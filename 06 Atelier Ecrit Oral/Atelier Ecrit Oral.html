/* --- « 07 Charte DA/tokens.css » --- */
/* =====================================================================
   Charte « Copie double » · Prépa DGFiP 2027
   Socle commun aux deux applis : QCM DGFiP 2027 et Atelier QRC compta.
   Concept : la copie d'examen. Papier crème, encre bleue, chiffres en
   machine à écrire, surligneur jaune pour ce qui compte.
   Chaque appli choisit sa couleur d'encre avec <body data-app="qcm|qrc">.
   ===================================================================== */

/* Polices (à charger dans le <head>) :
   https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap */

:root {
  /* Papier et encre */
  --paper: #F5F3EE;
  --surface: #FFFFFF;
  --sunk: #F0EDE6;
  --ink: #16213A;
  --muted: #5A6377;
  --line: #DAD5CA;
  --rule: #E8E4DB;
  --shadow: 0 1px 0 rgba(22, 33, 58, .04), 0 1px 3px rgba(22, 33, 58, .06);
  --shadow-lift: 0 2px 4px rgba(22, 33, 58, .06), 0 8px 24px rgba(22, 33, 58, .08);

  /* Encre de chaque appli (accent d'action) */
  --qcm: #2A44C7;      --qcm-soft: #E7EBFB;
  --qrc: #0E6871;      --qrc-soft: #E0F0F0;
  --accent: var(--qcm); --accent-soft: var(--qcm-soft); --on-accent: #FFFFFF;

  /* Surligneur : signature de la marque, jamais pour un état */
  --hl: #FFE45E;       --hl-ink: #16213A;

  /* États (toujours doublés d'un pictogramme ou d'un mot) */
  --ok: #217A3C;       --ok-soft: #E2F2E5;
  --bad: #B8322A;      --bad-soft: #FAE6E2;
  --warn: #8F5600;     --warn-soft: #FBEFD5;

  /* Typographie */
  --f-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --t-xs: .75rem;   /* 12 : mentions, axes */
  --t-sm: .8125rem; /* 13 : métadonnées, légendes */
  --t-md: .9375rem; /* 15 : interface */
  --t-base: 1rem;   /* 16 : texte courant, énoncés */
  --t-lg: 1.125rem; /* 18 : question, sous-titre */
  --t-xl: 1.375rem; /* 22 : titre de section */
  --t-2xl: 1.75rem; /* 28 : titre de page */
  --t-3xl: 2.5rem;  /* 40 : chiffre clé */

  /* Espacements (base 4) et rayons */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --tap: 44px;
  --content: 960px;
}

[data-app="qrc"] { --accent: var(--qrc); --accent-soft: var(--qrc-soft); }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141F; --surface: #171E2C; --sunk: #121825; --ink: #E8ECF4; --muted: #9BA4B8;
    --line: #2B3447; --rule: #222A3A;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
    --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --on-accent: #0F141F;
    --hl: #5A4E12; --hl-ink: #FFF3B8;
    --ok: #6BCB86; --ok-soft: #143222; --bad: #FF8A7D; --bad-soft: #3B1D1E; --warn: #E8B158; --warn-soft: #36290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141F; --surface: #171E2C; --sunk: #121825; --ink: #E8ECF4; --muted: #9BA4B8;
  --line: #2B3447; --rule: #222A3A;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
  --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --on-accent: #0F141F;
  --hl: #5A4E12; --hl-ink: #FFF3B8;
  --ok: #6BCB86; --ok-soft: #143222; --bad: #FF8A7D; --bad-soft: #3B1D1E; --warn: #E8B158; --warn-soft: #36290F;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: var(--t-base); line-height: 1.55; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--content); margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* Titres : serif pour la voix « copie », sans-serif pour l'outil */
.h-page { font-family: var(--f-display); font-size: var(--t-2xl); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.h-sec { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 600; line-height: 1.2; }
.h-card { font-size: var(--t-base); font-weight: 600; }
.eyebrow { font-size: var(--t-xs); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 64ch; }
.small { font-size: var(--t-sm); }
.muted { color: var(--muted); }

/* Surligné : un mot ou un chiffre par écran, pas plus */
mark.hl { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .12em; margin: 0 -.06em; }

/* ---------- Barre d'appli ---------- */
.appbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.appbar-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; text-decoration: none; color: inherit; }
.brand-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-t b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-t small { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-r { display: flex; align-items: center; gap: var(--s3); flex: none; }

/* Logo : tuile d'encre 32 px, pictogramme blanc trait 2 px */
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18); }
.logo svg { width: 22px; height: 22px; }
.logo.lg { width: 64px; height: 64px; border-radius: 16px; }
.logo.lg svg { width: 40px; height: 40px; }
.logo.qcm { background: var(--qcm); }
.logo.qrc { background: var(--qrc); }

/* Tampon compte à rebours : signature, en surligneur */
.stamp { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px 4px; background: var(--hl); color: var(--hl-ink); border-radius: 4px; transform: rotate(-1.5deg); font-size: var(--t-xs); white-space: nowrap; }
.stamp b { font-family: var(--f-num); font-size: .95rem; font-weight: 600; letter-spacing: -.02em; }

/* Bascule de profil */
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-pill); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); font-size: var(--t-sm); font-weight: 600; color: var(--muted); cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* Bascule clair / sombre */
.theme-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn svg { width: 18px; height: 18px; }

/* Onglets (≥ 720 px) */
.tabs { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; }
.tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px 11px; font-size: var(--t-md); font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a svg { width: 18px; height: 18px; opacity: .8; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs a[aria-current="page"] svg { color: var(--accent); opacity: 1; }
.tabs .count { font-family: var(--f-num); font-size: var(--t-xs); background: var(--accent-soft); color: var(--accent); padding: 0 6px; border-radius: var(--r-pill); }

/* Barre du bas (< 720 px) : à portée de pouce */
.bottomnav { display: none; }
@media (max-width: 719px) {
  .tabs { display: none; }
  .bottomnav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; inset: auto 0 0 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; min-height: 56px; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; position: relative; }
  .bottomnav a svg { width: 22px; height: 22px; }
  .bottomnav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .bottomnav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .appbar-in { min-height: 54px; }
  .brand-t small, .stamp span { display: none; }
  .appbar .seg { display: none; } /* le profil passe dans « Plus » sur mobile */
}

/* ---------- Mise en page ---------- */
.page { display: flex; flex-direction: column; gap: var(--s5); padding-block: var(--s5) var(--s7); }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(var(--min, 200px), 1fr)); }
.split { display: grid; gap: var(--s5); grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
@media (max-width: 879px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* Feuille : la carte de base */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.sheet.tight { padding: var(--s4); gap: var(--s3); }
.sheet.flat { box-shadow: none; background: var(--sunk); border-color: transparent; }
@media (max-width: 519px) { .sheet { padding: var(--s4); border-radius: var(--r-md); } }

/* Héros de page : marge rouge discrète de copie double */
.hero { display: flex; flex-direction: column; gap: var(--s2); padding-left: var(--s4); border-left: 3px solid var(--accent); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-md); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: var(--t-sm); border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--f-num); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--muted); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; line-height: 1.5; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.out { background: none; border: 1px solid var(--line); }
.badge.mono { font-family: var(--f-num); font-weight: 500; }

/* ---------- Chiffres clés ---------- */
.stats { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-num); font-size: 1.6rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat b small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.stat span { font-size: var(--t-sm); color: var(--muted); }
.stat .delta { font-family: var(--f-num); font-size: var(--t-xs); font-weight: 600; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }

/* ---------- Progression ---------- */
.meter { height: 6px; border-radius: var(--r-pill); background: var(--rule); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.track { position: relative; height: 12px; border-radius: var(--r-pill); background: var(--rule); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
.track .fill.ok { background: var(--ok); } .track .fill.bad { background: var(--bad); }
.track .jury { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.track .jury::after { content: attr(data-l); position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-family: var(--f-num); font-size: 10px; color: var(--muted); white-space: nowrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 3px; background: var(--rule); border: 1px solid var(--line); }
.pips i.on { background: var(--accent); border-color: var(--accent); }

/* ---------- Retours (correction) ---------- */
.callout { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--accent-soft); }
.callout .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.callout .ic svg { width: 16px; height: 16px; }
.callout.ok { background: var(--ok-soft); } .callout.ok .ic { background: var(--ok); }
.callout.bad { background: var(--bad-soft); } .callout.bad .ic { background: var(--bad); }
.callout.warn { background: var(--warn-soft); } .callout.warn .ic { background: var(--warn); }
.callout h4 { font-size: var(--t-base); font-weight: 600; margin-bottom: 2px; }
.callout.ok h4 { color: var(--ok); } .callout.bad h4 { color: var(--bad); } .callout.warn h4 { color: var(--warn); }

/* ---------- Tableaux ---------- */
.tw { overflow-x: auto; margin-inline: calc(var(--s5) * -1); padding-inline: var(--s5); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
table.t th { text-align: left; font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .r { text-align: right; }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--sunk); }
table.t tr.tot td { font-weight: 600; border-top: 1.5px solid var(--ink); }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: var(--t-sm); font-weight: 600; }
.input { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: var(--t-base); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.n { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.input.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.input.is-bad { border-color: var(--bad); background: var(--bad-soft); }

/* Puces de filtre */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-sm); font-weight: 500; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* Chrono */
.clock { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); }
.clock svg { width: 16px; height: 16px; color: var(--muted); }
.clock.low { color: var(--bad); border-color: var(--bad); }

@media (prefers-reduced-motion: no-preference) {
  .btn, .opt, .chips button, .tabs a { transition: background-color .15s, border-color .15s, color .15s; }
}

/* --- « 07 Charte DA/composants.css » --- */
/* =====================================================================
   Composants propres à chaque appli, construits sur tokens.css.
   ===================================================================== */

/* ---------- QCM : options de réponse (cases de la feuille optique) ---------- */
.question { font-size: var(--t-lg); font-weight: 600; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: var(--s2); }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; width: 100%; min-height: 54px; padding: 9px 14px 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; cursor: pointer; }
.opt .box { width: 32px; height: 32px; border: 2px solid var(--ink); border-radius: 7px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 600; font-size: .9rem; }
.opt .box svg { width: 18px; height: 18px; stroke-width: 2.6; }
.opt .t { overflow-wrap: anywhere; }
.opt .lab { font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.chosen { border-color: var(--accent); background: var(--accent-soft); }
.opt.chosen .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .box { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.right .lab { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .box { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.wrong .lab { color: var(--bad); }
.opts.locked .opt:not(.right):not(.wrong) { opacity: .55; }
.opt.ann { border-style: dashed; }
.opt.ann .box { font-size: .62rem; letter-spacing: .02em; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
.srcs a { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 600; padding: 4px 10px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.srcs a svg { width: 14px; height: 14px; }

/* Barre d'examen collante */
.exambar { position: sticky; top: 108px; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; padding: 10px 12px 10px 16px; border-radius: var(--r-lg); background: var(--ink); color: var(--paper); box-shadow: var(--shadow-lift); }
.exambar .clock { background: transparent; border-color: color-mix(in srgb, var(--paper) 30%, transparent); color: inherit; }
.exambar .clock svg { color: inherit; opacity: .7; }
.exambar .btn { background: var(--paper); color: var(--ink); border-color: transparent; }
.exambar small { opacity: .7; font-size: var(--t-xs); }
@media (max-width: 719px) { .exambar { top: 62px; } }

/* Feuille de réponse */
.omr { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.omr button { position: relative; height: 36px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-family: var(--f-num); font-size: var(--t-xs); font-weight: 500; cursor: pointer; color: var(--muted); }
.omr button.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.omr button.abst { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.omr button.cur { outline: 2px solid var(--ink); outline-offset: 2px; color: var(--ink); font-weight: 700; }
.omr button.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border-style: solid; border-width: 0 9px 9px 0; border-color: transparent var(--hl) transparent transparent; filter: drop-shadow(0 0 .5px var(--warn)); border-top-right-radius: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-xs); color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); background: var(--surface); }
.legend i.done { background: var(--accent); border-color: var(--accent); }
.legend i.abst { background: var(--warn-soft); border-color: var(--warn); }
.legend i.flag { background: var(--hl); border-color: var(--warn); }
.legend i.jury { width: 2px; border: 0; background: var(--ink); }

/* Barres de thèmes */
.bars { display: flex; flex-direction: column; gap: 30px; padding-bottom: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.bar-row .lab { display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; align-items: baseline; }
.bar-row .lab b { font-weight: 600; font-size: var(--t-md); }
.bar-row .lab span { font-family: var(--f-num); font-size: var(--t-sm); color: var(--muted); }
.bar-row .lab span strong { color: var(--ink); font-weight: 600; }

/* Liste de thèmes en latéral */
.mini { display: flex; flex-direction: column; gap: 12px; }
.mini li { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; font-size: var(--t-sm); }
.mini li .meter { grid-column: 1 / -1; }
.mini ul, ul.mini { margin: 0; padding: 0; }

/* ---------- QRC : énoncé, saisie et journal ---------- */
.kv { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
.kv td { padding: 8px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.kv td:first-child { color: var(--muted); padding-right: var(--s4); }
.kv td:last-child { font-family: var(--f-num); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kv tr:last-child td { border-bottom: 0; }
.consigne { display: flex; flex-direction: column; gap: 6px; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--sunk); font-weight: 500; }
.consigne ol { margin: 0; padding-left: 1.3em; }

.answers { display: flex; flex-direction: column; gap: var(--s2); }
.ans { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 200px); gap: 6px var(--s3); align-items: center; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--rule); background: var(--surface); }
.ans label { font-size: var(--t-md); font-weight: 500; }
.ans .in { position: relative; }
.ans .in::after { content: "€"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--f-num); font-size: var(--t-sm); color: var(--muted); }
.ans .in .input { padding-right: 28px; }
.ans .fb { grid-column: 1 / -1; display: flex; gap: 6px; align-items: flex-start; font-size: var(--t-sm); }
.ans .fb svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.ans.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-soft); }
.ans.ok .fb { color: var(--ok); }
.ans.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-soft); }
.ans.bad .fb { color: var(--bad); }
.ans.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.ans.warn .fb { color: var(--warn); }
@media (max-width: 519px) { .ans { grid-template-columns: 1fr; } }

/* Journal : la page réglée du livre-journal */
.journal { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.j-head { display: flex; align-items: center; gap: var(--s3); padding: 10px 14px; background: var(--sunk); border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.j-head b { font-family: var(--f-num); font-weight: 600; }
.j-head span { font-style: italic; color: var(--muted); }
.j-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr) 22px; gap: 0 10px; }
.j-grid > * { padding: 7px 0; display: flex; align-items: center; min-width: 0; }
.j-grid .hd { font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-block: 8px; }
.j-grid .hd.r { justify-content: flex-end; }
.j-row { display: contents; }
.j-row > * { border-bottom: 1px solid var(--rule); }
.j-acc { gap: 10px; }
.j-acc .input { min-height: 38px; width: 6.2rem; flex: none; font-family: var(--f-num); font-weight: 600; color: var(--accent); }
.j-acc small { color: var(--muted); font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.j-row.cr .j-acc { padding-left: 28px; }
.j-row .input.n { min-height: 38px; }
.j-st svg { width: 18px; height: 18px; }
.j-st.ok { color: var(--ok); } .j-st.bad { color: var(--bad); } .j-st.warn { color: var(--warn); }
.j-body { padding: 0 14px; }
.j-foot { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr) 22px; gap: 0 10px; padding: 10px 14px; border-top: 1.5px solid var(--ink); font-family: var(--f-num); font-size: var(--t-md); font-weight: 600; font-variant-numeric: tabular-nums; }
.j-foot .r { text-align: right; padding-right: 12px; }
.j-foot .lbl { font-family: var(--f-ui); font-size: var(--t-sm); display: flex; align-items: center; gap: 6px; color: var(--ok); }
.j-foot .lbl svg { width: 16px; height: 16px; }
.j-add { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: var(--t-sm); padding: 10px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.j-add svg { width: 16px; height: 16px; }
@media (max-width: 559px) {
  .j-grid, .j-foot { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 18px; }
  .j-grid .hd:first-child { display: none; }
  .j-acc { grid-column: 1 / -1; border-bottom: 0 !important; padding-bottom: 0 !important; }
  .j-row.cr .j-acc { padding-left: 16px; }
  .j-foot .lbl { grid-column: 1 / -1; padding-bottom: 6px; }
  .j-grid .hd:nth-child(2) { grid-column: 1; }
}

/* Score de l'exercice */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s4); align-items: center; padding: var(--s4); border-radius: var(--r-md); background: var(--accent-soft); }
.score .big { font-family: var(--f-num); font-size: var(--t-3xl); font-weight: 600; line-height: 1; letter-spacing: -.03em; color: var(--accent); }
.score .big small { font-size: 1rem; color: var(--muted); font-weight: 500; }

/* Recommandations */
.reco { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.reco a { display: flex; flex-direction: column; gap: 6px; padding: var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: inherit; position: relative; }
.reco a:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); }
.reco a b { font-size: var(--t-base); font-weight: 600; padding-right: 22px; }
.reco a .why { display: flex; gap: 6px; align-items: center; font-size: var(--t-sm); color: var(--muted); }
.reco a > svg { position: absolute; top: 16px; right: 14px; width: 18px; height: 18px; color: var(--accent); }
.reco a.first { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

/* Fiches */
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc h4 { font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px 10px; }
.toc h4:first-child { margin-top: 0; }
.toc a { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); font-size: var(--t-md); color: var(--ink); text-decoration: none; }
.toc a:hover { background: var(--sunk); }
.toc a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.reading { max-width: 70ch; display: flex; flex-direction: column; gap: var(--s4); }
.reading h3 { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 600; }
.reading h4 { font-size: var(--t-xs); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-top: var(--s2); }
.steps { counter-reset: st; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s3); }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-family: var(--f-num); font-size: var(--t-xs); font-weight: 600; margin-top: 1px; }
.traps { list-style: none; margin: 0; padding: var(--s4); display: flex; flex-direction: column; gap: 10px; border-radius: var(--r-md); background: var(--bad-soft); }
.traps li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: var(--t-md); }
.traps li svg { width: 16px; height: 16px; color: var(--bad); margin-top: 3px; stroke-width: 2.4; }
.accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.accts span { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: var(--r-sm); background: var(--sunk); font-size: var(--t-sm); }
.accts b { font-family: var(--f-num); color: var(--accent); font-weight: 600; min-width: 3.4em; }

/* =====================================================================
   Propre à l’Atelier écrit et oral.
   tokens.css et composants.css sont repris tels quels de « 07 Charte DA »
   par build.js : ne pas les recopier ici.
   ===================================================================== */

/* Encre de l’appli : prune (à reporter dans tokens.css si la charte l’adopte).
   Contrastes : 7,8:1 sur blanc et 6,6:1 sur son lavis en clair ; 7,4:1 sur son lavis en sombre. */
:root { --atl: #74398A; --atl-soft: #F3E9F6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --atl: #CDA6E6; --atl-soft: #2D1F3B; }
}
:root[data-theme="dark"] { --atl: #CDA6E6; --atl-soft: #2D1F3B; }
[data-app="atelier"] { --accent: var(--atl); --accent-soft: var(--atl-soft); }

html { background: var(--paper); }
.brand { cursor: pointer; }
/* Retour à l’accueil du site (GitHub Pages uniquement) */
.home-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); }
.home-btn:hover { border-color: var(--accent); color: var(--accent); }
.home-btn svg { width: 18px; height: 18px; }
.foot { color: var(--muted); font-size: var(--t-xs); padding-block: 0 var(--s6); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.small b, .lede b { color: var(--ink); }
@media (max-width: 559px) { .hide-sm { display: none; } }
h3.h-card { font-size: var(--t-base); }
ul.plain, ol.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

/* Sources : renvoi à la page du PDF */
details.src { font-size: var(--t-xs); line-height: 1.45; color: var(--muted); }
details.src summary { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; list-style: none; padding: 2px 0; }
details.src summary::-webkit-details-marker { display: none; }
details.src summary:hover { color: var(--accent); }
details.src[open] summary { color: var(--ink); }
details.src svg { width: 13px; height: 13px; flex: none; }
details.src .srcl { display: flex; flex-wrap: wrap; gap: 2px 6px; padding: 2px 0 2px 17px; }
details.src a { color: var(--muted); text-decoration-color: var(--line); }
details.src a:hover { color: var(--accent); text-decoration-color: currentColor; }
/* Frise de la répartition du temps */
.tline { display: flex; gap: 2px; height: 10px; border-radius: var(--r-pill); overflow: hidden; }
.tline i { display: block; height: 100%; background: var(--accent); opacity: .85; }
.tline i:nth-child(even) { opacity: .45; }
.tline i.p2 { background: var(--qrc, var(--ink)); }
.tsteps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 16px; font-size: var(--t-sm); }
.tsteps li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--rule); }
.tsteps li .mono { color: var(--muted); white-space: nowrap; }
.tsteps .tp { grid-column: 1 / -1; border: 0; padding-top: 6px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
/* Correction par Claude */
.claude { display: flex; flex-direction: column; gap: var(--s3); }
.claude ol.how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); }
.claude textarea { min-height: 90px; }
.trans textarea { min-height: 110px; }
.trans .live { font-size: var(--t-sm); color: var(--muted); font-style: italic; }

/* Bascules dans les vues */
.seg-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); }
.seg.wide { flex-wrap: wrap; border-radius: var(--r-md); }
.seg.wide button { border-radius: var(--r-sm); }

/* Choix du sujet */
.choices { display: flex; flex-direction: column; gap: var(--s2); }
.choice { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2) var(--s3); align-items: center; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice .pick { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--s3); align-items: start; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; min-height: var(--tap); color: inherit; }
.choice .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 2px; display: grid; place-items: center; }
.choice.on .radio { border-color: var(--accent); }
.choice.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.choice .ct { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.choice .ct b { font-size: var(--t-base); }
.choice .links { display: flex; flex-wrap: wrap; gap: 6px; }
.choice .extra { grid-column: 1 / -1; }
@media (max-width: 519px) {
  .choice { grid-template-columns: minmax(0, 1fr); }
  .choice .links { padding-left: 34px; }
}
.startrow { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; }

/* Barre d’épreuve (collante) */
#app .exambar { top: calc(var(--hh, 104px) + 8px); align-items: center; }
.exambar .stack { gap: 0; }
.exambar .big { font-family: var(--f-num); font-size: 1.6rem; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.exambar .xb-m { flex: 1 1 180px; min-width: 0; }
.exambar .xb-m b { font-size: var(--t-md); font-weight: 600; }
.exambar .small { opacity: .78; font-size: var(--t-xs); }
.exambar .tag { display: inline-flex; padding: 1px 8px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; background: var(--hl); color: var(--hl-ink); }
.exambar .tag.over { background: var(--bad-soft); color: var(--bad); }
.exambar .meter { flex: 1 1 100%; height: 4px; background: color-mix(in srgb, var(--paper) 22%, transparent); }
.exambar .meter > i { background: var(--paper); }
.exambar .confirm { color: var(--ink); flex: 1 1 100%; }
@media (max-width: 519px) {
  #app .exambar { padding: 8px 10px 8px 12px; gap: 6px 10px; }
  .exambar .big { font-size: 1.35rem; }
  .exambar > .row { flex: 1 1 100%; flex-wrap: nowrap; gap: 6px; }
  .exambar > .row .btn { flex: 1 1 0; padding: 0 8px; min-width: 0; }
}

/* Tableau des étapes */
table.ph td { vertical-align: top; }
table.ph tr.part td { font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); padding-block: 6px; }
table.ph tr.now td { background: var(--accent-soft); }
table.ph tr.now td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.ph tr.done td:first-child { color: var(--muted); }
table.ph .ic-ok svg { width: 14px; height: 14px; color: var(--ok); vertical-align: -2px; margin-right: 4px; stroke-width: 2.4; }
@media (max-width: 519px) { table.ph { font-size: var(--t-sm); } table.ph td, table.ph th { padding: 7px 5px; } }

/* Grille d’auto-évaluation */
.gpart { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.gpart:first-of-type { border-top: 0; padding-top: 0; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) 0; border-bottom: 1px dashed var(--line); }
.crit.last { border-bottom: 0; }
.crit .ct { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.crit .ct b { font-weight: 600; }
.crit .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.lv { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.lv button { min-width: 40px; height: 40px; padding: 0 8px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-family: var(--f-num); font-weight: 600; cursor: pointer; color: var(--ink); }
.lv button:hover { border-color: var(--accent); }
.lv button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pts { font-family: var(--f-num); font-size: var(--t-xs); color: var(--muted); white-space: nowrap; }
.scale { font-size: var(--t-xs); color: var(--muted); }
@media (max-width: 559px) {
  .crit { grid-template-columns: minmax(0, 1fr); }
  .crit .side { flex-direction: row; justify-content: space-between; align-items: center; }
}
.score .big small { font-size: 1rem; }

/* Défauts relevés par le jury */
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 9px 10px; border-radius: var(--r-sm); background: var(--sunk); cursor: pointer; font-size: var(--t-md); }
.checks input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.checks .src { grid-column: 2; }
textarea.input { min-height: 110px; padding: 10px 12px; line-height: 1.5; resize: vertical; }

/* Oral */
.qbox { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--sunk); min-width: 0; }
.qbox .question { font-size: var(--t-lg); font-weight: 600; line-height: 1.45; }
.oclock { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.oclock .big { font-family: var(--f-num); font-size: var(--t-3xl); font-weight: 600; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.oclock .big.over { color: var(--bad); }
.durrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); }
.durrow .val { min-width: 3.4em; text-align: center; font-family: var(--f-num); font-weight: 600; }
.recst { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--t-md); font-weight: 600; color: var(--bad); }
.recst:empty { display: none; }
.recdot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
@media (prefers-reduced-motion: no-preference) { .recdot { animation: blink 1.2s ease-in-out infinite; } @keyframes blink { 50% { opacity: .25; } } }
details.pistes { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
details.pistes summary { cursor: pointer; padding: 10px 14px; font-weight: 600; min-height: var(--tap); display: flex; align-items: center; gap: 10px; list-style: none; }
details.pistes summary::-webkit-details-marker { display: none; }
details.pistes summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); flex: none; }
details.pistes[open] summary::before { transform: rotate(45deg); }
details.pistes .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: var(--s3); }
.recs { display: flex; flex-direction: column; gap: 6px; }
.recs .r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--rule); }
.recs .r .meta { flex: 1 1 150px; font-size: var(--t-sm); min-width: 0; }
.recs .r audio { flex: 1 1 100%; width: 100%; height: 40px; }
.ocrit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.ocrit .ct { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
@media (max-width: 459px) { .ocrit { grid-template-columns: minmax(0, 1fr); } }

/* Historique */
.hlist { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; padding: 12px 6px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; color: inherit; }
.hrow:hover { background: var(--sunk); }
.hrow .t1 { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.hrow .t2 { font-size: var(--t-sm); color: var(--muted); grid-column: 1; }
.hrow .nt { font-family: var(--f-num); font-weight: 600; font-size: 1.1rem; grid-row: 1 / span 2; grid-column: 2; white-space: nowrap; }
.hrow .nt small { font-size: var(--t-xs); color: var(--muted); font-weight: 500; }
.hdet { padding: var(--s3) 6px var(--s4); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: var(--s3); }
.kvl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: var(--t-sm); }
.kvl .k { color: var(--muted); }
.kvl .v { font-family: var(--f-num); text-align: right; white-space: nowrap; }

/* Courbe d’évolution */
.chartbox { min-height: 160px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--rule); stroke-width: 1; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 11px; }
.chart .elim { stroke: var(--bad); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .ref { stroke: var(--ink); stroke-dasharray: 2 4; stroke-width: 1.5; opacity: .75; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
.legend i.l-me { background: var(--accent); border-color: var(--accent); }
.legend i.l-ref { width: 14px; height: 0; border: 0; border-top: 2px dotted var(--ink); border-radius: 0; vertical-align: 3px; background: none; }
.legend i.l-elim { width: 14px; height: 0; border: 0; border-top: 2px dashed var(--bad); border-radius: 0; vertical-align: 3px; background: none; }

/* Repères */
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s3); }
.facts li { display: flex; flex-direction: column; gap: 3px; padding-left: 14px; border-left: 2px solid var(--rule); }
.facts li.acc { border-left-color: var(--accent); }
.doclist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.doclist a { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); background: var(--sunk); text-decoration: none; color: var(--ink); font-size: var(--t-sm); }
.doclist a svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.doclist a:hover { color: var(--accent); }

/* Divers */
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--t-md); padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--bad); background: var(--bad-soft); color: var(--ink); }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-md); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--r-md); font-size: var(--t-md); z-index: 40; max-width: calc(100% - 32px); box-shadow: var(--shadow-lift); }
@media (max-width: 719px) { .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
.btn .ic-rec { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
.btn.pri .ic-rec { background: var(--on-accent); }
@media (prefers-reduced-motion: no-preference) { .page.enter { animation: rise .2s ease-out; } @keyframes rise { from { transform: translateY(3px); opacity: .6; } to { transform: none; opacity: 1; } } }
/* Sections repliables (Repères) */
details.fold > summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; padding-right: 28px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; position: absolute; right: 4px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
details.fold[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
details.fold:not([open]) { gap: 0; }
/* Dépôt de fichiers pour correction */
.depot { display: flex; flex-direction: column; gap: var(--s3); }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 96px; padding: var(--s4); border: 2px dashed var(--line); border-radius: var(--r-md); background: var(--sunk); text-align: center; cursor: pointer; }
.drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.drop .dz-t { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); }
.drop .dz-t svg { width: 20px; height: 20px; }
.deplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.deplist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.deplist li > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Repères : onglets et cartes en grille, pour lire sans défiler */
.rtabs { display: flex; width: 100%; }
.rtabs button { flex: 1 1 auto; }
.rgrid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.rgrid .sheet .h-card { margin: 0; }
.okcard { background: var(--ok-soft); border-color: transparent; }
.rsteps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.rsteps li { display: flex; flex-direction: column; gap: 2px; }
.consigne-l { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: var(--t-sm); }
.score { flex-wrap: wrap; }
@media (max-width: 519px) { .rtabs button { flex: 1 1 45%; } .rgrid { grid-template-columns: minmax(0, 1fr); } }
.rcard > summary { padding-right: 24px; }
.rcard:not([open]) { padding-block: 12px; }

/* Titre lu par les lecteurs d’écran, invisible à l’écran */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

</style>

// Bascule clair / sombre, mémorisée (clé commune au QCM, à l'atelier QRC et à l'accueil)
(function () {
  var K = "prepa-theme", root = document.documentElement, b = document.getElementById("theme");
  var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var SUN = SVG + '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON = SVG + '<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>';
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function cur() { return root.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light"); }
  function show() { var d = cur() === "dark", l = d ? "Passer en mode clair" : "Passer en mode sombre"; b.innerHTML = d ? SUN : MOON; b.setAttribute("aria-label", l); b.title = l; }
  try { var t = localStorage.getItem(K); if (t === "dark" || t === "light") root.setAttribute("data-theme", t); } catch (e) {}
  show();
  b.addEventListener("click", function () { var v = cur() === "dark" ? "light" : "dark"; root.setAttribute("data-theme", v); try { localStorage.setItem(K, v); } catch (e) {} show(); });
  if (mq && mq.addEventListener) mq.addEventListener("change", show);
})();

<script>
/* Synchro commune aux applis Prépa DGFiP 2027 : compte (identifiant + mot de passe) et Firestore.
   Une appli s'enregistre avec PrepaSync.attach(clé, { get, merge }) :
     get()    renvoie l'état local à synchroniser (objet JSON) ;
     merge(o) fusionne l'état distant o dans l'état local, le sauvegarde et réaffiche, sans rappeler changed().
   Après chaque sauvegarde locale, l'appli appelle PrepaSync.changed(clé).
   Données : users/{uid}/apps/{clé} = { json, u, dev }. Firestore garde les écritures hors connexion
   et les envoie au retour du réseau ; chaque appareil reçoit les changements des autres en direct.
   Le SDK Firebase n'est chargé qu'une fois un compte connecté sur l'appareil (ou à l'ouverture du formulaire). */
(function () {
  "use strict";
  var CONFIG = {
    apiKey: "AIzaSyBEGSyRvn1lGRwpZunKyl3DY6HsHe7ZY1Y",
    authDomain: "prepa-dgfip-2027.firebaseapp.com",
    projectId: "prepa-dgfip-2027",
    storageBucket: "prepa-dgfip-2027.firebasestorage.app",
    messagingSenderId: "483566332972",
    appId: "1:483566332972:web:3f3a41ad9ab6f0f4da3589"
  };
  var SDK = "https://www.gstatic.com/firebasejs/12.19.0/";
  // L'identifiant devient une adresse interne : aucun courrier n'y est envoyé, il n'y a donc pas de « mot de passe oublié ».
  var DOMAIN = "prepa.pbailly.fr";
  var FLAG = "prepa-sync-compte", MAX = 900000;

  var apps = {}, listeners = [], fb = null, F = null, user = null, state = "local", err = "", started = false;
  var DEV = (function () {
    try { var d = localStorage.getItem("prepa-appareil"); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem("prepa-appareil", d); } return d; }
    catch (e) { return "inconnu"; }
  })();
  function flag(v) { try { if (v) localStorage.setItem(FLAG, "1"); else localStorage.removeItem(FLAG); } catch (e) { } }
  function hasFlag() { try { return localStorage.getItem(FLAG) === "1"; } catch (e) { return false; } }

  // JSON à clés triées : deux états identiques donnent la même chaîne, quel que soit l'ordre d'insertion.
  function canon(o) {
    if (o === null || typeof o !== "object") return JSON.stringify(o);
    if (Array.isArray(o)) return "[" + o.map(canon).join(",") + "]";
    return "{" + Object.keys(o).sort().filter(function (k) { return o[k] !== undefined; }).map(function (k) { return JSON.stringify(k) + ":" + canon(o[k]); }).join(",") + "}";
  }
  function emit() { var s = api.status(); listeners.forEach(function (f) { try { f(s); } catch (e) { } }); }
  function setState(s, e) { state = s; err = e || ""; emit(); }

  function load() {
    if (fb) return fb;
    fb = Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]).then(function (m) {
      var A = m[0], Au = m[1], Fs = m[2];
      var app = A.initializeApp(CONFIG);
      var auth = Au.initializeAuth(app, { persistence: [Au.indexedDBLocalPersistence, Au.browserLocalPersistence] });
      var db;
      try { db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache({ tabManager: Fs.persistentMultipleTabManager() }) }); }
      catch (e) { db = Fs.getFirestore(app); }
      F = { Au: Au, Fs: Fs, auth: auth, db: db };
      return F;
    });
    fb.catch(function () { fb = null; setState("local", "Service de synchronisation injoignable."); });
    return fb;
  }
  function start() {
    if (started) return load();
    started = true;
    setState("connexion");
    return load().then(function (f) {
      f.Au.onAuthStateChanged(f.auth, function (u) {
        Object.keys(apps).forEach(stop);
        depWatchers.forEach(depStop);
        user = u;
        if (u) { flag(true); setState("attente"); Object.keys(apps).forEach(watch); }
        else { flag(false); setState("local"); }
        depWatchers.forEach(depSub);
      });
      return f;
    }, function (e) { started = false; throw e; });
  }

  function stop(key) { var a = apps[key]; if (a && a.unsub) { a.unsub(); a.unsub = null; a.ref = null; } }
  function watch(key) {
    var a = apps[key]; if (!a || !user || !F || a.unsub) return;
    a.ref = F.Fs.doc(F.db, "users", user.uid, "apps", key);
    a.first = true;
    a.unsub = F.Fs.onSnapshot(a.ref, function (snap) {
      if (snap.metadata.hasPendingWrites) return; // écho de nos propres écritures
      var d = snap.exists() ? snap.data() : null;
      if (d && d.json && d.json !== a.last) {
        a.last = d.json;
        try { var o = JSON.parse(d.json); a.canon = canon(o); a.merge(o); } catch (e) { }
      }
      if (a.first) { a.first = false; push(key, !d); }
      setState(snap.metadata.fromCache ? "attente" : "ok");
    }, function (e) { setState("erreur", (e && e.code) || "erreur"); });
  }
  function push(key, now) {
    var a = apps[key]; if (!a) return;
    clearTimeout(a.t);
    a.t = setTimeout(function () {
      if (!a.ref) return;
      var o; try { o = a.get(); } catch (e) { return; }
      var c = canon(o); if (c === a.canon) return;
      var json = JSON.stringify(o);
      if (json.length > MAX) { setState("plein"); return; }
      a.canon = c; a.last = json;
      F.Fs.setDoc(a.ref, { json: json, u: Date.now(), dev: DEV }).then(function () { if (state !== "erreur") setState(navigator.onLine === false ? "attente" : "ok"); }, function (e) { setState("erreur", (e && e.code) || "erreur"); });
    }, now ? 0 : 1200);
  }

  var MSG = {
    "auth/invalid-credential": "Identifiant ou mot de passe incorrect.",
    "auth/wrong-password": "Identifiant ou mot de passe incorrect.",
    "auth/user-not-found": "Identifiant ou mot de passe incorrect.",
    "auth/invalid-email": "Identifiant invalide.",
    "auth/email-already-in-use": "Cet identifiant est déjà pris.",

  function msg(e) { return MSG[e && e.code] || "Échec : " + ((e && (e.code || e.message)) || "erreur inconnue") + "."; }

  // ce qui accepte n'importe quel mot de passe, même très court.

  var api = {
    attach: function (key, o) {

    resume: function () { if (hasFlag()) start().catch(function () { }); },
    connected: hasFlag,
    onStatus: function (f) { listeners.push(f); f(api.status()); },
    status: function () { return { state: state, error: err, user: user ? (user.displayName || (user.email || "").split("@")[0]) : "" }; },
    label: function () {
      var s = api.status();
      if (s.user) return state === "ok" ? "synchronisée avec le compte " + s.user : state === "plein" ? "trop volumineuse pour le compte, sur cet appareil seulement" : state === "erreur" ? "sur cet appareil (synchro en erreur)" : "sur cet appareil, envoi au compte " + s.user + " dès que le réseau revient";

        var s = api.status();
        if (!s.user && state === "connexion" && hasFlag()) { el.innerHTML = '<p class="small muted">Connexion à ton compte…</p>'; return; }

            '<p class="small muted">Connecte-toi avec le même identifiant sur tes autres appareils : tout se synchronise en direct, et hors connexion les changements partent dès le retour du réseau.</p>' +
            '<div class="row"><button type="button" class="btn" data-sync="out">Se déconnecter</button></div></div>';
        } else {
          el.innerHTML = '<form class="sync-box" novalidate><p class="small muted">Sans compte, la progression reste sur cet appareil. Avec un compte, elle se synchronise entre tous tes appareils.</p>' +
            '<label class="field"><span>Identifiant</span><input class="input" name="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>' +
            '<label class="field"><span>Mot de passe</span><input class="input" name="p" type="password" autocomplete="current-password" required></label>' +
            (msgText ? '<p class="small sync-err" role="alert">' + esc(msgText) + '</p>' : '') +
            '<div class="row"><button type="submit" class="btn pri" data-sync="in">Se connecter</button><button type="button" class="btn" data-sync="up">Créer le compte</button></div>' +
            '<p class="small muted">Pas de récupération par e-mail : note bien ton mot de passe.</p></form>';
        }

        var f = el.querySelector("form"); if (!f) return;

     users/{uid}/depots/{id} : description (sujet, fichiers, statut, correction) ;
     users/{uid}/depots/{id}/parts/{n} : morceaux des fichiers en base64 (moins de 1 Mo par document Firestore).

    add: function (meta, files, progress) {

      });
    },
    // cb(liste) à chaque changement, cb([]) sans compte, cb(null) en cas d'erreur ; renvoie la fonction d'arrêt
    watch: function (cb) {
      var w = { cb: cb, unsub: null }; depWatchers.push(w);
      if (user) depSub(w); else { cb([]); if (hasFlag()) start().catch(function () { }); }

    }

})();

    { id: 'm03', c: 'motiv', q: 'Quel métier de la DGFiP vous attire le plus, et pourquoi ?', p: ['Un métier précis, décrit concrètement : vérificateur, conseiller aux décideurs locaux, gestionnaire en service des impôts, comptable public, évaluateur du Domaine…', 'Le lien avec tes compétences et tes expériences.', 'Une ouverture aux premiers postes possibles : l’affectation ne se choisit pas entièrement.', 'Le jury 2026 a apprécié l’intérêt pour la gestion publique, pas seulement la fiscalité (rapport inspecteur, p. 12).'] },
