# Publie les deux applis sur GitHub Pages à chaque mise à jour de main.
#   /      page d'accueil (site/index.html)
#   /qcm/  QCM DGFiP 2027
#   /qrc/  Atelier QRC compta
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construire et vérifier
        run: |
          cd "06 Appli QCM" && node verifier_banque.js && node build.js && cd ..
          cd "06 Atelier QRC" && node build.js && node test/test.js && cd ..
      - name: Assembler le site
        run: |
          mkdir -p _site/qcm _site/qrc
          cp site/index.html _site/
          cp "07 Charte DA/logos/qcm.svg" "07 Charte DA/logos/qrc.svg" _site/
          cp "06 Appli QCM/QCM_DGFiP_2027.html" _site/qcm/index.html
          cp "06 Atelier QRC/Atelier QRC compta.html" _site/qrc/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
