<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prépa DGFiP 2027</title>
<meta name="description" content="Deux outils de révision pour le concours DGFiP 2027 : QCM et atelier QRC de comptabilité.">
<link rel="icon" href="qcm.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Page d'accueil GitHub Pages · charte « Copie double » (07 Charte DA) */
:root {
  --paper: #F5F3EE; --surface: #FFFFFF; --ink: #16213A; --muted: #5A6377; --line: #DAD5CA;
  --qcm: #2A44C7; --qcm-soft: #E7EBFB; --qrc: #0E6871; --qrc-soft: #E0F0F0; --hl: #FFE45E; --hl-ink: #16213A;
  --shadow: 0 1px 0 rgba(22, 33, 58, .04), 0 1px 3px rgba(22, 33, 58, .06);
  --shadow-lift: 0 2px 4px rgba(22, 33, 58, .06), 0 8px 24px rgba(22, 33, 58, .08);
  --f-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141F; --surface: #171E2C; --ink: #E8ECF4; --muted: #9BA4B8; --line: #2B3447;
    --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --hl: #5A4E12; --hl-ink: #FFF3B8;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141F; --surface: #171E2C; --ink: #E8ECF4; --muted: #9BA4B8; --line: #2B3447;
  --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --hl: #5A4E12; --hl-ink: #FFF3B8;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 1rem; line-height: 1.55; }
.wrap { max-width: 640px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.apps { display: flex; flex-direction: column; gap: 12px; margin-block: auto; }
.app { --ink-app: var(--qcm); display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); color: inherit; text-decoration: none; }
.app.qrc { --ink-app: var(--qrc); }
.app:hover { border-color: var(--ink-app); box-shadow: var(--shadow-lift); }
.app:focus-visible { outline: 2px solid var(--ink-app); outline-offset: 2px; }
.app img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
.app h2 { margin: 0; flex: 1; font-family: var(--f-display); font-size: 1.375rem; font-weight: 700; }
.app svg { width: 22px; height: 22px; flex: none; color: var(--ink-app); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top { display: flex; justify-content: flex-end; }
.theme-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--qcm); color: var(--qcm); }
.theme-btn:focus-visible { outline: 2px solid var(--qcm); outline-offset: 2px; }
.theme-btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><button type="button" class="theme-btn" id="theme" aria-label="Changer de thème"></button></div>
  <h1 class="sr">Prépa DGFiP 2027</h1>
  <div class="apps">
    <a class="app" href="qcm/">
      <img src="qcm.svg" alt="">
      <h2>QCM DGFiP 2027</h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="app qrc" href="qrc/">
      <img src="qrc.svg" alt="">
      <h2>Atelier QRC compta</h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</main>
<script>
// Bascule clair / sombre, mémorisée (clé commune au QCM, à l'atelier QRC et à l'accueil)
(function () {
  var K = "prepa-theme", root = document.documentElement, b = document.getElementById("theme");
  var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var SUN = SVG + '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON = SVG + '<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>';
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function cur() { return root.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light"); }
  function show() { var d = cur() === "dark", l = d ? "Passer en mode clair" : "Passer en mode sombre"; b.innerHTML = d ? SUN : MOON; b.setAttribute("aria-label", l); b.title = l; }
  try { var t = localStorage.getItem(K); if (t === "dark" || t === "light") root.setAttribute("data-theme", t); } catch (e) {}
  show();
  b.addEventListener("click", function () { var v = cur() === "dark" ? "light" : "dark"; root.setAttribute("data-theme", v); try { localStorage.setItem(K, v); } catch (e) {} show(); });
  if (mq && mq.addEventListener) mq.addEventListener("change", show);
})();
</script>
</body>
</html>
