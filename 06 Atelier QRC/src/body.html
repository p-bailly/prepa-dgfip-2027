<script>
// Retour à l'accueil : seulement sur le site publié
(function () { var h = document.getElementById("home"); if (h && /^https?:$/.test(location.protocol) && /\/(qcm|qrc|atelier)\/(index\.html)?$/.test(location.pathname)) h.hidden = false; })();
// Bascule clair / sombre, mémorisée (clé commune au QCM, à l'atelier QRC et à l'accueil)
(function () {
  var K = "prepa-theme", root = document.documentElement, b = document.getElementById("theme");
  var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var SUN = SVG + '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON = SVG + '<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>';
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function cur() { return root.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light"); }
  function show() { var d = cur() === "dark", l = d ? "Passer en mode clair" : "Passer en mode sombre"; b.innerHTML = d ? SUN : MOON; b.setAttribute("aria-label", l); b.title = l; }
  try { var t = localStorage.getItem(K); if (t === "dark" || t === "light") root.setAttribute("data-theme", t); } catch (e) {}
  show();
  b.addEventListener("click", function () { var v = cur() === "dark" ? "light" : "dark"; root.setAttribute("data-theme", v); try { localStorage.setItem(K, v); } catch (e) {} show(); });
  if (mq && mq.addEventListener) mq.addEventListener("change", show);
})();
</script>
