<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* =====================================================================
   Charte « Pastille » · Prépa DGFiP 2027 · déclinaison Sage
   Concept : la sobriété d'un outil de travail, la gaieté en touches.
   Fond blanc, encre presque noire, un pastel par appli réservé aux
   pictogrammes et aux étiquettes, traits de 1,5 px. Seuls l'élément
   courant et la carte principale portent l'ombre décalée pleine.
   Mise en page « Colonne » : menu latéral (≥ 860 px), onglets en bas
   sur téléphone, tableau de bord du jour au centre (site/index.html).
   Polices (à charger dans le <head>) :
   https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap
   ===================================================================== */

:root {
  /* Fonds, surfaces, encre */
  --bg: #FFFFFF;
  --side: #F7F5FF;      /* menu latéral, survols */
  --surface: #FFFFFF;
  --line: #ECEAF4;      /* séparateurs */
  --line-2: #D9D6E8;    /* contours de champs et de listes */
  --ink: #1B1B2F;
  --muted: #5B5874;
  --edge: #1B1B2F;      /* contour de l'élément mis en avant */
  --drop: #1B1B2F;      /* ombre décalée */
  --on-tile: #1B1B2F;   /* texte posé sur un pastel, dans les deux thèmes */

  /* Action : vert menthe, toujours avec du texte --on-tile */
  --go: #7CE0A3;

  /* Un pastel par appli, et sa teinte claire pour les fonds */
  --qcm: #C9C2FF; --qcm-t: #EDEAFB;   /* lilas */
  --qrc: #B8E6C9; --qrc-t: #E3F5EA;   /* menthe */
  --ate: #FFD2C2; --ate-t: #FFEDE6;   /* corail */
  --doc: #FFE07A; --doc-t: #FFF6D1;   /* soleil */

  --err: #B8322A;

  /* Relief : un seul niveau, réservé à ce qui est courant ou principal */
  --bw: 1.5px;
  --lift: 4px 4px 0 var(--drop);
  --lift-sm: 3px 3px 0 var(--drop);

  /* Typographie : Nunito seule, la graisse fait la hiérarchie */
  --f: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;

  /* Rayons */
  --r-sm: 12px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;
  --tap: 44px;
  --side-w: 260px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15141D; --side: #1A1926; --surface: #1E1C2A; --line: #2A2838; --line-2: #3A3850; --ink: #F2F0FA; --muted: #A9A5BF;
    --edge: #3A3850; --drop: #000000; --go: #6FD497; --err: #FF8A7D;
    --qcm: #B3A9FF; --qrc: #9ED9B5; --ate: #F7B9A5; --doc: #F2D06B;
    --qcm-t: #2D2948; --qrc-t: #1D3328; --ate-t: #3A2620; --doc-t: #352E17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15141D; --side: #1A1926; --surface: #1E1C2A; --line: #2A2838; --line-2: #3A3850; --ink: #F2F0FA; --muted: #A9A5BF;
  --edge: #3A3850; --drop: #000000; --go: #6FD497; --err: #FF8A7D;
  --qcm: #B3A9FF; --qrc: #9ED9B5; --ate: #F7B9A5; --doc: #F2D06B;
  --qcm-t: #2D2948; --qrc-t: #1D3328; --ate-t: #3A2620; --doc-t: #352E17;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 1rem; font-weight: 600; line-height: 1.5; }
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- Cartes ---------- */
.card { display: flex; flex-direction: column; gap: 10px; padding: 22px; border: var(--bw) solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.card.main-card { border-color: var(--edge); box-shadow: var(--lift); }
.tag { align-self: flex-start; padding: 3px 10px; border-radius: var(--r-pill); background: var(--qcm); color: var(--on-tile); font-size: .8125rem; font-weight: 800; }
.tag.qrc { background: var(--qrc); } .tag.ate { background: var(--ate); } .tag.doc { background: var(--doc); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border: var(--bw) solid var(--edge); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-weight: 800; cursor: pointer; white-space: nowrap; }
.btn.go { background: var(--go); color: var(--on-tile); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .55; cursor: default; }

/* ---------- Menu : l'élément courant porte le relief ---------- */
.nav a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border: var(--bw) solid transparent; border-radius: var(--r-md); font-weight: 800; }
.nav a[aria-current="page"] { background: var(--surface); border-color: var(--edge); box-shadow: var(--lift-sm); font-weight: 900; }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .875rem; font-weight: 800; }
.input { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 14px; border: var(--bw) solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.input:focus { outline: none; border-color: var(--edge); box-shadow: var(--lift-sm); }

/* =====================================================================
   Charte « Pastille » · composants communs aux trois applis
   (QCM, QRC de comptabilité, Écrit et oral), à charger après tokens.css.
   Reprend le vocabulaire de « Copie double » (sheet, btn.pri, opt, omr,
   journal…) pour que les vues des applis n'aient pas à changer.
   Mise en page « Colonne » : menu latéral (≥ 860 px), barre du haut et
   onglets en bas sur téléphone, comme l'accueil (site/index.html).
   Chaque appli choisit son pastel avec data-app="qcm|qrc|atelier".
   ===================================================================== */

:root {
  /* États : toujours doublés d'un pictogramme ou d'un mot. Contrastes ≥ 4,5:1 sur le blanc et sur leur fond. */
  --ok: #1D7540;  --ok-soft: #E3F5EA;
  --bad: #B8322A; --bad-soft: #FDE9E5;
  --warn: #855000; --warn-soft: #FFF3D1;
  /* Surligneur soleil, pour un mot ou un chiffre par écran */
  --hl: #FFE07A; --hl-ink: #1B1B2F;

  /* Noms de « Copie double » encore employés par les vues */
  --paper: var(--bg);
  --sunk: var(--side);
  --rule: var(--line);
  --on-accent: var(--bg);   /* texte posé sur l'encre ou sur une couleur d'état */
  --shadow: none;
  --shadow-lift: var(--lift-sm);
  --f-display: var(--f); --f-ui: var(--f); --f-num: var(--f);
  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-base: 1rem; --t-lg: 1.125rem; --t-xl: 1.375rem; --t-2xl: 1.875rem; --t-3xl: 2.5rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --content: 1040px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ok: #6FD497; --ok-soft: #1D3328; --bad: #FF8A7D; --bad-soft: #3D2222; --warn: #F2C66B; --warn-soft: #352E17;
    --hl: #4D4217; --hl-ink: #FFF3C4;
  }
}
:root[data-theme="dark"] {
  --ok: #6FD497; --ok-soft: #1D3328; --bad: #FF8A7D; --bad-soft: #3D2222; --warn: #F2C66B; --warn-soft: #352E17;
  --hl: #4D4217; --hl-ink: #FFF3C4;
}

/* Pastel de l'appli : en touches (pictogrammes, étiquettes, sélection), jamais comme couleur de texte */
:root, [data-app] { --app: var(--qcm); --app-t: var(--qcm-t); --accent: var(--ink); --accent-soft: var(--app-t); }
[data-app="qrc"] { --app: var(--qrc); --app-t: var(--qrc-t); }
[data-app="atelier"] { --app: var(--ate); --app-t: var(--ate-t); }

/* ---------- Base ---------- */
h4 { margin: 0; text-wrap: balance; }
button, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
:focus-visible { border-radius: 6px; }
svg { flex: none; }
.num, .mono { font-variant-numeric: tabular-nums; }
.wrap { width: 100%; max-width: var(--content); margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

.h-page { font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.h-sec { font-size: var(--t-xl); font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
.h-card { font-size: var(--t-base); font-weight: 800; }
.eyebrow { font-size: var(--t-sm); font-weight: 800; color: var(--muted); }
.lede { color: var(--muted); max-width: 64ch; }
.small { font-size: var(--t-sm); }
.muted { color: var(--muted); }
b, strong { font-weight: 800; }
mark.hl { background: var(--hl); color: var(--hl-ink); padding: 0 .2em; border-radius: 4px; }

/* ---------- Ossature « Colonne » ---------- */
.shell { min-height: 100vh; min-height: 100dvh; }
.appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--side); border-bottom: var(--bw) solid var(--line); }
.appbar-in { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; border: 0; background: none; padding: 0; text-align: left; text-decoration: none; color: inherit; cursor: pointer; font: inherit; }
.brand-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-t b { font-size: 1.125rem; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-t small { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-r { display: flex; align-items: center; gap: var(--s2); flex: none; }

/* Logo : tuile pastel, contour d'encre */
.logo { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: var(--bw) solid var(--edge); border-radius: 10px; background: var(--app); color: var(--on-tile); }
.logo svg { width: 20px; height: 20px; }

/* Compte à rebours */
.stamp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--r-pill); background: var(--app); color: var(--on-tile); font-size: var(--t-sm); font-weight: 800; white-space: nowrap; }
.stamp:empty { display: none; }
.stamp b { font-weight: 900; font-variant-numeric: tabular-nums; }

/* Bascules (profil, options) */
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--side); border: var(--bw) solid var(--line-2); border-radius: var(--r-pill); }
.seg button { border: var(--bw) solid transparent; background: none; padding: 4px 12px; border-radius: var(--r-pill); font-size: var(--t-sm); font-weight: 700; color: var(--muted); cursor: pointer; min-height: 32px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); border-color: var(--edge); color: var(--ink); font-weight: 900; }

/* Boutons ronds : thème, retour à l'accueil */
.theme-btn, .home-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; padding: 0; border: var(--bw) solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover, .home-btn:hover { border-color: var(--edge); }
.theme-btn svg, .home-btn svg { width: 18px; height: 18px; }

/* Menu des sections : latéral sur ordinateur */
.tabs { display: none; }
.tabs a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border: var(--bw) solid transparent; border-radius: var(--r-md); color: var(--ink); font-weight: 800; text-decoration: none; }
.tabs a svg { width: 30px; height: 30px; padding: 6px; border-radius: 9px; background: var(--app); color: var(--on-tile); }
.tabs a:hover { background: var(--surface); }
.tabs a[aria-current="page"] { background: var(--surface); border-color: var(--edge); box-shadow: var(--lift-sm); font-weight: 900; }
.tabs .count { margin-left: auto; padding: 0 8px; border-radius: var(--r-pill); background: var(--app); color: var(--on-tile); font-size: var(--t-sm); font-weight: 900; font-variant-numeric: tabular-nums; }
.tabs [aria-current="page"] .count { background: var(--app-t); color: var(--ink); }

/* Onglets du bas : téléphone */
.bottomnav { position: fixed; z-index: 30; inset: auto 0 0 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: var(--bw) solid var(--line); }
.bottomnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 0 2px; font-size: .6875rem; font-weight: 700; color: var(--muted); text-decoration: none; text-align: center; }
.bottomnav a svg { width: 40px; height: 28px; padding: 4px 10px; border-radius: var(--r-pill); color: var(--ink); }
.bottomnav a[aria-current="page"] { color: var(--ink); font-weight: 900; }
.bottomnav a[aria-current="page"] svg { background: var(--app); color: var(--on-tile); outline: var(--bw) solid var(--edge); }
.bottomnav a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 419px) { .bottomnav { padding-inline: 0; } .bottomnav a { padding: 0; font-size: .625rem; letter-spacing: -.02em; } .bottomnav a[aria-current="page"] { font-weight: 800; } }
@media (max-width: 369px) { .bottomnav a { font-size: .59rem; } }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.appbar .seg { display: none; } /* le profil se règle dans les vues sur téléphone */
@media (max-width: 519px) { .appbar .stamp { padding: 4px 10px; } }

@media (min-width: 860px) {
  body { padding-bottom: 0; }
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); align-items: start; }
  .appbar { height: 100vh; height: 100dvh; overflow-y: auto; flex-direction: column; align-items: stretch; gap: 6px; padding: 24px 16px; border-bottom: 0; border-right: var(--bw) solid var(--line); }
  .appbar-in { flex: none; padding: 0 8px 20px; }
  .brand-t b { white-space: normal; line-height: 1.15; }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  .appbar-r { margin-top: auto; flex-wrap: wrap; gap: 10px; padding: 14px 4px 0; border-top: var(--bw) solid var(--line); }
  .appbar .seg { display: inline-flex; }
  .appbar-r .stamp { margin-right: auto; }
  .appbar-r .seg { order: 2; }
  .bottomnav { display: none; }
  .shell > .page { padding-inline: 44px; }
}

/* ---------- Mise en page ---------- */
.page { display: flex; flex-direction: column; gap: var(--s5); padding-block: var(--s5) var(--s7); }
@media (min-width: 860px) { .page { padding-block: 34px 48px; } }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(var(--min, 200px), 1fr)); }
.split { display: grid; gap: var(--s5); grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
@media (max-width: 1099px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* Feuille : la carte de base. La carte principale porte le contour d'encre et l'ombre décalée. */
.sheet { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; padding: 22px; border: var(--bw) solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.sheet.tight { padding: var(--s4); gap: var(--s3); border-radius: 18px; }
.sheet.flat { background: var(--side); border-color: transparent; }
.sheet.main, .main-card { border-color: var(--edge); box-shadow: var(--lift); }
@media (max-width: 519px) { .sheet { padding: 18px; border-radius: 20px; } .sheet.tight { padding: 14px; } }

.hero { display: flex; flex-direction: column; gap: var(--s2); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border: var(--bw) solid var(--edge); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-size: var(--t-md); font-weight: 800; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { background: var(--side); }
.btn.pri { background: var(--go); color: var(--on-tile); border-color: var(--edge); font-weight: 900; }
.btn.pri:hover { background: var(--go); filter: brightness(1.05); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--side); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: var(--t-sm); border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled], .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
kbd { font-family: var(--f); font-size: 11px; font-weight: 800; padding: 1px 5px; border: var(--bw) solid var(--line-2); border-radius: 5px; background: var(--surface); color: var(--muted); }

/* ---------- Étiquettes ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 800; line-height: 1.5; background: var(--side); color: var(--muted); white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.badge.acc { background: var(--app); color: var(--on-tile); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.out { background: none; border: var(--bw) solid var(--line-2); }

/* ---------- Chiffres clés ---------- */
.stats { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat { display: flex; flex-direction: column; gap: 2px; padding: var(--s3) var(--s4); border: var(--bw) solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.stat b { font-size: 1.75rem; font-weight: 900; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat b small { font-size: .9rem; color: var(--muted); font-weight: 700; }
.stat span { font-size: var(--t-sm); color: var(--muted); }
.stat .delta { font-size: var(--t-xs); font-weight: 800; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }

/* ---------- Progression ---------- */
.meter { height: 8px; border-radius: var(--r-pill); background: var(--app-t); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--go); border-radius: inherit; }
.track { position: relative; height: 12px; border-radius: var(--r-pill); background: var(--app-t); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--go); }
.track .fill.ok { background: var(--ok); } .track .fill.bad { background: var(--bad); }
.track .jury { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.track .jury::after { content: attr(data-l); position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 800; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); border: 1px solid var(--line-2); }
.pips i.on { background: var(--app); border-color: var(--edge); }

/* ---------- Retours (correction) ---------- */
.callout { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--side); }
.callout .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--app); color: var(--on-tile); }
.callout .ic svg { width: 16px; height: 16px; }
.callout.ok { background: var(--ok-soft); } .callout.ok .ic { background: var(--ok); color: var(--on-accent); }
.callout.bad { background: var(--bad-soft); } .callout.bad .ic { background: var(--bad); color: var(--on-accent); }
.callout.warn { background: var(--warn-soft); } .callout.warn .ic { background: var(--warn); color: var(--on-accent); }
.callout h4 { font-size: var(--t-base); font-weight: 900; margin-bottom: 2px; }
.callout.ok h4 { color: var(--ok); } .callout.bad h4 { color: var(--bad); } .callout.warn h4 { color: var(--warn); }

/* ---------- Tableaux ---------- */
.tw { overflow-x: auto; margin-inline: calc(var(--s5) * -1); padding-inline: var(--s5); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
table.t th { text-align: left; font-size: var(--t-sm); font-weight: 800; color: var(--muted); padding: 8px 10px; border-bottom: var(--bw) solid var(--line-2); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: var(--bw) solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .r { text-align: right; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--side); }
table.t tr.tot td { font-weight: 900; border-top: var(--bw) solid var(--ink); }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: var(--t-sm); font-weight: 800; }
.input { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 14px; border: var(--bw) solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-size: var(--t-base); font-weight: 700; }
.input:focus { outline: none; border-color: var(--edge); box-shadow: var(--lift-sm); }
.input.n { text-align: right; font-variant-numeric: tabular-nums; }
.input.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.input.is-bad { border-color: var(--bad); background: var(--bad-soft); }

/* Puces de filtre */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: var(--r-pill); border: var(--bw) solid var(--line-2); background: var(--surface); font-size: var(--t-sm); font-weight: 700; cursor: pointer; }
.chips button:hover { border-color: var(--edge); }
.chips button[aria-pressed="true"] { background: var(--app); color: var(--on-tile); border-color: var(--edge); font-weight: 900; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* Chrono */
.clock { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: var(--bw) solid var(--line-2); font-size: 1.05rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.clock svg { width: 16px; height: 16px; color: var(--muted); }
.clock.low { color: var(--bad); border-color: var(--bad); }

@media (prefers-reduced-motion: no-preference) {
  .btn, .opt, .chips button, .tabs a, .theme-btn, .home-btn, .seg button { transition: background-color .12s, border-color .12s, color .12s, box-shadow .12s; }
}

/* ---------- QCM : options de réponse ---------- */
.question { font-size: var(--t-lg); font-weight: 800; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: var(--s2); }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; width: 100%; min-height: 54px; padding: 9px 14px 9px 10px; border: var(--bw) solid var(--line-2); border-radius: var(--r-md); background: var(--surface); color: var(--ink); text-align: left; font-weight: 700; cursor: pointer; }
.opt .box { width: 32px; height: 32px; border: var(--bw) solid var(--edge); border-radius: 9px; display: grid; place-items: center; background: var(--surface); font-weight: 900; font-size: .9rem; }
.opt .box svg { width: 18px; height: 18px; stroke-width: 2.6; }
.opt .t { overflow-wrap: anywhere; }
.opt .lab { font-size: var(--t-xs); font-weight: 900; white-space: nowrap; }
.opt:hover:not([disabled]) { border-color: var(--edge); }
.opt[disabled] { cursor: default; }
.opt.chosen { border-color: var(--edge); background: var(--app-t); }
.opt.chosen .box { background: var(--app); border-color: var(--edge); color: var(--on-tile); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .box { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.opt.right .lab { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .box { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.opt.wrong .lab { color: var(--bad); }
.opts.locked .opt:not(.right):not(.wrong) { opacity: .6; }
.opt.ann { border-style: dashed; }
.opt.ann .box { font-size: .62rem; letter-spacing: .02em; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
.srcs a { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--surface); border: var(--bw) solid var(--line-2); font-size: var(--t-sm); font-weight: 800; text-decoration: none; }
.srcs a:hover { border-color: var(--edge); }
.srcs a svg { width: 14px; height: 14px; }

/* Barre d'épreuve : l'élément principal pendant une épreuve */
.exambar { position: sticky; top: 76px; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; padding: 10px 12px 10px 16px; border: var(--bw) solid var(--edge); border-radius: var(--r-lg); background: var(--surface); color: var(--ink); box-shadow: var(--lift-sm); }
.exambar small { color: var(--muted); font-size: var(--t-xs); }
@media (min-width: 860px) { .exambar { top: 16px; } }

/* Feuille de réponse */
.omr { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.omr button { position: relative; height: 36px; border: var(--bw) solid var(--line-2); border-radius: 9px; background: var(--surface); font-size: var(--t-xs); font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--muted); }
.omr button:hover { border-color: var(--edge); }
.omr button.done { background: var(--app); border-color: var(--app); color: var(--on-tile); }
.omr button.abst { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.omr button.cur { border-color: var(--edge); box-shadow: var(--lift-sm); color: var(--ink); font-weight: 900; }
.omr button.flag::after { content: ""; position: absolute; top: -1.5px; right: -1.5px; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--ink) transparent transparent; border-top-right-radius: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-xs); font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: var(--bw) solid var(--line-2); background: var(--surface); }
.legend i.done { background: var(--app); border-color: var(--app); }
.legend i.abst { background: var(--warn-soft); border-color: var(--warn); }
.legend i.flag { background: linear-gradient(225deg, var(--ink) 50%, var(--surface) 50%); border-color: var(--line-2); }
.legend i.jury { width: 2px; border: 0; background: var(--ink); }

/* Barres de thèmes */
.bars { display: flex; flex-direction: column; gap: 30px; padding-bottom: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.bar-row .lab { display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; align-items: baseline; }
.bar-row .lab b { font-weight: 800; font-size: var(--t-md); }
.bar-row .lab span { font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-row .lab span strong { color: var(--ink); font-weight: 900; }

/* Liste de thèmes en latéral */
.mini { display: flex; flex-direction: column; gap: 12px; }
.mini li { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; font-size: var(--t-sm); }
.mini li .meter { grid-column: 1 / -1; }
.mini ul, ul.mini { margin: 0; padding: 0; }

/* ---------- QRC : énoncé, saisie et journal ---------- */
.kv { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
.kv td { padding: 8px 0; border-bottom: var(--bw) dashed var(--line-2); vertical-align: top; }
.kv td:first-child { color: var(--muted); padding-right: var(--s4); }
.kv td:last-child { text-align: right; white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; }
.kv tr:last-child td { border-bottom: 0; }
.consigne { display: flex; flex-direction: column; gap: 6px; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--side); font-weight: 700; }
.consigne ol { margin: 0; padding-left: 1.3em; }

.answers { display: flex; flex-direction: column; gap: var(--s2); }
.ans { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 200px); gap: 6px var(--s3); align-items: center; padding: 10px 12px; border-radius: var(--r-md); border: var(--bw) solid var(--line); background: var(--surface); }
.ans label { font-size: var(--t-md); font-weight: 700; }
.ans .in { position: relative; }
.ans .in::after { content: "€"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: var(--t-sm); font-weight: 800; color: var(--muted); }
.ans .in .input { padding-right: 28px; }
.ans .fb { grid-column: 1 / -1; display: flex; gap: 6px; align-items: flex-start; font-size: var(--t-sm); font-weight: 700; }
.ans .fb svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.ans.ok { border-color: var(--ok); background: var(--ok-soft); }
.ans.ok .fb { color: var(--ok); }
.ans.bad { border-color: var(--bad); background: var(--bad-soft); }
.ans.bad .fb { color: var(--bad); }
.ans.warn { border-color: var(--warn); background: var(--warn-soft); }
.ans.warn .fb { color: var(--warn); }
@media (max-width: 519px) { .ans { grid-template-columns: 1fr; } }

/* Journal */
.journal { border: var(--bw) solid var(--line-2); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.j-head { display: flex; align-items: center; gap: var(--s3); padding: 10px 14px; background: var(--side); border-bottom: var(--bw) solid var(--line); font-size: var(--t-sm); }
.j-head b { font-weight: 900; font-variant-numeric: tabular-nums; }
.j-head span { color: var(--muted); }
.j-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr) 22px; gap: 0 10px; }
.j-grid > * { padding: 7px 0; display: flex; align-items: center; min-width: 0; }
.j-grid .hd { font-size: var(--t-sm); font-weight: 800; color: var(--muted); border-bottom: var(--bw) solid var(--line-2); padding-block: 8px; }
.j-grid .hd.r { justify-content: flex-end; }
.j-row { display: contents; }
.j-row > * { border-bottom: var(--bw) solid var(--line); }
.j-acc { gap: 10px; }
.j-acc .input { min-height: 38px; width: 6.2rem; flex: none; font-weight: 900; font-variant-numeric: tabular-nums; }
.j-acc small { color: var(--muted); font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.j-row.cr .j-acc { padding-left: 28px; }
.j-row .input.n { min-height: 38px; }
.j-st svg { width: 18px; height: 18px; }
.j-st.ok { color: var(--ok); } .j-st.bad { color: var(--bad); } .j-st.warn { color: var(--warn); }
.j-body { padding: 0 14px; }
.j-foot { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr) 22px; gap: 0 10px; padding: 10px 14px; border-top: var(--bw) solid var(--ink); font-size: var(--t-md); font-weight: 900; font-variant-numeric: tabular-nums; }
.j-foot .r { text-align: right; padding-right: 12px; }
.j-foot .lbl { font-size: var(--t-sm); display: flex; align-items: center; gap: 6px; color: var(--ok); }
.j-foot .lbl svg { width: 16px; height: 16px; }
.j-add { border: 0; background: none; color: var(--ink); font-weight: 800; font-size: var(--t-sm); padding: 10px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.j-add:hover { text-decoration-color: currentColor; }
.j-add svg { width: 16px; height: 16px; }
@media (max-width: 559px) {
  .j-grid, .j-foot { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 18px; }
  .j-grid .hd:first-child { display: none; }
  .j-acc { grid-column: 1 / -1; border-bottom: 0 !important; padding-bottom: 0 !important; }
  .j-row.cr .j-acc { padding-left: 16px; }
  .j-foot .lbl { grid-column: 1 / -1; padding-bottom: 6px; }
  .j-grid .hd:nth-child(2) { grid-column: 1; }
}

/* Score de l'exercice */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s4); align-items: center; padding: var(--s4); border-radius: var(--r-md); background: var(--side); }
.score .big { font-size: var(--t-3xl); font-weight: 900; line-height: 1; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.score .big small { font-size: 1rem; color: var(--muted); font-weight: 700; }

/* Recommandations : la première est la carte principale */
.reco { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.reco a { display: flex; flex-direction: column; gap: 6px; padding: var(--s4); border-radius: var(--r-md); border: var(--bw) solid var(--line); background: var(--surface); text-decoration: none; color: inherit; position: relative; }
.reco a:hover { border-color: var(--edge); }
.reco a b { font-size: var(--t-base); font-weight: 800; padding-right: 22px; }
.reco a .why { display: flex; gap: 6px; align-items: center; font-size: var(--t-sm); color: var(--muted); }
.reco a > svg { position: absolute; top: 16px; right: 14px; width: 18px; height: 18px; color: var(--ink); }
.reco a.first { border-color: var(--edge); box-shadow: var(--lift-sm); }

/* Fiches */
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc h4 { font-size: var(--t-sm); font-weight: 800; color: var(--muted); margin: 14px 0 4px 10px; }
.toc h4:first-child { margin-top: 0; }
.toc a { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border: var(--bw) solid transparent; border-radius: var(--r-sm); font-size: var(--t-md); font-weight: 700; color: var(--ink); text-decoration: none; }
.toc a:hover { background: var(--side); }
.toc a[aria-current="true"] { background: var(--app-t); border-color: var(--edge); font-weight: 900; }
.reading { max-width: 70ch; display: flex; flex-direction: column; gap: var(--s4); }
.reading h3 { font-size: var(--t-xl); font-weight: 800; }
.reading h4 { font-size: var(--t-sm); font-weight: 900; color: var(--muted); margin-top: var(--s2); }
.steps { counter-reset: st; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s3); }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; border: var(--bw) solid var(--edge); background: var(--app); color: var(--on-tile); display: grid; place-items: center; font-size: var(--t-xs); font-weight: 900; margin-top: 1px; }
.traps { list-style: none; margin: 0; padding: var(--s4); display: flex; flex-direction: column; gap: 10px; border-radius: var(--r-md); background: var(--bad-soft); }
.traps li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: var(--t-md); }
.traps li svg { width: 16px; height: 16px; color: var(--bad); margin-top: 3px; stroke-width: 2.4; }
.accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.accts span { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: var(--r-sm); background: var(--side); font-size: var(--t-sm); }
.accts b { color: var(--ink); font-weight: 900; min-width: 3.4em; font-variant-numeric: tabular-nums; }

/* ---------- Divers ---------- */
.note { font-size: var(--t-sm); color: var(--muted); }
.empty { padding: 22px; text-align: center; color: var(--muted); border: var(--bw) dashed var(--line-2); border-radius: var(--r-md); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: var(--bw) solid var(--bad); border-radius: var(--r-md); background: var(--bad-soft); color: var(--ink); font-size: var(--t-md); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: var(--r-md); background: var(--ink); color: var(--bg); font-size: var(--t-md); font-weight: 800; }
@media (min-width: 860px) { .toast { bottom: 24px; } }
.sync-box { display: flex; flex-direction: column; gap: var(--s3); }
.sync-err { color: var(--bad); font-weight: 800; }

/* =====================================================================
   Propre à l'Atelier QRC.
   La charte vient de « 07 Charte DA/pastille » (tokens.css puis appli.css),
   ajoutée par build.js : ne pas la recopier ici.
   ===================================================================== */
.foot { color: var(--muted); font-size: var(--t-xs); padding-block: 0 var(--s6); display: flex; flex-wrap: wrap; gap: 4px 14px; }
@media (max-width: 559px) { .hide-sm { display: none; } }
@media (max-width: 519px) { .tw { margin-inline: calc(var(--s4) * -1); padding-inline: var(--s4); } }
.small b, .lede b { color: var(--ink); }

/* Tableau de bord : la première recommandation est la carte principale */
.reco > button { display: flex; flex-direction: column; gap: 6px; padding: var(--s4); border-radius: var(--r-md); border: var(--bw) solid var(--line); background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; position: relative; }
.reco > button:hover { border-color: var(--edge); }
.reco > button b { font-size: var(--t-base); font-weight: 800; padding-right: 22px; }
.reco > button .why { display: flex; gap: 6px; align-items: center; font-size: var(--t-sm); color: var(--muted); }
.reco > button > svg { position: absolute; top: 16px; right: 14px; width: 18px; height: 18px; color: var(--ink); }
.reco > button.first { border-color: var(--edge); box-shadow: var(--lift-sm); }
table.t tr.click:focus-visible { outline-offset: -2px; }
.seg-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); }
.seg-row .seg { flex-wrap: wrap; border-radius: var(--r-md); }

/* Exercice */
.ex { display: flex; flex-direction: column; gap: var(--s5); }
.ex-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--s3); }
.clock:has(.over) { color: var(--bad); border-color: var(--bad); }
.clock .muted { font-weight: 700; }
.enonce { display: flex; flex-direction: column; gap: var(--s3); max-width: 76ch; }
.enonce ul, .enonce ol, .part ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.part { display: flex; flex-direction: column; gap: var(--s2); }
.part > h3 { font-size: var(--t-base); font-weight: 800; }
.ans .in::after { content: attr(data-u); }
.ans .in[data-u="K€"] .input { padding-right: 36px; }
.ans .in[data-u=""] .input { padding-right: 12px; }
.ans select.input { text-align: left; padding-right: 12px; }
.ans .in:has(select)::after { content: none; }
.ans .fb b { font-weight: 900; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 1rem; }

/* Saisie du journal */
.j-acc small:empty::before { content: "Intitulé du compte"; opacity: .7; }
.j-st { justify-content: center; }
.j-foot .lbl.warn { color: var(--warn); }
.j-foot .lbl.muted { color: var(--muted); }
.jfb { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); font-weight: 700; border-top: var(--bw) solid var(--line); }
.jfb .l { display: flex; gap: 6px; align-items: flex-start; }
.jfb .l svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.jfb .l.ok { color: var(--ok); } .jfb .l.bad { color: var(--bad); }
.jfb .mono { font-weight: 900; }

/* Tableaux produits par le moteur (énoncés et corrigés) */
.tw table { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
.tw th { text-align: left; font-size: var(--t-sm); font-weight: 800; color: var(--muted); padding: 8px 10px; border-bottom: var(--bw) solid var(--line-2); }
.tw td { padding: 8px 10px; border-bottom: var(--bw) solid var(--line); vertical-align: top; }
.tw td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

<script>
/* Synchro commune aux applis Prépa DGFiP 2027 : compte (identifiant + mot de passe) et Firestore.
   Une appli s'enregistre avec PrepaSync.attach(clé, { get, merge }) :
     get()    renvoie l'état local à synchroniser (objet JSON) ;
     merge(o) fusionne l'état distant o dans l'état local, le sauvegarde et réaffiche, sans rappeler changed().
   Après chaque sauvegarde locale, l'appli appelle PrepaSync.changed(clé).
   Données : users/{uid}/apps/{clé} = { json, u, dev }. Firestore garde les écritures hors connexion
   et les envoie au retour du réseau ; chaque appareil reçoit les changements des autres en direct.
   Le SDK Firebase n'est chargé qu'une fois un compte connecté sur l'appareil (ou à l'ouverture du formulaire). */
(function () {
  "use strict";
  var CONFIG = {
    apiKey: "AIzaSyBEGSyRvn1lGRwpZunKyl3DY6HsHe7ZY1Y",
    authDomain: "prepa-dgfip-2027.firebaseapp.com",
    projectId: "prepa-dgfip-2027",
    storageBucket: "prepa-dgfip-2027.firebasestorage.app",
    messagingSenderId: "483566332972",
    appId: "1:483566332972:web:3f3a41ad9ab6f0f4da3589"
  };
  var SDK = "https://www.gstatic.com/firebasejs/12.19.0/";
  // L'identifiant devient une adresse interne : aucun courrier n'y est envoyé, il n'y a donc pas de « mot de passe oublié ».
  var DOMAIN = "prepa.pbailly.fr";
  var FLAG = "prepa-sync-compte", MAX = 900000;

  var apps = {}, listeners = [], fb = null, F = null, user = null, state = "local", err = "", started = false;
  var DEV = (function () {
    try { var d = localStorage.getItem("prepa-appareil"); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem("prepa-appareil", d); } return d; }
    catch (e) { return "inconnu"; }
  })();
  function flag(v) { try { if (v) localStorage.setItem(FLAG, "1"); else localStorage.removeItem(FLAG); } catch (e) { } }
  function hasFlag() { try { return localStorage.getItem(FLAG) === "1"; } catch (e) { return false; } }

  // JSON à clés triées : deux états identiques donnent la même chaîne, quel que soit l'ordre d'insertion.
  function canon(o) {
    if (o === null || typeof o !== "object") return JSON.stringify(o);
    if (Array.isArray(o)) return "[" + o.map(canon).join(",") + "]";
    return "{" + Object.keys(o).sort().filter(function (k) { return o[k] !== undefined; }).map(function (k) { return JSON.stringify(k) + ":" + canon(o[k]); }).join(",") + "}";
  }
  function emit() { var s = api.status(); listeners.forEach(function (f) { try { f(s); } catch (e) { } }); }
  function setState(s, e) { state = s; err = e || ""; emit(); }

  function load() {
    if (fb) return fb;
    fb = Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]).then(function (m) {
      var A = m[0], Au = m[1], Fs = m[2];
      var app = A.initializeApp(CONFIG);
      var auth = Au.initializeAuth(app, { persistence: [Au.indexedDBLocalPersistence, Au.browserLocalPersistence] });
      var db;
      try { db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache({ tabManager: Fs.persistentMultipleTabManager() }) }); }
      catch (e) { db = Fs.getFirestore(app); }
      F = { Au: Au, Fs: Fs, auth: auth, db: db };
      return F;
    });
    fb.catch(function () { fb = null; setState("local", "Service de synchronisation injoignable."); });
    return fb;
  }
  function start() {
    if (started) return load();
    started = true;
    setState("connexion");
    return load().then(function (f) {
      f.Au.onAuthStateChanged(f.auth, function (u) {
        Object.keys(apps).forEach(stop);
        depWatchers.forEach(depStop);
        user = u;
        if (u) { flag(true); setState("attente"); Object.keys(apps).forEach(watch); }
        else { flag(false); setState("local"); }
        depWatchers.forEach(depSub);
      });
      return f;
    }, function (e) { started = false; throw e; });
  }

  function stop(key) { var a = apps[key]; if (a && a.unsub) { a.unsub(); a.unsub = null; a.ref = null; } }
  function watch(key) {
    var a = apps[key]; if (!a || !user || !F || a.unsub) return;
    a.ref = F.Fs.doc(F.db, "users", user.uid, "apps", key);
    a.first = true;
    a.unsub = F.Fs.onSnapshot(a.ref, function (snap) {
      if (snap.metadata.hasPendingWrites) return; // écho de nos propres écritures
      var d = snap.exists() ? snap.data() : null;

        try { var o = JSON.parse(d.json); a.canon = canon(o); a.merge(o); } catch (e) { }

      if (a.first) { a.first = false; push(key, !d); }
      setState(snap.metadata.fromCache ? "attente" : "ok");

  }
  function push(key, now) {
    var a = apps[key]; if (!a) return;
    clearTimeout(a.t);
    a.t = setTimeout(function () {
      if (!a.ref) return;
      var o; try { o = a.get(); } catch (e) { return; }
      var c = canon(o); if (c === a.canon) return;
      var json = JSON.stringify(o);
      if (json.length > MAX) { setState("plein"); return; }
      a.canon = c; a.last = json;
      F.Fs.setDoc(a.ref, { json: json, u: Date.now(), dev: DEV }).then(function () { if (state !== "erreur") setState(navigator.onLine === false ? "attente" : "ok"); }, function (e) { setState("erreur", (e && e.code) || "erreur"); });
    }, now ? 0 : 1200);
  }

  var MSG = {
    "auth/invalid-credential": "Identifiant ou mot de passe incorrect.",
    "auth/wrong-password": "Identifiant ou mot de passe incorrect.",
    "auth/user-not-found": "Identifiant ou mot de passe incorrect.",
    "auth/invalid-email": "Identifiant invalide.",
    "auth/email-already-in-use": "Cet identifiant est déjà pris.",
    "auth/weak-password": "Mot de passe trop court : 6 caractères minimum.",
    "auth/network-request-failed": "Pas de connexion réseau.",
    "auth/too-many-requests": "Trop d'essais : réessaie dans quelques minutes.",
    "auth/admin-restricted-operation": "La création de compte est fermée.",
    "auth/operation-not-allowed": "La création de compte est fermée."
  };
  function msg(e) { return MSG[e && e.code] || "Échec : " + ((e && (e.code || e.message)) || "erreur inconnue") + "."; }
  function norm(name) { return String(name || "").trim().toLowerCase(); }
  function check(name, pw) {
    if (!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(norm(name))) return "Identifiant : 3 à 30 caractères, lettres, chiffres, point, tiret ou tiret bas.";
    if (!pw) return "Saisis un mot de passe.";
    return "";
  }
  // Firebase exige 6 caractères au moins : on lui envoie l'empreinte SHA-256 du mot de passe,
  // ce qui accepte n'importe quel mot de passe, même très court.
  function derive(pw) {
    var data = new TextEncoder().encode("prepa-dgfip-2027|" + pw);
    return crypto.subtle.digest("SHA-256", data).then(function (h) {
      return "p1:" + Array.prototype.map.call(new Uint8Array(h), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }
  function bad(e) { var c = e && e.code; return c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found"; }

  var api = {
    attach: function (key, o) {
      apps[key] = { get: o.get, merge: o.merge, canon: null, last: null, ref: null, unsub: null, t: null };
      if (user) watch(key); else if (hasFlag()) start();
    },
    changed: function (key) { if (apps[key] && apps[key].ref) push(key); },
    // Reprend la session enregistrée sur l'appareil sans appli attachée (page d'accueil).
    resume: function () { if (hasFlag()) start().catch(function () { }); },
    connected: hasFlag,
    onStatus: function (f) { listeners.push(f); f(api.status()); },
    status: function () { return { state: state, error: err, user: user ? (user.displayName || (user.email || "").split("@")[0]) : "" }; },
    label: function () {
      var s = api.status();
      if (s.user) return state === "ok" ? "synchronisée avec le compte " + s.user : state === "plein" ? "trop volumineuse pour le compte, sur cet appareil seulement" : state === "erreur" ? "sur cet appareil (synchro en erreur)" : "sur cet appareil, envoi au compte " + s.user + " dès que le réseau revient";
      return state === "connexion" ? "sur cet appareil (connexion…)" : "sur cet appareil";
    },
    signIn: function (name, pw) {
      var why = check(name, pw); if (why) return Promise.reject(why);
      var mail = norm(name) + "@" + DOMAIN;
      return Promise.all([start(), derive(pw)]).then(function (r) {
        var f = r[0], key = r[1];
        return f.Au.signInWithEmailAndPassword(f.auth, mail, key).catch(function (e) {
          // Compte créé avant l'empreinte (mot de passe envoyé tel quel) : connexion puis conversion.

/* ===== Amortissements (partagé) ===== */
var AM = (function () {
  var r2 = U.r2;
  function coefDeg(n) { return n <= 4 ? 1.25 : (n <= 6 ? 1.75 : 2.25); }
  // Plan linéaire : départ à la date de mise en service (année 360 jours)
  function lineaire(base, n, d, m) {
    var annu = base / n, rows = [], cum = 0, vnc = base, y = 0;
    var j1 = U.joursRestants(d, m);
    var first = j1 >= 360 ? r2(annu) : r2(annu * j1 / 360);
    while (vnc > 0.004) {
      var a = y === 0 ? first : r2(annu);
      if (a > vnc - 0.004 || (y > 0 && vnc - a < 0.05)) a = vnc;
      cum = r2(cum + a); var v0 = vnc; vnc = r2(base - cum);
      rows.push({ y: y, base: base, v0: v0, a: a, cum: cum, vnc: vnc, prorata: y === 0 ? j1 : 360 });
      y++;
      if (y > 60) break;
    }
    return { annu: annu, taux: 1 / n, rows: rows, j1: j1 };
  }
  // Plan dégressif fiscal : départ le 1er jour du mois d'acquisition, n exercices
  function degressif(base, n, mAcq) {
    var c = coefDeg(n), t = c / n, rows = [], vnc = base, bascule = -1;
    var mois1 = 13 - mAcq;
    for (var k = 0; k < n; k++) {
      var rest = n - k, deg = vnc * t * (k === 0 ? mois1 / 12 : 1), lin = vnc / rest, a, mode = 'dég.';
      if (k === n - 1) { a = vnc; mode = bascule >= 0 ? 'lin.' : 'solde'; }
      else if (k > 0 && (bascule >= 0 || lin >= deg - 1e-9)) { a = lin; mode = 'lin.'; if (bascule < 0) bascule = k; }
      else a = deg;
      a = r2(a); var v0 = vnc; vnc = r2(vnc - a);
      rows.push({ y: k, v0: v0, a: a, vnc: vnc, mode: mode, rest: rest, tlin: 1 / rest });
    }
    if (bascule < 0 && n > 1) bascule = n - 1;
    return { coef: c, taux: t, rows: rows, bascule: bascule, mois1: mois1 };
  }
  return { coefDeg: coefDeg, lineaire: lineaire, degressif: degressif };
})();

  solve: function (p) {

      if (o.vp) li.push('Achat d’une voiture de tourisme pour le directeur commercial : ' + e(o.vp));
      if (o.aic) li.push('Acquisition intracommunautaire de marchandises auprès d’un fournisseur allemand : ' + e(o.aic));

  }

      com.push('Chaque année, le coefficient définitif est comparé à celui de l’année d’acquisition (' + n(p.c0, 2) + ') ; seul un écart de plus de 10 points entraîne une régularisation, égale à un ' + (p.meuble ? 'cinquième' : 'vingtième') + ' de la TVA d’origine multiplié par l’écart.');

      com.push('Un reversement augmente les charges de l’exercice et pèse sur la trésorerie ; un complément de déduction constitue au contraire un produit et une créance sur l’État.');

    } else if (p.sub === 'cession') {

      en += '<p class="consigne">Calculez la régularisation de TVA due lors de la cession et comptabilisez-la au 31/12/' + U.yl(p.kc) + '.</p>';
      qs.push(Q('ann', 'Nombre d’années civiles écoulées (année de cession comprise)', ec2, 'u', { tol: 0 }));
      qs.push(Q('rev', 'Montant de TVA à reverser', rev, '€'));
      c.push(['TVA déduite à l’origine', n(tva) + ' × ' + n(p.c0, 2), e(tvaD)]);
      c.push(['Années écoulées', 'de N à ' + U.yl(p.kc) + ' inclus', String(ec2)]);
      c.push(['Reversement', n(tvaD) + ' × (20 − ' + ec2 + ') ÷ 20', '<b>' + e(rev) + '</b>']);
      journal.push(U.entry('31/12/' + U.yl(p.kc), 'Reversement de TVA sur cession d’immeuble', [L('6358', rev, 0), L('44571', 0, rev, { lib: 'TVA à reverser' })]));
      com.push('La TVA déduite sur un immeuble n’est définitivement acquise qu’au terme d’une période de 20 ans.');
      com.push('En cédant le bien sans TVA au bout de ' + ec2 + ' années civiles, l’entreprise sort l’immeuble du circuit taxable : elle doit reverser la fraction de TVA correspondant aux ' + (20 - ec2) + ' années restantes, soit ' + e(rev) + '.');
      com.push('Ce reversement est une charge de l’exercice de cession ; il réduit d’autant le résultat de l’opération, qu’il faut intégrer dans la décision de vendre.');
      com.push('L’option pour la TVA sur la vente, quand elle est possible, éviterait ce reversement et permettrait même à l’acquéreur de déduire la taxe.');
      com.push('Le coût d’entrée et le plan d’amortissement ne sont pas modifiés ; la plus ou moins-value de cession se calcule séparément.');
    } else {
      var reg2 = U.r2(tva * (p.cdef - p.cprov));

      en += '<p class="consigne">Calculez la régularisation à opérer avant le 25 avril N+1 (positive pour un complément de déduction, négative pour un reversement) et comptabilisez-la au 31/03/N+1.</p>';

      c.push(['TVA déductible (définitive)', n(tva) + ' × ' + n(p.cdef, 2), e(U.r2(tva * p.cdef))]);
      c.push(['Régularisation', n(tva) + ' × (' + n(p.cdef, 2) + ' − ' + n(p.cprov, 2) + ')', '<b>' + (reg2 > 0 ? '+' : '') + e(reg2) + '</b>']);
      if (reg2 < 0) journal.push(U.entry('31/03/N+1', 'Ajustement au coefficient définitif (reversement)', [L('6358', -reg2, 0), L('44571', 0, -reg2, { lib: 'TVA à reverser' })]));
      if (reg2 > 0) journal.push(U.entry('31/03/N+1', 'Ajustement au coefficient définitif (complément)', [L('44562', reg2, 0), L('758', 0, reg2)]));

      com.push('Une fois le coefficient définitif de N connu (' + n(p.cdef, 2) + '), la déduction est ajustée sans seuil de tolérance, ici de ' + e(reg2) + '.');
      com.push('Cet ajustement, réalisé au plus tard le 25 avril N+1, est porté sur la déclaration du mois.');
      com.push('Le coefficient définitif de N devient la référence pour les régularisations annuelles des années suivantes : seuls les écarts de plus de 10 points par rapport à lui seront régularisés.');
      com.push('La différence est constatée en charge ou en produit, sans modifier le coût d’acquisition déjà retenu.');
    }
    return { enonce: en, questions: qs, journal: journal, steps: [{ h: 'Calculs', html: U.calc(c) }], comment: com.join(' ') };
  }
};

function ACC(a) { return U.pcgOld ? ({ '657': '675', '757': '775', '747': '777' }[a] || a) : a; }
var BIENS = [
  { lib: 'une machine-outil', compte: '2154', amort: '28154', cat: 'matériel industriel' },
  { lib: 'une ligne d’embouteillage', compte: '2154', amort: '28154', cat: 'matériel industriel' },
  { lib: 'un bras robotisé', compte: '2154', amort: '28154', cat: 'matériel industriel' },

  { lib: 'un camion frigorifique', compte: '2182', amort: '28182', cat: 'matériel de transport' }
];
function coutAcq(p) {
  var rem = U.r2(p.prix * (p.remise || 0));
  var base = U.r2(p.prix - rem);
  (p.frais || []).forEach(function (f) { if (f.incl) base = U.r2(base + f.mt); });
  return { rem: rem, base: base };
}
function coutTxt(p, ca) {
  var parts = [U.n(p.prix)];
  if (ca.rem) parts.push('− ' + U.n(ca.rem) + ' (remise)');
  (p.frais || []).forEach(function (f) { if (f.incl) parts.push('+ ' + U.n(f.mt) + ' (' + f.lib.toLowerCase() + ')'); });
  var exc = (p.frais || []).filter(function (f) { return !f.incl; }).map(function (f) { return f.lib.toLowerCase(); });
  return parts.join(' ') + (exc.length ? ' ; exclus : ' + exc.join(', ') + ' (charges)' : '');
}
function genFrais(r, prix) {
  var f = [];
  if (r.chance(0.7)) f.push({ lib: 'Frais de transport', mt: U.r0(prix * r.int(2, 5) / 100 / 10) * 10, incl: true });
  if (r.chance(0.7)) f.push({ lib: 'Frais d’installation et de montage', mt: U.r0(prix * r.int(3, 9) / 100 / 10) * 10, incl: true });
  if (r.chance(0.5)) f.push({ lib: 'Formation du personnel', mt: U.r0(prix * r.int(1, 3) / 100 / 10) * 10, incl: false });
  if (r.chance(0.3)) f.push({ lib: 'Frais de publicité pour le lancement du produit', mt: U.r0(prix * r.int(1, 3) / 100 / 10) * 10, incl: false });
  return f;
}
function planLinTable(pl) {
  return U.tbl(['Exercice', 'Base', 'Annuité', 'Cumul', 'VNC fin'], pl.rows.map(function (r) { return [U.yl(r.y) + (r.prorata < 360 ? ' (' + U.prorataTxt(r.prorata) + ')' : ''), U.n(r.base, 2), U.n(r.a, 2), U.n(r.cum, 2), U.n(r.vnc, 2)]; }));
}
function planDegTable(pd) {
  return U.tbl(['Exercice', 'VNC début', 'Taux', 'Annuité', 'VNC fin'], pd.rows.map(function (r) { return [U.yl(r.y) + (r.y === 0 ? ' (' + pd.mois1 + '/12)' : ''), U.n(r.v0, 2), r.mode === 'dég.' ? U.pcs(pd.taux) : (r.mode === 'lin.' ? 'lin. 1/' + r.rest : 'solde'), U.n(r.a, 2), U.n(r.vnc, 2)]; }));
}

/* ---------- 6. Amortissement dérogatoire ---------- */
function planDerog(p, base) {
  var pl = AM.lineaire(base, p.n, p.mes.d, p.mes.m);
  var pf = p.fiscal === 'lin' ? AM.lineaire(base, p.nF, p.mes.d, p.mes.m) : AM.degressif(base, p.n, p.mes.m);
  var ny = Math.max(pl.rows.length, pf.rows.length), rows = [], solde = 0;
  for (var y = 0; y < ny; y++) {
    var a = pl.rows[y] ? pl.rows[y].a : 0, f = pf.rows[y] ? pf.rows[y].a : 0, d = U.r2(f - a);
    solde = U.r2(solde + d);
    rows.push({ y: y, c: a, f: f, d: d, solde: solde });
  }
  return { pl: pl, pf: pf, rows: rows };
}

  }
};

      p.INT = r.int(1, 12) * 5; p.DF = r.chance(0.4) ? r.int(1, 3) * 5 : 0; p.CFt = p.INT + p.DF;
      p.RF = r.chance(0.4) ? r.int(1, 3) * 5 : 0; p.PFt = p.RF + r.int(0, 6) * 5;
      p.PCEA = r.chance(0.6) ? r.int(2, 20) * 5 : 0; p.QPS = r.chance(0.5) ? r.int(1, 6) * 5 : 0; p.REX = 0; p.PEt = p.PCEA + p.QPS + r.int(0, 4) * 5;

  calc: function (p) {

    en += '<div class="two">' + U.tbl(['Charges', 'K€'], ch) + U.tbl(['Produits', 'K€'], pr) + '</div>';
    en += '<p>Dividendes mis en paiement en N : ' + n(p.DIV) + ' K€.</p><p class="consigne">1. Calculez les soldes intermédiaires de gestion. 2. Calculez la CAF par les deux méthodes, puis l’autofinancement. 3. Commentez la part de la valeur ajoutée absorbée par les charges de personnel.</p>';
    qs = [];
    if (p.VM) qs.push(Q('mc', 'Marge commerciale (K€)', x.MC, '€', { tol: 0.5 }));
    qs.push(Q('prod', 'Production de l’exercice (K€)', x.PROD, '€', { tol: 0.5 }), Q('va', 'Valeur ajoutée (K€)', x.VA, '€', { tol: 0.5 }), Q('ebe', 'Excédent brut d’exploitation (K€)', x.EBE, '€', { tol: 0.5 }), Q('re', 'Résultat d’exploitation (K€)', x.RE, '€', { tol: 0.5 }), Q('rcai', 'Résultat courant avant impôt (K€)', x.RCAI, '€', { tol: 0.5 }), Q('rex', 'Résultat exceptionnel (K€)', x.REX, '€', { tol: 0.5 }), Q('rn', 'Résultat net (K€)', x.RN, '€', { tol: 0.5 }), Q('caf', 'CAF (K€)', x.CAFs, '€', { tol: 0.5 }), Q('af', 'Autofinancement (K€)', x.AF, '€', { tol: 0.5 }), Q('pva', 'Charges de personnel ÷ valeur ajoutée', U.rd(x.pers / x.VA * 100, 1), '%', { tol: 0.15 }));

    return { enonce: en, questions: qs, journal: [], steps: steps, comment: com };
  }
};

/* ---------- 14. Bilan fonctionnel ---------- */
T.bilan_fonc = {
  id: 'bilan_fonc', nom: 'Bilan fonctionnel (FRNG, BFR, trésorerie)', famille: 'Analyse financière', ctrl: true, minutes: 20,
  fiche: {
    objectif: 'Reclasser le bilan comptable en valeurs brutes selon les cycles, puis calculer FRNG, BFRE, BFRHE et trésorerie nette.',
    etapes: [
      'Emplois stables = immobilisations brutes (incorporelles, corporelles, financières).',
      'Ressources stables = capitaux propres (capital non appelé déduit) + amortissements et dépréciations (de tout l’actif) + provisions pour risques + dettes financières hors concours bancaires courants et hors intérêts courus.',
      'Actif circulant d’exploitation = stocks bruts + créances clients brutes + avances versées + charges constatées d’avance d’exploitation.',
      'Dettes d’exploitation = fournisseurs + dettes fiscales et sociales hors IS + avances reçues + produits constatés d’avance d’exploitation.',
      'Hors exploitation : autres créances (actif) ; IS, dettes sur immobilisations, intérêts courus, dividendes à payer (passif).',
      'Trésorerie active = VMP brutes + disponibilités ; trésorerie passive = concours bancaires courants.',
      'FRNG = RS − ES ; BFRE = ACE − DE ; BFRHE = ACHE − DHE ; TN = FRNG − BFR, vérifiée par TA − TP.',
      'BFRE en jours de CA = BFRE ÷ CA HT × 360.'
    ],
    pieges: [
      'Reprendre les valeurs nettes : le bilan fonctionnel est en valeurs brutes, les amortissements et dépréciations passent en ressources stables.',
      'Laisser les concours bancaires dans les emprunts.',
      'Classer l’IS en dettes d’exploitation (il est hors exploitation).',
      'Les subventions d’investissement font partie des capitaux propres.',
      'Vérifier toujours FRNG − BFR = TA − TP.'
    ],
    comptes: []
  },
  gen: function (r) {
    for (var t = 0; t < 300; t++) {
      var p = { nom: U.nom(r), k: true };
      p.II = [r.int(2, 40) * 10, 0]; p.II[1] = U.r0(p.II[0] * r.int(20, 60) / 100);
      p.IC = [r.int(50, 600) * 10, 0]; p.IC[1] = U.r0(p.IC[0] * r.int(25, 60) / 100);
      p.IF = [r.int(0, 30) * 10, 0]; p.IF[1] = p.IF[0] ? r.int(0, 3) * 5 : 0;
      p.ST = [r.int(10, 150) * 10, 0]; p.ST[1] = r.int(0, 6) * 5;
      p.CL = [r.int(10, 200) * 10, 0]; p.CL[1] = r.int(0, 8) * 5;
      p.AUT = r.int(0, 20) * 10; p.VMP = r.int(0, 10) * 10; p.DISP = r.int(1, 30) * 10; p.CCA = r.int(0, 6) * 5;
      p.CSNA = r.chance(0.2) ? r.int(1, 10) * 10 : 0;
      p.CAP = r.int(20, 200) * 10 + p.CSNA * 2; p.RES_ = r.int(1, 25) * 10; p.SUB = r.chance(0.5) ? r.int(1, 15) * 10 : 0; p.PROV = r.int(0, 10) * 10;
      p.EMP = r.int(10, 300) * 10; p.CBC = r.chance(0.6) ? r.int(1, 25) * 10 : 0; p.ICNE = r.chance(0.3) ? r.int(1, 4) * 5 : 0; p.EMP += p.CBC + p.ICNE;
      p.FOU = U.r0((p.ST[0] + p.CL[0]) * r.int(30, 70) / 100 / 10) * 10; p.DFS = r.int(5, 60) * 10; p.ISD = r.chance(0.7) ? U.r0(p.DFS * r.int(10, 30) / 100 / 5) * 5 : 0;
      p.DIMMO = r.chance(0.5) ? r.int(1, 10) * 10 : 0; p.PCA = r.int(0, 6) * 5;
      var actif = (p.II[0] - p.II[1]) + (p.IC[0] - p.IC[1]) + (p.IF[0] - p.IF[1]) + (p.ST[0] - p.ST[1]) + (p.CL[0] - p.CL[1]) + p.AUT + p.VMP + p.DISP + p.CCA + p.CSNA;
      var passifSansRes = p.CAP + p.RES_ + p.SUB + p.PROV + p.EMP + p.FOU + p.DFS + p.DIMMO + p.PCA;
      p.RESV = actif - passifSansRes;
      if (p.RESV < 20 || p.RESV > p.CAP * 2) continue;
      p.CA = U.r0((p.ST[0] + p.CL[0]) * r.int(25, 60) / 10 / 100) * 100;
      return p;
    }
  },
  calc: function (p) {
    var x = {};
    x.ES = p.II[0] + p.IC[0] + p.IF[0];
    x.AMD = p.II[1] + p.IC[1] + p.IF[1] + p.ST[1] + p.CL[1] + (p.VMPd || 0);
    x.CP = p.CAP + p.RESV + p.RES_ + p.SUB - p.CSNA;
    x.EMPs = p.EMP - p.CBC - p.ICNE;
    x.RS = x.CP + x.AMD + p.PROV + x.EMPs;
    x.ACE = p.ST[0] + p.CL[0] + p.CCA; x.ACHE = p.AUT; x.TA = p.VMP + (p.VMPd || 0) + p.DISP;
    x.DE = p.FOU + (p.DFS - p.ISD) + p.PCA; x.DHE = p.ISD + p.DIMMO + p.ICNE + (p.DIVP || 0); x.TP = p.CBC;
    x.FRNG = x.RS - x.ES; x.BFRE = x.ACE - x.DE; x.BFRHE = x.ACHE - x.DHE; x.BFR = x.BFRE + x.BFRHE; x.TN = x.FRNG - x.BFR; x.TN2 = x.TA - x.TP;

  gen: function (r) {

  id: 'devises', nom: 'Opérations en devises', famille: 'Comptabilité générale', ctrl: false, minutes: 15,

    objectif: 'Enregistrer une créance ou une dette en devises, l’évaluer à la clôture et constater le résultat de change au règlement.',
    etapes: [

      'À la clôture : réévaluation au cours du 31/12 ; l’écart est inscrit en différence de conversion : 476 (actif) si perte latente, 477 (passif) si gain latent.',

      'À l’ouverture de N+1 : contrepassation des écarts de conversion.',
      'Au règlement : écart entre la valeur d’origine et la somme réellement encaissée ou payée → 656 perte de change ou 756 gain de change (opérations commerciales) ; reprise de la provision D 1515 / C 7865.'

      'Comptabiliser le gain latent en produit.',
      'Opération commerciale : 656 / 756 (opération financière : 666 / 766).'
    ],
    comptes: ['411 / 401 Clients / Fournisseurs', '476 / 477 Différences de conversion', '6865 / 1515 Provision pour perte de change', '7865 Reprise', '656 / 756 Pertes et gains de change']
  },
  gen: function (r) {
    var dev = r.pick([['USD', 1.05, 1.22], ['GBP', 0.82, 0.90], ['CHF', 0.91, 1.00]]);
    var c0 = U.rd(dev[1] + (dev[2] - dev[1]) * r.f(), 4), c1, c2;
    do { c1 = U.rd(c0 * (1 + (r.f() - 0.5) * 0.12), 4); } while (Math.abs(c1 - c0) / c0 < 0.01);
    do { c2 = U.rd(c1 * (1 + (r.f() - 0.5) * 0.08), 4); } while (Math.abs(c2 - c0) / c0 < 0.005);
    return { nom: U.nom(r), sens: r.pick(['vente', 'achat']), dev: dev[0], X: r.int(10, 400) * 1000, c0: c0, c1: c1, c2: c2, d0: { d: r.int(2, 28), m: r.int(10, 12) }, dR: { d: r.int(5, 28), m: r.int(1, 3) } };
  },
  calc: function (p) {
    var V0 = U.r2(p.X / p.c0), V1 = U.r2(p.X / p.c1), V2 = U.r2(p.X / p.c2);
    var ecart = U.r2(V1 - V0);
    var perteLat = p.sens === 'vente' ? ecart < 0 : ecart > 0;
    var res = p.sens === 'vente' ? U.r2(V2 - V0) : U.r2(V0 - V2);
    return { V0: V0, V1: V1, V2: V2, ecart: Math.abs(ecart), perteLat: perteLat, prov: perteLat ? Math.abs(ecart) : 0, res: res };
  },
  solve: function (p) {
    var x = this.calc(p), e = U.e, n = U.n, L = U.L, D = p.dev, vente = p.sens === 'vente';
    var d0 = U.dt(p.d0.d, p.d0.m), dR = U.dt(p.dR.d, p.dR.m, 1);

    var qs = [Q('v0', 'Valeur en euros à l’origine', x.V0, '€'), Q('v1', 'Valeur en euros au 31/12/N', x.V1, '€'), Q('ec', 'Écart de conversion (montant)', x.ecart, '€'), QC('nat', 'Nature de l’écart', ['Perte latente (476)', 'Gain latent (477)'], x.perteLat ? 0 : 1), Q('pr', 'Provision pour perte de change', x.prov, '€'), Q('rs', 'Résultat de change au règlement (+ gain, − perte)', x.res, '€')];
    var c = [['Valeur d’origine', n(p.X) + ' ÷ ' + n(p.c0, 4), e(x.V0)], ['Valeur au 31/12', n(p.X) + ' ÷ ' + n(p.c1, 4), e(x.V1)], ['Écart', (vente ? 'créance ' : 'dette ') + (x.V1 > x.V0 ? 'en hausse' : 'en baisse') + ' de ' + n(x.ecart), x.perteLat ? 'perte latente' : 'gain latent'], ['Provision', x.perteLat ? 'égale à la perte latente' : 'aucune (gain latent non comptabilisé)', e(x.prov)], ['Montant réglé', n(p.X) + ' ÷ ' + n(p.c2, 4), e(x.V2)], ['Résultat de change', vente ? n(x.V2) + ' − ' + n(x.V0) : n(x.V0) + ' − ' + n(x.V2), '<b>' + (x.res >= 0 ? 'gain ' : 'perte ') + e(Math.abs(x.res)) + '</b>']];
    var J = [];
    J.push(vente ? U.entry(d0, 'Vente à l’exportation', [L('411', x.V0, 0), L('707', 0, x.V0)]) : U.entry(d0, 'Achat à l’importation', [L('607', x.V0, 0), L('401', 0, x.V0)]));
    var tiers = vente ? '411' : '401';
    if (x.perteLat) {
      J.push(U.entry('31/12/N', 'Écart de conversion (perte latente)', vente ? [L('476', x.ecart, 0), L('411', 0, x.ecart)] : [L('476', x.ecart, 0), L('401', 0, x.ecart)]));
      J.push(U.entry('31/12/N', 'Provision pour perte de change', [L('6865', x.prov, 0), L('1515', 0, x.prov)]));
    } else {
      J.push(U.entry('31/12/N', 'Écart de conversion (gain latent)', vente ? [L('411', x.ecart, 0), L('477', 0, x.ecart)] : [L('401', x.ecart, 0), L('477', 0, x.ecart)]));
    }
    var reg = vente ? [L('512', x.V2, 0), L('656', x.res < 0 ? -x.res : 0, 0), L('411', 0, x.V0), L('756', 0, x.res > 0 ? x.res : 0)]
      : [L('401', x.V0, 0), L('656', x.res < 0 ? -x.res : 0, 0), L('512', 0, x.V2), L('756', 0, x.res > 0 ? x.res : 0)];
    J.push(U.entry(dR, 'Règlement', reg));
    if (x.prov) J.push(U.entry(dR, 'Reprise de la provision pour perte de change', [L('1515', x.prov, 0), L('7865', 0, x.prov)]));
    var com = 'Une opération en devises expose l’entreprise au risque de change entre la date de l’opération et celle du règlement. À la clôture, ' + (vente ? 'la créance' : 'la dette') + ' est réévaluée au cours du 31/12 pour donner une image fidèle du bilan, mais l’écart n’est pas encore réalisé : il est inscrit en compte d’attente (' + (x.perteLat ? '476' : '477') + ') et n’affecte pas directement le résultat. ' + (x.perteLat ? 'S’agissant d’une perte latente, la prudence impose de constituer une provision de ' + e(x.prov) + ', qui réduit le résultat de N.' : 'S’agissant d’un gain latent, il n’est pas comptabilisé en produit : la prudence interdit de constater un gain non réalisé.') + ' Les écarts de conversion sont contrepassés à l’ouverture de N+1 et le résultat de change réel n’apparaît qu’au règlement : ' + (x.res >= 0 ? 'un gain' : 'une perte') + ' de ' + e(Math.abs(x.res)) + ', en compte ' + (x.res >= 0 ? '756' : '656') + ' pour une opération commerciale. ' + (x.prov ? 'La provision devenue sans objet est reprise. ' : '') + 'Pour se protéger, l’entreprise peut facturer en euros, couvrir l’opération par une vente ou un achat à terme de devises, ou recourir à des options de change.';
    return { enonce: en, questions: qs, journal: J, steps: [{ h: 'Calculs', html: U.calc(c) }], comment: com };
  }
