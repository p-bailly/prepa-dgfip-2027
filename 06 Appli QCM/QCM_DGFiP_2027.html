<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>QCM DGFiP 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* --- Copie de « 07 Charte DA/tokens.css » puis « composants.css » : les mettre à jour ensemble. --- */
/* =====================================================================
   Charte « Copie double » · Prépa DGFiP 2027
   Socle commun aux deux applis : QCM DGFiP 2027 et Atelier QRC compta.
   Concept : la copie d'examen. Papier crème, encre bleue, chiffres en
   machine à écrire, surligneur jaune pour ce qui compte.
   Chaque appli choisit sa couleur d'encre avec <body data-app="qcm|qrc">.
   ===================================================================== */

/* Polices (à charger dans le <head>) :
   https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap */

:root {
  /* Papier et encre */
  --paper: #F5F3EE;
  --surface: #FFFFFF;
  --sunk: #F0EDE6;
  --ink: #16213A;
  --muted: #5A6377;
  --line: #DAD5CA;
  --rule: #E8E4DB;
  --shadow: 0 1px 0 rgba(22, 33, 58, .04), 0 1px 3px rgba(22, 33, 58, .06);
  --shadow-lift: 0 2px 4px rgba(22, 33, 58, .06), 0 8px 24px rgba(22, 33, 58, .08);

  /* Encre de chaque appli (accent d'action) */
  --qcm: #2A44C7;      --qcm-soft: #E7EBFB;
  --qrc: #0E6871;      --qrc-soft: #E0F0F0;
  --accent: var(--qcm); --accent-soft: var(--qcm-soft); --on-accent: #FFFFFF;

  /* Surligneur : signature de la marque, jamais pour un état */
  --hl: #FFE45E;       --hl-ink: #16213A;

  /* États (toujours doublés d'un pictogramme ou d'un mot) */
  --ok: #217A3C;       --ok-soft: #E2F2E5;
  --bad: #B8322A;      --bad-soft: #FAE6E2;
  --warn: #8F5600;     --warn-soft: #FBEFD5;

  /* Typographie */
  --f-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --t-xs: .75rem;   /* 12 : mentions, axes */
  --t-sm: .8125rem; /* 13 : métadonnées, légendes */
  --t-md: .9375rem; /* 15 : interface */
  --t-base: 1rem;   /* 16 : texte courant, énoncés */
  --t-lg: 1.125rem; /* 18 : question, sous-titre */
  --t-xl: 1.375rem; /* 22 : titre de section */
  --t-2xl: 1.75rem; /* 28 : titre de page */
  --t-3xl: 2.5rem;  /* 40 : chiffre clé */

  /* Espacements (base 4) et rayons */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --tap: 44px;
  --content: 960px;
}

[data-app="qrc"] { --accent: var(--qrc); --accent-soft: var(--qrc-soft); }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141F; --surface: #171E2C; --sunk: #121825; --ink: #E8ECF4; --muted: #9BA4B8;
    --line: #2B3447; --rule: #222A3A;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
    --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --on-accent: #0F141F;
    --hl: #5A4E12; --hl-ink: #FFF3B8;
    --ok: #6BCB86; --ok-soft: #143222; --bad: #FF8A7D; --bad-soft: #3B1D1E; --warn: #E8B158; --warn-soft: #36290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141F; --surface: #171E2C; --sunk: #121825; --ink: #E8ECF4; --muted: #9BA4B8;
  --line: #2B3447; --rule: #222A3A;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
  --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --on-accent: #0F141F;
  --hl: #5A4E12; --hl-ink: #FFF3B8;
  --ok: #6BCB86; --ok-soft: #143222; --bad: #FF8A7D; --bad-soft: #3B1D1E; --warn: #E8B158; --warn-soft: #36290F;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: var(--t-base); line-height: 1.55; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--content); margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* Titres : serif pour la voix « copie », sans-serif pour l'outil */
.h-page { font-family: var(--f-display); font-size: var(--t-2xl); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.h-sec { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 600; line-height: 1.2; }
.h-card { font-size: var(--t-base); font-weight: 600; }
.eyebrow { font-size: var(--t-xs); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 64ch; }
.small { font-size: var(--t-sm); }
.muted { color: var(--muted); }

/* Surligné : un mot ou un chiffre par écran, pas plus */
mark.hl { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .12em; margin: 0 -.06em; }

/* ---------- Barre d'appli ---------- */
.appbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.appbar-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; text-decoration: none; color: inherit; }
.brand-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-t b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-t small { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-r { display: flex; align-items: center; gap: var(--s3); flex: none; }

/* Logo : tuile d'encre 32 px, pictogramme blanc trait 2 px */
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18); }
.logo svg { width: 22px; height: 22px; }
.logo.lg { width: 64px; height: 64px; border-radius: 16px; }
.logo.lg svg { width: 40px; height: 40px; }
.logo.qcm { background: var(--qcm); }
.logo.qrc { background: var(--qrc); }

/* Tampon compte à rebours : signature, en surligneur */
.stamp { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px 4px; background: var(--hl); color: var(--hl-ink); border-radius: 4px; transform: rotate(-1.5deg); font-size: var(--t-xs); white-space: nowrap; }
.stamp b { font-family: var(--f-num); font-size: .95rem; font-weight: 600; letter-spacing: -.02em; }

/* Bascule de profil */
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-pill); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); font-size: var(--t-sm); font-weight: 600; color: var(--muted); cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* Bascule clair / sombre */
.theme-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn svg { width: 18px; height: 18px; }

/* Retour à l'accueil du site (GitHub Pages uniquement) */
.home-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); }
.home-btn:hover { border-color: var(--accent); color: var(--accent); }
.home-btn svg { width: 18px; height: 18px; }

/* Onglets (≥ 720 px) */
.tabs { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; }
.tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px 11px; font-size: var(--t-md); font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a svg { width: 18px; height: 18px; opacity: .8; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs a[aria-current="page"] svg { color: var(--accent); opacity: 1; }
.tabs .count { font-family: var(--f-num); font-size: var(--t-xs); background: var(--accent-soft); color: var(--accent); padding: 0 6px; border-radius: var(--r-pill); }

/* Barre du bas (< 720 px) : à portée de pouce */
.bottomnav { display: none; }
@media (max-width: 719px) {
  .tabs { display: none; }
  .bottomnav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; inset: auto 0 0 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; min-height: 56px; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; position: relative; }
  .bottomnav a svg { width: 22px; height: 22px; }
  .bottomnav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .bottomnav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .appbar-in { min-height: 54px; }
  .brand-t small, .stamp span { display: none; }
  .appbar .seg { display: none; } /* le profil passe dans « Plus » sur mobile */
}

/* ---------- Mise en page ---------- */
.page { display: flex; flex-direction: column; gap: var(--s5); padding-block: var(--s5) var(--s7); }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(var(--min, 200px), 1fr)); }
.split { display: grid; gap: var(--s5); grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
@media (max-width: 879px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* Feuille : la carte de base */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.sheet.tight { padding: var(--s4); gap: var(--s3); }
.sheet.flat { box-shadow: none; background: var(--sunk); border-color: transparent; }
@media (max-width: 519px) { .sheet { padding: var(--s4); border-radius: var(--r-md); } }

/* Héros de page : marge rouge discrète de copie double */
.hero { display: flex; flex-direction: column; gap: var(--s2); padding-left: var(--s4); border-left: 3px solid var(--accent); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-md); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: var(--t-sm); border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--f-num); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--muted); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; line-height: 1.5; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.out { background: none; border: 1px solid var(--line); }
.badge.mono { font-family: var(--f-num); font-weight: 500; }

/* ---------- Chiffres clés ---------- */
.stats { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-num); font-size: 1.6rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat b small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.stat span { font-size: var(--t-sm); color: var(--muted); }
.stat .delta { font-family: var(--f-num); font-size: var(--t-xs); font-weight: 600; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }

/* ---------- Progression ---------- */
.meter { height: 6px; border-radius: var(--r-pill); background: var(--rule); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.track { position: relative; height: 12px; border-radius: var(--r-pill); background: var(--rule); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
.track .fill.ok { background: var(--ok); } .track .fill.bad { background: var(--bad); }
.track .jury { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.track .jury::after { content: attr(data-l); position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-family: var(--f-num); font-size: 10px; color: var(--muted); white-space: nowrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 3px; background: var(--rule); border: 1px solid var(--line); }
.pips i.on { background: var(--accent); border-color: var(--accent); }

/* ---------- Retours (correction) ---------- */
.callout { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--accent-soft); }
.callout .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.callout .ic svg { width: 16px; height: 16px; }
.callout.ok { background: var(--ok-soft); } .callout.ok .ic { background: var(--ok); }
.callout.bad { background: var(--bad-soft); } .callout.bad .ic { background: var(--bad); }
.callout.warn { background: var(--warn-soft); } .callout.warn .ic { background: var(--warn); }
.callout h4 { font-size: var(--t-base); font-weight: 600; margin-bottom: 2px; }
.callout.ok h4 { color: var(--ok); } .callout.bad h4 { color: var(--bad); } .callout.warn h4 { color: var(--warn); }

/* ---------- Tableaux ---------- */
.tw { overflow-x: auto; margin-inline: calc(var(--s5) * -1); padding-inline: var(--s5); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
table.t th { text-align: left; font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .r { text-align: right; }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--sunk); }
table.t tr.tot td { font-weight: 600; border-top: 1.5px solid var(--ink); }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: var(--t-sm); font-weight: 600; }
.input { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: var(--t-base); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.n { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.input.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.input.is-bad { border-color: var(--bad); background: var(--bad-soft); }

/* Puces de filtre */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-sm); font-weight: 500; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* Chrono */
.clock { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); }
.clock svg { width: 16px; height: 16px; color: var(--muted); }
.clock.low { color: var(--bad); border-color: var(--bad); }

@media (prefers-reduced-motion: no-preference) {
  .btn, .opt, .chips button, .tabs a { transition: background-color .15s, border-color .15s, color .15s; }
}

/* =====================================================================
   Composants propres à chaque appli, construits sur tokens.css.
   ===================================================================== */

/* ---------- QCM : options de réponse (cases de la feuille optique) ---------- */
.question { font-size: var(--t-lg); font-weight: 600; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: var(--s2); }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; width: 100%; min-height: 54px; padding: 9px 14px 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; cursor: pointer; }
.opt .box { width: 32px; height: 32px; border: 2px solid var(--ink); border-radius: 7px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 600; font-size: .9rem; }
.opt .box svg { width: 18px; height: 18px; stroke-width: 2.6; }
.opt .t { overflow-wrap: anywhere; }
.opt .lab { font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }

{id:"i26-01",t:"admin",q:"Quelle est la définition du principe d'universalité budgétaire ?",o:["Chaque recette est affectée à une dépense","L'autorisation budgétaire donnée à l'exécutif n'est valable que pour un an","Le budget décrit, pour la durée de l'exercice, l'ensemble des recettes qui financent l'ensemble des dépenses","Le budget doit être accompagné de l'ensemble des pièces comptables justificatives"],a:2,e:"Universalité = non-compensation et non-affectation : toutes les recettes financent toutes les dépenses. La 2e proposition décrit l'annualité.",s:"QCM inspecteur 2026, Q1"},
{id:"i26-02",t:"admin",q:"Selon l'article 24 de la Constitution, quel est l'un des rôles du Sénat ?",o:["Représenter la France auprès des collectivités territoriales étrangères","Représenter la position du Gouvernement","Représenter les collectivités territoriales de la République","Représenter les seules collectivités territoriales métropolitaines"],a:2,e:"Art. 24 : le Sénat assure la représentation des collectivités territoriales de la République (outre-mer compris).",s:"QCM inspecteur 2026, Q2"},
{id:"i26-03",t:"admin",q:"« Un agent public doit garder confidentielles les informations personnelles relatives aux usagers dont il a eu connaissance dans l'exercice de ses fonctions. » À quelle obligation cela renvoie-t-il ?",o:["L'impartialité","La neutralité","L'obéissance hiérarchique","Le secret professionnel"],a:3,e:"Le secret professionnel protège les usagers (sanction pénale) ; la discrétion professionnelle protège l'administration.",s:"QCM inspecteur 2026, Q3"},
{id:"i26-04",t:"admin",q:"Le Pacte de stabilité et de croissance (1997) plafonne le déficit public des États membres à quelle part du PIB ?",o:["1 %","3 %","5 %","10 %"],a:1,e:"Critères de Maastricht repris par le Pacte : déficit ≤ 3 % du PIB, dette ≤ 60 % du PIB.",s:"QCM inspecteur 2026, Q4"},
{id:"i26-05",t:"admin",q:"Qu'est-ce que la fongibilité asymétrique définie par la LOLF ?",o:["En cas d'insuffisance, des crédits inutilisés d'autres programmes peuvent être transférés sur les dépenses de personnel","La fongibilité asymétrique est interdite depuis la LOLF","Les crédits de personnel peuvent être utilisés pour d'autres natures de dépenses","Les crédits d'un programme peuvent être utilisés sur tout autre programme en cas d'insuffisance justifiée auprès du Parlement"],a:2,e:"Dans un programme, les crédits du titre 2 (personnel) peuvent financer d'autres dépenses, jamais l'inverse.",s:"QCM inspecteur 2026, Q5"},
{id:"i26-06",t:"admin",q:"Quels sont les quatre principes fondamentaux de la République française (article 1er) ?",o:["Démocratie, liberté, laïcité, fraternité","Indivisibilité, laïcité, démocratie, social","Indivisibilité, laïcité, liberté, tolérance","Liberté, égalité, fraternité, laïcité"],a:1,e:"Art. 1er : République indivisible, laïque, démocratique et sociale. « Liberté, Égalité, Fraternité » est la devise (art. 2).",s:"QCM inspecteur 2026, Q6"},
{id:"i26-07",t:"admin",q:"Le budget de l'État est structuré en trois niveaux. À quoi correspondent les missions ?",o:["À la destination des crédits","Au budget accordé à chaque ministère","Au cadre de mise en œuvre des dépenses d'investissement de l'État","Aux grandes politiques de l'État"],a:3,e:"La mission regroupe les programmes concourant à une politique publique ; elle peut être interministérielle. C'est l'unité de vote.",s:"QCM inspecteur 2026, Q7"},
{id:"i26-08",t:"admin",q:"Quelle est la durée du mandat d'un maire ?",o:["4 ans","5 ans","6 ans","7 ans"],a:2,e:"Le maire est élu par le conseil municipal, lui-même élu pour 6 ans.",s:"QCM inspecteur 2026, Q8"},
{id:"i26-09",t:"admin",q:"La libre administration des collectivités territoriales est :",o:["Un principe constitutionnel","Un principe jurisprudentiel","Un principe législatif","Un principe réglementaire"],a:0,e:"Article 72 de la Constitution : les collectivités s'administrent librement par des conseils élus.",s:"QCM inspecteur 2026, Q9"},
{id:"i26-10",t:"admin",q:"À l'été 2023, la dette publique de la France a dépassé 3 000 milliards d'euros. À quoi correspond cette dette ?",o:["À l'ensemble des emprunts contractés par les collectivités territoriales","À l'ensemble des emprunts contractés par l'État","À l'ensemble des emprunts contractés par l'État, la Sécurité sociale, les ODAC et les collectivités territoriales","Au solde annuel négatif du budget des administrations publiques"],a:2,e:"La dette « au sens de Maastricht » couvre toutes les administrations publiques. Le solde annuel négatif est le déficit (un flux).",s:"QCM inspecteur 2026, Q10"},
{id:"i26-11",t:"ue",q:"Sur quelles libertés repose le marché unique européen ?",o:["Liberté d'expression, de religion, de vivre à l'abri du besoin et de la peur","Liberté d'opinion, d'expression, de réunion, de culte, syndicale","Liberté, égalité, fraternité","Libre circulation des biens, des personnes, des services et des capitaux"],a:3,e:"Les quatre libertés du marché intérieur (Acte unique, marché intérieur au 1er janvier 1993).",s:"QCM inspecteur 2026, Q11"},
{id:"i26-12",t:"ue",q:"Quel est le rôle du Parlement européen dans l'adoption du cadre financier pluriannuel ?",o:["Il doit approuver le budget","Il fait la première proposition sur le montant","Il n'a qu'un rôle consultatif","Il n'a pas de rôle budgétaire"],a:0,e:"Le CFP est adopté par le Conseil à l'unanimité après approbation du Parlement européen (art. 312 TFUE).",s:"QCM inspecteur 2026, Q12"},
{id:"i26-13",t:"ue",q:"Quel État membre est le plus grand contributeur au budget de l'Union européenne ?",o:["L'Allemagne","L'Espagne","La France","L'Italie"],a:0,e:"L'Allemagne est première, la France deuxième.",s:"QCM inspecteur 2026, Q13"},
{id:"i26-14",t:"ue",q:"Lequel de ces critères est une condition d'adhésion à l'Union européenne ?",o:["Adhérer à la zone euro","Avoir une dette publique inférieure à 60 % du PIB","Être une République","Respecter des droits fondamentaux comme la démocratie ou la protection des minorités"],a:3,e:"Critères de Copenhague (1993) : institutions démocratiques, État de droit, droits de l'homme, protection des minorités, économie de marché, reprise de l'acquis. L'euro n'est pas une condition.",s:"QCM inspecteur 2026, Q14"},
{id:"i26-15",t:"ue",q:"En quelle année a été signé le traité de Lisbonne ?",o:["1957","1992","2001","2007"],a:3,e:"Signé le 13 décembre 2007, en vigueur le 1er décembre 2009.",s:"QCM inspecteur 2026, Q15"},
{id:"i26-16",t:"ue",q:"Quelle est la portée des règlements de l'Union européenne ?",o:["Ils nécessitent une transposition en droit national","Ils s'appliquent uniquement aux États qui les acceptent","Ils sont directement applicables dans tous les États membres","Ce sont de simples recommandations"],a:2,e:"Le règlement est obligatoire dans tous ses éléments et directement applicable. C'est la directive qui doit être transposée.",s:"QCM inspecteur 2026, Q16"},
{id:"i26-17",t:"ue",q:"Quelle mesure fiscale issue de l'OCDE est entrée en vigueur dans l'UE en 2024 pour lutter contre l'évasion fiscale ?",o:["Un impôt minimum de 15 % sur les multinationales","La suppression des paradis fiscaux en Europe","La taxe numérique européenne","Le renforcement de la TVA intracommunautaire"],a:0,e:"Directive « Pilier 2 » : imposition minimale effective de 15 % des grands groupes (CA ≥ 750 M€).",s:"QCM inspecteur 2026, Q17"},
{id:"i26-18",t:"ue",q:"Quel État membre présidait le Conseil de l'Union européenne depuis le 1er juillet 2025 ?",o:["Allemagne","Belgique","Danemark","Pologne"],a:2,e:"Pologne (1er semestre 2025), Danemark (2nd semestre 2025), Chypre (1er semestre 2026), Irlande (2nd semestre 2026).",s:"QCM inspecteur 2026, Q18",act:1},
{id:"i26-19",t:"ue",q:"Quelle institution veille à la bonne application du droit de l'Union par tous les États membres ?",o:["La Commission européenne","Le Conseil de l'Europe","La Cour de justice de l'Union européenne","La Cour européenne des droits de l'homme"],a:0,e:"La Commission est « gardienne des traités » : elle engage les recours en manquement. La CJUE juge, sur saisine.",s:"QCM inspecteur 2026, Q19"},
{id:"i26-20",t:"ue",q:"Qui a été élu(e) président(e) du Parlement européen en janvier 2022 et réélu(e) en juillet 2024 ?",o:["Nicole Fontaine","Roberta Metsola","David Sassoli","Martin Schulz"],a:1,e:"Roberta Metsola (Malte) a succédé à David Sassoli, décédé en janvier 2022.",s:"QCM inspecteur 2026, Q20"},
{id:"i26-21",t:"num",q:"Quel est le rôle principal d'un pare-feu informatique ?",o:["Bloquer les publicités intrusives","Filtrer et sécuriser les connexions réseau","Optimiser la vitesse de connexion","Supprimer automatiquement les virus"],a:1,e:"Le pare-feu filtre les flux entrants et sortants ; c'est l'antivirus qui supprime les logiciels malveillants.",s:"QCM inspecteur 2026, Q21"},
{id:"i26-22",t:"num",q:"Sur l'open data (données ouvertes), trouvez l'intrus.",o:["L'open data offre la possibilité d'accéder à des statistiques médicales","L'open data permet d'utiliser des données protégées par des droits d'auteur","L'open data permet de consulter des données librement accessibles","L'open data peut être d'origine publique ou privée"],a:1,e:"Les données protégées par le droit d'auteur ou personnelles ne relèvent pas de l'open data.",s:"QCM inspecteur 2026, Q22"},
{id:"i26-23",t:"num",q:"Qu'est-ce que l'illectronisme ?",o:["L'incapacité à utiliser le numérique faute de couverture réseau","L'incapacité à utiliser le numérique par manque de connaissance de son fonctionnement","La facilité à utiliser le numérique grâce à une très bonne connaissance","Les conséquences d'une surexposition aux écrans dès l'enfance"],a:1,e:"Illectronisme = illettrisme numérique, par manque de compétences (environ un Français sur six).",s:"QCM inspecteur 2026, Q23"},
{id:"i26-24",t:"num",q:"D'où provient la majorité de l'empreinte carbone du numérique en France ?",o:["Des équipements (smartphones, ordinateurs, objets connectés)","Des centres de données","Des cryptoactifs","Des réseaux fixes et mobiles"],a:0,e:"Les équipements pèsent le plus : 79 % dans l'étude ADEME-Arcep de 2020, environ 50 % dans sa mise à jour, devant les centres de données (46 %) et les réseaux.",s:"QCM inspecteur 2026, Q24"},
{id:"i26-25",t:"num",q:"Quel est le principal objectif de la loi « Informatique et Libertés » ?",o:["Encadrer l'utilisation des données personnelles","Faciliter les échanges de données personnelles entre sites","Interdire les sites de commerce en ligne","Obliger les citoyens à s'inscrire sur une plateforme nationale"],a:0,e:"Loi du 6 janvier 1978, qui a créé la CNIL.",s:"QCM inspecteur 2026, Q25"},
{id:"i26-26",t:"num",q:"Quelle est la différence entre HTTP et HTTPS ?",o:["Il n'y en a aucune","HTTP est plus rapide","HTTPS est plus rapide","HTTPS est sécurisé"],a:3,e:"HTTPS chiffre les échanges (TLS) ; le « S » signifie Secure.",s:"QCM inspecteur 2026, Q26"},
{id:"i26-27",t:"num",q:"Qu'est-ce qu'un flux RSS ?",o:["Une messagerie pour échanger des données sensibles","Une revue informatique spécialisée","Un moyen de communication entre serveurs","Un système de diffusion de contenus fréquemment mis à jour sur un site"],a:3,e:"Le flux RSS diffuse automatiquement les nouveaux contenus d'un site.",s:"QCM inspecteur 2026, Q27"},
{id:"i26-28",t:"num",q:"Qu'est-ce que le droit à la déconnexion ?",o:["Le droit de ne pas être connecté aux outils professionnels en dehors de ses horaires de travail","Le droit de se déconnecter de temps en temps sur son lieu de travail","Le droit de se déconnecter une heure par jour au travail","Le droit de travailler sans connexion Internet"],a:0,e:"Créé par la loi Travail de 2016 (applicable en 2017).",s:"QCM inspecteur 2026, Q28"},
{id:"i26-29",t:"num",q:"Qu'est-ce que la blockchain (« chaîne de blocs ») ?",o:["Un environnement dédié aux jeux en ligne","Une technologie de stockage et de transmission d'informations, décentralisée, qui valide et sécurise les échanges","Un réseau centralisé utilisé par les États pour sécuriser les transactions monétaires","Un système de protection contre les cyberattaques dans une entreprise"],a:1,e:"Registre distribué, sans tiers de confiance central.",s:"QCM inspecteur 2026, Q29"},
{id:"i26-30",t:"num",q:"Qu'est-ce que l'exploration de données (« data mining ») ?",o:["La modification de données pour les rendre accessibles sur Internet","La recherche de données libres de droits","L'exploitation et l'analyse de grands ensembles de données","L'ouverture d'un dossier dans l'explorateur de fichiers"],a:2,e:"Data mining : extraire des tendances de grands volumes de données.",s:"QCM inspecteur 2026, Q30"},
{id:"i26-31",t:"log",q:"Quel est le mot manquant ? Cailloux – Pierres – Roches – ???",o:["Diamant","Granite","Paillage","Rubis"],a:1,e:"DOUTEUSE. La grille publique donne Granite. Mais la logique du nombre de lettres (8, 7, 6, puis 5) désigne Rubis. Question exclue des examens et du score.",s:"QCM inspecteur 2026, Q31",d:1},
{id:"i26-32",t:"log",q:"Des plaques sont facturées selon chaque lettre du nom. MARC paye 36 €, PUSSI 42 €, MARCEL 58 €, SUPINS 52 €, MARCO 45 €. Combien paiera NOËL ?",o:["38 €","40 €","41 €","46 €"],a:2,e:"MARCO − MARC : O = 9. MARCEL − MARC : E + L = 22. SUPINS − PUSSI : N = 10. NOËL = 10 + 9 + 22 = 41 €.",s:"QCM inspecteur 2026, Q32"},
{id:"i26-34",t:"log",q:"Complétez la série : A1 – C4 – E9 – G16 – ?",o:["I21","I25","J20","J24"],a:1,e:"Une lettre sur deux (A, C, E, G, I) et les carrés 1, 4, 9, 16, 25.",s:"QCM inspecteur 2026, Q34"},
{id:"i26-35",t:"log",q:"Une boîte contient 5 boules rouges, 7 bleues et 3 vertes. Quelle est la probabilité de tirer une boule verte ?",o:["14 %","20 %","25 %","30 %"],a:1,e:"3 / 15 = 1/5 = 20 %.",s:"QCM inspecteur 2026, Q35"},
{id:"i26-38",t:"log",q:"Complétez : CANARD – BIBELOT – CHACAL – DEMANDER – ÉCUREUIL – SIFFLET – GAGNER – ?",o:["FILLES","HACHOIR","INCENDIE","PÂQUES"],a:1,e:"Chaque mot contient deux fois la lettre suivante de l'alphabet : A, B, C, D, E, F, G, puis H (HACHOIR).",s:"QCM inspecteur 2026, Q38"},
{id:"i26-39",t:"log",q:"Si aujourd'hui est lundi, quel jour sera-t-on dans 45 jours ?",o:["Mercredi","Jeudi","Vendredi","Samedi"],a:1,e:"45 = 6 × 7 + 3 : lundi + 3 jours = jeudi.",s:"QCM inspecteur 2026, Q39"},
{id:"i26-40",t:"log",q:"Marie est la sœur de Jean. Jean est le frère de Paul. Paul est le fils de Louise. Louise est la mère de Marc. Quel est le lien de Marie avec Marc ?",o:["Sa cousine","Sa mère","Sa sœur","Sa tante"],a:2,e:"Louise est la mère de Paul et de Marc ; Marie, sœur de Paul, est donc la sœur de Marc.",s:"QCM inspecteur 2026, Q40"},
{id:"i26-41",t:"ang",q:"What's the English for: « Tu as soif ? Il y a de la limonade dans le cellier et du jus d'orange à la cave. Sers-toi. »",o:["Are you thirsty? There is some limonade in the cellar and some orange juice in the cave. Help yourself.","Are you thirsty? There is some limonade in the storeroom and some orange juicce in the cellar. Help yourself.","Are you thirsty? There is some limonade in the storeroom and some orrange juice in the cave. Help yourself.","Are you thirsty? There is some limonade in the storeroom and some orange juice in the cellar. Help yourself."],a:3,e:"Cellier = storeroom ; cave = cellar (cave = grotte). Les options 2 et 3 contiennent des fautes (juicce, orrange). Les 4 options gardent « limonade » (en anglais : lemonade).",s:"QCM inspecteur 2026, Q41"},
{id:"i26-42",t:"ang",q:"Complete: « I am starving. What are we having … lunch? »",o:["at","for","in","on"],a:1,e:"« for lunch / for dinner » : le repas.",s:"QCM inspecteur 2026, Q42"},
{id:"i26-43",t:"ang",q:"Find the synonym of « obvious » in: « The solution to this question is obvious. »",o:["Clear","Hard","Impossible","Weird"],a:0,e:"Obvious = évident = clear.",s:"QCM inspecteur 2026, Q43"},
{id:"i26-44",t:"ang",q:"Which sentence is correct?",o:["Paul drove when he stopped smoking","Paul drove when he stopped to smoke","Paul was driving when he stopped to smoke","Paul was driving when he stopped to smoking"],a:2,e:"Grille officielle : 3. Action en cours interrompue : past continuous (was driving) ; « stop to + verbe » = s'arrêter pour. Les phrases 1 et 2 sont grammaticales mais ne décrivent pas une action en cours ; la 4 est fautive.",s:"QCM inspecteur 2026, Q44"},
{id:"i26-45",t:"ang",q:"« One of the direct consequences of Brexit was the restoration of customs. » What does « customs » mean?",o:["Douanes","Frontières","Impôts","Passeports"],a:0,e:"Customs = douane(s). Frontière = border.",s:"QCM inspecteur 2026, Q45"},

{id:"e-01",t:"admin",q:"Quel article de la Constitution fixe le domaine de la loi ?",o:["Article 20","Article 37","Article 49","Article 34"],a:3,e:"Art. 34 : domaine de la loi ; art. 37 : tout le reste relève du règlement.",s:"Entraînement, Q1"},

{id:"e-04",t:"admin",q:"Dans la LOLF, quelle est l'unité de spécialité des crédits ?",o:["Le programme","La mission","L'action","Le titre"],a:0,e:"Les crédits sont votés par mission et spécialisés par programme.",s:"Entraînement, Q4"},
{id:"e-05",t:"admin",q:"Quel principe budgétaire interdit d'affecter une recette à une dépense déterminée ?",o:["L'annualité","L'unité","L'universalité","La spécialité"],a:2,e:"Universalité : non-affectation et non-compensation.",s:"Entraînement, Q5"},
{id:"e-06",t:"admin",q:"De combien de jours le Parlement dispose-t-il pour se prononcer sur un projet de loi de finances ?",o:["40 jours","50 jours","70 jours","90 jours"],a:2,e:"Art. 47 : 70 jours, sinon mise en œuvre par ordonnance. 50 jours pour la loi de financement de la Sécurité sociale.",s:"Entraînement, Q6"},
{id:"e-07",t:"admin",q:"Qui exerce le contrôle de légalité sur les actes des collectivités territoriales ?",o:["La chambre régionale des comptes","Le Conseil d'État","Le directeur départemental des finances publiques","Le préfet"],a:3,e:"Le préfet peut déférer l'acte au tribunal administratif dans les 2 mois.",s:"Entraînement, Q7"},
{id:"e-08",t:"admin",q:"Qu'a fait la loi NOTRe du 7 août 2015 ?",o:["Elle a supprimé la clause générale de compétence des départements et des régions","Elle a créé les métropoles","Elle a supprimé les départements","Elle a instauré l'élection des conseillers régionaux au suffrage direct"],a:0,e:"Les métropoles ont été créées par la loi RCT (2010) puis généralisées par la loi MAPTAM (2014).",s:"Entraînement, Q8"},
{id:"e-09",t:"admin",q:"Un fonctionnaire reçoit un ordre manifestement illégal et de nature à compromettre gravement un intérêt public. Que doit-il faire ?",o:["L'exécuter, par obéissance hiérarchique","Refuser de l'exécuter","Demander l'avis du préfet","Saisir le Conseil constitutionnel"],a:1,e:"Seule exception légale au devoir d'obéissance hiérarchique.",s:"Entraînement, Q9"},
{id:"e-10",t:"admin",q:"Fin juin 2026, la dette publique de la France représentait environ :",o:["60 % du PIB","98 % du PIB","119 % du PIB","140 % du PIB"],a:2,e:"3 595,5 Md€, soit 119,0 % du PIB (Insee, 29 septembre 2026).",s:"Entraînement, Q10",act:1},
{id:"e-11",t:"ue",q:"En quelle année le traité de Maastricht a-t-il été signé ?",o:["1957","1986","1992","2007"],a:2,e:"Signé le 7 février 1992, en vigueur le 1er novembre 1993.",s:"Entraînement, Q11"},
{id:"e-12",t:"ue",q:"Combien d'États membres compte la zone euro au 1er janvier 2026 ?",o:["19","20","21","27"],a:2,e:"21 avec l'entrée de la Bulgarie (la Croatie était entrée en 2023).",s:"Entraînement, Q12",act:1},
{id:"e-13",t:"ue",q:"Quelle institution dispose en principe de l'initiative législative dans l'UE ?",o:["La Commission européenne","Le Parlement européen","Le Conseil européen","Le Conseil de l'Union européenne"],a:0,e:"Monopole de l'initiative : la Commission propose, le Parlement et le Conseil adoptent.",s:"Entraînement, Q13"},
{id:"e-14",t:"ue",q:"Qu'est-ce qu'une directive européenne ?",o:["Un acte directement applicable sans transposition","Un acte sans force obligatoire","Un acte qui ne s'applique qu'aux États qui l'ont voté","Un acte qui lie les États quant au résultat à atteindre et qui doit être transposé"],a:3,e:"Art. 288 TFUE : la directive lie quant au résultat, en laissant le choix des moyens.",s:"Entraînement, Q14"},
{id:"e-15",t:"ue",q:"Où siège la Cour de justice de l'Union européenne ?",o:["Bruxelles","Strasbourg","Luxembourg","La Haye"],a:2,e:"Luxembourg. La Cour européenne des droits de l'homme siège à Strasbourg.",s:"Entraînement, Q15"},
{id:"e-16",t:"ue",q:"Comment se définit la majorité qualifiée au Conseil de l'UE ?",o:["55 % des États représentant au moins 65 % de la population","50 % des États membres","Les deux tiers des États membres","L'unanimité moins une voix"],a:0,e:"Double majorité, en vigueur depuis le 1er novembre 2014 (traité de Lisbonne).",s:"Entraînement, Q16"},
{id:"e-17",t:"ue",q:"Quelle est la principale ressource du budget de l'UE ?",o:["Les droits de douane","La ressource fondée sur la TVA","La ressource fondée sur le revenu national brut","La contribution sur les plastiques non recyclés"],a:2,e:"La ressource RNB représente de loin la plus grande part.",s:"Entraînement, Q17"},
{id:"e-18",t:"ue",q:"Lequel de ces organes n'est pas une institution de l'Union européenne ?",o:["La Cour européenne des droits de l'homme","La Cour des comptes européenne","La Banque centrale européenne","Le Conseil européen"],a:0,e:"La CEDH relève du Conseil de l'Europe (46 États).",s:"Entraînement, Q18"},
{id:"e-19",t:"ue",q:"Depuis quand la Charte des droits fondamentaux de l'UE a-t-elle une valeur juridique contraignante ?",o:["2000","2004","2009","2013"],a:2,e:"Proclamée à Nice en 2000, elle a la même valeur que les traités depuis l'entrée en vigueur de Lisbonne, le 1er décembre 2009.",s:"Entraînement, Q19"},

// --- Raisonnement logique ---
{id:"lo-01",t:"log",q:"Quel nombre suit : 1 – 1 – 2 – 3 – 5 – 8 – ?",o:["11","12","13","16"],a:2,e:"Chaque terme est la somme des deux précédents : 5 + 8 = 13.",s:"Banque logique"},
{id:"lo-02",t:"log",q:"Quel nombre suit : 2 – 6 – 18 – 54 – ?",o:["108","148","162","216"],a:2,e:"× 3 à chaque fois.",s:"Banque logique"},
{id:"lo-03",t:"log",q:"Quel nombre suit : 81 – 27 – 9 – 3 – ?",o:["0","1","2","1/3"],a:1,e:"÷ 3 à chaque fois.",s:"Banque logique"},
{id:"lo-04",t:"log",q:"Quel nombre suit : 1 – 8 – 27 – 64 – ?",o:["81","100","125","128"],a:2,e:"Les cubes : 1³, 2³, 3³, 4³, 5³ = 125.",s:"Banque logique"},
{id:"lo-05",t:"log",q:"Quel nombre suit : 5 – 10 – 8 – 16 – 14 – ?",o:["12","20","28","30"],a:2,e:"Alternance × 2 et − 2 : 14 × 2 = 28.",s:"Banque logique"},
{id:"lo-06",t:"log",q:"Quelle lettre suit : A – D – G – J – ?",o:["K","L","M","N"],a:2,e:"+ 3 rangs : A(1), D(4), G(7), J(10), M(13).",s:"Banque logique"},
{id:"lo-07",t:"log",q:"Quelle lettre suit : Z – X – V – T – ?",o:["S","R","Q","P"],a:1,e:"On recule de deux lettres.",s:"Banque logique"},
{id:"lo-08",t:"log",q:"Complétez : AZ – BY – CX – ?",o:["DV","DW","EW","CW"],a:1,e:"La 1re lettre avance, la 2e recule depuis Z.",s:"Banque logique"},
{id:"lo-09",t:"log",q:"Complétez : B – C – E – H – L – ?",o:["O","P","Q","R"],a:2,e:"Écarts 1, 2, 3, 4, puis 5 : L(12) + 5 = Q(17).",s:"Banque logique"},
{id:"lo-10",t:"log",q:"3 ouvriers construisent un mur en 12 jours. Combien de jours faut-il à 4 ouvriers au même rythme ?",o:["8","9","10","16"],a:1,e:"3 × 12 = 36 jours-ouvriers ; 36 / 4 = 9.",s:"Banque logique"},
{id:"lo-11",t:"log",q:"Tous les A sont des B. Certains B sont des C. Que peut-on conclure ?",o:["Tous les A sont des C","Certains A sont des C","Aucun A n'est un C","Rien de certain sur le lien entre A et C"],a:3,e:"Les B qui sont des C ne sont pas forcément des A.",s:"Banque logique"},
{id:"lo-12",t:"log",q:"Tous les inspecteurs sont fonctionnaires. Paul n'est pas fonctionnaire. Donc :",o:["Paul est inspecteur","Paul n'est pas inspecteur","Paul est contrôleur","On ne peut rien dire"],a:1,e:"Contraposée : non-fonctionnaire ⇒ non-inspecteur.",s:"Banque logique"},
{id:"lo-13",t:"log",q:"Le 1er janvier d'une année non bissextile est un jeudi. Quel jour sera le 1er janvier de l'année suivante ?",o:["Jeudi","Vendredi","Samedi","Mercredi"],a:1,e:"365 = 52 × 7 + 1 : on avance d'un jour.",s:"Banque logique"},
{id:"lo-14",t:"log",q:"Le vendredi 16 octobre 2026, quel jour de la semaine tombera le 7 décembre 2026 ?",o:["Dimanche","Lundi","Mardi","Mercredi"],a:1,e:"15 jours jusqu'au 31 octobre + 30 + 7 = 52 jours = 7 × 7 + 3 : vendredi + 3 = lundi.",s:"Banque logique"},
{id:"lo-15",t:"log",q:"On lance deux pièces. Quelle est la probabilité d'obtenir au moins une fois « face » ?",o:["1/4","1/2","2/3","3/4"],a:3,e:"1 − probabilité de deux « pile » = 1 − 1/4 = 3/4.",s:"Banque logique"},
{id:"lo-16",t:"log",q:"Quel angle forment les aiguilles d'une horloge à 3 h 30 ?",o:["60°","75°","90°","105°"],a:1,e:"Petite aiguille à 105° (3,5 × 30°), grande à 180° : 75°.",s:"Banque logique"},
{id:"lo-17",t:"log",q:"Trouvez l'intrus : 3 – 5 – 9 – 11 – 13",o:["3","5","9","13"],a:2,e:"9 = 3 × 3 n'est pas premier.",s:"Banque logique"},
{id:"lo-18",t:"log",q:"Quel mot est l'anagramme de CHIEN ?",o:["NICHE","CHAINE","CHIENNE","NICHER"],a:0,e:"Mêmes lettres : C, H, I, E, N.",s:"Banque logique"},
{id:"lo-19",t:"log",q:"Un père a 40 ans et son fils 10 ans. Dans combien d'années le père aura-t-il le double de l'âge de son fils ?",o:["10","15","20","30"],a:2,e:"40 + x = 2 (10 + x) donne x = 20.",s:"Banque logique"},
{id:"lo-20",t:"log",q:"2 crayons et 1 gomme coûtent 3 € ; 1 crayon et 1 gomme coûtent 2 €. Combien coûte une gomme ?",o:["0,50 €","1 €","1,50 €","2 €"],a:1,e:"La différence donne 1 crayon = 1 €, donc gomme = 1 €.",s:"Banque logique"},
{id:"lo-21",t:"log",q:"Pierre a deux fois l'âge de Jean. Dans 5 ans, la somme de leurs âges sera 40. Quel âge a Pierre ?",o:["15","20","25","30"],a:1,e:"3J + 10 = 40, donc J = 10 et P = 20.",s:"Banque logique"},
{id:"lo-22",t:"log",q:"Chaque fille d'une famille a autant de frères que de sœurs ; chaque garçon a deux fois plus de sœurs que de frères. Combien y a-t-il d'enfants ?",o:["5","6","7","8"],a:2,e:"f − 1 = g et f = 2 (g − 1) : g = 3, f = 4, soit 7 enfants.",s:"Banque logique"},
{id:"lo-23",t:"log",q:"Si ROUGE s'écrit SPVHF, comment s'écrit VERT ?",o:["WFSU","UDQS","WGSU","XFSU"],a:0,e:"Chaque lettre avance d'un rang.",s:"Banque logique"},
{id:"lo-24",t:"log",q:"Si MER s'écrit REM, comment s'écrit SOLEIL ?",o:["LIELOS","LIOLES","SOLIEL","LEILOS"],a:0,e:"Le mot est écrit à l'envers.",s:"Banque logique"},
{id:"lo-25",t:"log",q:"Un train part toutes les 40 minutes à partir de 6 h 10. À quelle heure part le 5e train ?",o:["8 h 10","8 h 30","8 h 50","9 h 10"],a:2,e:"6 h 10 + 4 × 40 min = 6 h 10 + 2 h 40 = 8 h 50.",s:"Banque logique"},
{id:"lo-26",t:"log",q:"Un robinet remplit une baignoire en 6 minutes, un autre en 3 minutes. Ensemble, en combien de temps ?",o:["2 minutes","3 minutes","4 minutes","4 min 30"],a:0,e:"1/6 + 1/3 = 1/2 de baignoire par minute : 2 minutes.",s:"Banque logique"},
{id:"lo-27",t:"log",q:"Combien de carrés au total compte un quadrillage de 2 cases sur 2 ?",o:["4","5","6","8"],a:1,e:"4 petits carrés et 1 grand.",s:"Banque logique"},
{id:"lo-28",t:"log",q:"Si hier était dimanche, quel jour serons-nous après-demain ?",o:["Mardi","Mercredi","Jeudi","Lundi"],a:1,e:"Aujourd'hui lundi, après-demain mercredi.",s:"Banque logique"},
{id:"lo-29",t:"log",q:"Le fils du frère de mon père est mon :",o:["Neveu","Cousin","Oncle","Frère"],a:1,e:"Le frère de mon père est mon oncle ; son fils est mon cousin.",s:"Banque logique"},
{id:"lo-30",t:"log",q:"Trouvez l'intrus : Paris – Lyon – Bruxelles – Marseille",o:["Paris","Lyon","Bruxelles","Marseille"],a:2,e:"Bruxelles n'est pas en France.",s:"Banque logique"},
{id:"lo-31",t:"log",q:"Un article coûte 80 €. Il est soldé à −25 %. Quel est son nouveau prix ?",o:["55 €","60 €","64 €","70 €"],a:1,e:"80 × 0,75 = 60 €.",s:"Banque logique"},
{id:"lo-32",t:"log",q:"Quel nombre suit : 1 – 4 – 9 – 16 – 25 – ?",o:["30","34","36","49"],a:2,e:"Les carrés : 6² = 36.",s:"Banque logique"},
{id:"lo-33",t:"log",q:"Quel nombre suit : 3 – 5 – 9 – 17 – 33 – ?",o:["49","57","65","66"],a:2,e:"Chaque terme = double du précédent − 1 : 33 × 2 − 1 = 65.",s:"Banque logique"},
{id:"lo-34",t:"log",q:"Si tous les chats sont gris et que Félix est un chat, alors :",o:["Félix est gris","Tous les animaux gris sont des chats","Félix n'est peut-être pas gris","Seuls les chats sont gris"],a:0,e:"Déduction directe (syllogisme).",s:"Banque logique"},
// --- Anglais B1 ---
{id:"an-01",t:"ang",q:"Complete: « I'm looking forward to … you. »",o:["see","seeing","seen","saw"],a:1,e:"« look forward to » + -ing (to est ici une préposition).",s:"Banque anglais"},
{id:"an-02",t:"ang",q:"Complete: « He has lived in Paris … ten years. »",o:["since","for","during","from"],a:1,e:"for + durée ; since + point de départ.",s:"Fiche 7"},
{id:"an-03",t:"ang",q:"Complete: « She … to London last year. »",o:["has gone","goes","went","going"],a:2,e:"Date passée révolue (last year) : prétérit.",s:"Fiche 7"},
{id:"an-04",t:"ang",q:"Complete: « If it rains tomorrow, we … at home. »",o:["stay will","will stay","would stay","stayed"],a:1,e:"If + présent, will + verbe.",s:"Banque anglais"},
{id:"an-05",t:"ang",q:"Complete: « There isn't … milk left. »",o:["many","much","few","a few"],a:1,e:"Much + indénombrable ; many + dénombrable.",s:"Banque anglais"},
{id:"an-06",t:"ang",q:"Complete: « How … people attended the meeting? »",o:["much","many","long","often"],a:1,e:"People est dénombrable.",s:"Banque anglais"},
{id:"an-07",t:"ang",q:"Complete: « This year's deficit is … than last year's. »",o:["more high","higher","highest","the higher"],a:1,e:"Adjectif court : -er + than.",s:"Banque anglais"},
{id:"an-08",t:"ang",q:"What does « actually » mean?",o:["Actuellement","En fait","Activement","Récemment"],a:1,e:"Faux ami : « actuellement » se dit currently.",s:"Fiche 7"},
{id:"an-09",t:"ang",q:"What does « library » mean?",o:["Librairie","Bibliothèque","Liberté","Livret"],a:1,e:"Faux ami : librairie = bookshop.",s:"Fiche 7"},
{id:"an-10",t:"ang",q:"« She attended the meeting. » What does « attended » mean here?",o:["Attendit","Assista à","Annula","Organisa"],a:1,e:"To attend = assister à ; attendre = to wait.",s:"Fiche 7"},
{id:"an-11",t:"ang",q:"What is the French for « income tax »?",o:["Taxe d'habitation","Impôt sur le revenu","TVA","Droits de douane"],a:1,e:"Income = revenu.",s:"Fiche 7"},
{id:"an-12",t:"ang",q:"What is the English for « TVA »?",o:["VAT","IRS","GDP","CIT"],a:0,e:"Value Added Tax. GDP = PIB.",s:"Fiche 7"},
{id:"an-13",t:"ang",q:"What is the French for « balance sheet »?",o:["Compte de résultat","Bilan","Balance commerciale","Budget"],a:1,e:"Income statement = compte de résultat.",s:"Fiche 7"},
{id:"an-14",t:"ang",q:"What is the French for « shareholder »?",o:["Associé gérant","Actionnaire","Créancier","Fournisseur"],a:1,e:"Share = action.",s:"Fiche 7"},
{id:"an-15",t:"ang",q:"In accounting, what do « liabilities » mean?",o:["Les actifs","Les dettes (le passif)","Les capitaux propres","Les produits"],a:1,e:"Assets / liabilities / equity = actif / dettes / capitaux propres.",s:"Fiche 7"},
{id:"an-16",t:"ang",q:"What is the French for « tax audit »?",o:["Contrôle fiscal","Avis d'imposition","Niche fiscale","Taux marginal"],a:0,e:"Audit = contrôle, vérification.",s:"Fiche 7"},
{id:"an-17",t:"ang",q:"For a company, « revenue » usually means:",o:["Le bénéfice","Le chiffre d'affaires","Le revenu imposable","La dépense"],a:1,e:"Pour l'État, revenue = recettes.",s:"Fiche 7"},
{id:"an-18",t:"ang",q:"Complete: « The report … by the inspector yesterday. »",o:["wrote","was written","has written","is writing"],a:1,e:"Passif au prétérit : was + participe passé.",s:"Banque anglais"},
{id:"an-19",t:"ang",q:"« He stopped smoking. » means:",o:["Il s'est arrêté pour fumer","Il a arrêté de fumer","Il fumait en s'arrêtant","Il va arrêter de fumer"],a:1,e:"Stop + -ing = cesser ; stop to + verbe = s'arrêter pour.",s:"Fiche 7"},
{id:"an-20",t:"ang",q:"What is the past tense of « to buy »?",o:["buyed","bought","brought","boughted"],a:1,e:"Buy – bought – bought ; bring – brought – brought.",s:"Banque anglais"},
{id:"an-21",t:"ang",q:"Find the synonym of « compulsory ».",o:["Optional","Mandatory","Useless","Expensive"],a:1,e:"Compulsory = mandatory = obligatoire.",s:"Banque anglais"},
{id:"an-22",t:"ang",q:"Complete: « You are a civil servant, … ? »",o:["isn't it","aren't you","don't you","are you"],a:1,e:"Question tag : auxiliaire de la phrase, à la forme négative.",s:"Banque anglais"},
{id:"an-23",t:"ang",q:"What is the French for « deadline »?",o:["Date limite","Ligne morte","Délai de paiement","Fin de contrat"],a:0,e:"Meet the deadline = respecter l'échéance.",s:"Banque anglais"},
{id:"an-24",t:"ang",q:"Complete: « The meeting is … Monday … 9 o'clock. »",o:["in / at","on / at","at / on","on / in"],a:1,e:"on + jour ; at + heure ; in + mois ou année.",s:"Fiche 7"},
{id:"an-25",t:"ang",q:"Complete: « He was born … 1990. »",o:["on","at","in","since"],a:2,e:"in + année.",s:"Fiche 7"},
{id:"an-26",t:"ang",q:"What does « sensible » mean?",o:["Sensible","Raisonnable","Sensuel","Sensationnel"],a:1,e:"Faux ami : « sensible » se dit sensitive.",s:"Banque anglais"},
{id:"an-27",t:"ang",q:"What does « to resume » mean?",o:["Résumer","Reprendre","Démissionner","Rassembler"],a:1,e:"Faux ami : résumer = to summarize.",s:"Banque anglais"},
{id:"an-28",t:"ang",q:"What is the French for « public debt »?",o:["Déficit public","Dette publique","Dépense publique","Débit public"],a:1,e:"Budget deficit = déficit budgétaire.",s:"Fiche 7"},
{id:"an-29",t:"ang",q:"Complete: « I have … finished my report. »",o:["yet","already","since","ago"],a:1,e:"Already : déjà, à l'affirmative ; yet s'emploie à la négative ou à l'interrogative.",s:"Banque anglais"},
{id:"an-30",t:"ang",q:"Complete: « We moved here three years … . »",o:["ago","since","for","before of"],a:0,e:"Prétérit + durée + ago = il y a.",s:"Banque anglais"},
{id:"an-31",t:"ang",q:"Find the synonym of « to improve ».",o:["To enhance","To reduce","To delay","To ignore"],a:0,e:"Improve = enhance = améliorer.",s:"Fiche 7"},
{id:"an-32",t:"ang",q:"What does « depreciation » mean in accounting?",o:["Dépréciation de stock","Amortissement","Provision pour risque","Dévaluation monétaire"],a:1,e:"Depreciation = amortissement des immobilisations corporelles.",s:"Fiche 7"}
);

// --- Français ---
{id:"fr-01",t:"fr",q:"Quelle phrase est correctement accordée ?",o:["Les décisions qu'ils ont pris sont justes.","Les décisions qu'ils ont prises sont justes.","Les décisions qu'ils ont prise sont justes.","Les décisions qu'ils ont prit sont justes."],a:1,e:"Avec avoir, accord avec le COD placé avant (« décisions », féminin pluriel).",s:"Fiche contrôleur"},
{id:"fr-02",t:"fr",q:"Quelle écriture est correcte ?",o:["quatre-vingt euros","quatre-vingts euros","quatres-vingts euros","quatre-vingts-deux euros"],a:1,e:"Vingt prend un s multiplié et non suivi d'un autre nombre : quatre-vingts, mais quatre-vingt-deux.",s:"Fiche contrôleur"},
{id:"fr-03",t:"fr",q:"Quelle écriture est correcte ?",o:["deux cents trois","deux cent trois","deux-cents-trois","deux cent troix"],a:1,e:"Cent prend un s seulement s'il n'est suivi d'aucun nombre : deux cents, deux cent trois.",s:"Fiche contrôleur"},
{id:"fr-04",t:"fr",q:"Complétez : « Il range … affaires dans son sac. »",o:["ces","ses","c'est","s'est"],a:1,e:"Ses = les siennes (possessif) ; ces = démonstratif.",s:"Fiche contrôleur"},
{id:"fr-05",t:"fr",q:"Complétez : « … heure est-il ? »",o:["Qu'elle","Quelle","Quel","Qu'elles"],a:1,e:"Quelle, adjectif interrogatif accordé avec « heure ».",s:"Fiche contrôleur"},
{id:"fr-06",t:"fr",q:"Complétez : « Il est … arriver à 9 heures. »",o:["sensé","censé","censés","sensée"],a:1,e:"Censé = supposé ; sensé = raisonnable.",s:"Fiche contrôleur"},
{id:"fr-07",t:"fr",q:"Que signifie « pérenne » ?",o:["Éphémère","Durable","Coûteux","Discutable"],a:1,e:"Pérenne : qui dure longtemps.",s:"Fiche contrôleur"},
{id:"fr-08",t:"fr",q:"Quel est le synonyme d'« éphémère » ?",o:["Passager","Éternel","Robuste","Fréquent"],a:0,e:"Éphémère : de courte durée.",s:"Fiche contrôleur"},
{id:"fr-09",t:"fr",q:"Que signifie « prolixe » ?",o:["Qui produit beaucoup d'œuvres","Trop long, bavard","Très précis","Peu fiable"],a:1,e:"Ne pas confondre avec prolifique (qui produit beaucoup).",s:"Fiche contrôleur"},
{id:"fr-10",t:"fr",q:"Que signifie « probité » ?",o:["Honnêteté scrupuleuse","Probabilité","Rapidité","Prudence excessive"],a:0,e:"Obligation déontologique des agents publics.",s:"Fiche contrôleur"},
{id:"fr-11",t:"fr",q:"Complétez : « Il faut que tu … demain. » (venir)",o:["viens","viennes","viendras","venais"],a:1,e:"Subjonctif présent après « il faut que ».",s:"Banque français"},
{id:"fr-12",t:"fr",q:"Complétez : « Si j'… su, je serais venu. »",o:["aurais","avais","aurai","ai"],a:1,e:"Si + plus-que-parfait, puis conditionnel passé. Jamais de conditionnel après « si ».",s:"Banque français"},
{id:"fr-13",t:"fr",q:"Quel pluriel est fautif ?",o:["des festivals","des bijoux","des chevaux","des journals"],a:3,e:"Un journal, des journaux.",s:"Banque français"},
{id:"fr-14",t:"fr",q:"Quel mot est mal orthographié ?",o:["parmi","malgré","parmis","hormis"],a:2,e:"« Parmi » ne prend jamais de s.",s:"Banque français"},
{id:"fr-15",t:"fr",q:"Quelle phrase est correcte ?",o:["Elles se sont lavées les mains.","Elles se sont lavé les mains.","Elles se sont lavés les mains.","Elles se sont lavée les mains."],a:1,e:"Le COD « les mains » est placé après : pas d'accord.",s:"Banque français"},
{id:"fr-16",t:"fr",q:"Dans « Le contrôleur vérifie la déclaration », quel est le COD ?",o:["Le contrôleur","vérifie","la déclaration","Il n'y en a pas"],a:2,e:"Il vérifie quoi ? la déclaration.",s:"Fiche contrôleur"},
{id:"fr-17",t:"fr",q:"« Cette obscure clarté » est :",o:["Une métaphore","Un oxymore","Une litote","Une hyperbole"],a:1,e:"Oxymore : alliance de deux termes contraires.",s:"Banque français"},
{id:"fr-18",t:"fr",q:"Complétez : « Il … parti hier. »",o:["et","est","ait","es"],a:1,e:"Auxiliaire être, 3e personne.",s:"Fiche contrôleur"},
{id:"fr-19",t:"fr",q:"Complétez : « Ils … leur dossier ce matin. » (passé simple de prendre)",o:["prenèrent","prirent","prîmes","prendirent"],a:1,e:"Je pris, ils prirent.",s:"Banque français"},
{id:"fr-20",t:"fr",q:"Quelle orthographe est correcte ?",o:["Je lui ai donné leurs adresses.","Je leurs ai donné leur adresse.","Je leur ai donnés leurs adresses.","Je leurs ai donnés leurs adresses."],a:0,e:"« Leur » pronom (à eux) est invariable ; « leurs » déterminant s'accorde.",s:"Fiche contrôleur"},
// --- Mathématiques ---
{id:"ma-01",t:"math",q:"Combien vaut 15 % de 240 ?",o:["24","30","36","40"],a:2,e:"240 × 0,15 = 36.",s:"Banque maths"},
{id:"ma-02",t:"math",q:"Un capital de 2 000 € est placé à 3 % d'intérêts simples pendant 2 ans. Combien rapporte-t-il ?",o:["60 €","120 €","121,80 €","600 €"],a:1,e:"2 000 × 0,03 × 2 = 120 €.",s:"Fiche contrôleur"},
{id:"ma-03",t:"math",q:"Quel est le PGCD de 36 et 48 ?",o:["6","8","12","24"],a:2,e:"36 = 2² × 3² ; 48 = 2⁴ × 3 ; PGCD = 2² × 3 = 12.",s:"Fiche contrôleur"},
{id:"ma-04",t:"math",q:"Quel est le PPCM de 4 et 6 ?",o:["2","12","18","24"],a:1,e:"4 = 2², 6 = 2 × 3 : PPCM = 2² × 3 = 12.",s:"Fiche contrôleur"},
{id:"ma-05",t:"math",q:"Résolvez : 3x + 5 = 20",o:["x = 3","x = 5","x = 6","x = 25/3"],a:1,e:"3x = 15, x = 5.",s:"Fiche contrôleur"},
{id:"ma-06",t:"math",q:"Résolvez le système : x + y = 10 et x − y = 4",o:["x = 6, y = 4","x = 7, y = 3","x = 8, y = 2","x = 5, y = 5"],a:1,e:"En additionnant : 2x = 14, x = 7, y = 3.",s:"Fiche contrôleur"},
{id:"ma-07",t:"math",q:"Un article coûte 120 € TTC avec une TVA de 20 %. Quel est son prix HT ?",o:["96 €","100 €","104 €","144 €"],a:1,e:"120 / 1,2 = 100 € (et non 120 × 0,8).",s:"Banque maths"},
{id:"ma-08",t:"math",q:"Un prix augmente de 10 %, puis encore de 10 %. Quelle est la hausse totale ?",o:["20 %","21 %","22 %","11 %"],a:1,e:"1,1 × 1,1 = 1,21.",s:"Fiche contrôleur"},
{id:"ma-09",t:"math",q:"Quelle distance parcourt-on en 45 minutes à 80 km/h ?",o:["45 km","55 km","60 km","65 km"],a:2,e:"45 min = 0,75 h ; 80 × 0,75 = 60 km.",s:"Fiche contrôleur"},
{id:"ma-10",t:"math",q:"Lequel de ces nombres est divisible par 9 ?",o:["1 234","2 345","3 451","4 572"],a:3,e:"Somme des chiffres 4 + 5 + 7 + 2 = 18, multiple de 9.",s:"Fiche contrôleur"},
{id:"ma-11",t:"math",q:"Un candidat obtient 12 (coefficient 2) et 15 (coefficient 1). Quelle est sa moyenne ?",o:["13","13,5","14","12,5"],a:0,e:"(24 + 15) / 3 = 13.",s:"Banque maths"},
{id:"ma-12",t:"math",q:"3 kg de pommes coûtent 7,50 €. Combien coûtent 5 kg ?",o:["10,50 €","12,00 €","12,50 €","15,00 €"],a:2,e:"2,50 € le kg × 5 = 12,50 €.",s:"Banque maths"},
{id:"ma-13",t:"math",q:"Sur une carte à l'échelle 1/50 000, 4 cm représentent :",o:["200 m","2 km","20 km","4 km"],a:1,e:"4 × 50 000 = 200 000 cm = 2 km.",s:"Fiche contrôleur"},
{id:"ma-14",t:"math",q:"Combien de litres contient 1 m³ ?",o:["10","100","1 000","10 000"],a:2,e:"1 dm³ = 1 L ; 1 m³ = 1 000 dm³.",s:"Banque maths"},
{id:"ma-15",t:"math",q:"Quelle est la médiane de la série 3 – 7 – 8 – 12 ?",o:["7","7,5","8","7,25"],a:1,e:"Nombre pair de valeurs : moyenne des deux centrales (7 + 8) / 2.",s:"Fiche contrôleur"},
{id:"ma-16",t:"math",q:"Un triangle rectangle a des côtés de l'angle droit de 6 cm et 8 cm. Quelle est son hypoténuse ?",o:["10 cm","12 cm","14 cm","100 cm"],a:0,e:"Pythagore : 36 + 64 = 100, racine 10.",s:"Banque maths"},
{id:"ma-17",t:"math",q:"Quel est le volume d'un cube de 3 cm d'arête ?",o:["9 cm³","18 cm³","27 cm³","81 cm³"],a:2,e:"3 × 3 × 3 = 27 cm³.",s:"Banque maths"},
{id:"ma-18",t:"math",q:"2,5 heures correspondent à :",o:["2 h 05","2 h 25","2 h 30","2 h 50"],a:2,e:"0,5 h = 30 min.",s:"Fiche contrôleur"},
{id:"ma-19",t:"math",q:"Un prix de 150 € baisse de 20 %. Quel est le nouveau prix ?",o:["110 €","120 €","125 €","130 €"],a:1,e:"150 × 0,8 = 120 €.",s:"Fiche contrôleur"},
{id:"ma-20",t:"math",q:"Quelle fraction est égale à 0,75 ?",o:["2/3","3/4","4/5","7/5"],a:1,e:"3 / 4 = 0,75.",s:"Banque maths"},

{id:"hg-01",t:"hg",q:"Quelle ordonnance de 1539 impose le français dans les actes officiels ?",o:["L'ordonnance de Villers-Cotterêts","L'édit de Nantes","Le Concordat","L'ordonnance de Moulins"],a:0,e:"Signée par François Ier.",s:"Fiche contrôleur"},
{id:"hg-02",t:"hg",q:"Quel roi a signé l'édit de Nantes en 1598 ?",o:["François Ier","Henri IV","Louis XIII","Louis XIV"],a:1,e:"Il accorde la liberté de culte aux protestants ; révoqué par Louis XIV en 1685.",s:"Fiche contrôleur"},
{id:"hg-03",t:"hg",q:"En quelle année le Code civil a-t-il été promulgué ?",o:["1789","1799","1804","1815"],a:2,e:"21 mars 1804, l'année du sacre de Napoléon Ier.",s:"Fiche contrôleur"},
{id:"hg-04",t:"hg",q:"Quelle mesure est adoptée en France en 1848 ?",o:["Le droit de vote des femmes","L'abolition de l'esclavage et le suffrage universel masculin","La séparation des Églises et de l'État","L'abolition de la peine de mort"],a:1,e:"IIe République ; décret d'abolition du 27 avril 1848 (Victor Schœlcher).",s:"Fiche contrôleur"},
{id:"hg-05",t:"hg",q:"En quelle année a été votée la loi de séparation des Églises et de l'État ?",o:["1882","1901","1905","1946"],a:2,e:"Loi du 9 décembre 1905.",s:"Fiche contrôleur"},

BANK.push(
// --- Suites numériques ---
{id:"lo2-001",t:"log",q:"Quel nombre suit : 7 – 11 – 15 – 19 – ?",o:["21","23","25","27"],a:1,e:"Suite arithmétique : on ajoute 4 à chaque terme (19 + 4 = 23).",s:"Banque logique"},
{id:"lo2-002",t:"log",q:"Quel nombre suit : 96 – 48 – 24 – 12 – ?",o:["6","4","8","10"],a:0,e:"Chaque terme est la moitié du précédent : 12 / 2 = 6.",s:"Banque logique"},
{id:"lo2-003",t:"log",q:"Quel nombre suit : 5 – 15 – 45 – 135 – ?",o:["270","375","540","405"],a:3,e:"Suite géométrique de raison 3 : 135 × 3 = 405.",s:"Banque logique"},
{id:"lo2-004",t:"log",q:"Quel nombre suit : 2 – 5 – 10 – 17 – 26 – ?",o:["35","36","37","39"],a:2,e:"Écarts 3, 5, 7, 9, puis 11 : 26 + 11 = 37 (ce sont les carrés augmentés de 1).",s:"Banque logique"},
{id:"lo2-005",t:"log",q:"Quel nombre suit : 3 – 12 – 27 – 48 – ?",o:["69","72","81","75"],a:3,e:"Triple des carrés : 3 × 1², 3 × 2², 3 × 3², 3 × 4², puis 3 × 5² = 75 (écarts 9, 15, 21, 27).",s:"Banque logique"},
{id:"lo2-006",t:"log",q:"Quel nombre complète cette suite de nombres premiers : 47 – 53 – 59 – 61 – ?",o:["67","63","65","69"],a:0,e:"Le nombre premier qui suit 61 est 67 ; 63 = 7 × 9, 65 = 5 × 13 et 69 = 3 × 23.",s:"Banque logique"},
{id:"lo2-007",t:"log",q:"Quel nombre suit : 1 – 3 – 6 – 10 – 15 – ?",o:["20","21","22","25"],a:1,e:"Nombres triangulaires : on ajoute 2, 3, 4, 5, puis 6 : 15 + 6 = 21.",s:"Banque logique"},
{id:"lo2-008",t:"log",q:"Quel nombre suit : 1 – 2 – 6 – 24 – 120 – ?",o:["240","600","720","840"],a:2,e:"On multiplie successivement par 2, 3, 4, 5, puis 6 : 120 × 6 = 720.",s:"Banque logique"},
{id:"lo2-009",t:"log",q:"Quel nombre suit : 3 – 4 – 7 – 11 – 18 – 29 – ?",o:["40","43","58","47"],a:3,e:"Chaque terme est la somme des deux précédents : 18 + 29 = 47.",s:"Banque logique"},
{id:"lo2-010",t:"log",q:"Quel nombre vient ensuite : 2 – 9 – 4 – 8 – 6 – 7 – ?",o:["8","5","6","10"],a:0,e:"Deux suites alternées : rangs impairs 2, 4, 6, 8 (+ 2) et rangs pairs 9, 8, 7 (− 1). Le 7e terme est 8.",s:"Banque logique"},
{id:"lo2-011",t:"log",q:"Quel nombre suit : 0 – 7 – 26 – 63 – ?",o:["99","124","125","127"],a:1,e:"Cubes moins 1 : 1³ − 1, 2³ − 1, 3³ − 1, 4³ − 1, puis 5³ − 1 = 124.",s:"Banque logique"},
{id:"lo2-012",t:"log",q:"Quel nombre suit : 1 – 4 – 27 – 256 – ?",o:["625","1 024","3 125","4 096"],a:2,e:"Chaque entier est élevé à sa propre puissance : 1¹, 2², 3³, 4⁴, puis 5⁵ = 3 125.",s:"Banque logique"},
{id:"lo2-013",t:"log",q:"Quel nombre suit : 4 – 9 – 19 – 39 – 79 – ?",o:["118","158","160","159"],a:3,e:"Chaque terme est le double du précédent plus 1 : 79 × 2 + 1 = 159.",s:"Banque logique"},
{id:"lo2-014",t:"log",q:"Quel nombre vient ensuite : 2 – 5 – 4 – 7 – 6 – 9 – ?",o:["8","7","10","12"],a:0,e:"On alterne + 3 et − 1 : 9 − 1 = 8.",s:"Banque logique"},
{id:"lo2-015",t:"log",q:"Quel nombre manque : 29 – 31 – ? – 41 – 43",o:["33","37","35","39"],a:1,e:"Ce sont des nombres premiers consécutifs : 29, 31, 37, 41, 43 (33, 35 et 39 ne sont pas premiers).",s:"Banque logique"},
{id:"lo2-016",t:"log",q:"Quel nombre suit : 2 – 12 – 36 – 80 – 150 – ?",o:["216","240","252","294"],a:2,e:"Terme = n² × (n + 1) : 1 × 2, 4 × 3, 9 × 4, 16 × 5, 25 × 6, puis 36 × 7 = 252.",s:"Banque logique"},
{id:"lo2-017",t:"log",q:"Quel nombre suit : 1 – 2 – 5 – 14 – 41 – ?",o:["82","121","123","122"],a:3,e:"Chaque terme est le triple du précédent moins 1 : 41 × 3 − 1 = 122 (les écarts 1, 3, 9, 27, 81 triplent).",s:"Banque logique"},
{id:"lo2-018",t:"log",q:"Quel nombre suit : 1 – 4 – 10 – 22 – 46 – ?",o:["94","70","92","96"],a:0,e:"Chaque terme vaut le double du précédent plus 2 : 46 × 2 + 2 = 94 (écarts 3, 6, 12, 24, 48).",s:"Banque logique"},
{id:"lo2-019",t:"log",q:"Quel nombre suit : 6 – 11 – 21 – 36 – 56 – ?",o:["76","81","80","86"],a:1,e:"Les écarts augmentent de 5 : 5, 10, 15, 20, puis 25 : 56 + 25 = 81.",s:"Banque logique"},
{id:"lo2-020",t:"log",q:"Quel nombre vient ensuite : 1 – 4 – 2 – 8 – 3 – 16 – 4 – ?",o:["5","20","32","24"],a:2,e:"Rangs impairs : 1, 2, 3, 4 ; rangs pairs : 4, 8, 16, puis 32 (× 2). Le 8e terme est 32.",s:"Banque logique"},
{id:"lo2-021",t:"log",q:"Quel nombre suit : 0 – 1 – 1 – 2 – 4 – 7 – 13 – ?",o:["20","21","26","24"],a:3,e:"Chaque terme est la somme des trois précédents : 4 + 7 + 13 = 24.",s:"Banque logique"},
{id:"lo2-022",t:"log",q:"Quel nombre suit : 5 – 6 – 8 – 12 – 20 – ?",o:["36","28","32","40"],a:0,e:"Les écarts doublent : 1, 2, 4, 8, puis 16 : 20 + 16 = 36.",s:"Banque logique"},
{id:"lo2-023",t:"log",q:"Quel nombre vient ensuite : 1 – 3 – 2 – 6 – 5 – 15 – 14 – ?",o:["13","42","28","45"],a:1,e:"On alterne × 3 et − 1 : 14 × 3 = 42.",s:"Banque logique"},
{id:"lo2-024",t:"log",q:"Quel nombre suit : 81 – 64 – 49 – 36 – ?",o:["16","27","25","30"],a:2,e:"Carrés décroissants : 9², 8², 7², 6², puis 5² = 25.",s:"Banque logique"},
{id:"lo2-025",t:"log",q:"Quel nombre suit : 2 – 6 – 30 – 210 – 2 310 – ?",o:["25 410","27 720","34 650","30 030"],a:3,e:"On multiplie par les nombres premiers successifs 3, 5, 7, 11, puis 13 : 2 310 × 13 = 30 030.",s:"Banque logique"},
{id:"lo2-026",t:"log",q:"Quel nombre suit : 1 – 9 – 25 – 49 – 81 – ?",o:["121","100","144","169"],a:0,e:"Carrés des nombres impairs : 1², 3², 5², 7², 9², puis 11² = 121 (écarts 8, 16, 24, 32, 40).",s:"Banque logique"},
{id:"lo2-027",t:"log",q:"Quel nombre suit : 1 – 2 – 4 – 8 – 15 – 26 – ?",o:["37","42","40","52"],a:1,e:"Écarts 1, 2, 4, 7, 11 : ils augmentent de 1, 2, 3, 4, puis 5. Écart suivant 16 : 26 + 16 = 42.",s:"Banque logique"},
// --- Suites de lettres et alphanumériques ---
{id:"lo2-028",t:"log",q:"Quelle lettre suit : Y – V – S – P – ?",o:["N","L","M","O"],a:2,e:"On recule de trois lettres : P (16) − 3 = M (13).",s:"Banque logique"},
{id:"lo2-029",t:"log",q:"Complétez : AB – DE – GH – JK – ?",o:["LM","NO","MO","MN"],a:3,e:"Deux lettres consécutives, puis on en saute une : AB (C) DE (F) GH (I) JK (L) MN.",s:"Banque logique"},
{id:"lo2-030",t:"log",q:"Complétez : A1 – B2 – D4 – H8 – ?",o:["P16","I9","O15","Q17"],a:0,e:"Le nombre double à chaque fois et la lettre est celle de ce rang dans l'alphabet : 16 = P.",s:"Banque logique"},
{id:"lo2-031",t:"log",q:"Complétez : A2 – C6 – E10 – G14 – ?",o:["H16","I18","I16","J18"],a:1,e:"Une lettre sur deux ; le nombre est le double du rang de la lettre : I = 9, donc 18.",s:"Banque logique"},
{id:"lo2-032",t:"log",q:"Complétez : B1 – D8 – F27 – H64 – ?",o:["I81","J100","J125","K125"],a:2,e:"Une lettre sur deux (B, D, F, H, J) et les cubes 1, 8, 27, 64, 125.",s:"Banque logique"},
{id:"lo2-033",t:"log",q:"Complétez : AZ – CX – EV – GT – ?",o:["HS","IS","JR","IR"],a:3,e:"La première lettre avance de deux rangs, la seconde recule de deux : I et R.",s:"Banque logique"},
{id:"lo2-034",t:"log",q:"Quelle lettre suit : J – F – M – A – M – J – J – ?",o:["A","S","O","J"],a:0,e:"Initiales des mois : janvier, février, mars, avril, mai, juin, juillet, puis août.",s:"Banque logique"},
{id:"lo2-035",t:"log",q:"Quelle lettre suit : U – D – T – Q – C – S – S – ?",o:["N","H","D","O"],a:1,e:"Initiales des nombres : un, deux, trois, quatre, cinq, six, sept, puis huit.",s:"Banque logique"},
{id:"lo2-036",t:"log",q:"Complétez : ACE – BDF – CEG – ?",o:["DEF","EGI","DFH","CFH"],a:2,e:"Chaque bloc prend une lettre sur deux, et chaque bloc commence une lettre plus loin que le précédent : DFH.",s:"Banque logique"},
{id:"lo2-037",t:"log",q:"Quelle lettre suit : A – C – G – M – ?",o:["S","T","W","U"],a:3,e:"Rangs 1, 3, 7, 13 : écarts 2, 4, 6, puis 8 : 13 + 8 = 21, soit U.",s:"Banque logique"},
{id:"lo2-038",t:"log",q:"Quelle lettre suit : B – C – D – F – G – H – J – ?",o:["K","I","L","M"],a:0,e:"Ce sont les consonnes dans l'ordre alphabétique : après J vient K.",s:"Banque logique"},
{id:"lo2-039",t:"log",q:"Complétez : 1A – 3C – 6F – 10J – ?",o:["14N","15O","15N","16P"],a:1,e:"Nombres triangulaires (écarts 2, 3, 4, puis 5) et lettre du même rang : 15 = O.",s:"Banque logique"},
{id:"lo2-040",t:"log",q:"Complétez : 2B – 3C – 5E – 7G – 11K – ?",o:["12L","13L","13M","15O"],a:2,e:"Nombres premiers successifs, avec la lettre de même rang : 13 = M.",s:"Banque logique"},
{id:"lo2-041",t:"log",q:"Quelle lettre suit : Z – W – S – N – ?",o:["G","I","J","H"],a:3,e:"Rangs 26, 23, 19, 14 : on recule de 3, 4, 5, puis 6 : 14 − 6 = 8, soit H.",s:"Banque logique"},
// --- Suites de mots à règle cachée ---
{id:"lo2-042",t:"log",q:"Quel mot complète la série : OR – AIR – CIEL – TERRE – ?",o:["SOLEIL","LUNE","NUAGE","PLANÈTE"],a:0,e:"Le nombre de lettres augmente de 1 : 2, 3, 4, 5, puis 6 (SOLEIL).",s:"Banque logique"},
{id:"lo2-043",t:"log",q:"Quel mot complète la série : BALLE – CARTE – DOUCHE – ESCALIER – ?",o:["ARMOIRE","FENÊTRE","GARAGE","DOMINO"],a:1,e:"Les initiales suivent l'alphabet : B, C, D, E, puis F.",s:"Banque logique"},
{id:"lo2-044",t:"log",q:"Quel mot complète la série : PARIS – SOLEIL – LAPIN – NAVIRE – ?",o:["ARBRE","ORANGE","ENCRE","TIGRE"],a:2,e:"Chaque mot commence par la dernière lettre du précédent : NAVIRE finit par E, d'où ENCRE.",s:"Banque logique"},
{id:"lo2-045",t:"log",q:"Quel mot complète la série : AMI – CHAT – ENFANT – GARE – ?",o:["HIBOU","JARDIN","KIWI","IGLOO"],a:3,e:"Les initiales avancent de deux lettres : A, C, E, G, puis I.",s:"Banque logique"},
{id:"lo2-046",t:"log",q:"Rangés dans l'ordre alphabétique, quel mot arrive en troisième position : FACTURE, FACTEUR, FACTION, FACILE ?",o:["FACTION","FACILE","FACTEUR","FACTURE"],a:0,e:"FACI précède FACT ; puis FACTE, FACTI, FACTU : FACILE, FACTEUR, FACTION, FACTURE.",s:"Banque logique"},
{id:"lo2-047",t:"log",q:"Quel mot complète la série : CODA – CLUB – ARC – BLED – ?",o:["LOUP","TIGRE","OURS","LYNX"],a:1,e:"Les dernières lettres suivent l'alphabet : A, B, C, D, puis E (TIGRE).",s:"Banque logique"},
{id:"lo2-048",t:"log",q:"Quel mot complète la série : CHOCOLAT – BISCUIT – GÂTEAU – TARTE – ?",o:["CRÊPE","BEIGNET","PAIN","BRIOCHE"],a:2,e:"Le nombre de lettres diminue de 1 : 8, 7, 6, 5, puis 4 (PAIN).",s:"Banque logique"},
{id:"lo2-049",t:"log",q:"Quel mot complète la série : MER – AMER – RAMER – ?",o:["RAMES","MARRE","AMERS","TRAMER"],a:3,e:"On ajoute à chaque fois une lettre devant le mot précédent : MER, A-MER, R-AMER, T-RAMER.",s:"Banque logique"},
// --- Codages ---
{id:"lo2-050",t:"log",q:"Si PAIN s'écrit RCKP, comment s'écrit LAIT ?",o:["NCKV","MBJU","NCJV","OCKV"],a:0,e:"Chaque lettre avance de deux rangs : L → N, A → C, I → K, T → V.",s:"Banque logique"},
{id:"lo2-051",t:"log",q:"Si CODE s'écrit BNCD, comment s'écrit IMPOT ?",o:["JNQPU","HLONS","HLNOS","HKONS"],a:1,e:"Chaque lettre recule d'un rang : I → H, M → L, P → O, O → N, T → S.",s:"Banque logique"},
{id:"lo2-052",t:"log",q:"Si SEL s'écrit MFT et VIN s'écrit OJW, comment s'écrit TAXE ?",o:["UBYF","FXAT","FYBU","EYBU"],a:2,e:"On écrit le mot à l'envers, puis chaque lettre avance d'un rang : TAXE → EXAT → FYBU.",s:"Banque logique"},
{id:"lo2-053",t:"log",q:"Le mot LAIT vaut 42 (somme des rangs de ses lettres dans l'alphabet). Combien vaut MIEL ?",o:["37","40","41","39"],a:3,e:"M (13) + I (9) + E (5) + L (12) = 39.",s:"Banque logique"},
{id:"lo2-054",t:"log",q:"Chaque lettre a un prix fixe. LOT coûte 12 €, LOTO 16 € et MOT 11 €. Combien coûte MOTO ?",o:["15 €","14 €","16 €","17 €"],a:0,e:"LOTO − LOT donne O = 4 € ; MOTO = MOT + O = 11 + 4 = 15 €.",s:"Banque logique"},
{id:"lo2-055",t:"log",q:"Chaque lettre a un prix fixe. PAIN coûte 20 €, PAINS 23 € et PIN 15 €. Combien coûte SAPIN ?",o:["21 €","23 €","22 €","25 €"],a:1,e:"SAPIN s'écrit avec exactement les lettres de PAINS : 23 €. Par le calcul : S = 3, A = 5, donc SAPIN = 3 + 5 + 15.",s:"Banque logique"},
{id:"lo2-056",t:"log",q:"Chaque lettre a un prix fixe. TOUR coûte 40 €, ROUTE 47 €, OURS 38 € et TOUT 44 €. Combien coûte SOUTE ?",o:["45 €","47 €","49 €","51 €"],a:2,e:"ROUTE − TOUR donne E = 7 ; OURS − TOUR donne S − T = −2 ; TOUT − TOUR donne T − R = 4. SOUTE = TOUR + E + S − R = 40 + 7 + 2 = 49 €.",s:"Banque logique"},
{id:"lo2-057",t:"log",q:"Dans un code, LIVRE s'écrit ILRVE. Comment s'écrit CAHIER ?",o:["ACHIER","CAIHER","REIHAC","ACIHRE"],a:3,e:"On permute les lettres deux à deux : LI → IL, VR → RV, E reste ; CA → AC, HI → IH, ER → RE.",s:"Banque logique"},
{id:"lo2-058",t:"log",q:"Si BOIS s'écrit YLRH, comment s'écrit FER ?",o:["UVI","GFS","UWI","VUI"],a:0,e:"Chaque lettre est remplacée par sa symétrique dans l'alphabet (A ↔ Z, B ↔ Y…), les deux rangs faisant 27 : F (6) → U (21), E (5) → V (22), R (18) → I (9).",s:"Banque logique"},
{id:"lo2-059",t:"log",q:"Dans un code, A = 26, B = 25, …, Z = 1. Quelle est la valeur du mot CODE (somme des valeurs de ses lettres) ?",o:["79","81","83","85"],a:1,e:"Valeur = 27 − rang : C 24 + O 12 + D 23 + E 22 = 81.",s:"Banque logique"},
{id:"lo2-060",t:"log",q:"Dans un jeu, chaque voyelle vaut 3 points et chaque consonne 2 points. Combien vaut le mot CONTRIBUABLE ?",o:["27","28","29","31"],a:2,e:"5 voyelles (O, I, U, A, E) font 15 points et 7 consonnes (C, N, T, R, B, B, L) font 14 points : 29.",s:"Banque logique"},
{id:"lo2-061",t:"log",q:"Si 5 + 3 = 28, 9 + 1 = 810 et 8 + 6 = 214, combien font 7 + 3 ?",o:["104","421","1 004","410"],a:3,e:"On écrit la différence puis la somme : 5 − 3 = 2 et 5 + 3 = 8 donnent 28 ; 7 − 3 = 4 et 7 + 3 = 10 donnent 410.",s:"Banque logique"},
// --- Calendriers ---
{id:"lo2-062",t:"log",q:"Nous sommes samedi. Quel jour serons-nous dans 1 000 jours ?",o:["Vendredi","Jeudi","Samedi","Dimanche"],a:0,e:"1 000 = 142 × 7 + 6 : samedi + 6 jours = vendredi.",s:"Banque logique"},
{id:"lo2-063",t:"log",q:"Laquelle de ces années est bissextile ?",o:["1900","2000","2100","2200"],a:1,e:"Une année séculaire n'est bissextile que si elle est divisible par 400 : 2000 l'est, pas 1900, 2100 ni 2200.",s:"Banque logique"},
{id:"lo2-064",t:"log",q:"Combien y a-t-il d'années bissextiles de 2001 à 2100 inclus ?",o:["23","25","24","26"],a:2,e:"Il y a 25 multiples de 4 de 2004 à 2100, mais 2100 n'est pas bissextile (non divisible par 400) : 24.",s:"Banque logique"},
{id:"lo2-065",t:"log",q:"Le 1er janvier 2024, année bissextile, était un lundi. Quel jour était le 1er janvier 2025 ?",o:["Mardi","Jeudi","Lundi","Mercredi"],a:3,e:"366 jours = 52 semaines + 2 jours : lundi + 2 = mercredi.",s:"Banque logique"},
{id:"lo2-066",t:"log",q:"Le 14 juillet 2026 est un mardi. Quel jour de la semaine sera le 14 juillet 2027 ?",o:["Mercredi","Mardi","Jeudi","Lundi"],a:0,e:"Entre les deux dates il y a 365 jours (février 2027 n'a que 28 jours), soit 52 semaines + 1 jour : mercredi.",s:"Banque logique"},
{id:"lo2-067",t:"log",q:"Quelle date sera-t-on 100 jours après le 1er mars ?",o:["8 juin","9 juin","10 juin","11 juin"],a:1,e:"30 jours jusqu'au 31 mars, 30 en avril, 31 en mai : 91 jours mènent au 31 mai ; 9 de plus : 9 juin.",s:"Banque logique"},
{id:"lo2-068",t:"log",q:"Un mois de 31 jours commence un vendredi. Quel jour de la semaine tombe le 31 ?",o:["Samedi","Lundi","Dimanche","Vendredi"],a:2,e:"Le 29 est un vendredi (1 + 28 jours) ; le 30 est un samedi et le 31 un dimanche.",s:"Banque logique"},
{id:"lo2-069",t:"log",q:"Combien une même année peut-elle compter, au maximum, de vendredis 13 ?",o:["2","4","5","3"],a:3,e:"Au plus trois mois d'une même année ont leur 13 le même jour de la semaine : c'est le cas en 2026 (février, mars et novembre).",s:"Banque logique"},
{id:"lo2-070",t:"log",q:"Si le surlendemain de demain est un jeudi, quel jour était avant-hier ?",o:["Samedi","Vendredi","Dimanche","Mardi"],a:0,e:"Le surlendemain de demain tombe dans 3 jours : aujourd'hui est lundi, donc avant-hier était samedi.",s:"Banque logique"},
{id:"lo2-071",t:"log",q:"Le 1er mars d'une année non bissextile est un mercredi. Quel jour était le 1er février de cette année ?",o:["Mardi","Mercredi","Jeudi","Samedi"],a:1,e:"Février compte 28 jours, soit exactement 4 semaines : le 1er février était aussi un mercredi.",s:"Banque logique"},
