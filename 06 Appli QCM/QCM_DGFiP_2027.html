      <div class="grid2" style="margin-top:10px">
        <div class="stat"><div class="n">${fmtNum(x.note,1)} / 20</div><div class="l">Note simulée de la partie QCM</div></div>
        <div class="stat"><div class="n">${fmtNum(x.raw,2)} / ${x.n}</div><div class="l">${x.ok} justes − ${fmtNum(x.pen)} × ${x.ko} fausses · ${x.ab} abstentions</div></div>
      </div>
      <div class="tablewrap" style="margin-top:14px"><table>
        <thead><tr><th>Thème</th><th class="num">Justes</th><th class="num">Fausses</th><th class="num">Abst.</th><th class="num">Réussite</th><th class="num">Jury 2026</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="row" style="margin-top:14px">
        ${x.wrong.length?`<button class="btn primary" data-act="revwrong">Revoir mes ${x.wrong.length} erreurs</button>`:""}
        <button class="btn" data-act="examhome">Retour</button>
      </div>
    </article>
    ${x.ids?`<article class="sheet"><h3>Correction</h3><div class="stack">${x.ids.map((id,k)=>{ const c=cardMap().get(id); if(!c) return ""; const a=x.ans[id]; const perm=permFor(id,x.id); const st = a==null||a===-1 ? "abst" : perm[a]===c.a ? "ok" : "ko";
      return `<div class="item"><button class="head" data-toggle><span class="tag ${st==="ok"?"ok":st==="ko"?"bad":"warn"}">Q${k+1} · ${st==="ok"?"juste":st==="ko"?"fausse":"abstention"}</span> ${esc(c.q)}</button><div class="body" hidden><ol>${perm.map((oi,j)=>`<li class="${oi===c.a?"good":""}">${esc(c.o[oi])}${a===j&&oi!==c.a?" ← ta réponse":""}</li>`).join("")}</ol>${explHtml(c)}</div></div>`; }).join("")}</div></article>`:""}
  </section>`;
}

// ----- Progrès -----
function themeStats(t){
  let n=0, ok=0, seen=0, acq=0, total=0;
  for(const c of allCards()){
    if(c.t!==t || c.d) continue;
    total++;
    const r = rec(c.id); if(!r || !r.l) continue;
    seen++; if(status(c.id)==="acquise") acq++;
    n += r.k[0]; ok += r.k[1];
  }
  let xn=0, xok=0;
  for(const x of S.exams){ const v=x.by && x.by[t]; if(v){ xn+=v[0]; xok+=v[1]; } }
  return {n,ok,seen,acq,total,xn,xok};
}
function viewProgres(m){
  const themes = themesOn();
  const st = themes.map(t=>({t,...themeStats(t)}));
  const totalAns = st.reduce((a,b)=>a+b.n,0);
  const totalOk = st.reduce((a,b)=>a+b.ok,0);
  const acq = st.reduce((a,b)=>a+b.acq,0), tot = st.reduce((a,b)=>a+b.total,0), seen = st.reduce((a,b)=>a+b.seen,0);
  m.innerHTML = `
  <section class="stack">
    <h2>Progrès par thème</h2>
    <div class="grid2">
      <div class="stat"><div class="n">${fmtPct(pct(totalOk,totalAns))}</div><div class="l">Réussite en révision (${totalAns} réponses)</div></div>
      <div class="stat"><div class="n">${seen} / ${tot}</div><div class="l">Questions vues · ${acq} acquises</div></div>
    </div>
    <article class="sheet">
      <div class="bars">
        ${st.map(s=>{ const v=pct(s.ok,s.n); const j=THEMES[s.t].jury; return `<div class="bar-row">
          <div class="lab"><b>${THEMES[s.t].l}</b><span>moi ${fmtPct(v)}${j?` · jury ${fmtNum(j,1)} %`:""} · examen ${fmtPct(pct(s.xok,s.xn))}</span></div>
          <div class="track" role="img" aria-label="${THEMES[s.t].l} : ${fmtPct(v)}${j?", jury "+Math.round(j)+" %":""}">
            <div class="fill ${v==null?"":j==null?"":v>=j?"ok":"bad"}" style="width:${v||0}%"></div>
            ${j?`<div class="mark" style="left:calc(${j}% - 1px)"></div>`:""}
          </div></div>`; }).join("")}
      </div>
      <div class="scale"><span>0 %</span><span>25 %</span><span>50 %</span><span>75 %</span><span>100 %</span></div>
      <div class="legend" style="margin-top:10px"><span><i style="background:var(--ok)"></i>au-dessus du jury</span><span><i style="background:var(--bad)"></i>en dessous</span><span><i class="mk"></i>moyenne des candidats 2026</span></div>
    </article>
    <article class="sheet">
      <h3>Par thème</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>Thème</th><th class="num">Banque</th><th class="num">Vues</th><th class="num">Acquises</th><th class="num">Réponses</th><th></th></tr></thead>
        <tbody>${st.map(s=>`<tr><td>${THEMES[s.t].s}</td><td class="num">${s.total}</td><td class="num">${s.seen}</td><td class="num">${s.acq}</td><td class="num">${s.n}</td><td><button class="btn" data-theme-session="${s.t}">30 questions</button></td></tr>`).join("")}</tbody>
      </table></div>
    </article>
  </section>`;
}

// ----- Banque -----
let bq = {t:"all", f:"", flag:"", lim:40};
function viewBanque(m){
  const themes = themesOn();
  const f = bq.f.trim().toLowerCase();
  const list = allCards().filter(c => (bq.t==="all" ? themes.includes(c.t) : c.t===bq.t)
     && (!bq.flag || (bq.flag==="d"&&c.d) || (bq.flag==="act"&&c.act) || (bq.flag==="mine"&&c.mine))
     && (!f || (c.q+" "+c.o.join(" ")+" "+c.e+" "+(c.x||"")+" "+c.s).toLowerCase().includes(f)));
  m.innerHTML = `
  <section class="stack">
    <div class="row" style="justify-content:space-between"><h2>Banque de questions</h2><span class="kbd">${allCards().length} questions</span></div>
    <div class="chips" role="group" aria-label="Thème">
      <button data-bqt="all" aria-pressed="${bq.t==="all"}">Tous</button>
      ${themes.map(t=>`<button data-bqt="${t}" aria-pressed="${bq.t===t}">${THEMES[t].s} · ${allCards().filter(c=>c.t===t).length}</button>`).join("")}
    </div>
    <div class="row">
      <input type="search" id="bq-search" aria-label="Rechercher" placeholder="Rechercher" value="${esc(bq.f)}" style="flex:1 1 220px">
      <select id="bq-flag" aria-label="Filtre" style="flex:0 1 200px">
        <option value="" ${bq.flag===""?"selected":""}>Toutes</option>
        <option value="act" ${bq.flag==="act"?"selected":""}>Actualité datée</option>
        <option value="d" ${bq.flag==="d"?"selected":""}>Douteuses</option>
        <option value="mine" ${bq.flag==="mine"?"selected":""}>Mes cartes</option>
      </select>
    </div>
    <p class="note" style="margin:0">${list.length} résultat(s)</p>
    <div class="stack" id="bq-list">
      ${list.slice(0,bq.lim).map(c=>{ const st=status(c.id); return `<div class="item">
        <button class="head" data-toggle><span class="tag">${THEMES[c.t].s}</span> ${c.d?'<span class="tag bad">Douteuse</span> ':''}${c.act?'<span class="tag warn">Actu</span> ':''}${c.mine?'<span class="tag ok">Ma carte</span> ':''}<span class="tag plain">${st}</span><br>${esc(c.q)}</button>
        <div class="body" hidden><ol>${c.o.map((o,i)=>`<li class="${i===c.a?"good":""}">${esc(o)}</li>`).join("")}</ol>${explHtml(c, c.d?"bad":"")}
        ${c.mine?`<div class="row" style="margin-top:8px"><span id="del-${c.id}"><button class="btn danger" data-delask="${c.id}">Supprimer cette carte</button></span></div>`:""}</div></div>`; }).join("") || '<div class="empty">Aucune question ne correspond.</div>'}
    </div>
    ${list.length>bq.lim?`<button class="btn" data-act="bqmore">Afficher plus</button>`:""}
  </section>`;
}

// ----- Ajouter -----
function viewAjout(m){
  const mine = S.custom.slice().reverse();
  m.innerHTML = `
  <section class="stack">
    <h2>Ajouter une carte d'actualité</h2>
    <form class="sheet stack" id="addform" novalidate>
      <div class="grid2">
        <label class="f">Thème<select id="add-t">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}" ${k==="admin"?"selected":""}>${v.l}</option>`).join("")}</select></label>
        <label class="f">Source et date<input type="text" id="add-s"></label>
      </div>
      <label class="f">Question<textarea id="add-q"></textarea></label>
      <fieldset style="border:0;padding:0;margin:0" class="stack">
        <legend style="font-size:.88rem;font-weight:600;margin-bottom:6px">Propositions (cocher la bonne)</legend>
        ${[0,1,2,3].map(i=>`<div class="optin"><input type="radio" name="add-a" id="add-a${i}" value="${i}" ${i===0?"checked":""} aria-label="Bonne réponse : proposition ${i+1}"><input type="text" id="add-o${i}" aria-label="Proposition ${i+1}"></div>`).join("")}
      </fieldset>
      <label class="f">Explication<textarea id="add-e"></textarea></label>
      <label class="f">Lien (facultatif)<input type="text" id="add-u" inputmode="url"></label>
      <label class="row" style="font-size:.9rem"><input type="checkbox" id="add-act" checked> Actualité datée</label>
      <div class="row"><button class="btn primary" type="submit">Ajouter la carte</button><span id="add-msg" class="note"></span></div>
    </form>
    <article class="sheet">
      <h3>Mes cartes (${mine.length})</h3>
      ${mine.length?`<div class="stack">${mine.map(c=>`<div class="item"><button class="head" data-toggle><span class="tag">${THEMES[c.t].s}</span> ${esc(c.q)}</button><div class="body" hidden><ol>${c.o.map((o,i)=>`<li class="${i===c.a?"good":""}">${esc(o)}</li>`).join("")}</ol>${explHtml(c)}<div class="row" style="margin-top:8px"><span id="del-${c.id}"><button class="btn danger" data-delask="${c.id}">Supprimer</button></span></div></div></div>`).join("")}</div>`:`<div class="empty">Aucune carte.</div>`}
    </article>
  </section>`;
}
function addCard(){
  const q = $("#add-q").value.trim();
  const o = [0,1,2,3].map(i=>$("#add-o"+i).value.trim());
  const a = Number((document.querySelector('input[name="add-a"]:checked')||{}).value||0);
  const u = $("#add-u").value.trim();
  const msg = $("#add-msg");
  if(!q){ msg.textContent = "Écris la question."; $("#add-q").focus(); return; }
  if(o.some(x=>!x)){ msg.textContent = "Remplis les quatre propositions."; $("#add-o"+o.findIndex(x=>!x)).focus(); return; }
  if(new Set(o.map(x=>x.toLowerCase())).size<4){ msg.textContent = "Les quatre propositions doivent être différentes."; return; }
  if(u && !/^https:\/\/\S+$/.test(u)){ msg.textContent = "Le lien doit commencer par https://"; $("#add-u").focus(); return; }
  const c = {id:"u-"+Date.now().toString(36), t:$("#add-t").value, q, o, a, e:$("#add-e").value.trim()||"Carte personnelle.", s:$("#add-s").value.trim()||"Ma carte", act:$("#add-act").checked?1:0, at:Date.now()};
  if(u) c.u = [u];
  S.custom.push(c); save(); invalidate();
  toast("Carte ajoutée.");
  render();
}
function delCard(id){
  S.custom = S.custom.filter(c=>c.id!==id); S.del.push(id); delete S.cards[id];
  if(S.daily && S.daily.ids) S.daily.ids = S.daily.ids.filter(x=>x!==id);
  if(session){ session.ids = session.ids.filter((x,k)=>x!==id||k<session.pos); }
  save(); invalidate(); toast("Carte supprimée."); render();
}

// ----- Réglages -----
function viewReglages(m){
  const s = S.set;
  m.innerHTML = `
  <section class="stack">
    <h2>Réglages</h2>
    <article class="sheet stack">
      <label class="f">Module<select id="set-mod">${Object.entries(MODULES).map(([k,v])=>`<option value="${k}" ${s.mod===k?"selected":""}>${v.l} (${v.t.map(t=>THEMES[t].s).join(", ")})</option>`).join("")}</select></label>
      <label class="f">Questions par jour : <b id="size-v">${s.size}</b><input type="range" id="set-size" min="20" max="60" step="5" value="${s.size}"></label>
      <label class="f">Nouvelles questions par jour au maximum<input type="number" id="set-new" min="0" max="60" value="${s.newMax}"></label>
      <label class="f">Pénalité par réponse fausse<select id="set-pen">${[0,0.25,0.33,0.5,1].map(p=>`<option value="${p}" ${s.pen===p?"selected":""}>−${fmtNum(p)} point</option>`).join("")}</select></label>
      <label class="row" style="font-size:.95rem"><input type="checkbox" id="set-act" ${s.act?"checked":""}> Inclure les questions d'actualité datée</label>
      <div class="row"><button class="btn" data-act="newday">Recomposer la session du jour</button></div>
    </article>
    <article class="sheet stack">
      <h3>Sauvegarde manuelle</h3>
      <textarea id="exp" readonly aria-label="Sauvegarde" style="min-height:90px;font-family:var(--f-mono);font-size:.75rem">${esc(serialize())}</textarea>
      <div class="row"><button class="btn" data-act="copy">Copier</button></div>
      <label class="f">Importer une sauvegarde<textarea id="imp"></textarea></label>
      <div class="row"><button class="btn" data-act="import">Importer et fusionner</button></div>
    </article>
    <article class="sheet stack">
      <h3>Remise à zéro</h3>
      <div id="resetbox"><button class="btn danger" data-act="resetask">Effacer toute ma progression</button></div>
    </article>
  </section>`;
}

// ---------- Événements ----------
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.tab){ go(d.tab); return; }
  if(d.go){ go(d.go); return; }
  if(d.pick!=null){ pick(Number(d.pick)); return; }
  if(d.toggle!=null){ const body=b.nextElementSibling; if(body) body.hidden=!body.hidden; return; }
  if(d.exam){ startExam(d.exam); return; }
  if(d.pen!=null){ S.set.pen = Number(d.pen); save(); render(); return; }
  if(d.xpick!=null && S.run){ const id=S.run.ids[S.run.pos]; const v=Number(d.xpick); if(S.run.ans[id]===v) delete S.run.ans[id]; else S.run.ans[id]=v; save(); render(); return; }
  if(d.xnav && S.run){ S.run.pos = Math.min(Math.max(0, S.run.pos + Number(d.xnav)), S.run.ids.length-1); save(); render(); return; }
  if(d.xgo!=null && S.run){ S.run.pos = Number(d.xgo); save(); render(); return; }
  if(d.bqt){ bq.t = d.bqt; bq.lim=40; render(); return; }
  if(d.themeSession){ const t=d.themeSession; startExtra(buildDaily(30, t), "Révision ciblée · "+THEMES[t].l); return; }
  if(d.delask){ const box=$("#del-"+CSS.escape(d.delask)); if(box) box.innerHTML = `<span class="confirm">Supprimer définitivement ? <button class="btn danger" data-del="${esc(d.delask)}">Oui, supprimer</button><button class="btn" data-act="rerender">Annuler</button></span>`; return; }
  if(d.del){ delCard(d.del); return; }
  switch(d.act){
    case "next": next(); break;
    case "skip": { session.skipped = session.skipped || {}; const id = session.ids[session.pos]; if(!session.skipped[id]){ session.skipped[id]=1; session.ids.push(id); } next(); break; }
    case "more": { const done = new Set(session ? session.ids : []); startExtra(buildDaily(10, null, done), "10 questions de plus"); break; }
    case "endask": $("#endbox").innerHTML = `<div class="confirm">Rendre la copie maintenant ? <button class="btn danger" data-act="end">Oui, rendre</button><button class="btn" data-act="rerender">Continuer</button></div>`; break;
    case "end": finishExam(false); break;
    case "revwrong": if(lastResult) startExtra(lastResult.wrong.slice(), "Erreurs de l'examen blanc"); break;
    case "examhome": lastResult=null; render(); break;
    case "bqmore": bq.lim += 40; render(); break;
    case "rerender": render(); break;
    case "newday": S.daily=null; session=null; save(); toast("Session du jour recomposée."); go("jour"); break;
    case "copy": { const t=$("#exp"); try{ navigator.clipboard.writeText(t.value).then(()=>toast("Sauvegarde copiée."),()=>{ t.select(); toast("Texte sélectionné."); }); }catch(err){ t.select(); toast("Texte sélectionné."); } break; }
    case "import": { try{ const v=JSON.parse($("#imp").value); S = merge(S, normalize(v)); save(); invalidate(); session=null; toast("Sauvegarde importée."); render(); }catch(err){ toast("Texte illisible : colle une sauvegarde complète."); } break; }
    case "resetask": $("#resetbox").innerHTML = `<div class="confirm">Toutes tes réponses, examens et cartes perso seront effacés. <button class="btn danger" data-act="reset">Oui, tout effacer</button><button class="btn" data-act="rerender">Annuler</button></div>`; break;
    case "reset": { const set=S.set; S = blank(); S.set=set; session=null; lastResult=null; save(); toast("Progression effacée."); go("jour"); break; }
  }
});
document.addEventListener("submit", e => { if(e.target.id==="addform"){ e.preventDefault(); addCard(); } });
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id==="bq-search"){ bq.f=t.value; bq.lim=40; clearTimeout(bq._t); bq._t=setTimeout(()=>{ const pos=t.selectionStart; render(); const s=$("#bq-search"); if(s){ s.focus(); try{ s.setSelectionRange(pos,pos);}catch(err){} } }, 250); }
  if(t.id==="set-size"){ $("#size-v").textContent=t.value; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id==="bq-flag"){ bq.flag=t.value; render(); return; }
  if(t.id==="set-mod"){ S.set.mod=t.value; S.daily=null; session=null; save(); render(); toast("Module : "+MODULES[t.value].l+"."); }
  if(t.id==="set-size"){ S.set.size=Number(t.value); S.daily=null; session=null; save(); renderPills(); }
  if(t.id==="set-new"){ S.set.newMax=Math.max(0,Math.min(60,Number(t.value)||0)); S.daily=null; session=null; save(); }
  if(t.id==="set-pen"){ S.set.pen=Number(t.value); save(); }
  if(t.id==="set-act"){ S.set.act=t.checked; S.daily=null; session=null; save(); }
});
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("input,textarea,select")) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(tab==="jour" && session && session.pos < session.ids.length){
    if(session.picked==null){ if(["1","2","3","4"].includes(e.key)) pick(Number(e.key)-1); }
    else if(e.key==="Enter"){ e.preventDefault(); next(); }
  } else if(tab==="examen" && S.run){
    if(["1","2","3","4"].includes(e.key)){ const id=S.run.ids[S.run.pos]; S.run.ans[id]=Number(e.key)-1; save(); render(); }
    else if(e.key==="ArrowRight"){ S.run.pos=Math.min(S.run.pos+1,S.run.ids.length-1); save(); render(); }
    else if(e.key==="ArrowLeft"){ S.run.pos=Math.max(S.run.pos-1,0); save(); render(); }
  }
});
window.addEventListener("storage", e => { if(e.key===KEY){ S = load(); invalidate(); session=null; render(); } });

render();
initRemote();
</script>

</body></html>
