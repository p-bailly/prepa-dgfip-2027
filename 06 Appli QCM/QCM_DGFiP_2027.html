{id:"lo2-072",t:"log",q:"Le 31 décembre 2026 est un jeudi. Quel jour était le 1er janvier 2026 ?",o:["Mercredi","Vendredi","Jeudi","Samedi"],a:2,e:"2026 n'est pas bissextile : le 31 décembre est 364 jours (52 semaines) après le 1er janvier, c'était donc aussi un jeudi.",s:"Banque logique"},
{id:"lo2-073",t:"log",q:"Le 16 octobre 2026 est un vendredi. Quel jour de la semaine était le 16 octobre 2020 ?",o:["Mercredi","Jeudi","Samedi","Vendredi"],a:3,e:"Six années dont un 29 février (2024) : 6 × 365 + 1 = 2 191 jours, soit 313 semaines exactement : c'était aussi un vendredi.",s:"Banque logique"},
// --- Horloges et heures ---
{id:"lo2-074",t:"log",q:"Quel est le plus petit angle formé par les aiguilles d'une horloge à 4 h 00 ?",o:["120°","100°","110°","135°"],a:0,e:"Chaque heure du cadran correspond à 30° : 4 × 30° = 120°.",s:"Banque logique"},
{id:"lo2-075",t:"log",q:"Quel est le plus petit angle formé par les aiguilles d'une horloge à 2 h 20 ?",o:["40°","50°","60°","70°"],a:1,e:"Petite aiguille : 2 × 30 + 20 × 0,5 = 70° ; grande aiguille : 20 × 6 = 120° ; écart : 50°.",s:"Banque logique"},
{id:"lo2-076",t:"log",q:"Quel est le plus petit angle formé par les aiguilles d'une horloge à 7 h 30 ?",o:["30°","60°","45°","75°"],a:2,e:"Petite aiguille : 7,5 × 30 = 225° ; grande aiguille : 180° ; écart : 45°.",s:"Banque logique"},
{id:"lo2-077",t:"log",q:"Quel est le plus petit angle formé par les aiguilles d'une horloge à 10 h 15 ?",o:["135°","150°","157,5°","142,5°"],a:3,e:"Petite aiguille : 10 × 30 + 15 × 0,5 = 307,5° ; grande : 90° ; écart 217,5°, soit 360 − 217,5 = 142,5°.",s:"Banque logique"},
{id:"lo2-078",t:"log",q:"Entre 3 h et 4 h, à quel instant (à la seconde près) les deux aiguilles d'une horloge sont-elles superposées ?",o:["3 h 16 min 22 s","3 h 15 min 00 s","3 h 17 min 10 s","3 h 18 min 00 s"],a:0,e:"La grande aiguille rattrape 5,5° par minute sur la petite, qui a 90° d'avance : 90 / 5,5 ≈ 16,36 min, soit 3 h 16 min 22 s.",s:"Banque logique"},
{id:"lo2-079",t:"log",q:"Il est 14 h à Paris (UTC+1). Quelle heure est-il au même instant à New York (UTC−5) ?",o:["9 h","8 h","19 h","20 h"],a:1,e:"Six heures d'écart, New York étant en retard : 14 − 6 = 8 h.",s:"Banque logique"},
{id:"lo2-080",t:"log",q:"Un avion quitte Paris à 10 h (heure de Paris) pour Montréal, qui a 6 heures de retard sur Paris. Le vol dure 7 h 30. Quelle heure locale est-il à l'arrivée ?",o:["12 h 30","17 h 30","11 h 30","23 h 30"],a:2,e:"Arrivée à 17 h 30, heure de Paris, soit 17 h 30 − 6 h = 11 h 30 à Montréal.",s:"Banque logique"},
{id:"lo2-081",t:"log",q:"Un avion quitte Tokyo à 22 h (heure locale) et arrive à Paris à 5 h le lendemain (heure de Paris). Tokyo a 8 heures d'avance sur Paris. Combien de temps a duré le vol ?",o:["7 h","13 h","17 h","15 h"],a:3,e:"Le départ a lieu à 22 h − 8 h = 14 h, heure de Paris ; de 14 h à 5 h le lendemain : 15 heures.",s:"Banque logique"},
{id:"lo2-082",t:"log",q:"Vue dans un miroir, une horloge à aiguilles sans chiffres semble indiquer 3 h 15. Quelle heure est-il réellement ?",o:["8 h 45","9 h 45","9 h 15","8 h 15"],a:0,e:"Le miroir inverse la gauche et la droite : heure réelle = 12 h 00 − 3 h 15 = 8 h 45.",s:"Banque logique"},
{id:"lo2-083",t:"log",q:"Un agent commence à 8 h 47 et termine à 17 h 12, avec une pause de 1 h 15. Combien de temps a-t-il travaillé ?",o:["7 h 25","7 h 10","7 h 35","8 h 25"],a:1,e:"De 8 h 47 à 17 h 12 : 8 h 25 ; moins 1 h 15 de pause : 7 h 10.",s:"Banque logique"},
{id:"lo2-084",t:"log",q:"Quand il est midi à Londres (UTC), il est 21 h à Tokyo. Quelle heure est-il à Tokyo lorsqu'il est 18 h à Paris (UTC+1) ?",o:["1 h","3 h","2 h","9 h"],a:2,e:"18 h à Paris correspond à 17 h UTC ; Tokyo a 9 heures d'avance sur UTC : 2 h du matin, le lendemain.",s:"Banque logique"},
// --- Probabilités ---
{id:"lo2-085",t:"log",q:"On lance un dé équilibré à six faces. Quelle est la probabilité d'obtenir un nombre pair ?",o:["1/6","1/3","2/3","1/2"],a:3,e:"3 cas favorables (2, 4, 6) sur 6 : 1/2.",s:"Banque logique"},
{id:"lo2-086",t:"log",q:"On lance deux dés équilibrés. Quelle est la probabilité que la somme soit égale à 10 ?",o:["1/12","1/18","1/9","1/6"],a:0,e:"3 cas sur 36 : (4,6), (5,5), (6,4), soit 1/12.",s:"Banque logique"},
{id:"lo2-087",t:"log",q:"On lance deux dés équilibrés. Quelle est la probabilité d'obtenir au moins un 6 ?",o:["1/6","11/36","1/3","5/18"],a:1,e:"Événement contraire (aucun 6) : (5/6)² = 25/36 ; donc 1 − 25/36 = 11/36.",s:"Banque logique"},
{id:"lo2-088",t:"log",q:"On tire une carte d'un jeu de 32 cartes. Quelle est la probabilité de tirer un as ?",o:["1/4","1/13","1/8","1/32"],a:2,e:"4 as sur 32 cartes : 1/8.",s:"Banque logique"},
{id:"lo2-089",t:"log",q:"On tire une carte d'un jeu de 52 cartes. Quelle est la probabilité de tirer un cœur ou un roi ?",o:["1/4","17/52","5/13","4/13"],a:3,e:"13 cœurs + 4 rois − le roi de cœur compté deux fois = 16 cartes : 16/52 = 4/13.",s:"Banque logique"},
{id:"lo2-090",t:"log",q:"On tire une carte d'un jeu de 52 cartes. Quelle est la probabilité de tirer une figure (valet, dame ou roi) ?",o:["3/13","1/13","4/13","1/4"],a:0,e:"12 figures sur 52 cartes : 12/52 = 3/13.",s:"Banque logique"},
{id:"lo2-091",t:"log",q:"Une urne contient 3 boules rouges et 2 bleues. On tire deux boules sans remise. Quelle est la probabilité qu'elles soient toutes les deux rouges ?",o:["1/5","3/10","9/25","2/5"],a:1,e:"3/5 pour la première, puis 2/4 pour la seconde : 3/5 × 2/4 = 3/10.",s:"Banque logique"},
{id:"lo2-092",t:"log",q:"On lance trois pièces équilibrées. Quelle est la probabilité d'obtenir exactement deux « pile » ?",o:["1/4","1/2","3/8","2/3"],a:2,e:"8 issues équiprobables, dont 3 avec exactement deux « pile » (PPF, PFP, FPP) : 3/8.",s:"Banque logique"},
{id:"lo2-093",t:"log",q:"On lance deux dés équilibrés. Quelle est la probabilité que la somme soit inférieure ou égale à 4 ?",o:["1/9","2/9","1/4","1/6"],a:3,e:"Somme 2 : 1 cas ; somme 3 : 2 cas ; somme 4 : 3 cas. 6 cas sur 36 = 1/6.",s:"Banque logique"},
{id:"lo2-094",t:"log",q:"Dans un groupe de 20 personnes, 12 parlent anglais, 8 espagnol et 5 les deux langues. Quelle est la probabilité qu'une personne choisie au hasard ne parle aucune des deux ?",o:["25 %","20 %","30 %","0 %"],a:0,e:"12 + 8 − 5 = 15 personnes parlent au moins une des deux langues ; 5 sur 20 n'en parlent aucune : 25 %.",s:"Banque logique"},
{id:"lo2-095",t:"log",q:"On tire au hasard une lettre du mot PROBABILITE. Quelle est la probabilité de tirer un B ?",o:["1/11","2/11","3/11","1/5"],a:1,e:"Le mot compte 11 lettres, dont 2 B : 2/11.",s:"Banque logique"},
{id:"lo2-096",t:"log",q:"On lance deux dés équilibrés. Quelle est la probabilité que le produit des deux résultats soit pair ?",o:["1/2","2/3","3/4","5/6"],a:2,e:"Le produit n'est impair que si les deux dés sont impairs : 1/2 × 1/2 = 1/4. Il est donc pair avec la probabilité 3/4.",s:"Banque logique"},
{id:"lo2-097",t:"log",q:"À un jeu, on lance un dé : on gagne 10 € si l'on obtient 6, sinon on perd 1 €. Quel est le gain moyen par partie ?",o:["−1 €","0 €","Environ 1,67 €","Environ 0,83 €"],a:3,e:"Espérance : 10 × 1/6 − 1 × 5/6 = 5/6, soit environ 0,83 €.",s:"Banque logique"},
// --- Dénombrement ---
{id:"lo2-098",t:"log",q:"Huit personnes se serrent toutes la main, une fois chacune avec chacune. Combien y a-t-il de poignées de main ?",o:["28","16","56","64"],a:0,e:"8 × 7 / 2 = 28 (chaque poignée de main concerne deux personnes).",s:"Banque logique"},
{id:"lo2-099",t:"log",q:"Un menu propose 3 entrées, 4 plats et 2 desserts. Combien de menus « entrée-plat-dessert » différents peut-on composer ?",o:["9","24","12","36"],a:1,e:"Principe multiplicatif : 3 × 4 × 2 = 24.",s:"Banque logique"},
{id:"lo2-100",t:"log",q:"De combien de façons 5 personnes peuvent-elles s'asseoir sur un banc de 5 places ?",o:["25","60","120","720"],a:2,e:"5 × 4 × 3 × 2 × 1 = 120.",s:"Banque logique"},
{id:"lo2-101",t:"log",q:"Combien de « mots » différents (ayant un sens ou non) peut-on écrire en utilisant toutes les lettres de RADAR ?",o:["15","60","120","30"],a:3,e:"5! / (2! × 2!) = 120 / 4 = 30, car le mot contient deux R et deux A.",s:"Banque logique"},
{id:"lo2-102",t:"log",q:"On choisit 2 personnes parmi 6 pour former un binôme. Combien de binômes différents est-il possible de former ?",o:["15","12","30","36"],a:0,e:"6 × 5 / 2 = 15 (l'ordre des deux personnes ne compte pas).",s:"Banque logique"},
{id:"lo2-103",t:"log",q:"Parmi 6 personnes, on désigne un président et un trésorier, qui doivent être différents. Combien de choix possibles ?",o:["15","30","12","36"],a:1,e:"6 choix pour le président, puis 5 pour le trésorier : 30 (ici l'ordre compte).",s:"Banque logique"},
{id:"lo2-104",t:"log",q:"Combien d'entiers de 1 à 100 sont divisibles par 3 ou par 5 ?",o:["45","50","47","53"],a:2,e:"33 multiples de 3 + 20 multiples de 5 − 6 multiples de 15 (comptés deux fois) = 47.",s:"Banque logique"},
{id:"lo2-105",t:"log",q:"Combien de chiffres faut-il écrire pour numéroter les pages d'un livre de la page 1 à la page 120 ?",o:["240","260","360","252"],a:3,e:"9 pages à 1 chiffre + 90 pages à 2 chiffres + 21 pages à 3 chiffres : 9 + 180 + 63 = 252.",s:"Banque logique"},
{id:"lo2-106",t:"log",q:"Combien de fois le chiffre 7 apparaît-il quand on écrit tous les nombres de 1 à 100 ?",o:["20","10","11","19"],a:0,e:"10 fois au rang des unités (7, 17… 97) et 10 fois au rang des dizaines (70 à 79) : 20, le 77 comptant deux fois.",s:"Banque logique"},
{id:"lo2-107",t:"log",q:"Un tiroir contient 10 chaussettes noires et 10 blanches, mélangées. Combien faut-il en prendre au minimum, sans regarder, pour être sûr d'en avoir deux de la même couleur ?",o:["2","3","11","20"],a:1,e:"Avec deux couleurs seulement, trois chaussettes garantissent qu'au moins deux sont de la même couleur.",s:"Banque logique"},
{id:"lo2-108",t:"log",q:"Un tournoi à élimination directe réunit 16 équipes. Combien de matchs faut-il jouer pour désigner le vainqueur ?",o:["8","16","15","31"],a:2,e:"Chaque match élimine une équipe ; il faut en éliminer 15 : 15 matchs (8 + 4 + 2 + 1).",s:"Banque logique"},
// --- Liens de parenté ---
{id:"lo2-109",t:"log",q:"Le frère de la mère de mon père est mon :",o:["Oncle","Cousin","Arrière-grand-père","Grand-oncle"],a:3,e:"La mère de mon père est ma grand-mère ; son frère est mon grand-oncle.",s:"Banque logique"},
{id:"lo2-110",t:"log",q:"La fille de la sœur de ma mère est ma :",o:["Cousine","Nièce","Tante","Sœur"],a:0,e:"La sœur de ma mère est ma tante ; sa fille est ma cousine.",s:"Banque logique"},
{id:"lo2-111",t:"log",q:"Le fils de ma sœur est mon :",o:["Cousin","Neveu","Oncle","Petit-fils"],a:1,e:"L'enfant d'un frère ou d'une sœur est un neveu ou une nièce.",s:"Banque logique"},
{id:"lo2-112",t:"log",q:"Je n'ai ni frère ni sœur. Le père de cet homme est le fils de mon père. Qui est cet homme ?",o:["Moi-même","Mon père","Mon fils","Mon neveu"],a:2,e:"Le fils de mon père, puisque je n'ai pas de frère, c'est moi ; je suis donc le père de cet homme : c'est mon fils.",s:"Banque logique"},
{id:"lo2-113",t:"log",q:"La mère du père de ma mère est ma :",o:["Grand-mère","Grand-tante","Arrière-arrière-grand-mère","Arrière-grand-mère"],a:3,e:"Le père de ma mère est mon grand-père ; sa mère est mon arrière-grand-mère.",s:"Banque logique"},
{id:"lo2-114",t:"log",q:"Anne est la fille de Bernard. Bernard est le fils de Claire. Claire est la sœur de Denis. Qu'est Denis pour Anne ?",o:["Son grand-oncle","Son oncle","Son grand-père","Son cousin"],a:0,e:"Denis est le frère de la mère de Bernard, donc l'oncle de Bernard, et le grand-oncle d'Anne.",s:"Banque logique"},
{id:"lo2-115",t:"log",q:"Luc est le père de Marc, qui est le père de Jules. Sophie est la sœur de Marc. Qu'est Sophie pour Jules ?",o:["Sa cousine","Sa tante","Sa sœur","Sa grand-mère"],a:1,e:"Sophie est la sœur du père de Jules : c'est sa tante.",s:"Banque logique"},
{id:"lo2-116",t:"log",q:"Sans ancêtre commun, combien une personne a-t-elle au total de grands-parents, d'arrière-grands-parents et d'arrière-arrière-grands-parents ?",o:["14","24","28","30"],a:2,e:"Le nombre d'ancêtres double à chaque génération : 4 + 8 + 16 = 28.",s:"Banque logique"},
{id:"lo2-117",t:"log",q:"Une femme montre la photo d'un homme et dit : « Sa mère est la fille unique de ma mère. » Qui est cet homme pour elle ?",o:["Son frère","Son neveu","Son père","Son fils"],a:3,e:"La fille unique de sa mère, c'est elle-même ; elle est la mère de l'homme : c'est son fils.",s:"Banque logique"},
{id:"lo2-118",t:"log",q:"La sœur de ma mère a un fils. Pour ce garçon, ma mère est sa :",o:["Tante","Cousine","Grand-mère","Sœur"],a:0,e:"Ma mère est la sœur de la mère de ce garçon : elle est sa tante.",s:"Banque logique"},
// --- Syllogismes et déductions ---
{id:"lo2-119",t:"log",q:"Aucun poisson n'est un mammifère. Le saumon est un poisson. Que peut-on conclure ?",o:["Le saumon est un mammifère","Le saumon n'est pas un mammifère","Certains mammifères sont des saumons","On ne peut rien conclure"],a:1,e:"Le saumon appartient à l'ensemble des poissons, qui n'a aucun élément commun avec celui des mammifères.",s:"Banque logique"},
{id:"lo2-120",t:"log",q:"Certains fonctionnaires sont inspecteurs. Tous les inspecteurs ont réussi un concours. Que peut-on conclure ?",o:["Tous les fonctionnaires ont réussi un concours","Aucun fonctionnaire n'a réussi de concours","Certains fonctionnaires ont réussi un concours","Tous les lauréats d'un concours sont inspecteurs"],a:2,e:"Les fonctionnaires qui sont inspecteurs ont réussi un concours ; rien n'est dit des autres.",s:"Banque logique"},
{id:"lo2-121",t:"log",q:"S'il pleut, la route est mouillée. La route est mouillée. Que peut-on conclure ?",o:["Il pleut","Il ne pleut pas","Il a plu dans la nuit","On ne peut pas savoir s'il pleut"],a:3,e:"La route peut être mouillée pour une autre raison : on ne remonte pas de la conséquence à la condition.",s:"Banque logique"},
{id:"lo2-122",t:"log",q:"Quelle est la négation de « Tous les agents sont présents » ?",o:["Au moins un agent est absent","Tous les agents sont absents","Aucun agent n'est présent","Au moins un agent est présent"],a:0,e:"Nier « tous » revient à affirmer qu'il existe au moins une exception.",s:"Banque logique"},
{id:"lo2-123",t:"log",q:"Quelle est la négation de « Il pleut et il fait froid » ?",o:["Il ne pleut pas et il ne fait pas froid","Il ne pleut pas ou il ne fait pas froid","Il pleut ou il fait froid","Il ne pleut pas et il fait froid"],a:1,e:"La négation de « A et B » est « non A ou non B » : il suffit que l'une des deux conditions manque.",s:"Banque logique"},
{id:"lo2-124",t:"log",q:"Tous les A sont des B. Aucun B n'est un C. Que peut-on conclure ?",o:["Certains A sont des C","Tous les C sont des A","Aucun A n'est un C","Certains C sont des B"],a:2,e:"Les A sont inclus dans les B, qui n'ont aucun élément commun avec les C.",s:"Banque logique"},
{id:"lo2-125",t:"log",q:"Seuls les agents habilités peuvent consulter ce fichier. Léa l'a consulté. Que peut-on conclure ?",o:["Léa n'est pas habilitée","Tous les agents habilités l'ont consulté","On ne peut rien conclure","Léa est habilitée"],a:3,e:"« Seuls les habilités peuvent consulter » signifie : avoir consulté implique être habilité.",s:"Banque logique"},
{id:"lo2-126",t:"log",q:"Si Marc vient, Julie vient. Si Julie vient, Paul ne vient pas. Or Paul vient. Que peut-on conclure ?",o:["Ni Marc ni Julie ne viennent","Marc et Julie viennent","Julie vient mais pas Marc","Marc vient mais pas Julie"],a:0,e:"Paul vient, donc Julie ne vient pas (contraposée) ; Julie ne venant pas, Marc ne vient pas non plus.",s:"Banque logique"},
{id:"lo2-127",t:"log",q:"Tous les membres du club sont musiciens. Certains musiciens sont sportifs. Jean est sportif. Que peut-on affirmer avec certitude ?",o:["Jean est membre du club","On ne peut pas savoir si Jean est membre du club","Jean est musicien","Jean n'est pas membre du club"],a:1,e:"Être sportif n'implique ni d'être musicien ni d'être membre du club : aucune des trois autres affirmations n'est certaine.",s:"Banque logique"},
{id:"lo2-128",t:"log",q:"Quelle phrase est équivalente à « Si je réussis, je suis content » ?",o:["Si je suis content, j'ai réussi","Si je ne réussis pas, je ne suis pas content","Si je ne suis pas content, je n'ai pas réussi","Je réussis et je suis content"],a:2,e:"Une implication « A ⇒ B » équivaut à sa contraposée « non B ⇒ non A ».",s:"Banque logique"},
{id:"lo2-129",t:"log",q:"Quelle est la négation de « Certains candidats ont échoué » ?",o:["Certains candidats ont réussi","Tous les candidats ont échoué","Certains candidats n'ont pas échoué","Aucun candidat n'a échoué"],a:3,e:"Nier « il en existe au moins un » revient à dire « il n'en existe aucun ».",s:"Banque logique"},
{id:"lo2-130",t:"log",q:"Aucun inspecteur n'est stagiaire. Certains stagiaires sont diplômés. Que peut-on conclure ?",o:["Certains diplômés ne sont pas inspecteurs","Aucun diplômé n'est inspecteur","Certains inspecteurs sont diplômés","Tous les diplômés sont stagiaires"],a:0,e:"Les stagiaires diplômés existent et ne sont pas inspecteurs : certains diplômés ne sont donc pas inspecteurs.",s:"Banque logique"},
// --- Vrai ou faux, menteurs ---
{id:"lo2-131",t:"log",q:"Chacun ment toujours ou dit toujours la vérité. Anne dit : « Basile ment. » Basile dit : « Chloé ment. » Chloé dit : « Anne et Basile mentent. » Qui dit la vérité ?",o:["Anne seule","Basile seul","Chloé seule","Anne et Chloé"],a:1,e:"Si Anne disait vrai, Basile mentirait, Chloé dirait vrai et Anne mentirait : contradiction. Donc Anne ment, Basile dit vrai, Chloé ment (sa phrase est bien fausse).",s:"Banque logique"},
{id:"lo2-132",t:"log",q:"Sur une île, les chevaliers disent toujours la vérité et les fripons mentent toujours. A déclare : « B et moi sommes deux fripons. » Que sont A et B ?",o:["Deux chevaliers","Deux fripons","A fripon, B chevalier","A chevalier, B fripon"],a:2,e:"Un chevalier ne peut pas se dire fripon : A est fripon, sa phrase est fausse, donc B n'est pas fripon.",s:"Banque logique"},
{id:"lo2-133",t:"log",q:"Un trésor est caché dans une seule des boîtes A, B, C ou D. Une seule de ces phrases est vraie : (1) le trésor est dans A ; (2) le trésor n'est pas dans B ; (3) le trésor n'est pas dans A. Où est le trésor ?",o:["A","C","D","B"],a:3,e:"(1) et (3) se contredisent, donc l'une d'elles est la phrase vraie ; (2) est alors fausse : le trésor est dans B.",s:"Banque logique"},
{id:"lo2-134",t:"log",q:"Un seul des quatre suspects dit la vérité, et un seul est coupable. Alain : « C'est Brigitte. » Brigitte : « C'est Diane. » Cédric : « Ce n'est pas moi. » Diane : « Brigitte ment. » Qui est coupable ?",o:["Cédric","Alain","Brigitte","Diane"],a:0,e:"On teste chaque coupable possible : seul le cas « Cédric » donne exactement une phrase vraie (celle de Diane).",s:"Banque logique"},
{id:"lo2-135",t:"log",q:"Paul ment toujours. Il affirme : « Je n'ai pas de voiture et j'ai un vélo. » Que peut-on en déduire ?",o:["Il a une voiture et pas de vélo","Il a une voiture ou il n'a pas de vélo","Il n'a ni voiture ni vélo","Il a une voiture et un vélo"],a:1,e:"Sa phrase est fausse ; la négation de « non A et B » est « A ou non B ».",s:"Banque logique"},
{id:"lo2-136",t:"log",q:"Trois boîtes portent les étiquettes « Pommes », « Poires » et « Mélange », toutes fausses. On tire un fruit de la boîte « Mélange » : c'est une pomme. Que contient la boîte étiquetée « Poires » ?",o:["Des pommes","Des poires","Le mélange","On ne peut pas savoir"],a:2,e:"La boîte « Mélange » ne contient pas le mélange : ce sont des pommes. La boîte « Poires » ne contient ni poires ni pommes : c'est le mélange.",s:"Banque logique"},
{id:"lo2-137",t:"log",q:"Dans quel cas l'affirmation « S'il fait beau, je sors » est-elle fausse ?",o:["Il fait beau et je sors","Il ne fait pas beau et je sors","Il ne fait pas beau et je ne sors pas","Il fait beau et je ne sors pas"],a:3,e:"Une implication n'est fausse que lorsque la condition est remplie et que la conséquence n'a pas lieu.",s:"Banque logique"},
{id:"lo2-138",t:"log",q:"Un entier N compris entre 1 et 30 vérifie exactement trois des quatre affirmations suivantes : (1) N est pair ; (2) N est multiple de 7 ; (3) N est supérieur à 20 ; (4) N est un carré parfait. Que vaut N ?",o:["28","14","21","25"],a:0,e:"Aucun carré de 1 à 30 ne vérifie deux autres affirmations ; il faut donc (1), (2) et (3) : N pair, multiple de 7 et supérieur à 20, soit 28.",s:"Banque logique"},
// --- Classements et ordonnancement ---
{id:"lo2-139",t:"log",q:"Cinq coureurs. Bruno arrive juste après Alice ; David arrive avant Alice ; Chloé n'est ni première ni dernière ; Emma arrive après Chloé mais n'est pas dernière. Qui est arrivé 3e ?",o:["Alice","Emma","Chloé","David"],a:1,e:"Emma n'étant pas dernière, le dernier est Bruno (juste après Alice) ; on obtient David, Chloé, Emma, Alice, Bruno.",s:"Banque logique"},
{id:"lo2-140",t:"log",q:"Un immeuble de cinq étages compte un habitant par étage. Carl habite au 3e, Elie au 1er ; Ana habite plus haut que Ben ; Dora habite juste en dessous d'Ana. À quel étage habite Ben ?",o:["Au 4e","Au 5e","Au 2e","Au 3e"],a:2,e:"Restent les étages 2, 4 et 5 ; Dora juste sous Ana impose Ana au 5e et Dora au 4e : Ben est au 2e.",s:"Banque logique"},
{id:"lo2-141",t:"log",q:"Anne est plus âgée que Bruno mais plus jeune que Carla. Didier est plus âgé que Carla. Qui est le plus âgé ?",o:["Anne","Bruno","Carla","Didier"],a:3,e:"Du plus jeune au plus âgé : Bruno, Anne, Carla, Didier.",s:"Banque logique"},
{id:"lo2-142",t:"log",q:"Dans une file d'attente, Paul est le 7e en partant de l'avant et le 12e en partant de l'arrière. Combien de personnes compte la file ?",o:["18","17","19","20"],a:0,e:"7 + 12 − 1 = 18, car Paul est compté deux fois.",s:"Banque logique"},
{id:"lo2-143",t:"log",q:"A pèse plus que B ; C pèse moins que B ; D pèse plus que A. Quel est l'ordre du plus léger au plus lourd ?",o:["C, A, B, D","C, B, A, D","B, C, A, D","D, A, B, C"],a:1,e:"C < B < A < D.",s:"Banque logique"},
{id:"lo2-144",t:"log",q:"Cinq réunions R1 à R5 se tiennent du lundi au vendredi, une par jour. R1 a lieu mercredi ; R2 a lieu la veille de R4 ; R5 a lieu avant R3 ; R3 n'a pas lieu le vendredi. Quel jour a lieu R3 ?",o:["Lundi","Jeudi","Mardi","Vendredi"],a:2,e:"R2-R4 ne peuvent occuper que jeudi-vendredi (lundi-mardi ne laisserait rien à R5 avant R3) ; R5 lundi, R3 mardi.",s:"Banque logique"},
{id:"lo2-145",t:"log",q:"Dans une course, je double le deuxième. Quelle est alors ma place ?",o:["Premier","Troisième","Avant-dernier","Deuxième"],a:3,e:"Je prends la place de celui que je viens de doubler : la deuxième.",s:"Banque logique"},
{id:"lo2-146",t:"log",q:"Dans une course à cinq, Ana termine devant Bob mais derrière Chloé ; Dan termine derrière Bob ; Eve termine entre Chloé et Ana. Qui termine 3e ?",o:["Ana","Eve","Bob","Chloé"],a:0,e:"Chloé, Eve, Ana, Bob, Dan.",s:"Banque logique"},
{id:"lo2-147",t:"log",q:"Ali, Béa, Cyril et Dina travaillent à l'accueil, au contrôle, au recouvrement et au cadastre (un par service). Ali n'est ni à l'accueil ni au cadastre ; Béa n'est ni au contrôle ni à l'accueil ; Cyril n'est ni au contrôle ni au recouvrement ; Dina n'est ni au cadastre, ni au recouvrement, ni au contrôle. Qui est au recouvrement ?",o:["Ali","Béa","Cyril","Dina"],a:1,e:"Dina est à l'accueil, donc Cyril au cadastre, Béa au recouvrement et Ali au contrôle.",s:"Banque logique"},
{id:"lo2-148",t:"log",q:"Léo, Mia, Noé et Zoé sont assis sur un banc de quatre places. Noé n'est à aucune extrémité ; Mia est à la droite de Léo (pas forcément à côté) ; Zoé est à côté de Léo mais pas à l'extrémité gauche. Qui est en 2e position en partant de la gauche ?",o:["Léo","Mia","Noé","Zoé"],a:3,e:"Seul ordre possible de gauche à droite : Léo, Zoé, Noé, Mia.",s:"Banque logique"},
// --- Problèmes arithmétiques ---
{id:"lo2-149",t:"log",q:"Une mère a 36 ans et sa fille 12 ans. Il y a combien d'années la mère avait-elle cinq fois l'âge de sa fille ?",o:["4","5","6","8"],a:2,e:"36 − x = 5 (12 − x) donne 4x = 24, soit x = 6 (elles avaient alors 30 ans et 6 ans).",s:"Banque logique"},
{id:"lo2-150",t:"log",q:"Dans 6 ans, Léo aura le triple de l'âge qu'il avait il y a 6 ans. Quel âge a-t-il ?",o:["9","15","18","12"],a:3,e:"x + 6 = 3 (x − 6) donne 2x = 24, soit x = 12.",s:"Banque logique"},
{id:"lo2-151",t:"log",q:"J'ai le double de l'âge que tu avais quand j'avais l'âge que tu as. Quand tu auras mon âge, la somme de nos âges sera de 63 ans. Quel âge ai-je ?",o:["28","21","24","32"],a:0,e:"Avec x (moi) et y (toi) : x = 2 (2y − x), soit 3x = 4y ; puis x + (2x − y) = 63. D'où x = 28 et y = 21.",s:"Banque logique"},
{id:"lo2-152",t:"log",q:"On partage 360 € entre trois personnes proportionnellement à 2, 3 et 4. Quel est le montant de la plus grosse part ?",o:["120 €","160 €","140 €","180 €"],a:1,e:"9 parts au total : 360 / 9 = 40 € la part ; 4 × 40 = 160 €.",s:"Banque logique"},
{id:"lo2-153",t:"log",q:"Un héritage est partagé ainsi : la moitié à l'aîné, le tiers au cadet, et le reste, soit 8 000 €, au benjamin. Quel est le montant de l'héritage ?",o:["40 000 €","56 000 €","48 000 €","64 000 €"],a:2,e:"Le benjamin reçoit 1 − 1/2 − 1/3 = 1/6 du total : 6 × 8 000 = 48 000 €.",s:"Banque logique"},
{id:"lo2-154",t:"log",q:"Un robinet remplit une cuve en 4 h ; une vidange ouverte la vide en 6 h. Les deux étant ouverts, en combien de temps la cuve vide se remplit-elle ?",o:["2 h","5 h","10 h","12 h"],a:3,e:"1/4 − 1/6 = 1/12 de cuve par heure : 12 heures.",s:"Banque logique"},
{id:"lo2-155",t:"log",q:"A fait seul un travail en 10 jours, B le fait seul en 15 jours. Ensemble, en combien de jours le font-ils ?",o:["6","5","12,5","25"],a:0,e:"1/10 + 1/15 = 1/6 du travail par jour : 6 jours.",s:"Banque logique"},
{id:"lo2-156",t:"log",q:"6 ouvriers fabriquent 6 tables en 6 jours. Combien de tables 12 ouvriers fabriquent-ils en 12 jours, au même rythme ?",o:["12","24","18","48"],a:1,e:"Un ouvrier fait une table en 6 jours ; 12 ouvriers pendant 12 jours : 12 × 12 / 6 = 24 tables.",s:"Banque logique"},
{id:"lo2-157",t:"log",q:"12 personnes doivent achever un chantier en 20 jours. Au bout de 5 jours, 3 personnes partent. Combien de jours faut-il au total pour achever le chantier ?",o:["20","23","25","27"],a:2,e:"Travail : 240 jours-personne ; 60 sont faits ; restent 180 pour 9 personnes, soit 20 jours : 5 + 20 = 25 jours.",s:"Banque logique"},
{id:"lo2-158",t:"log",q:"Un trajet se fait à 60 km/h à l'aller et à 40 km/h au retour, sur la même distance. Quelle est la vitesse moyenne sur l'aller-retour ?",o:["45 km/h","50 km/h","52 km/h","48 km/h"],a:3,e:"Sur 120 km : 2 h à l'aller, 3 h au retour ; 240 km en 5 h = 48 km/h (et non 50).",s:"Banque logique"},
{id:"lo2-159",t:"log",q:"Deux trains partent au même moment de deux villes distantes de 300 km et roulent l'un vers l'autre, à 80 km/h et à 120 km/h. Au bout de combien de temps se croisent-ils ?",o:["1 h 30","1 h 15","1 h 45","2 h 30"],a:0,e:"Ils se rapprochent à 80 + 120 = 200 km/h : 300 / 200 = 1,5 h, soit 1 h 30.",s:"Banque logique"},
{id:"lo2-160",t:"log",q:"Un cycliste part à 9 h à 20 km/h. Une voiture part du même point à 10 h, sur la même route, à 60 km/h. À quelle heure le rattrape-t-elle ?",o:["10 h 20","10 h 30","10 h 40","11 h"],a:1,e:"À 10 h, le cycliste a 20 km d'avance ; la voiture regagne 40 km par heure : 20 / 40 = 0,5 h, soit 10 h 30.",s:"Banque logique"},
{id:"lo2-161",t:"log",q:"Un train de 200 m roule à 72 km/h et traverse un tunnel de 1 km. Combien de temps s'écoule entre l'entrée de la locomotive et la sortie du dernier wagon ?",o:["50 s","55 s","60 s","70 s"],a:2,e:"72 km/h = 20 m/s ; il faut parcourir 1 000 + 200 = 1 200 m, soit 60 s.",s:"Banque logique"},
{id:"lo2-162",t:"log",q:"Après une baisse de 20 %, de quel pourcentage un prix doit-il augmenter pour revenir à sa valeur initiale ?",o:["20 %","22,5 %","30 %","25 %"],a:3,e:"Il faut multiplier par 1 / 0,8 = 1,25, soit une hausse de 25 %.",s:"Banque logique"},
{id:"lo2-163",t:"log",q:"Un article coûte 120 € TTC, avec une TVA de 20 %. Quel est son prix hors taxe ?",o:["100 €","96 €","104 €","110 €"],a:0,e:"HT = 120 / 1,2 = 100 € (et non 120 × 0,8 = 96 €).",s:"Banque logique"},
{id:"lo2-164",t:"log",q:"Un prix subit trois hausses successives de 10 %. Quelle est sa hausse totale ?",o:["30 %","33,1 %","31 %","33 %"],a:1,e:"1,1 × 1,1 × 1,1 = 1,331, soit + 33,1 %.",s:"Banque logique"},
{id:"lo2-165",t:"log",q:"Un article à 200 € bénéficie d'une remise de 10 %, puis d'une remise supplémentaire de 5 % sur le prix remisé. Quel est le prix final ?",o:["170 €","172 €","171 €","175 €"],a:2,e:"200 × 0,9 × 0,95 = 171 € : des remises successives ne s'additionnent pas.",s:"Banque logique"},
{id:"lo2-166",t:"log",q:"Après une augmentation de 25 %, un salaire atteint 2 500 €. Quel était le salaire initial ?",o:["1 875 €","2 025 €","2 250 €","2 000 €"],a:3,e:"2 500 / 1,25 = 2 000 € (et non 2 500 × 0,75 = 1 875 €).",s:"Banque logique"},
{id:"lo2-167",t:"log",q:"On mélange 2 L de jus contenant 10 % de sucre avec 3 L de jus contenant 20 % de sucre. Quel est le taux de sucre du mélange ?",o:["16 %","14 %","15 %","18 %"],a:0,e:"Sucre : 0,2 + 0,6 = 0,8 L pour 5 L de mélange, soit 16 %.",s:"Banque logique"},
{id:"lo2-168",t:"log",q:"Combien de litres d'eau faut-il ajouter à 10 L d'une solution salée à 30 % pour obtenir une solution à 20 % ?",o:["2 L","5 L","10 L","15 L"],a:1,e:"La solution contient 3 L de sel ; 3 / (10 + x) = 0,2 donne 10 + x = 15, soit x = 5 L.",s:"Banque logique"},
{id:"lo2-169",t:"log",q:"Un café coûte 12 € le kilo, un autre 18 € le kilo. Dans quelles proportions faut-il les mélanger pour obtenir un café à 14 € le kilo ?",o:["1/3 de café à 12 € et 2/3 à 18 €","Moitié-moitié","2/3 de café à 12 € et 1/3 à 18 €","3/4 de café à 12 € et 1/4 à 18 €"],a:2,e:"12x + 18 (1 − x) = 14 donne 6x = 4, soit x = 2/3 de café à 12 €.",s:"Banque logique"},
{id:"lo2-170",t:"log",q:"Dans une basse-cour, on compte 20 têtes et 56 pattes, uniquement des poules et des lapins. Combien y a-t-il de lapins ?",o:["6","10","12","8"],a:3,e:"Si tous étaient des poules : 40 pattes ; les 16 pattes en plus, à raison de 2 par lapin, donnent 8 lapins.",s:"Banque logique"},
{id:"lo2-171",t:"log",q:"Un escargot grimpe un mur de 10 m : il monte de 3 m le jour et glisse de 2 m la nuit. Au cours de quel jour atteint-il le sommet ?",o:["Le 8e","Le 7e","Le 9e","Le 10e"],a:0,e:"Au matin du 8e jour, il est à 7 m ; il monte de 3 m dans la journée et atteint 10 m.",s:"Banque logique"},
{id:"lo2-172",t:"log",q:"Une bouteille et son bouchon coûtent 1,10 € ; la bouteille coûte 1 € de plus que le bouchon. Combien coûte le bouchon ?",o:["0,10 €","0,05 €","0,15 €","1,00 €"],a:1,e:"b + (b + 1) = 1,10 donne 2b = 0,10 : le bouchon coûte 0,05 €.",s:"Banque logique"},
{id:"lo2-173",t:"log",q:"Il faut 5 minutes pour scier une bûche en 2 morceaux. Combien de temps faut-il pour la scier en 5 morceaux ?",o:["25 min","15 min","20 min","30 min"],a:2,e:"5 morceaux exigent 4 coupes : 4 × 5 = 20 minutes.",s:"Banque logique"},
{id:"lo2-174",t:"log",q:"La moyenne de 4 notes est 12. Quelle 5e note faut-il obtenir pour que la moyenne passe à 13 ?",o:["13","15","16","17"],a:3,e:"Total visé : 5 × 13 = 65 ; total acquis : 4 × 12 = 48 ; il faut 17.",s:"Banque logique"},
// --- Intrus ---
{id:"lo2-175",t:"log",q:"Trouvez l'intrus : 2 – 4 – 8 – 14 – 16 – 32",o:["14","8","16","32"],a:0,e:"Tous sont des puissances de 2, sauf 14.",s:"Banque logique"},
{id:"lo2-176",t:"log",q:"Trouvez l'intrus : 8 – 27 – 64 – 100 – 125",o:["27","100","64","125"],a:1,e:"Tous sont des cubes (2³, 3³, 4³, 5³), sauf 100.",s:"Banque logique"},
{id:"lo2-177",t:"log",q:"Trouvez l'intrus : 24 – 36 – 48 – 54 – 60 – 72",o:["36","48","54","60"],a:2,e:"Tous sont des multiples de 12, sauf 54.",s:"Banque logique"},
{id:"lo2-178",t:"log",q:"Trouvez l'intrus : 3 – 7 – 15 – 31 – 62 – 127",o:["7","31","127","62"],a:3,e:"Chaque terme devrait valoir le double du précédent plus 1 (puissances de 2 moins 1) : on attend 63, pas 62.",s:"Banque logique"},
{id:"lo2-179",t:"log",q:"Trouvez l'intrus : Sénat – Assemblée nationale – Conseil constitutionnel – Parlement européen",o:["Conseil constitutionnel","Sénat","Assemblée nationale","Parlement européen"],a:0,e:"Les trois autres sont des assemblées parlementaires ; le Conseil constitutionnel est une juridiction.",s:"Banque logique"},
{id:"lo2-180",t:"log",q:"Trouvez l'intrus : TVA – Accises – Droits de douane – Impôt sur les sociétés",o:["TVA","Impôt sur les sociétés","Accises","Droits de douane"],a:1,e:"L'impôt sur les sociétés est un impôt direct ; la TVA, les accises et les droits de douane sont des impôts indirects.",s:"Banque logique"},
{id:"lo2-181",t:"log",q:"Trouvez l'intrus : Mercure – Vénus – Lune – Mars",o:["Mercure","Vénus","Lune","Mars"],a:2,e:"La Lune est un satellite naturel ; les trois autres sont des planètes.",s:"Banque logique"},
{id:"lo2-182",t:"log",q:"Trouvez l'intrus : Commune – Département – Canton – Région",o:["Commune","Département","Région","Canton"],a:3,e:"Commune, département et région sont des collectivités territoriales ; le canton n'est qu'une circonscription électorale.",s:"Banque logique"},
{id:"lo2-183",t:"log",q:"Trouvez l'intrus : Octet – Kilooctet – Mégahertz – Gigaoctet",o:["Mégahertz","Octet","Kilooctet","Gigaoctet"],a:0,e:"Le mégahertz mesure une fréquence ; les autres mesurent une quantité d'information.",s:"Banque logique"},
{id:"lo2-184",t:"log",q:"Trouvez l'intrus : AIMER – MARIE – MAIRE – MAIRIE – RAMIE",o:["AIMER","MAIRIE","MAIRE","RAMIE"],a:1,e:"AIMER, MARIE, MAIRE et RAMIE sont des anagrammes (A, E, I, M, R) ; MAIRIE a une lettre de plus.",s:"Banque logique"},
// --- Analogies ---
{id:"lo2-185",t:"log",q:"Pied est à chaussure ce que main est à :",o:["Bague","Bras","Gant","Doigt"],a:2,e:"La chaussure habille le pied comme le gant habille la main.",s:"Banque logique"},
{id:"lo2-186",t:"log",q:"2 est à 8 ce que 3 est à 27. De même, 4 est à :",o:["16","48","81","64"],a:3,e:"On élève au cube : 2³ = 8, 3³ = 27, 4³ = 64.",s:"Banque logique"},
{id:"lo2-187",t:"log",q:"Livre est à bibliothèque ce que tableau est à :",o:["Musée","Peintre","Cadre","Toile"],a:0,e:"C'est le lieu où l'on conserve et présente l'objet.",s:"Banque logique"},
{id:"lo2-188",t:"log",q:"ABC est à DEF ce que MNO est à :",o:["NOP","PQR","OPQ","QRS"],a:1,e:"On avance de trois lettres : M → P, N → Q, O → R.",s:"Banque logique"},
{id:"lo2-189",t:"log",q:"BD est à FH ce que JL est à :",o:["MO","NO","NP","OQ"],a:2,e:"On avance de quatre lettres : J → N, L → P.",s:"Banque logique"},
{id:"lo2-190",t:"log",q:"Commune est à maire ce que département est à :",o:["Préfet","Sous-préfet","Conseiller régional","Président du conseil départemental"],a:3,e:"L'exécutif élu de la commune est le maire ; celui du département est le président du conseil départemental (le préfet représente l'État).",s:"Banque logique"},
{id:"lo2-191",t:"log",q:"Lundi est à mercredi ce que jeudi est à :",o:["Samedi","Vendredi","Dimanche","Mardi"],a:0,e:"On avance de deux jours.",s:"Banque logique"},
{id:"lo2-192",t:"log",q:"Décret est à pouvoir exécutif ce que loi est à :",o:["Pouvoir judiciaire","Pouvoir législatif","Conseil constitutionnel","Conseil d'État"],a:1,e:"Le décret est un acte du pouvoir exécutif ; la loi est votée par le Parlement, qui exerce le pouvoir législatif.",s:"Banque logique"},
{id:"lo2-193",t:"log",q:"Cause est à effet ce que prémisse est à :",o:["Hypothèse","Raisonnement","Conclusion","Preuve"],a:2,e:"La prémisse précède et fonde la conclusion, comme la cause produit l'effet.",s:"Banque logique"},
// --- Tableaux de nombres décrits en texte ---
{id:"lo2-194",t:"log",q:"Tableau de nombres. Ligne 1 : 2, 4, 6. Ligne 2 : 3, 6, 9. Ligne 3 : 4, 8, ?. Quel nombre manque ?",o:["10","14","16","12"],a:3,e:"Chaque ligne donne le premier nombre multiplié par 1, 2 puis 3 : 4 × 3 = 12.",s:"Banque logique"},
{id:"lo2-195",t:"log",q:"Tableau de nombres. Ligne 1 : 3, 5, 8. Ligne 2 : 4, 7, 11. Ligne 3 : 6, 9, ?. Quel nombre manque ?",o:["15","12","13","18"],a:0,e:"Le 3e nombre de chaque ligne est la somme des deux premiers : 6 + 9 = 15.",s:"Banque logique"},
{id:"lo2-196",t:"log",q:"Tableau de nombres. Ligne 1 : 2, 3, 6. Ligne 2 : 4, 5, 20. Ligne 3 : 7, 3, ?. Quel nombre manque ?",o:["10","21","14","24"],a:1,e:"Le 3e nombre de chaque ligne est le produit des deux premiers : 7 × 3 = 21.",s:"Banque logique"},
{id:"lo2-197",t:"log",q:"Tableau de nombres. Ligne 1 : 5, 3, 16. Ligne 2 : 6, 2, 16. Ligne 3 : 7, 4, ?. Quel nombre manque ?",o:["24","28","22","33"],a:2,e:"Le 3e nombre vaut le double de la somme des deux premiers : (7 + 4) × 2 = 22.",s:"Banque logique"},
{id:"lo2-198",t:"log",q:"Tableau de nombres. Ligne 1 : 8, 2, 4. Ligne 2 : 15, 3, 5. Ligne 3 : 24, 6, ?. Quel nombre manque ?",o:["3","6","18","4"],a:3,e:"Le 3e nombre est le quotient des deux premiers : 24 / 6 = 4.",s:"Banque logique"},
{id:"lo2-199",t:"log",q:"Tableau de nombres. Colonne 1 : 1, 2, 3. Colonne 2 : 1, 4, 9. Colonne 3 : 1, 8, ?. Quel nombre manque ?",o:["27","12","16","24"],a:0,e:"La colonne 2 contient les carrés de la colonne 1, la colonne 3 les cubes : 3³ = 27.",s:"Banque logique"},
{id:"lo2-200",t:"log",q:"Tableau de nombres. Ligne 1 : 3, 4, 25. Ligne 2 : 5, 12, 169. Ligne 3 : 6, 8, ?. Quel nombre manque ?",o:["48","100","64","196"],a:1,e:"Le 3e nombre est la somme des carrés des deux premiers : 36 + 64 = 100.",s:"Banque logique"},
{id:"lo2-201",t:"log",q:"Tableau de nombres. Ligne 1 : 2, 5, 12. Ligne 2 : 3, 4, 15. Ligne 3 : 6, 2, ?. Quel nombre manque ?",o:["12","14","18","20"],a:2,e:"Le 3e nombre vaut a × b + a : 2 × 5 + 2 = 12, 3 × 4 + 3 = 15, 6 × 2 + 6 = 18.",s:"Banque logique"},
{id:"lo2-202",t:"log",q:"Carré magique de 3 × 3 (même somme sur chaque ligne, colonne et diagonale). Ligne 1 : 2, 7, 6. Ligne 2 : 9, 5, 1. Ligne 3 : 4, ?, 8. Quel nombre manque ?",o:["5","10","13","3"],a:3,e:"La somme magique est 2 + 7 + 6 = 15 : 15 − 4 − 8 = 3 (et 7 + 5 + 3 = 15 dans la colonne).",s:"Banque logique"},
{id:"lo2-203",t:"log",q:"Pyramide de nombres : la base est 3, 5, 2, 6, et chaque case vaut la somme des deux cases sur lesquelles elle repose. Quel nombre figure au sommet ?",o:["30","26","28","32"],a:0,e:"Étage 2 : 8, 7, 8 ; étage 3 : 15, 15 ; sommet : 30.",s:"Banque logique"},
// --- Conversions et unités ---
{id:"lo2-204",t:"log",q:"Combien de secondes compte une journée ?",o:["3 600","86 400","36 000","864 000"],a:1,e:"24 × 60 × 60 = 86 400 secondes.",s:"Banque logique"},
{id:"lo2-205",t:"log",q:"À quelle durée correspondent 2,75 heures ?",o:["2 h 7 min","2 h 34 min","2 h 45 min","3 h 15 min"],a:2,e:"0,75 h × 60 = 45 min : 2 h 45 min.",s:"Banque logique"},
{id:"lo2-206",t:"log",q:"Une vitesse de 36 km/h correspond à combien de mètres par seconde ?",o:["3,6 m/s","36 m/s","100 m/s","10 m/s"],a:3,e:"36 000 m en 3 600 s : 10 m/s (on divise les km/h par 3,6).",s:"Banque logique"},
{id:"lo2-207",t:"log",q:"Un terrain rectangulaire mesure 250 m sur 80 m. Quelle est sa surface en hectares ?",o:["2 ha","0,2 ha","20 ha","200 ha"],a:0,e:"250 × 80 = 20 000 m² ; 1 ha = 10 000 m², soit 2 ha.",s:"Banque logique"},
{id:"lo2-208",t:"log",q:"Combien de minutes compte une semaine ?",o:["1 440","10 080","8 640","100 800"],a:1,e:"7 × 24 × 60 = 10 080 minutes.",s:"Banque logique"},
{id:"lo2-209",t:"log",q:"Un robinet débite 12 litres par minute. Combien de temps faut-il pour remplir une cuve de 1,5 m³ ?",o:["1 h 25","2 h 15","2 h 05","12 h 30"],a:2,e:"1,5 m³ = 1 500 L ; 1 500 / 12 = 125 minutes, soit 2 h 05.",s:"Banque logique"},
{id:"lo2-210",t:"log",q:"Sur une carte à l'échelle 1/50 000, quelle distance réelle représentent 6 cm ?",o:["300 m","30 km","300 km","3 km"],a:3,e:"6 cm × 50 000 = 300 000 cm = 3 km.",s:"Banque logique"},
{id:"lo2-211",t:"log",q:"Une connexion offre un débit de 100 Mbit/s. Combien de mégaoctets peut-elle transférer, au mieux, en une seconde ?",o:["12,5 Mo","8 Mo","100 Mo","800 Mo"],a:0,e:"1 octet = 8 bits : 100 / 8 = 12,5 Mo par seconde.",s:"Banque logique"}
);

// Banque anglais (niveau B1 du CECRL) : temps, for/since, prépositions, modaux, conditionnels,
// passif, discours indirect, gérondif/infinitif, comparatifs, quantifieurs, articles, relatifs,
// question tags, phrasal verbs, verbes irréguliers, orthographe, faux amis, vocabulaire des
// finances publiques, de la fiscalité et de la comptabilité, traduction de phrases courtes.
BANK.push(
// --- Temps : présent, prétérit, present perfect, past perfect, futur ---
{id:"an2-001",t:"ang",q:"Complete: « Water … at 100 degrees Celsius. »",o:["is boiling","boiled","has boiled","boils"],a:3,e:"Present simple pour une vérité générale ou un fait scientifique.",s:"Banque anglais"},
{id:"an2-002",t:"ang",q:"Complete: « She usually … to work by bus, but today she … . »",o:["goes / is walking","is going / walks","goes / walking","go / is walking"],a:0,e:"Habitude (usually) : present simple ; action propre au moment présent (today) : present continuous.",s:"Banque anglais"},
{id:"an2-003",t:"ang",q:"Which sentence is correct?",o:["I am knowing the answer.","I knowing the answer.","I know the answer.","I am know the answer."],a:2,e:"Les verbes d'état (know, believe, understand, need, want) ne s'emploient normalement pas à la forme en -ing.",s:"Banque anglais"},
{id:"an2-004",t:"ang",q:"Complete: « I … him since we left university. »",o:["didn't see","haven't seen","don't see","wasn't seeing"],a:1,e:"Since + point de départ : present perfect, car la période se prolonge jusqu'à maintenant.",s:"Banque anglais"},
{id:"an2-005",t:"ang",q:"Complete: « She … for the ministry for ten years, and she still works there. »",o:["worked","works","had worked","has worked"],a:3,e:"Action commencée dans le passé et qui dure encore : present perfect + for. Le prétérit « worked » signifierait qu'elle n'y travaille plus.",s:"Banque anglais"},
{id:"an2-006",t:"ang",q:"Complete: « How long … English? – For three years now. »",o:["are you learning","do you learn","have you been learning","were you learning"],a:2,e:"How long + action qui dure encore : present perfect continuous (have been + -ing).",s:"Banque anglais"},
{id:"an2-007",t:"ang",q:"Complete: « I'm exhausted because I … all day. »",o:["have been work","have been working","had been working","am worked"],a:1,e:"Present perfect continuous : activité prolongée, qui vient de s'achever ou dure encore, dont on voit le résultat (la fatigue).",s:"Banque anglais"},
{id:"an2-008",t:"ang",q:"Complete: « When I arrived at the station, the train … already … . »",o:["had / left","has / left","is / leaving","did / leave"],a:0,e:"Past perfect (had + participe passé) : action antérieure à une autre action passée (arrived).",s:"Banque anglais"},
{id:"an2-009",t:"ang",q:"Which sentence is correct?",o:["I have seen her yesterday.","I saw her yesterday.","I have saw her yesterday.","I seen her yesterday."],a:1,e:"Avec un repère passé révolu (yesterday, last week, in 2020, ago), on emploie le prétérit, jamais le present perfect.",s:"Banque anglais"},
{id:"an2-010",t:"ang",q:"Complete: « While I … dinner, the phone rang. »",o:["were cooking","am cooking","was cooking","have cooked"],a:2,e:"Past continuous (was / were + -ing) pour l'action en cours, interrompue par une action brève au prétérit (rang). Avec I : was.",s:"Banque anglais"},
{id:"an2-011",t:"ang",q:"Complete: « Look at those dark clouds! It … rain. »",o:["goes to","is raining to","going to","is going to"],a:3,e:"Be going to : prédiction fondée sur un indice visible dans le présent (les nuages).",s:"Banque anglais"},
{id:"an2-012",t:"ang",q:"Complete: « I … my dentist at 4 pm tomorrow: the appointment is booked. »",o:["am seeing","saw","have seen","had seen"],a:0,e:"Present continuous à valeur de futur : rendez-vous ou arrangement déjà fixé.",s:"Banque anglais"},
{id:"an2-013",t:"ang",q:"Complete: « The train to Lyon … at 7.45 tomorrow morning, according to the timetable. »",o:["left","has left","leaves","had left"],a:2,e:"Present simple à valeur de futur pour un horaire officiel (timetable, programme).",s:"Banque anglais"},
{id:"an2-014",t:"ang",q:"Complete: « It's cold in here. – Wait, I … the window. »",o:["closed","will close","have closed","had closed"],a:1,e:"Will : décision prise au moment où l'on parle (offre spontanée).",s:"Banque anglais"},
{id:"an2-015",t:"ang",q:"Complete: « This is the first time I … to Ireland. »",o:["go","went","had been","have been"],a:3,e:"This is the first time + present perfect (et non le présent comme en français : « c'est la première fois que je vais… »).",s:"Banque anglais"},
{id:"an2-016",t:"ang",q:"Complete: « What … at the moment? – I'm reading the new circular. »",o:["are you doing","do you do","did you do","have you done"],a:0,e:"At the moment : present continuous. « What do you do? » demande la profession.",s:"Banque anglais"},
// --- For, since, during, while, by, until ---
{id:"an2-017",t:"ang",q:"Complete: « I fell asleep … the film. »",o:["for","since","during","while"],a:2,e:"During + nom (pendant un événement) ; while + sujet + verbe ; for + durée.",s:"Banque anglais"},
{id:"an2-018",t:"ang",q:"Complete: « I met him … I was living in London. »",o:["during","for","since","while"],a:3,e:"While + proposition (sujet + verbe) ; during + nom (during my stay).",s:"Banque anglais"},
{id:"an2-019",t:"ang",q:"Complete: « The tax office will be closed … three weeks in August. »",o:["for","since","during","ago"],a:0,e:"For + durée (combien de temps ?) ; during répond à « quand ? » (during August).",s:"Banque anglais"},
{id:"an2-020",t:"ang",q:"What's the English for: « Il travaille ici depuis trois mois. »",o:["He works here since three months.","He has worked here for three months.","He has worked here since three months.","He works here for three months."],a:1,e:"« Depuis » + durée : present perfect + for. Since s'emploie avec un point de départ (since March).",s:"Banque anglais"},
{id:"an2-021",t:"ang",q:"Complete: « Your tax return must be filed … 31 May at the latest. »",o:["until","since","by","in"],a:2,e:"By = au plus tard (échéance) ; until = jusqu'à (action ou état qui se prolonge jusqu'à ce moment).",s:"Banque anglais"},
{id:"an2-022",t:"ang",q:"Complete: « The office stays open … 6 pm, then it closes. »",o:["by","until","since","for"],a:1,e:"Until = jusqu'à (l'état se prolonge jusqu'à ce moment) ; by = au plus tard.",s:"Banque anglais"},
// --- Prépositions de temps et de lieu ---
{id:"an2-023",t:"ang",q:"Complete: « She lives … Paris. »",o:["in","at","on","to"],a:0,e:"In + ville, pays, région ; at + lieu précis (at the station, at the bus stop).",s:"Banque anglais"},
{id:"an2-024",t:"ang",q:"Complete: « Let's meet … the bus stop. »",o:["in","on","to","at"],a:3,e:"At : point précis, lieu de rendez-vous (at the bus stop, at the station).",s:"Banque anglais"},
{id:"an2-025",t:"ang",q:"Complete: « Her birthday is … 14 July. »",o:["in","at","on","by"],a:2,e:"On + date ou jour ; in + mois, année, saison ; at + heure.",s:"Banque anglais"},
{id:"an2-026",t:"ang",q:"Complete: « Owls hunt … night. »",o:["at","in","on","during"],a:0,e:"At night (sans article), mais in the morning, in the afternoon, in the evening.",s:"Banque anglais"},
{id:"an2-027",t:"ang",q:"Complete: « I'm not very good … cooking. »",o:["in","on","for","at"],a:3,e:"Good at / bad at + activité ou domaine.",s:"Banque anglais"},
{id:"an2-028",t:"ang",q:"Complete: « The price depends … the quantity ordered. »",o:["of","on","from","at"],a:1,e:"Depend on (et non « of ») : dépendre de.",s:"Banque anglais"},
{id:"an2-029",t:"ang",q:"Complete: « We arrived … the airport two hours before the flight. »",o:["to","on","by","at"],a:3,e:"Arrive at + lieu précis (station, airport) ; arrive in + ville ou pays ; jamais « arrive to ».",s:"Banque anglais"},
{id:"an2-030",t:"ang",q:"Complete: « She is married … a tax lawyer. »",o:["with","at","to","by"],a:2,e:"Be married to somebody (et non « with »).",s:"Banque anglais"},
{id:"an2-031",t:"ang",q:"Complete: « She goes to work … foot, but her husband goes … car. »",o:["by / on","on / by","on / in","by / by"],a:1,e:"On foot, mais by car, by bus, by train (sans article).",s:"Banque anglais"},
// --- Modaux ---
{id:"an2-032",t:"ang",q:"Complete: « You … smoke in the office: it is strictly forbidden. »",o:["mustn't","needn't","don't have to","can"],a:0,e:"Mustn't = interdiction ; needn't et don't have to = absence d'obligation.",s:"Banque anglais"},
{id:"an2-033",t:"ang",q:"Complete: « You … bring your passport: your identity card is enough. »",o:["mustn't","can't","needn't","shouldn't to"],a:2,e:"Needn't = ce n'est pas nécessaire ; mustn't exprimerait une interdiction.",s:"Banque anglais"},
{id:"an2-034",t:"ang",q:"Complete: « When I was younger, I … run for an hour without stopping. »",o:["can","must","may","could"],a:3,e:"Could : capacité dans le passé (prétérit de can).",s:"Banque anglais"},
{id:"an2-035",t:"ang",q:"Complete: « You look tired. You … go to bed earlier. »",o:["must to","should","ought","would"],a:1,e:"Should + base verbale : conseil. Ought est toujours suivi de to (you ought to go).",s:"Banque anglais"},
{id:"an2-036",t:"ang",q:"Complete: « Her car is in front of the house, so she … be at home. »",o:["must","can't","needn't","mustn't"],a:0,e:"Must : déduction quasi certaine ; can't : impossibilité logique.",s:"Banque anglais"},
{id:"an2-037",t:"ang",q:"Complete: « He … be the thief: he was with me all evening. »",o:["must","should","has to","can't"],a:3,e:"Can't : déduction négative (c'est impossible). Le contraire de must (déduction) est can't, pas mustn't.",s:"Banque anglais"},
{id:"an2-038",t:"ang",q:"Which sentence is a polite request for permission?",o:["May I leave early today?","Must I leave early today?","Should I leave early today?","Will I leave early today?"],a:0,e:"May I… ? (ou Could I… ? / Can I… ?) : demander la permission. Must = obligation, should = conseil.",s:"Banque anglais"},
{id:"an2-039",t:"ang",q:"Complete: « Take an umbrella: it … rain later, you never know. »",o:["must","might","has to","should to"],a:1,e:"Might : simple possibilité (peut-être). Must exprimerait une certitude ; should n'est jamais suivi de to.",s:"Banque anglais"},
{id:"an2-040",t:"ang",q:"Complete: « Yesterday I … work late because of the audit. »",o:["must","have to","had to","musted"],a:2,e:"Must n'a pas de prétérit : on emploie had to pour une obligation passée.",s:"Banque anglais"},
{id:"an2-041",t:"ang",q:"Complete: « You … have told me! I would have helped you. »",o:["must","can","should","will"],a:2,e:"Should have + participe passé : reproche ou regret (tu aurais dû).",s:"Banque anglais"},
{id:"an2-042",t:"ang",q:"Complete: « I'm sorry, I … come to the meeting tomorrow: I'll be on holiday. »",o:["won't be able to","won't can","can't to","don't can"],a:0,e:"Can n'a pas de futur : on emploie will be able to (won't be able to à la forme négative).",s:"Banque anglais"},
// --- Conditionnels ---
{id:"an2-043",t:"ang",q:"Complete: « If you heat ice, it … . »",o:["would melt","melted","had melted","melts"],a:3,e:"Conditionnel zéro (vérité générale) : if + présent, présent.",s:"Banque anglais"},
{id:"an2-044",t:"ang",q:"Complete: « If I had known about the meeting, I … it. »",o:["will attend","would have attended","attended","would attended"],a:1,e:"Conditionnel 3 (irréel du passé) : if + past perfect, would have + participe passé.",s:"Banque anglais"},
{id:"an2-045",t:"ang",q:"Complete: « If she … harder, she would have passed the exam. »",o:["studied","has studied","had studied","would study"],a:2,e:"Conditionnel 3 : if + past perfect (had + participe passé). Pas de would dans la subordonnée en if.",s:"Banque anglais"},
{id:"an2-046",t:"ang",q:"Complete: « Unless you hurry, you … the train. »",o:["will miss","would have missed","would miss","missed"],a:0,e:"Unless = if… not (à moins que) : même construction que le conditionnel 1 (présent, puis will).",s:"Banque anglais"},
{id:"an2-047",t:"ang",q:"Complete: « We will start the meeting as soon as the director … . »",o:["will arrive","arrives","arrived","would arrive"],a:1,e:"Après when, as soon as, before, until à sens futur, on emploie le présent simple, jamais will.",s:"Banque anglais"},
{id:"an2-048",t:"ang",q:"Complete: « What would you do if you … the lottery? »",o:["win","will win","would win","won"],a:3,e:"Conditionnel 2 (hypothèse) : if + prétérit, would + base verbale.",s:"Banque anglais"},
{id:"an2-049",t:"ang",q:"Complete: « I wish I … more free time. »",o:["had","have","will have","would have"],a:0,e:"Wish + prétérit : regret portant sur le présent (j'aimerais avoir).",s:"Banque anglais"},
// --- Voix passive ---
{id:"an2-050",t:"ang",q:"Complete: « English … in many countries around the world. »",o:["speaks","is speaking","has spoken","is spoken"],a:3,e:"Voix passive au présent : be + participe passé (is spoken).",s:"Banque anglais"},
{id:"an2-051",t:"ang",q:"Complete: « A new tax office … in our town next year. »",o:["will build","is building","will be built","builds"],a:2,e:"Passif au futur : will be + participe passé.",s:"Banque anglais"},
{id:"an2-052",t:"ang",q:"Complete: « The suspect … by the police at the moment. »",o:["is questioned","is being questioned","has questioned","questions"],a:1,e:"Passif progressif : be being + participe passé pour une action en cours (at the moment).",s:"Banque anglais"},
{id:"an2-053",t:"ang",q:"Complete: « The accounts … by an independent auditor every year. »",o:["are checked","check","are checking","have checked"],a:0,e:"Passif au présent simple (action habituelle) : are + participe passé ; by introduit l'agent.",s:"Banque anglais"},
{id:"an2-054",t:"ang",q:"Complete: « Three new inspectors … since January. »",o:["were recruited","have recruited","are recruited","have been recruited"],a:3,e:"Since impose le present perfect ; au passif : have been + participe passé.",s:"Banque anglais"},
{id:"an2-055",t:"ang",q:"What is the passive form of « Someone stole my wallet »?",o:["My wallet has stole.","My wallet was stolen.","My wallet stole.","My wallet was stealing."],a:1,e:"Passif du prétérit : was / were + participe passé (steal – stole – stolen).",s:"Banque anglais"},
// --- Discours indirect ---
{id:"an2-056",t:"ang",q:"On Monday, Paul said: « I will call you tomorrow. » On Friday, you report: « Paul said that he … »",o:["will call me tomorrow.","would call you tomorrow.","would call me the next day.","calls me the next day."],a:2,e:"Discours indirect au passé : will devient would, tomorrow devient the next day, et les pronoms s'adaptent (you → me).",s:"Banque anglais"},
{id:"an2-057",t:"ang",q:"Complete: « She asked me where … . »",o:["did I live","do I live","I lived","lived I"],a:2,e:"Question indirecte : ordre sujet + verbe, sans auxiliaire do.",s:"Banque anglais"},
{id:"an2-058",t:"ang",q:"Complete: « He asked me … I had finished the report. »",o:["that","if","what","did"],a:1,e:"Question fermée au discours indirect : if (ou whether) + sujet + verbe.",s:"Banque anglais"},
{id:"an2-059",t:"ang",q:"Complete: « The inspector told me … the documents by Monday. »",o:["send","sending","that send","to send"],a:3,e:"Ordre au discours indirect : tell somebody to + base verbale.",s:"Banque anglais"},
{id:"an2-060",t:"ang",q:"Complete: « He … me that he was leaving the department. »",o:["told","said","spoke","talked"],a:0,e:"Tell + personne (he told me that…) ; say s'emploie sans complément de personne direct (he said that…).",s:"Banque anglais"},
{id:"an2-061",t:"ang",q:"Complete: « She told me not … late. »",o:["be","being","to being","to be"],a:3,e:"Ordre négatif au discours indirect : tell somebody not to + base verbale.",s:"Banque anglais"},
// --- Gérondif ou infinitif ---
{id:"an2-062",t:"ang",q:"Complete: « I really enjoy … in the countryside. »",o:["to walk","walk","walking","to walking"],a:2,e:"Enjoy est suivi du gérondif (-ing), comme avoid, mind, finish, suggest.",s:"Banque anglais"},
{id:"an2-063",t:"ang",q:"Complete: « She decided … her job. »",o:["to leave","leaving","leave","left"],a:0,e:"Decide est suivi de to + base verbale, comme want, hope, refuse, agree.",s:"Banque anglais"},
{id:"an2-064",t:"ang",q:"Complete: « Remember … the door when you leave. »",o:["locking","to lock","lock","locked"],a:1,e:"Remember to do = penser à faire (action à venir) ; remember doing = se souvenir d'avoir fait.",s:"Banque anglais"},
{id:"an2-065",t:"ang",q:"Complete: « I remember … this man before: his face is familiar. »",o:["to meet","meeting","meet","to meeting"],a:1,e:"Remember + -ing = se souvenir d'avoir fait (action passée).",s:"Banque anglais"},
{id:"an2-066",t:"ang",q:"Complete: « He avoided … the journalist's question. »",o:["to answer","answer","answering","to answering"],a:2,e:"Avoid est toujours suivi du gérondif (-ing).",s:"Banque anglais"},
{id:"an2-067",t:"ang",q:"Complete: « I want you … this report by Friday. »",o:["finish","finishing","that you finish","to finish"],a:3,e:"Want + complément + to + base verbale ; on ne dit jamais « I want that you… ».",s:"Banque anglais"},
{id:"an2-068",t:"ang",q:"Complete: « She is used to … up early: she has done it for years. »",o:["getting","get","got","gets"],a:0,e:"Be used to + -ing = avoir l'habitude de ; used to + base verbale = habitude passée révolue.",s:"Banque anglais"},
{id:"an2-069",t:"ang",q:"Complete: « When I was a child, I … play football every Saturday. »",o:["was used to","use to","am used to","used to"],a:3,e:"Used to + base verbale : habitude passée qui n'existe plus.",s:"Banque anglais"},
{id:"an2-070",t:"ang",q:"Complete: « He suggested … to the cinema. »",o:["to go","go","going","went"],a:2,e:"Suggest + -ing (ou suggest that…), jamais suggest + to.",s:"Banque anglais"},
{id:"an2-071",t:"ang",q:"Complete: « My manager made me … the whole report again. »",o:["write","to write","writing","written"],a:0,e:"Make + complément + base verbale sans to (faire faire quelque chose à quelqu'un).",s:"Banque anglais"},
{id:"an2-072",t:"ang",q:"Complete: « Have you finished … the report? »",o:["to write","writing","write","wrote"],a:1,e:"Finish est suivi du gérondif (-ing).",s:"Banque anglais"},
// --- Comparatifs et superlatifs ---
{id:"an2-073",t:"ang",q:"Complete: « This is … building in the city. »",o:["the taller","the tallest","tallest","the most tall"],a:1,e:"Superlatif d'un adjectif court : the + adjectif + -est.",s:"Banque anglais"},
{id:"an2-074",t:"ang",q:"Complete: « The new software is … than the old one. »",o:["more efficient","efficienter","most efficient","more efficienter"],a:0,e:"Adjectif long : more + adjectif + than.",s:"Banque anglais"},
{id:"an2-075",t:"ang",q:"Complete: « Her English is … than mine. »",o:["gooder","more good","better","best"],a:2,e:"Comparatifs irréguliers : good – better – the best ; bad – worse – the worst.",s:"Banque anglais"},
{id:"an2-076",t:"ang",q:"Complete: « The exam was not as difficult … I expected. »",o:["than","that","like","as"],a:3,e:"Comparatif d'égalité : (not) as + adjectif + as.",s:"Banque anglais"},
{id:"an2-077",t:"ang",q:"Complete: « The … you read, the … you learn. »",o:["most / most","more / most","more / more","much / much"],a:2,e:"The more…, the more… : plus…, plus… (comparatif, jamais most).",s:"Banque anglais"},
{id:"an2-078",t:"ang",q:"Complete: « This year, taxes are … higher than last year. »",o:["much","very","more","most"],a:0,e:"Pour renforcer un comparatif : much, far ou a lot (jamais very).",s:"Banque anglais"},
{id:"an2-079",t:"ang",q:"Complete: « There were … people at the meeting than we expected. »",o:["less","fewer","fewest","little"],a:1,e:"Fewer + nom dénombrable pluriel (fewer people) ; less + indénombrable (less money).",s:"Banque anglais"},
{id:"an2-080",t:"ang",q:"Complete: « The weather is getting … . »",o:["more and more bad","worst and worst","badder and badder","worse and worse"],a:3,e:"Comparatif répété pour une progression : worse and worse (de pire en pire), more and more expensive.",s:"Banque anglais"},
// --- Quantifieurs ---
{id:"an2-081",t:"ang",q:"Complete: « I have … friends in London, so I never feel lonely there. »",o:["a little","few","little","a few"],a:3,e:"A few + dénombrable = quelques (sens positif) ; few = peu (sens négatif) ; a little / little + indénombrable.",s:"Banque anglais"},
{id:"an2-082",t:"ang",q:"Complete: « There is very … sugar left: we need to buy some. »",o:["little","few","a few","many"],a:0,e:"Little + indénombrable = peu de ; few et many s'emploient avec un dénombrable pluriel.",s:"Banque anglais"},
{id:"an2-083",t:"ang",q:"Complete: « There aren't … documents on my desk. »",o:["some","much","any","a little"],a:2,e:"Any à la forme négative et dans les questions ouvertes ; much et a little + indénombrable.",s:"Banque anglais"},
{id:"an2-084",t:"ang",q:"Complete: « I need … information about the new tax. »",o:["an","some","many","a few"],a:1,e:"Information est indénombrable en anglais : pas d'article an, pas de pluriel ; quantifieur some ou much.",s:"Banque anglais"},
{id:"an2-085",t:"ang",q:"Complete: « … employee received a bonus this year. »",o:["All","Both","Most","Every"],a:3,e:"Every + nom singulier ; all, both et most se construisent avec un pluriel.",s:"Banque anglais"},
{id:"an2-086",t:"ang",q:"Complete: « He gave me some very good … . »",o:["advices","advice","an advice","advises"],a:1,e:"Advice (conseil) est indénombrable : some advice, a piece of advice. Le verbe est to advise.",s:"Banque anglais"},
{id:"an2-087",t:"ang",q:"Complete: « There are … mistakes in this report: please check it again. »",o:["too many","too much","enough of","too"],a:0,e:"Too many + dénombrable pluriel ; too much + indénombrable.",s:"Banque anglais"},
// --- Articles ---
{id:"an2-088",t:"ang",q:"Complete: « She is … honest woman. »",o:["a","(no article)","an","any"],a:2,e:"An devant un son voyelle : le h de honest, hour, honour est muet.",s:"Banque anglais"},
{id:"an2-089",t:"ang",q:"Which phrase is correct?",o:["a European company","an European company","an university","a hour"],a:0,e:"A ou an dépend du son : a devant le son « you » (a European, a university), an devant un h muet (an hour).",s:"Banque anglais"},
{id:"an2-090",t:"ang",q:"Complete: « He goes to work by … bus. »",o:["the","a","(no article)","an"],a:2,e:"By + moyen de transport s'emploie sans article (by bus, by train, by car).",s:"Banque anglais"},
{id:"an2-091",t:"ang",q:"Complete: « … United Kingdom left the European Union in 2020. »",o:["(no article)","The","A","An"],a:1,e:"The devant les noms de pays formés d'un nom commun ou au pluriel : the United Kingdom, the United States, the Netherlands.",s:"Banque anglais"},
// --- Pronoms relatifs ---
{id:"an2-092",t:"ang",q:"Complete: « The man … lives next door is a tax inspector. »",o:["which","whose","where","who"],a:3,e:"Who pour une personne ; which pour une chose ; that convient aux deux dans une relative déterminative.",s:"Banque anglais"},
{id:"an2-093",t:"ang",q:"Complete: « The report … I wrote yesterday is on your desk. »",o:["who","whose","which","where"],a:2,e:"Which (ou that, ou rien) pour une chose.",s:"Banque anglais"},
{id:"an2-094",t:"ang",q:"Complete: « That's the woman … car was stolen. »",o:["who","whose","which","whom"],a:1,e:"Whose = dont, exprime la possession (whose car = dont la voiture).",s:"Banque anglais"},
{id:"an2-095",t:"ang",q:"Complete: « This is the town … I was born. »",o:["where","which","who","whose"],a:0,e:"Where pour un lieu (= in which).",s:"Banque anglais"},
{id:"an2-096",t:"ang",q:"Complete: « … I need is a long holiday. »",o:["Which","That","Who","What"],a:3,e:"What = ce que (ce dont), sans antécédent ; which a toujours un antécédent.",s:"Banque anglais"},
// --- Question tags ---
{id:"an2-097",t:"ang",q:"Complete: « She can speak Spanish, … ? »",o:["can't she","couldn't she","doesn't she","isn't she"],a:0,e:"Question tag : on reprend l'auxiliaire de la phrase (can) ; phrase affirmative, tag négatif.",s:"Banque anglais"},
{id:"an2-098",t:"ang",q:"Complete: « They didn't come to the meeting, … ? »",o:["didn't they","did they","do they","were they"],a:1,e:"Phrase négative, tag affirmatif, avec le même auxiliaire (did).",s:"Banque anglais"},
{id:"an2-099",t:"ang",q:"Complete: « Let's go, … ? »",o:["will we","don't we","shall we","let we"],a:2,e:"Après Let's…, le question tag est shall we?",s:"Banque anglais"},
{id:"an2-100",t:"ang",q:"Complete: « He has finished his report, … ? »",o:["doesn't he","isn't he","didn't he","hasn't he"],a:3,e:"Has est ici l'auxiliaire du present perfect : on le reprend dans le tag (hasn't he).",s:"Banque anglais"},
{id:"an2-101",t:"ang",q:"Complete: « I'm late, … ? »",o:["aren't I","amn't I","isn't I","am not I"],a:0,e:"Après I am, le tag négatif est aren't I (forme irrégulière).",s:"Banque anglais"},
// --- Phrasal verbs ---
{id:"an2-102",t:"ang",q:"Complete: « Please fill … this form and sign it at the bottom. »",o:["at","of","off","in"],a:3,e:"Fill in a form = remplir un formulaire (en anglais américain : fill out).",s:"Banque anglais"},
{id:"an2-103",t:"ang",q:"What does « to look after » mean?",o:["Chercher","S'occuper de","Regarder derrière","Admirer"],a:1,e:"Look after = s'occuper de ; look for = chercher ; look forward to = avoir hâte de.",s:"Banque anglais"},
{id:"an2-104",t:"ang",q:"What does « to give up » mean?",o:["Rendre","Donner davantage","Abandonner, renoncer","Se lever"],a:2,e:"Give up = abandonner (give up smoking = arrêter de fumer) ; give back = rendre ; get up = se lever.",s:"Banque anglais"},
{id:"an2-105",t:"ang",q:"Complete: « The meeting has been called … because the director is ill. »",o:["out","up","on","off"],a:3,e:"Call off = annuler.",s:"Banque anglais"},
{id:"an2-106",t:"ang",q:"Find the synonym of « to put off » in: « We had to put off the meeting until next week. »",o:["To postpone","To cancel","To prepare","To attend"],a:0,e:"Put off = postpone = reporter, remettre à plus tard ; call off = cancel = annuler.",s:"Banque anglais"},
{id:"an2-107",t:"ang",q:"Complete: « I'm looking … my glasses. Have you seen them? »",o:["after","for","at","up"],a:1,e:"Look for = chercher ; look after = s'occuper de ; look at = regarder.",s:"Banque anglais"},
{id:"an2-108",t:"ang",q:"Complete: « Can you pick me … at the station at six? »",o:["on","off","up","out"],a:2,e:"Pick somebody up = aller chercher quelqu'un (en voiture).",s:"Banque anglais"},
{id:"an2-109",t:"ang",q:"Complete: « We have run … of paper: can you order some? »",o:["off","away","out","over"],a:2,e:"Run out of = être à court de, ne plus avoir de.",s:"Banque anglais"},
{id:"an2-110",t:"ang",q:"Complete: « The government set … a new agency to fight tax fraud. »",o:["up","off","down","in"],a:0,e:"Set up = créer, mettre en place, fonder.",s:"Banque anglais"},
{id:"an2-111",t:"ang",q:"What does « to carry out an audit » mean?",o:["Annuler un contrôle","Réaliser un contrôle","Reporter un contrôle","Contester un contrôle"],a:1,e:"Carry out = effectuer, réaliser (carry out a survey, an investigation).",s:"Banque anglais"},
// --- Verbes irréguliers ---
{id:"an2-112",t:"ang",q:"What is the past participle of « to write »?",o:["wrote","writed","writen","written"],a:3,e:"Write – wrote – written.",s:"Banque anglais"},
{id:"an2-113",t:"ang",q:"What is the past tense (preterit) of « to catch »?",o:["catched","caught","cought","caughten"],a:1,e:"Catch – caught – caught ; même terminaison pour teach – taught – taught.",s:"Banque anglais"},
{id:"an2-114",t:"ang",q:"What is the past tense (preterit) of « to lead »?",o:["leaded","lead","lid","led"],a:3,e:"Lead – led – led (mener, diriger).",s:"Banque anglais"},
{id:"an2-115",t:"ang",q:"Complete: « The price of fuel has … sharply this year. »",o:["rose","raised","risen","rised"],a:2,e:"Rise – rose – risen (intransitif : augmenter) ; raise – raised – raised est transitif (augmenter quelque chose).",s:"Banque anglais"},
{id:"an2-116",t:"ang",q:"What is the past participle of « to choose »?",o:["chosen","chose","choosed","choosen"],a:0,e:"Choose – chose – chosen.",s:"Banque anglais"},
{id:"an2-117",t:"ang",q:"Complete: « She … the electricity bill yesterday. »",o:["payed","pay","paid","paied"],a:2,e:"Pay – paid – paid (et non « payed »).",s:"Banque anglais"},
{id:"an2-118",t:"ang",q:"What is the past tense (preterit) of « to teach »?",o:["teached","thought","tought","taught"],a:3,e:"Teach – taught – taught ; ne pas confondre avec think – thought – thought.",s:"Banque anglais"},
{id:"an2-119",t:"ang",q:"Which of these verbs is regular?",o:["To bring","To explain","To think","To send"],a:1,e:"Explain – explained – explained ; bring – brought, think – thought, send – sent sont irréguliers.",s:"Banque anglais"},
{id:"an2-120",t:"ang",q:"What is the past tense (preterit) of « to fall »?",o:["fell","felt","fallen","falled"],a:0,e:"Fall – fell – fallen ; ne pas confondre avec feel – felt – felt.",s:"Banque anglais"},
// --- Orthographe ---
{id:"an2-121",t:"ang",q:"Which word is spelled correctly?",o:["accomodation","acommodation","accommodation","acomodation"],a:2,e:"Accommodation (logement) : deux c et deux m.",s:"Banque anglais"},
{id:"an2-122",t:"ang",q:"Which word is spelled correctly?",o:["goverment","government","governement","govermnent"],a:1,e:"Government = govern + -ment : n avant le m, sans e intermédiaire (fr : gouvernement).",s:"Banque anglais"},
{id:"an2-123",t:"ang",q:"Which word is spelled correctly?",o:["neccessary","necesary","neccesary","necessary"],a:3,e:"Necessary : un c, deux s.",s:"Banque anglais"},
{id:"an2-124",t:"ang",q:"Which word is spelled correctly?",o:["receive","recieve","receeve","riceive"],a:0,e:"Après c, on écrit ei : receive, receipt, ceiling (« i before e, except after c »).",s:"Banque anglais"},
{id:"an2-125",t:"ang",q:"Which word is spelled correctly?",o:["buisness","business","bussiness","busness"],a:1,e:"Business = busi- + -ness : un seul s au milieu, deux à la fin.",s:"Banque anglais"},
{id:"an2-126",t:"ang",q:"Which word is spelled correctly?",o:["adress","adresse","addresse","address"],a:3,e:"Address : deux d, deux s, sans e final (fr : adresse).",s:"Banque anglais"},
{id:"an2-127",t:"ang",q:"Which word is spelled correctly?",o:["responsability","responsibillity","responsibility","resposibility"],a:2,e:"Responsibility : -ibility, comme responsible (fr : responsabilité).",s:"Banque anglais"},
{id:"an2-128",t:"ang",q:"Which word is spelled correctly?",o:["separate","seperate","separete","sepparate"],a:0,e:"Separate : s-e-p-a-r-a-t-e (moyen mnémotechnique : « there is a rat in separate »).",s:"Banque anglais"},
{id:"an2-129",t:"ang",q:"Which word is spelled correctly?",o:["begining","beggining","beginning","beginnig"],a:2,e:"Begin est accentué sur la dernière syllabe, terminée par voyelle + consonne : on double le n devant -ing (beginning).",s:"Banque anglais"},
{id:"an2-130",t:"ang",q:"Which word is spelled correctly?",o:["developpement","developement","devellopment","development"],a:3,e:"Development : un seul p et pas de e après develop (fr : développement).",s:"Banque anglais"},
{id:"an2-131",t:"ang",q:"Which word is spelled correctly?",o:["embarrassed","embarassed","embarrased","embarased"],a:0,e:"Embarrassed : deux r et deux s.",s:"Banque anglais"},
{id:"an2-132",t:"ang",q:"Complete with the correct spelling: « The accident … at noon. »",o:["occured","occurred","ocurred","occurrd"],a:1,e:"Occur est accentué sur la dernière syllabe : on double le r au prétérit (occurred, occurring).",s:"Banque anglais"},
{id:"an2-133",t:"ang",q:"Complete: « The company has changed … name. »",o:["its","it's","its'","it is"],a:0,e:"Its = possessif (son, sa, ses) ; it's = it is ou it has.",s:"Banque anglais"},
{id:"an2-134",t:"ang",q:"Complete: « … going to the meeting tomorrow. »",o:["Their","There","Theyr","They're"],a:3,e:"They're = they are ; their = leur(s) ; there = là, il y a.",s:"Banque anglais"},
{id:"an2-135",t:"ang",q:"Complete: « Be careful not to … your keys. »",o:["loose","loss","lose","lost"],a:2,e:"To lose = perdre ; loose = desserré, ample ; loss = perte (nom).",s:"Banque anglais"},
{id:"an2-136",t:"ang",q:"Complete: « I … you to read the contract carefully. »",o:["advice","advise","advices","advize"],a:1,e:"Advise (verbe, avec s) ; advice (nom indénombrable, avec c).",s:"Banque anglais"},
// --- Faux amis ---
{id:"an2-137",t:"ang",q:"« The children pretended to be asleep when their mother came in. » What does « pretended » mean here?",o:["Ont affirmé","Ont refusé","Ont fait semblant","Ont essayé"],a:2,e:"Faux ami : to pretend = faire semblant ; prétendre (affirmer) = to claim.",s:"Banque anglais"},
{id:"an2-138",t:"ang",q:"« I suddenly realized I had forgotten my keys. » What does « realized » mean?",o:["Je me suis rendu compte","J'ai imaginé","J'ai regretté","J'ai prouvé"],a:0,e:"To realize = se rendre compte ; réaliser (un projet) = to carry out, to achieve.",s:"Banque anglais"},
{id:"an2-139",t:"ang",q:"« She finally achieved her goal. » What does « achieved » mean?",o:["Achevé","Acheté","Abandonné","Atteint"],a:3,e:"Faux ami : to achieve = atteindre, réaliser ; achever = to finish, to complete.",s:"Banque anglais"},
{id:"an2-140",t:"ang",q:"« Please send your résumé and a cover letter to the HR department. » What is a « résumé » here?",o:["Un résumé","Un CV","Un rapport d'activité","Un justificatif de domicile"],a:1,e:"En anglais américain, résumé = CV (en anglais britannique : CV) ; un résumé (synthèse) = a summary.",s:"Banque anglais"},
{id:"an2-141",t:"ang",q:"« What's on the agenda for today's meeting? » What does « agenda » mean?",o:["Le carnet de rendez-vous","Le compte rendu","L'ordre du jour","La liste des participants"],a:2,e:"Faux ami : agenda = ordre du jour ; un agenda (carnet) = a diary ou a planner.",s:"Banque anglais"},
{id:"an2-142",t:"ang",q:"« A nurse assisted the surgeon during the operation. » What does « assisted » mean?",o:["A assisté (était présent sans participer)","A aidé","A remplacé","A observé"],a:1,e:"To assist = aider ; assister à (être présent) = to attend.",s:"Banque anglais"},
{id:"an2-143",t:"ang",q:"What does « deception » mean?",o:["Tromperie","Déception","Réception","Décision"],a:0,e:"Faux ami : deception = tromperie ; déception = disappointment.",s:"Banque anglais"},
{id:"an2-144",t:"ang",q:"« The new office is in a great location. » What does « location » mean?",o:["Location (bail)","Loyer","Logement","Emplacement"],a:3,e:"Location = emplacement, lieu ; la location (bail) = rental, renting.",s:"Banque anglais"},
{id:"an2-145",t:"ang",q:"« My boss was very sympathetic when my father was ill. » What does « sympathetic » mean?",o:["Compréhensif, compatissant","Sympathique","Symbolique","Bavard"],a:0,e:"Faux ami : sympathetic = compatissant, compréhensif ; sympathique = nice, friendly.",s:"Banque anglais"},
{id:"an2-146",t:"ang",q:"« The journey from Paris to Lyon takes two hours by train. » What does « journey » mean?",o:["La journée","Le trajet, le voyage","Le journal","Le jour férié"],a:1,e:"Journey = trajet, voyage ; une journée = a day.",s:"Banque anglais"},
{id:"an2-147",t:"ang",q:"« Tax fraud is a major issue for the government. » What does « issue » mean here?",o:["Une issue (sortie)","Une solution","Un problème, un enjeu","Un résultat"],a:2,e:"Issue = question, problème, enjeu ; une issue (sortie) = an exit ; une issue (dénouement) = an outcome.",s:"Banque anglais"},
{id:"an2-148",t:"ang",q:"« She passed her driving test. » What does it mean?",o:["Elle s'est présentée à son permis, sans préciser le résultat.","Elle a échoué au permis.","Elle a révisé son permis.","Elle a réussi son permis."],a:3,e:"To pass an exam = réussir ; passer un examen = to take (ou sit) an exam.",s:"Banque anglais"},
{id:"an2-149",t:"ang",q:"« The actual cost was higher than the estimate. » What does « actual » mean?",o:["Actuel","Prévu","Réel","Total"],a:2,e:"Faux ami : actual = réel, effectif ; actuel = current.",s:"Banque anglais"},
{id:"an2-150",t:"ang",q:"« The minister resigned last week. » What does « resigned » mean?",o:["S'est résigné","A démissionné","A été réélu","A signé de nouveau"],a:1,e:"To resign = démissionner ; se résigner = to resign oneself (to something).",s:"Banque anglais"},
// --- Finances publiques, fiscalité, comptabilité, administration ---
{id:"an2-151",t:"ang",q:"What's the English for « remboursement d'impôt »?",o:["A tax return","A tax rate","A tax bracket","A tax refund"],a:3,e:"Tax refund = remboursement ; tax return = déclaration de revenus ; tax rate = taux d'imposition.",s:"Banque anglais"},
{id:"an2-152",t:"ang",q:"What does « tax evasion » mean?",o:["La fraude fiscale (illégale)","L'optimisation fiscale (légale)","L'exonération d'impôt","Le crédit d'impôt"],a:0,e:"Tax evasion = fraude fiscale, illégale ; tax avoidance = optimisation fiscale, légale mais parfois abusive.",s:"Banque anglais"},
{id:"an2-153",t:"ang",q:"What's the English for « optimisation fiscale » (réduire son impôt par des moyens légaux)?",o:["Tax evasion","Tax fraud","Tax avoidance","Tax collection"],a:2,e:"Tax avoidance = optimisation fiscale ; tax evasion et tax fraud désignent la fraude ; tax collection = recouvrement.",s:"Banque anglais"},
{id:"an2-154",t:"ang",q:"What does « tax haven » mean?",o:["Niche fiscale","Bouclier fiscal","Crédit d'impôt","Paradis fiscal"],a:3,e:"Haven = refuge, abri. Niche fiscale = tax loophole ou tax break ; crédit d'impôt = tax credit.",s:"Banque anglais"},
{id:"an2-155",t:"ang",q:"What does « corporate tax » mean?",o:["L'impôt sur le revenu","L'impôt sur les sociétés","La taxe foncière","Les droits d'enregistrement"],a:1,e:"Corporate tax (corporation tax au Royaume-Uni) = impôt sur les sociétés ; income tax = impôt sur le revenu.",s:"Banque anglais"},
{id:"an2-156",t:"ang",q:"What's the English for « droits de douane »?",o:["Customs duties","Custom rights","Duty-free","Excise duties"],a:0,e:"Customs (toujours avec s) = la douane ; duty = droit, taxe. Duty-free = hors taxes ; excise duties = droits d'accise.",s:"Banque anglais"},
{id:"an2-157",t:"ang",q:"What does « tax bracket » mean?",o:["Taux réduit","Tranche d'imposition","Abattement","Niche fiscale"],a:1,e:"Tax bracket = tranche du barème ; tax rate = taux ; allowance = abattement.",s:"Banque anglais"},
{id:"an2-158",t:"ang",q:"What's the English for « prélèvement à la source » (de l'impôt sur le revenu)?",o:["Withholding tax","Direct debit","Tax deduction","Sales tax"],a:0,e:"Withholding tax = retenue à la source ; direct debit = prélèvement automatique sur un compte ; tax deduction = déduction fiscale.",s:"Banque anglais"},
{id:"an2-159",t:"ang",q:"« The budget deficit narrowed last year. » What does « narrowed » mean?",o:["S'est creusé","A été publié","S'est réduit","A été voté"],a:2,e:"Narrow = (se) réduire, (se) resserrer ; widen = (se) creuser, s'élargir.",s:"Banque anglais"},
{id:"an2-160",t:"ang",q:"What's the English for « les dépenses publiques »?",o:["Public spendings","Public expanses","Public dispenses","Public spending"],a:3,e:"Spending est indénombrable (jamais de s) ; on dit aussi public expenditure.",s:"Banque anglais"},
{id:"an2-161",t:"ang",q:"« The government announced spending cuts. » What does it mean?",o:["Des hausses de dépenses","Des réductions de dépenses","Des coupures de courant","Des baisses d'impôts"],a:1,e:"Cut = réduction, coupe ; spending = dépenses. Des baisses d'impôts = tax cuts.",s:"Banque anglais"},
{id:"an2-162",t:"ang",q:"What's the English for « recettes fiscales »?",o:["Tax revenue","Tax recipes","Tax rents","Tax gains"],a:0,e:"Revenue = recettes (de l'État) ; recipe = recette de cuisine.",s:"Banque anglais"},
{id:"an2-163",t:"ang",q:"What's the English for « compte de résultat »?",o:["Balance sheet","Result account","Cash flow statement","Income statement"],a:3,e:"Income statement (ou profit and loss account) = compte de résultat ; balance sheet = bilan.",s:"Banque anglais"},
{id:"an2-164",t:"ang",q:"What does « fixed assets » mean?",o:["Les stocks","Les créances clients","Les immobilisations","Les capitaux propres"],a:2,e:"Fixed assets = actif immobilisé (immobilisations) ; current assets = actif circulant (stocks, créances, trésorerie).",s:"Banque anglais"},
