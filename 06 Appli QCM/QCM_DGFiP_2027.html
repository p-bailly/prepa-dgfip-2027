<style>
/* Layout : une colonne de travail type « feuille de réponse », cases 1-4 et « Ann », barre d'onglets collante. */
:root{
  --paper:#F4F6FA; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6580; --line:#D6DCE8;
  --pen:#2340C8; --pen-soft:#E5EAFB; --ok:#1C7A4B; --ok-soft:#E2F2E9; --bad:#BF3328; --bad-soft:#FBE6E3;
  --warn:#9A5B00; --warn-soft:#FBEFD8; --shade:rgba(20,33,61,.06); --on-solid:#FFFFFF;
  --f-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1320; --surface:#161D2D; --ink:#E6EBF5; --muted:#9AA5BD; --line:#2A3448;
  --pen:#8199FF; --pen-soft:#1E2950; --ok:#4FC48C; --ok-soft:#13302A; --bad:#FF7B6F; --bad-soft:#3B1D1E;
  --warn:#E8AA4A; --warn-soft:#382B15; --shade:rgba(0,0,0,.25); --on-solid:#0E1320; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1320; --surface:#161D2D; --ink:#E6EBF5; --muted:#9AA5BD; --line:#2A3448;
  --pen:#8199FF; --pen-soft:#1E2950; --ok:#4FC48C; --ok-soft:#13302A; --bad:#FF7B6F; --bad-soft:#3B1D1E;
  --warn:#E8AA4A; --warn-soft:#382B15; --shade:rgba(0,0,0,.25); --on-solid:#0E1320; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:1.45rem;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:.74rem;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.strong{color:var(--pen);border-color:var(--pen);background:var(--pen-soft)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs .in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:12px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h2{font-size:1.15rem;margin:0 0 4px;font-weight:700;text-wrap:balance}
h3{font-size:.8rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 0 var(--shade)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--pen)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-solid)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--pen-soft);color:var(--pen);letter-spacing:.02em}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.plain{background:none;border:1px solid var(--line);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--pen)}
.q{font-size:1.08rem;font-weight:600;margin:0 0 14px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.opt .box{width:30px;height:30px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.opt span.t{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt:hover:not([disabled]){border-color:var(--pen)}
.opt[disabled]{cursor:default}
.opts.locked .opt:not(.right):not(.wrong){opacity:.55}
.opt.chosen .box{background:var(--pen);border-color:var(--pen);color:var(--on-solid)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .box{border-color:var(--ok);background:var(--ok);color:var(--on-solid)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .box{border-color:var(--bad);background:var(--bad);color:var(--on-solid)}
.opt.ann .box{font-size:.62rem}
.expl{margin-top:14px;padding:12px 14px;border-left:3px solid var(--pen);background:var(--pen-soft);border-radius:0 8px 8px 0;font-size:.95rem}
.expl.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.expl.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.expl b{display:block;margin-bottom:2px}
.expl .more{margin:8px 0 0}
.expl .links{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.expl .links a{color:var(--pen);font-weight:600;text-underline-offset:2px;overflow-wrap:anywhere}
.expl .links a::after{content:" ↗"}
.src{font-size:.78rem;color:var(--muted);margin-top:6px;font-family:var(--f-mono)}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat .n{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.85rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .lab{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:4px;flex-wrap:wrap}
.bar-row .lab b{font-weight:600}
.bar-row .lab span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:16px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--pen);border-radius:3px 0 0 3px}
.track .fill.ok{background:var(--ok)} .track .fill.bad{background:var(--bad)}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.track .mark.dash{background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px;background:var(--pen)}
.legend i.mk{width:2px;background:var(--ink)}
.legend i.mk.dash{background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px)}
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.sheetgrid button{font-family:var(--f-mono);font-size:.78rem;padding:6px 0;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer}
.sheetgrid button.done{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.sheetgrid button.abst{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sheetgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.optin{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.optin input[type=radio]{width:20px;height:20px;accent-color:var(--pen)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.item{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.item>button.head{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer}
.item .body{padding:0 12px 12px}
.item ol{margin:6px 0;padding-left:22px}
.item li.good{color:var(--ok);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.note{font-size:.85rem;color:var(--muted)}
.big{font-family:var(--f-mono);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.na{color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sheet{padding:14px}.q{font-size:1.02rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:border-color .12s,background-color .12s}}
</style>

<script>
const BANK = [];
// Annales officielles 2026 et QCM d'entraînement inédit (dossier 05).
// Format : id, t (thème), q, o (4 propositions), a (index 0-3 de la bonne réponse),
// e (explication), s (source), d:1 = douteuse, act:1 = actualité datée.
BANK.push(
// ---------- QCM officiel inspecteur 2026 ----------
{id:"i26-01",t:"admin",q:"Quelle est la définition du principe d'universalité budgétaire ?",o:["Chaque recette est affectée à une dépense","L'autorisation budgétaire donnée à l'exécutif n'est valable que pour un an","Le budget décrit, pour la durée de l'exercice, l'ensemble des recettes qui financent l'ensemble des dépenses","Le budget doit être accompagné de l'ensemble des pièces comptables justificatives"],a:2,e:"Universalité = non-compensation et non-affectation : toutes les recettes financent toutes les dépenses. La 2e proposition décrit l'annualité.",s:"QCM inspecteur 2026, Q1"},
{id:"i26-02",t:"admin",q:"Selon l'article 24 de la Constitution, quel est l'un des rôles du Sénat ?",o:["Représenter la France auprès des collectivités territoriales étrangères","Représenter la position du Gouvernement","Représenter les collectivités territoriales de la République","Représenter les seules collectivités territoriales métropolitaines"],a:2,e:"Art. 24 : le Sénat assure la représentation des collectivités territoriales de la République (outre-mer compris).",s:"QCM inspecteur 2026, Q2"},
{id:"i26-03",t:"admin",q:"« Un agent public doit garder confidentielles les informations personnelles relatives aux usagers dont il a eu connaissance dans l'exercice de ses fonctions. » À quelle obligation cela renvoie-t-il ?",o:["L'impartialité","La neutralité","L'obéissance hiérarchique","Le secret professionnel"],a:3,e:"Le secret professionnel protège les usagers (sanction pénale) ; la discrétion professionnelle protège l'administration.",s:"QCM inspecteur 2026, Q3"},
{id:"i26-04",t:"admin",q:"Le Pacte de stabilité et de croissance (1997) plafonne le déficit public des États membres à quelle part du PIB ?",o:["1 %","3 %","5 %","10 %"],a:1,e:"Critères de Maastricht repris par le Pacte : déficit ≤ 3 % du PIB, dette ≤ 60 % du PIB.",s:"QCM inspecteur 2026, Q4"},
{id:"i26-05",t:"admin",q:"Qu'est-ce que la fongibilité asymétrique définie par la LOLF ?",o:["En cas d'insuffisance, des crédits inutilisés d'autres programmes peuvent être transférés sur les dépenses de personnel","La fongibilité asymétrique est interdite depuis la LOLF","Les crédits de personnel peuvent être utilisés pour d'autres natures de dépenses","Les crédits d'un programme peuvent être utilisés sur tout autre programme en cas d'insuffisance justifiée auprès du Parlement"],a:2,e:"Dans un programme, les crédits du titre 2 (personnel) peuvent financer d'autres dépenses, jamais l'inverse.",s:"QCM inspecteur 2026, Q5"},
{id:"i26-06",t:"admin",q:"Quels sont les quatre principes fondamentaux de la République française (article 1er) ?",o:["Démocratie, liberté, laïcité, fraternité","Indivisibilité, laïcité, démocratie, social","Indivisibilité, laïcité, liberté, tolérance","Liberté, égalité, fraternité, laïcité"],a:1,e:"Art. 1er : République indivisible, laïque, démocratique et sociale. « Liberté, Égalité, Fraternité » est la devise (art. 2).",s:"QCM inspecteur 2026, Q6"},
{id:"i26-07",t:"admin",q:"Le budget de l'État est structuré en trois niveaux. À quoi correspondent les missions ?",o:["À la destination des crédits","Au budget accordé à chaque ministère","Au cadre de mise en œuvre des dépenses d'investissement de l'État","Aux grandes politiques de l'État"],a:3,e:"La mission regroupe les programmes concourant à une politique publique ; elle peut être interministérielle. C'est l'unité de vote.",s:"QCM inspecteur 2026, Q7"},
{id:"i26-08",t:"admin",q:"Quelle est la durée du mandat d'un maire ?",o:["4 ans","5 ans","6 ans","7 ans"],a:2,e:"Le maire est élu par le conseil municipal, lui-même élu pour 6 ans.",s:"QCM inspecteur 2026, Q8"},
{id:"i26-09",t:"admin",q:"La libre administration des collectivités territoriales est :",o:["Un principe constitutionnel","Un principe jurisprudentiel","Un principe législatif","Un principe réglementaire"],a:0,e:"Article 72 de la Constitution : les collectivités s'administrent librement par des conseils élus.",s:"QCM inspecteur 2026, Q9"},
{id:"i26-10",t:"admin",q:"À l'été 2023, la dette publique de la France a dépassé 3 000 milliards d'euros. À quoi correspond cette dette ?",o:["À l'ensemble des emprunts contractés par les collectivités territoriales","À l'ensemble des emprunts contractés par l'État","À l'ensemble des emprunts contractés par l'État, la Sécurité sociale, les ODAC et les collectivités territoriales","Au solde annuel négatif du budget des administrations publiques"],a:2,e:"La dette « au sens de Maastricht » couvre toutes les administrations publiques. Le solde annuel négatif est le déficit (un flux).",s:"QCM inspecteur 2026, Q10"},
{id:"i26-11",t:"ue",q:"Sur quelles libertés repose le marché unique européen ?",o:["Liberté d'expression, de religion, de vivre à l'abri du besoin et de la peur","Liberté d'opinion, d'expression, de réunion, de culte, syndicale","Liberté, égalité, fraternité","Libre circulation des biens, des personnes, des services et des capitaux"],a:3,e:"Les quatre libertés du marché intérieur (Acte unique, marché intérieur au 1er janvier 1993).",s:"QCM inspecteur 2026, Q11"},
{id:"i26-12",t:"ue",q:"Quel est le rôle du Parlement européen dans l'adoption du cadre financier pluriannuel ?",o:["Il doit approuver le budget","Il fait la première proposition sur le montant","Il n'a qu'un rôle consultatif","Il n'a pas de rôle budgétaire"],a:0,e:"Le CFP est adopté par le Conseil à l'unanimité après approbation du Parlement européen (art. 312 TFUE).",s:"QCM inspecteur 2026, Q12"},
{id:"i26-13",t:"ue",q:"Quel État membre est le plus grand contributeur au budget de l'Union européenne ?",o:["L'Allemagne","L'Espagne","La France","L'Italie"],a:0,e:"L'Allemagne est première, la France deuxième.",s:"QCM inspecteur 2026, Q13"},
{id:"i26-14",t:"ue",q:"Lequel de ces critères est une condition d'adhésion à l'Union européenne ?",o:["Adhérer à la zone euro","Avoir une dette publique inférieure à 60 % du PIB","Être une République","Respecter des droits fondamentaux comme la démocratie ou la protection des minorités"],a:3,e:"Critères de Copenhague (1993) : institutions démocratiques, État de droit, droits de l'homme, protection des minorités, économie de marché, reprise de l'acquis. L'euro n'est pas une condition.",s:"QCM inspecteur 2026, Q14"},
{id:"i26-15",t:"ue",q:"En quelle année a été signé le traité de Lisbonne ?",o:["1957","1992","2001","2007"],a:3,e:"Signé le 13 décembre 2007, en vigueur le 1er décembre 2009.",s:"QCM inspecteur 2026, Q15"},
{id:"i26-16",t:"ue",q:"Quelle est la portée des règlements de l'Union européenne ?",o:["Ils nécessitent une transposition en droit national","Ils s'appliquent uniquement aux États qui les acceptent","Ils sont directement applicables dans tous les États membres","Ce sont de simples recommandations"],a:2,e:"Le règlement est obligatoire dans tous ses éléments et directement applicable. C'est la directive qui doit être transposée.",s:"QCM inspecteur 2026, Q16"},
{id:"i26-17",t:"ue",q:"Quelle mesure fiscale issue de l'OCDE est entrée en vigueur dans l'UE en 2024 pour lutter contre l'évasion fiscale ?",o:["Un impôt minimum de 15 % sur les multinationales","La suppression des paradis fiscaux en Europe","La taxe numérique européenne","Le renforcement de la TVA intracommunautaire"],a:0,e:"Directive « Pilier 2 » : imposition minimale effective de 15 % des grands groupes (CA ≥ 750 M€).",s:"QCM inspecteur 2026, Q17"},
{id:"i26-18",t:"ue",q:"Quel État membre présidait le Conseil de l'Union européenne depuis le 1er juillet 2025 ?",o:["Allemagne","Belgique","Danemark","Pologne"],a:2,e:"Pologne (1er semestre 2025), Danemark (2nd semestre 2025), Chypre (1er semestre 2026), Irlande (2nd semestre 2026).",s:"QCM inspecteur 2026, Q18",act:1},
{id:"i26-19",t:"ue",q:"Quelle institution veille à la bonne application du droit de l'Union par tous les États membres ?",o:["La Commission européenne","Le Conseil de l'Europe","La Cour de justice de l'Union européenne","La Cour européenne des droits de l'homme"],a:0,e:"La Commission est « gardienne des traités » : elle engage les recours en manquement. La CJUE juge, sur saisine.",s:"QCM inspecteur 2026, Q19"},
{id:"i26-20",t:"ue",q:"Qui a été élu(e) président(e) du Parlement européen en janvier 2022 et réélu(e) en juillet 2024 ?",o:["Nicole Fontaine","Roberta Metsola","David Sassoli","Martin Schulz"],a:1,e:"Roberta Metsola (Malte) a succédé à David Sassoli, décédé en janvier 2022.",s:"QCM inspecteur 2026, Q20"},
{id:"i26-21",t:"num",q:"Quel est le rôle principal d'un pare-feu informatique ?",o:["Bloquer les publicités intrusives","Filtrer et sécuriser les connexions réseau","Optimiser la vitesse de connexion","Supprimer automatiquement les virus"],a:1,e:"Le pare-feu filtre les flux entrants et sortants ; c'est l'antivirus qui supprime les logiciels malveillants.",s:"QCM inspecteur 2026, Q21"},
{id:"i26-22",t:"num",q:"Sur l'open data (données ouvertes), trouvez l'intrus.",o:["L'open data offre la possibilité d'accéder à des statistiques médicales","L'open data permet d'utiliser des données protégées par des droits d'auteur","L'open data permet de consulter des données librement accessibles","L'open data peut être d'origine publique ou privée"],a:1,e:"Les données protégées par le droit d'auteur ou personnelles ne relèvent pas de l'open data.",s:"QCM inspecteur 2026, Q22"},
{id:"i26-23",t:"num",q:"Qu'est-ce que l'illectronisme ?",o:["L'incapacité à utiliser le numérique faute de couverture réseau","L'incapacité à utiliser le numérique par manque de connaissance de son fonctionnement","La facilité à utiliser le numérique grâce à une très bonne connaissance","Les conséquences d'une surexposition aux écrans dès l'enfance"],a:1,e:"Illectronisme = illettrisme numérique, par manque de compétences (environ un Français sur six).",s:"QCM inspecteur 2026, Q23"},
{id:"i26-24",t:"num",q:"D'où provient la majorité de l'empreinte carbone du numérique en France ?",o:["Des équipements (smartphones, ordinateurs, objets connectés)","Des centres de données","Des cryptoactifs","Des réseaux fixes et mobiles"],a:0,e:"Les équipements pèsent le plus : 79 % dans l'étude ADEME-Arcep de 2020, environ 50 % dans sa mise à jour, devant les centres de données (46 %) et les réseaux.",s:"QCM inspecteur 2026, Q24"},
{id:"i26-25",t:"num",q:"Quel est le principal objectif de la loi « Informatique et Libertés » ?",o:["Encadrer l'utilisation des données personnelles","Faciliter les échanges de données personnelles entre sites","Interdire les sites de commerce en ligne","Obliger les citoyens à s'inscrire sur une plateforme nationale"],a:0,e:"Loi du 6 janvier 1978, qui a créé la CNIL.",s:"QCM inspecteur 2026, Q25"},
{id:"i26-26",t:"num",q:"Quelle est la différence entre HTTP et HTTPS ?",o:["Il n'y en a aucune","HTTP est plus rapide","HTTPS est plus rapide","HTTPS est sécurisé"],a:3,e:"HTTPS chiffre les échanges (TLS) ; le « S » signifie Secure.",s:"QCM inspecteur 2026, Q26"},
{id:"i26-27",t:"num",q:"Qu'est-ce qu'un flux RSS ?",o:["Une messagerie pour échanger des données sensibles","Une revue informatique spécialisée","Un moyen de communication entre serveurs","Un système de diffusion de contenus fréquemment mis à jour sur un site"],a:3,e:"Le flux RSS diffuse automatiquement les nouveaux contenus d'un site.",s:"QCM inspecteur 2026, Q27"},
{id:"i26-28",t:"num",q:"Qu'est-ce que le droit à la déconnexion ?",o:["Le droit de ne pas être connecté aux outils professionnels en dehors de ses horaires de travail","Le droit de se déconnecter de temps en temps sur son lieu de travail","Le droit de se déconnecter une heure par jour au travail","Le droit de travailler sans connexion Internet"],a:0,e:"Créé par la loi Travail de 2016 (applicable en 2017).",s:"QCM inspecteur 2026, Q28"},
{id:"i26-29",t:"num",q:"Qu'est-ce que la blockchain (« chaîne de blocs ») ?",o:["Un environnement dédié aux jeux en ligne","Une technologie de stockage et de transmission d'informations, décentralisée, qui valide et sécurise les échanges","Un réseau centralisé utilisé par les États pour sécuriser les transactions monétaires","Un système de protection contre les cyberattaques dans une entreprise"],a:1,e:"Registre distribué, sans tiers de confiance central.",s:"QCM inspecteur 2026, Q29"},
{id:"i26-30",t:"num",q:"Qu'est-ce que l'exploration de données (« data mining ») ?",o:["La modification de données pour les rendre accessibles sur Internet","La recherche de données libres de droits","L'exploitation et l'analyse de grands ensembles de données","L'ouverture d'un dossier dans l'explorateur de fichiers"],a:2,e:"Data mining : extraire des tendances de grands volumes de données.",s:"QCM inspecteur 2026, Q30"},
{id:"i26-31",t:"log",q:"Quel est le mot manquant ? Cailloux – Pierres – Roches – ???",o:["Diamant","Granite","Paillage","Rubis"],a:1,e:"DOUTEUSE. La grille publique donne Granite. Mais la logique du nombre de lettres (8, 7, 6, puis 5) désigne Rubis. Question exclue des examens et du score.",s:"QCM inspecteur 2026, Q31",d:1},
{id:"i26-32",t:"log",q:"Des plaques sont facturées selon chaque lettre du nom. MARC paye 36 €, PUSSI 42 €, MARCEL 58 €, SUPINS 52 €, MARCO 45 €. Combien paiera NOËL ?",o:["38 €","40 €","41 €","46 €"],a:2,e:"MARCO − MARC : O = 9. MARCEL − MARC : E + L = 22. SUPINS − PUSSI : N = 10. NOËL = 10 + 9 + 22 = 41 €.",s:"QCM inspecteur 2026, Q32"},
{id:"i26-34",t:"log",q:"Complétez la série : A1 – C4 – E9 – G16 – ?",o:["I21","I25","J20","J24"],a:1,e:"Une lettre sur deux (A, C, E, G, I) et les carrés 1, 4, 9, 16, 25.",s:"QCM inspecteur 2026, Q34"},
{id:"i26-35",t:"log",q:"Une boîte contient 5 boules rouges, 7 bleues et 3 vertes. Quelle est la probabilité de tirer une boule verte ?",o:["14 %","20 %","25 %","30 %"],a:1,e:"3 / 15 = 1/5 = 20 %.",s:"QCM inspecteur 2026, Q35"},
{id:"i26-38",t:"log",q:"Complétez : CANARD – BIBELOT – CHACAL – DEMANDER – ÉCUREUIL – SIFFLET – GAGNER – ?",o:["FILLES","HACHOIR","INCENDIE","PÂQUES"],a:1,e:"Chaque mot contient deux fois la lettre suivante de l'alphabet : A, B, C, D, E, F, G, puis H (HACHOIR).",s:"QCM inspecteur 2026, Q38"},
{id:"i26-39",t:"log",q:"Si aujourd'hui est lundi, quel jour sera-t-on dans 45 jours ?",o:["Mercredi","Jeudi","Vendredi","Samedi"],a:1,e:"45 = 6 × 7 + 3 : lundi + 3 jours = jeudi.",s:"QCM inspecteur 2026, Q39"},
{id:"i26-40",t:"log",q:"Marie est la sœur de Jean. Jean est le frère de Paul. Paul est le fils de Louise. Louise est la mère de Marc. Quel est le lien de Marie avec Marc ?",o:["Sa cousine","Sa mère","Sa sœur","Sa tante"],a:2,e:"Louise est la mère de Paul et de Marc ; Marie, sœur de Paul, est donc la sœur de Marc.",s:"QCM inspecteur 2026, Q40"},
{id:"i26-41",t:"ang",q:"What's the English for: « Tu as soif ? Il y a de la limonade dans le cellier et du jus d'orange à la cave. Sers-toi. »",o:["Are you thirsty? There is some limonade in the cellar and some orange juice in the cave. Help yourself.","Are you thirsty? There is some limonade in the storeroom and some orange juicce in the cellar. Help yourself.","Are you thirsty? There is some limonade in the storeroom and some orrange juice in the cave. Help yourself.","Are you thirsty? There is some limonade in the storeroom and some orange juice in the cellar. Help yourself."],a:3,e:"Cellier = storeroom ; cave = cellar (cave = grotte). Les options 2 et 3 contiennent des fautes (juicce, orrange). Les 4 options gardent « limonade » (en anglais : lemonade).",s:"QCM inspecteur 2026, Q41"},
{id:"i26-42",t:"ang",q:"Complete: « I am starving. What are we having … lunch? »",o:["at","for","in","on"],a:1,e:"« for lunch / for dinner » : le repas.",s:"QCM inspecteur 2026, Q42"},
{id:"i26-43",t:"ang",q:"Find the synonym of « obvious » in: « The solution to this question is obvious. »",o:["Clear","Hard","Impossible","Weird"],a:0,e:"Obvious = évident = clear.",s:"QCM inspecteur 2026, Q43"},
{id:"i26-44",t:"ang",q:"Which sentence is correct?",o:["Paul drove when he stopped smoking","Paul drove when he stopped to smoke","Paul was driving when he stopped to smoke","Paul was driving when he stopped to smoking"],a:2,e:"Grille officielle : 3. Action en cours interrompue : past continuous (was driving) ; « stop to + verbe » = s'arrêter pour. Les phrases 1 et 2 sont grammaticales mais ne décrivent pas une action en cours ; la 4 est fautive.",s:"QCM inspecteur 2026, Q44"},
{id:"i26-45",t:"ang",q:"« One of the direct consequences of Brexit was the restoration of customs. » What does « customs » mean?",o:["Douanes","Frontières","Impôts","Passeports"],a:0,e:"Customs = douane(s). Frontière = border.",s:"QCM inspecteur 2026, Q45"},

// ---------- QCM d'entraînement inédit (fichier 02) ----------
{id:"e-01",t:"admin",q:"Quel article de la Constitution fixe le domaine de la loi ?",o:["Article 20","Article 37","Article 49","Article 34"],a:3,e:"Art. 34 : domaine de la loi ; art. 37 : tout le reste relève du règlement.",s:"Entraînement, Q1"},
{id:"e-02",t:"admin",q:"Combien de membres nommés compte le Conseil constitutionnel ?",o:["7","9","12","15"],a:1,e:"9 membres pour 9 ans, renouvelés par tiers tous les 3 ans (plus les anciens présidents, membres de droit).",s:"Entraînement, Q2"},
{id:"e-03",t:"admin",q:"Depuis quelle année un justiciable peut-il soulever une question prioritaire de constitutionnalité (QPC) ?",o:["1958","1974","2002","2010"],a:3,e:"Créée par la révision du 23 juillet 2008, la QPC s'applique depuis le 1er mars 2010 (art. 61-1).",s:"Entraînement, Q3"},
{id:"e-04",t:"admin",q:"Dans la LOLF, quelle est l'unité de spécialité des crédits ?",o:["Le programme","La mission","L'action","Le titre"],a:0,e:"Les crédits sont votés par mission et spécialisés par programme.",s:"Entraînement, Q4"},
{id:"e-05",t:"admin",q:"Quel principe budgétaire interdit d'affecter une recette à une dépense déterminée ?",o:["L'annualité","L'unité","L'universalité","La spécialité"],a:2,e:"Universalité : non-affectation et non-compensation.",s:"Entraînement, Q5"},
{id:"e-06",t:"admin",q:"De combien de jours le Parlement dispose-t-il pour se prononcer sur un projet de loi de finances ?",o:["40 jours","50 jours","70 jours","90 jours"],a:2,e:"Art. 47 : 70 jours, sinon mise en œuvre par ordonnance. 50 jours pour la loi de financement de la Sécurité sociale.",s:"Entraînement, Q6"},
{id:"e-07",t:"admin",q:"Qui exerce le contrôle de légalité sur les actes des collectivités territoriales ?",o:["La chambre régionale des comptes","Le Conseil d'État","Le directeur départemental des finances publiques","Le préfet"],a:3,e:"Le préfet peut déférer l'acte au tribunal administratif dans les 2 mois.",s:"Entraînement, Q7"},
{id:"e-08",t:"admin",q:"Qu'a fait la loi NOTRe du 7 août 2015 ?",o:["Elle a supprimé la clause générale de compétence des départements et des régions","Elle a créé les métropoles","Elle a supprimé les départements","Elle a instauré l'élection des conseillers régionaux au suffrage direct"],a:0,e:"Les métropoles ont été créées par la loi RCT (2010) puis généralisées par la loi MAPTAM (2014).",s:"Entraînement, Q8"},
{id:"e-09",t:"admin",q:"Un fonctionnaire reçoit un ordre manifestement illégal et de nature à compromettre gravement un intérêt public. Que doit-il faire ?",o:["L'exécuter, par obéissance hiérarchique","Refuser de l'exécuter","Demander l'avis du préfet","Saisir le Conseil constitutionnel"],a:1,e:"Seule exception légale au devoir d'obéissance hiérarchique.",s:"Entraînement, Q9"},
{id:"e-10",t:"admin",q:"Fin juin 2026, la dette publique de la France représentait environ :",o:["60 % du PIB","98 % du PIB","119 % du PIB","140 % du PIB"],a:2,e:"3 595,5 Md€, soit 119,0 % du PIB (Insee, 29 septembre 2026).",s:"Entraînement, Q10",act:1},
{id:"e-11",t:"ue",q:"En quelle année le traité de Maastricht a-t-il été signé ?",o:["1957","1986","1992","2007"],a:2,e:"Signé le 7 février 1992, en vigueur le 1er novembre 1993.",s:"Entraînement, Q11"},
{id:"e-12",t:"ue",q:"Combien d'États membres compte la zone euro au 1er janvier 2026 ?",o:["19","20","21","27"],a:2,e:"21 avec l'entrée de la Bulgarie (la Croatie était entrée en 2023).",s:"Entraînement, Q12",act:1},
{id:"e-13",t:"ue",q:"Quelle institution dispose en principe de l'initiative législative dans l'UE ?",o:["La Commission européenne","Le Parlement européen","Le Conseil européen","Le Conseil de l'Union européenne"],a:0,e:"Monopole de l'initiative : la Commission propose, le Parlement et le Conseil adoptent.",s:"Entraînement, Q13"},
{id:"e-14",t:"ue",q:"Qu'est-ce qu'une directive européenne ?",o:["Un acte directement applicable sans transposition","Un acte sans force obligatoire","Un acte qui ne s'applique qu'aux États qui l'ont voté","Un acte qui lie les États quant au résultat à atteindre et qui doit être transposé"],a:3,e:"Art. 288 TFUE : la directive lie quant au résultat, en laissant le choix des moyens.",s:"Entraînement, Q14"},
{id:"e-15",t:"ue",q:"Où siège la Cour de justice de l'Union européenne ?",o:["Bruxelles","Strasbourg","Luxembourg","La Haye"],a:2,e:"Luxembourg. La Cour européenne des droits de l'homme siège à Strasbourg.",s:"Entraînement, Q15"},
{id:"e-16",t:"ue",q:"Comment se définit la majorité qualifiée au Conseil de l'UE ?",o:["55 % des États représentant au moins 65 % de la population","50 % des États membres","Les deux tiers des États membres","L'unanimité moins une voix"],a:0,e:"Double majorité, en vigueur depuis le 1er novembre 2014 (traité de Lisbonne).",s:"Entraînement, Q16"},
{id:"e-17",t:"ue",q:"Quelle est la principale ressource du budget de l'UE ?",o:["Les droits de douane","La ressource fondée sur la TVA","La ressource fondée sur le revenu national brut","La contribution sur les plastiques non recyclés"],a:2,e:"La ressource RNB représente de loin la plus grande part.",s:"Entraînement, Q17"},
{id:"e-18",t:"ue",q:"Lequel de ces organes n'est pas une institution de l'Union européenne ?",o:["La Cour européenne des droits de l'homme","La Cour des comptes européenne","La Banque centrale européenne","Le Conseil européen"],a:0,e:"La CEDH relève du Conseil de l'Europe (46 États).",s:"Entraînement, Q18"},
{id:"e-19",t:"ue",q:"Depuis quand la Charte des droits fondamentaux de l'UE a-t-elle une valeur juridique contraignante ?",o:["2000","2004","2009","2013"],a:2,e:"Proclamée à Nice en 2000, elle a la même valeur que les traités depuis l'entrée en vigueur de Lisbonne, le 1er décembre 2009.",s:"Entraînement, Q19"},
{id:"e-20",t:"ue",q:"Quel est le dernier pays à avoir adhéré à l'Union européenne ?",o:["La Bulgarie","La Croatie","La Roumanie","La Slovénie"],a:1,e:"Croatie, 1er juillet 2013.",s:"Entraînement, Q20"},
{id:"e-21",t:"num",q:"Dans quel délai une violation de données personnelles doit-elle être notifiée à la CNIL ?",o:["24 heures","72 heures","7 jours","1 mois"],a:1,e:"RGPD, art. 33 : 72 heures au plus tard après en avoir pris connaissance.",s:"Entraînement, Q21"},
{id:"e-22",t:"num",q:"Quel droit permet de récupérer ses données dans un format réutilisable pour les transmettre à un autre service ?",o:["Le droit d'accès","Le droit d'opposition","Le droit de rectification","Le droit à la portabilité"],a:3,e:"Droit à la portabilité (art. 20 RGPD).",s:"Entraînement, Q22"},
{id:"e-23",t:"num",q:"Que signifie le principe de minimisation des données ?",o:["Ne collecter que les données nécessaires à la finalité du traitement","Chiffrer toutes les données","Supprimer les données au bout d'un an","Anonymiser toutes les données collectées"],a:0,e:"Données adéquates, pertinentes et limitées à ce qui est nécessaire.",s:"Entraînement, Q23"},
{id:"e-24",t:"num",q:"Qu'est-ce qu'un rançongiciel ?",o:["Un logiciel publicitaire gratuit","Un logiciel de paiement en ligne","Un logiciel de sauvegarde automatique","Un logiciel qui chiffre les données d'une victime et exige une rançon"],a:3,e:"Ransomware.",s:"Entraînement, Q24"},
{id:"e-25",t:"num",q:"Que signifie le « S » de HTTPS ?",o:["Simple","Secure","Server","Speed"],a:1,e:"Secure : les échanges sont chiffrés.",s:"Entraînement, Q25"},
{id:"e-26",t:"num",q:"Qu'est-ce que FranceConnect ?",o:["Un dispositif qui permet d'accéder à de nombreux services publics en ligne avec un compte déjà existant","Un réseau wifi public gratuit","La messagerie sécurisée des agents de l'État","Le moteur de recherche de l'administration"],a:0,e:"Identification unique (via impots.gouv, ameli, La Poste…).",s:"Entraînement, Q26"},
{id:"e-27",t:"num",q:"Que désigne l'informatique en nuage (cloud) ?",o:["L'utilisation de ressources informatiques à distance via Internet","Un réseau sans fil à longue portée","La prévision météorologique par ordinateur","Le stockage exclusif sur clé USB"],a:0,e:"SaaS, PaaS, IaaS : logiciel, plateforme ou infrastructure « en tant que service ».",s:"Entraînement, Q27"},
{id:"e-28",t:"num",q:"Quelle autorité est chargée de la sécurité des systèmes d'information de l'État ?",o:["La CNIL","L'ANSSI","L'ARCOM","L'ARCEP"],a:1,e:"ANSSI (2009), rattachée au SGDSN. La CNIL protège les données personnelles.",s:"Entraînement, Q28"},
{id:"e-29",t:"num",q:"Selon quel critère le règlement européen sur l'IA (AI Act) classe-t-il les systèmes d'IA ?",o:["Leur prix","Leur niveau de risque","Leur pays d'origine","Leur nombre d'utilisateurs"],a:1,e:"Risque inacceptable (interdit), élevé, limité, minimal.",s:"Entraînement, Q29"},
{id:"e-30",t:"num",q:"Qu'est-ce qu'un logiciel libre ?",o:["Un logiciel forcément gratuit","Un logiciel sans aucune licence","Un logiciel réservé aux administrations","Un logiciel dont le code source peut être consulté, modifié et redistribué selon sa licence"],a:3,e:"Libre ne veut pas dire gratuit : c'est une question de libertés accordées par la licence.",s:"Entraînement, Q30"},
{id:"e-31",t:"log",q:"Quel nombre suit : 3 – 6 – 12 – 24 – ?",o:["36","42","48","50"],a:2,e:"Chaque terme double.",s:"Entraînement, Q31"},
{id:"e-32",t:"log",q:"Quel nombre suit : 2 – 3 – 5 – 8 – 12 – 17 – ?",o:["21","22","23","24"],a:2,e:"Écarts 1, 2, 3, 4, 5, puis 6 : 17 + 6 = 23.",s:"Entraînement, Q32"},
{id:"e-33",t:"log",q:"Complétez la série : B2 – D4 – F6 – H8 – ?",o:["I9","J10","K10","J12"],a:1,e:"Une lettre sur deux, nombre = rang de la lettre : J = 10.",s:"Entraînement, Q33"},
{id:"e-34",t:"log",q:"Si nous sommes mercredi, quel jour serons-nous dans 100 jours ?",o:["Jeudi","Vendredi","Samedi","Dimanche"],a:1,e:"100 = 14 × 7 + 2 : mercredi + 2 = vendredi.",s:"Entraînement, Q34"},
{id:"e-35",t:"log",q:"Un prix augmente de 20 %, puis baisse de 20 %. Quelle est sa variation globale ?",o:["0 %","−2 %","−4 %","+4 %"],a:2,e:"1,2 × 0,8 = 0,96, soit −4 %.",s:"Entraînement, Q35"},
{id:"e-36",t:"log",q:"Si CHAT s'écrit 3-8-1-20, comment s'écrit LOUP ?",o:["12-15-21-16","11-15-21-16","12-14-21-16","12-15-20-16"],a:0,e:"Rang dans l'alphabet : L = 12, O = 15, U = 21, P = 16.",s:"Entraînement, Q36"},
{id:"e-37",t:"log",q:"On lance deux dés équilibrés. Quelle est la probabilité que la somme fasse 7 ?",o:["1/12","1/9","1/6","1/3"],a:2,e:"6 cas favorables sur 36 : (1,6), (2,5), (3,4), (4,3), (5,2), (6,1).",s:"Entraînement, Q37"},
{id:"e-38",t:"log",q:"Trouvez l'intrus.",o:["Euro","Livre sterling","Yen","Nasdaq"],a:3,e:"Le Nasdaq est un indice boursier, pas une monnaie.",s:"Entraînement, Q38"},
{id:"e-39",t:"log",q:"Paul est plus grand que Marc, Marc plus grand que Léa, Léa plus grande que Tom. Qui est le deuxième plus petit ?",o:["Marc","Paul","Tom","Léa"],a:3,e:"Du plus grand au plus petit : Paul, Marc, Léa, Tom.",s:"Entraînement, Q39"},
{id:"e-40",t:"log",q:"Cinq machines fabriquent cinq pièces en cinq minutes. Combien de minutes faut-il à cent machines pour fabriquer cent pièces ?",o:["1","5","20","100"],a:1,e:"Une machine fait une pièce en 5 minutes ; 100 machines font 100 pièces en 5 minutes.",s:"Entraînement, Q40"},
{id:"e-41",t:"ang",q:"Complete: « I have been working here … 2019. »",o:["for","since","during","from"],a:1,e:"Since + point de départ ; for + durée.",s:"Entraînement, Q41"},
{id:"e-42",t:"ang",q:"What does « tax return » mean?",o:["Déclaration fiscale","Remboursement d'impôt","Taux d'imposition","Retour sur investissement"],a:0,e:"Le remboursement se dit « tax refund ».",s:"Entraînement, Q42"},
{id:"e-43",t:"ang",q:"Which sentence is correct?",o:["She don't like coffee.","She doesn't likes coffee.","She doesn't like coffee.","She not like coffee."],a:2,e:"Doesn't + base verbale.",s:"Entraînement, Q43"},
{id:"e-44",t:"ang",q:"« Eventually, the minister agreed. » What does « eventually » mean?",o:["Éventuellement","Immédiatement","Probablement","Finalement"],a:3,e:"Faux ami : « éventuellement » se dit possibly.",s:"Entraînement, Q44"},
{id:"e-45",t:"ang",q:"Complete: « If I … more time, I would study English. »",o:["have","had","will have","would have"],a:1,e:"Conditionnel présent : if + prétérit, puis would + verbe.",s:"Entraînement, Q45"},

{id:"c26-01",t:"num",m:"ctrl",q:"Les opérations suivantes constituent un traitement de données personnelles, sauf une. Laquelle ?",o:["La collecte de coordonnées de prospects via un questionnaire","La création d'une carte de fidélité avec les coordonnées du client","La mise à jour d'un fichier client pour l'envoi d'une commande","La tenue d'un fichier de coordonnées d'entreprises (nom, adresse, standard, courriel générique)"],a:3,e:"Des coordonnées d'entreprise génériques ne permettent pas d'identifier une personne physique : ce ne sont pas des données personnelles.",s:"QCM contrôleur 2026, Q1"},
{id:"c26-02",t:"hg",q:"En 2014, l'Assemblée nationale a voté la réduction du nombre de régions métropolitaines de 22 à :",o:["8","10","13","15"],a:2,e:"13 régions métropolitaines depuis le 1er janvier 2016 (loi du 16 janvier 2015).",s:"QCM contrôleur 2026, Q2"},
{id:"c26-03",t:"hg",q:"Le début du règne de Louis XIV se situe pendant :",o:["L'Antiquité","L'Époque moderne","L'Histoire contemporaine","Le Moyen Âge"],a:1,e:"Louis XIV règne de 1643 à 1715. Époque moderne : 1492 (ou 1453) – 1789.",s:"QCM contrôleur 2026, Q3"},
{id:"c26-04",t:"hg",q:"Quel est l'apport majeur de la bataille de Marignan ?",o:["La chute de l'Empire romain d'Orient","Le début de la Renaissance française","Le début du siècle des Lumières","Le partage du royaume de Charlemagne"],a:1,e:"1515, début du règne de François Ier, qui fait venir la Renaissance italienne en France.",s:"QCM contrôleur 2026, Q4"},

{id:"c26-17",t:"math",q:"Un moteur tourne à 20 tours par seconde. Combien de tours effectue-t-il en 1 minute 30 secondes ?",o:["26","30","1 200","1 800"],a:3,e:"90 s × 20 = 1 800 tours.",s:"QCM contrôleur 2026, Q17"},
{id:"c26-18",t:"math",q:"Un train part à 10 h pour un terminus situé à 50 km, arrivée prévue à 11 h. Il arrive avec 36 minutes de retard. Quelle a été sa vitesse moyenne ?",o:["25 km/h","31,25 km/h","50 km/h","61,25 km/h"],a:1,e:"Durée : 1 h 36 = 1,6 h. 50 / 1,6 = 31,25 km/h.",s:"QCM contrôleur 2026, Q18"},
{id:"c26-19",t:"math",q:"Un camion avec remorque mesure 40 mètres. Combien mesure son modèle réduit à l'échelle 1/25 000 ?",o:["0,16 centimètre","0,16 millimètre","16 centimètres","16 millimètres"],a:0,e:"4 000 cm / 25 000 = 0,16 cm (1,6 mm).",s:"QCM contrôleur 2026, Q19"},
{id:"c26-20",t:"math",q:"Une commerçante achète 80 carnets à 3 € et prévoit de les revendre 4,50 €. Elle en vend 65, puis baisse le prix des restants de 40 % et écoule tout. Quel est son bénéfice ?",o:["79,50 €","93,00 €","120,00 €","333,00 €"],a:1,e:"65 × 4,50 = 292,50 ; 15 × 2,70 = 40,50 ; recette 333 € ; coût 240 € ; bénéfice 93 €.",s:"QCM contrôleur 2026, Q20"},
{id:"c26-21",t:"math",q:"Lequel de ces nombres est premier ?",o:["51","57","61","63"],a:2,e:"51 = 3 × 17 ; 57 = 3 × 19 ; 63 = 7 × 9 ; 61 est premier.",s:"QCM contrôleur 2026, Q21"},
{id:"c26-22",t:"math",q:"Une fonction est strictement croissante (sur un intervalle) si :",o:["sa dérivée est nulle","sa dérivée est positive ou nulle","sa dérivée est strictement négative","sa dérivée est strictement positive"],a:3,e:"Dérivée strictement positive ⇒ strictement croissante.",s:"QCM contrôleur 2026, Q22"},
{id:"c26-23",t:"math",q:"Températures relevées à Lyon sur 7 jours : 23, 20, 24, 19, 22, 23, 20. Quelle est la médiane ?",o:["20","21","22","23"],a:2,e:"Série classée : 19, 20, 20, 22, 23, 23, 24 ; valeur centrale (4e) : 22. (Données du diagramme du sujet.)",s:"QCM contrôleur 2026, Q23 (diagramme mis en texte)"},

{id:"c26-25",t:"log",m:"ctrl",q:"Le père de la mère du père de votre tante est votre :",o:["arrière-arrière-grand-oncle","arrière-arrière-arrière-grand-père","arrière-arrière-arrière-grand-oncle","arrière-arrière-grand-père"],a:3,e:"Le père de votre tante est votre grand-père ; sa mère, votre arrière-grand-mère ; son père, votre arrière-arrière-grand-père.",s:"QCM contrôleur 2026, Q25"},

{id:"c26-28",t:"log",m:"ctrl",q:"Quatre livres (bleu, rouge, vert, jaune). Le bleu est à gauche du vert ; le jaune, à droite du vert, ne côtoie pas le rouge ; le rouge n'est pas à une extrémité. Quel est l'ordre de gauche à droite ?",o:["Bleu, rouge, jaune, vert","Bleu, rouge, vert, jaune","Rouge, bleu, jaune, vert","Rouge, bleu, vert, jaune"],a:1,e:"Seul « bleu, rouge, vert, jaune » respecte toutes les contraintes.",s:"QCM contrôleur 2026, Q28"},

// --- Raisonnement logique ---
{id:"lo-01",t:"log",q:"Quel nombre suit : 1 – 1 – 2 – 3 – 5 – 8 – ?",o:["11","12","13","16"],a:2,e:"Chaque terme est la somme des deux précédents : 5 + 8 = 13.",s:"Banque logique"},
{id:"lo-02",t:"log",q:"Quel nombre suit : 2 – 6 – 18 – 54 – ?",o:["108","148","162","216"],a:2,e:"× 3 à chaque fois.",s:"Banque logique"},
{id:"lo-03",t:"log",q:"Quel nombre suit : 81 – 27 – 9 – 3 – ?",o:["0","1","2","1/3"],a:1,e:"÷ 3 à chaque fois.",s:"Banque logique"},
{id:"lo-04",t:"log",q:"Quel nombre suit : 1 – 8 – 27 – 64 – ?",o:["81","100","125","128"],a:2,e:"Les cubes : 1³, 2³, 3³, 4³, 5³ = 125.",s:"Banque logique"},
{id:"lo-05",t:"log",q:"Quel nombre suit : 5 – 10 – 8 – 16 – 14 – ?",o:["12","20","28","30"],a:2,e:"Alternance × 2 et − 2 : 14 × 2 = 28.",s:"Banque logique"},
{id:"lo-06",t:"log",q:"Quelle lettre suit : A – D – G – J – ?",o:["K","L","M","N"],a:2,e:"+ 3 rangs : A(1), D(4), G(7), J(10), M(13).",s:"Banque logique"},
{id:"lo-07",t:"log",q:"Quelle lettre suit : Z – X – V – T – ?",o:["S","R","Q","P"],a:1,e:"On recule de deux lettres.",s:"Banque logique"},
{id:"lo-08",t:"log",q:"Complétez : AZ – BY – CX – ?",o:["DV","DW","EW","CW"],a:1,e:"La 1re lettre avance, la 2e recule depuis Z.",s:"Banque logique"},
{id:"lo-09",t:"log",q:"Complétez : B – C – E – H – L – ?",o:["O","P","Q","R"],a:2,e:"Écarts 1, 2, 3, 4, puis 5 : L(12) + 5 = Q(17).",s:"Banque logique"},
{id:"lo-10",t:"log",q:"3 ouvriers construisent un mur en 12 jours. Combien de jours faut-il à 4 ouvriers au même rythme ?",o:["8","9","10","16"],a:1,e:"3 × 12 = 36 jours-ouvriers ; 36 / 4 = 9.",s:"Banque logique"},
{id:"lo-11",t:"log",q:"Tous les A sont des B. Certains B sont des C. Que peut-on conclure ?",o:["Tous les A sont des C","Certains A sont des C","Aucun A n'est un C","Rien de certain sur le lien entre A et C"],a:3,e:"Les B qui sont des C ne sont pas forcément des A.",s:"Banque logique"},
{id:"lo-12",t:"log",q:"Tous les inspecteurs sont fonctionnaires. Paul n'est pas fonctionnaire. Donc :",o:["Paul est inspecteur","Paul n'est pas inspecteur","Paul est contrôleur","On ne peut rien dire"],a:1,e:"Contraposée : non-fonctionnaire ⇒ non-inspecteur.",s:"Banque logique"},
{id:"lo-13",t:"log",q:"Le 1er janvier d'une année non bissextile est un jeudi. Quel jour sera le 1er janvier de l'année suivante ?",o:["Jeudi","Vendredi","Samedi","Mercredi"],a:1,e:"365 = 52 × 7 + 1 : on avance d'un jour.",s:"Banque logique"},
{id:"lo-14",t:"log",q:"Le vendredi 16 octobre 2026, quel jour de la semaine tombera le 7 décembre 2026 ?",o:["Dimanche","Lundi","Mardi","Mercredi"],a:1,e:"15 jours jusqu'au 31 octobre + 30 + 7 = 52 jours = 7 × 7 + 3 : vendredi + 3 = lundi.",s:"Banque logique"},
{id:"lo-15",t:"log",q:"On lance deux pièces. Quelle est la probabilité d'obtenir au moins une fois « face » ?",o:["1/4","1/2","2/3","3/4"],a:3,e:"1 − probabilité de deux « pile » = 1 − 1/4 = 3/4.",s:"Banque logique"},
{id:"lo-16",t:"log",q:"Quel angle forment les aiguilles d'une horloge à 3 h 30 ?",o:["60°","75°","90°","105°"],a:1,e:"Petite aiguille à 105° (3,5 × 30°), grande à 180° : 75°.",s:"Banque logique"},
{id:"lo-17",t:"log",q:"Trouvez l'intrus : 3 – 5 – 9 – 11 – 13",o:["3","5","9","13"],a:2,e:"9 = 3 × 3 n'est pas premier.",s:"Banque logique"},
{id:"lo-18",t:"log",q:"Quel mot est l'anagramme de CHIEN ?",o:["NICHE","CHAINE","CHIENNE","NICHER"],a:0,e:"Mêmes lettres : C, H, I, E, N.",s:"Banque logique"},
{id:"lo-19",t:"log",q:"Un père a 40 ans et son fils 10 ans. Dans combien d'années le père aura-t-il le double de l'âge de son fils ?",o:["10","15","20","30"],a:2,e:"40 + x = 2 (10 + x) donne x = 20.",s:"Banque logique"},
{id:"lo-20",t:"log",q:"2 crayons et 1 gomme coûtent 3 € ; 1 crayon et 1 gomme coûtent 2 €. Combien coûte une gomme ?",o:["0,50 €","1 €","1,50 €","2 €"],a:1,e:"La différence donne 1 crayon = 1 €, donc gomme = 1 €.",s:"Banque logique"},
{id:"lo-21",t:"log",q:"Pierre a deux fois l'âge de Jean. Dans 5 ans, la somme de leurs âges sera 40. Quel âge a Pierre ?",o:["15","20","25","30"],a:1,e:"3J + 10 = 40, donc J = 10 et P = 20.",s:"Banque logique"},
{id:"lo-22",t:"log",q:"Chaque fille d'une famille a autant de frères que de sœurs ; chaque garçon a deux fois plus de sœurs que de frères. Combien y a-t-il d'enfants ?",o:["5","6","7","8"],a:2,e:"f − 1 = g et f = 2 (g − 1) : g = 3, f = 4, soit 7 enfants.",s:"Banque logique"},
{id:"lo-23",t:"log",q:"Si ROUGE s'écrit SPVHF, comment s'écrit VERT ?",o:["WFSU","UDQS","WGSU","XFSU"],a:0,e:"Chaque lettre avance d'un rang.",s:"Banque logique"},
{id:"lo-24",t:"log",q:"Si MER s'écrit REM, comment s'écrit SOLEIL ?",o:["LIELOS","LIOLES","SOLIEL","LEILOS"],a:0,e:"Le mot est écrit à l'envers.",s:"Banque logique"},
{id:"lo-25",t:"log",q:"Un train part toutes les 40 minutes à partir de 6 h 10. À quelle heure part le 5e train ?",o:["8 h 10","8 h 30","8 h 50","9 h 10"],a:2,e:"6 h 10 + 4 × 40 min = 6 h 10 + 2 h 40 = 8 h 50.",s:"Banque logique"},
{id:"lo-26",t:"log",q:"Un robinet remplit une baignoire en 6 minutes, un autre en 3 minutes. Ensemble, en combien de temps ?",o:["2 minutes","3 minutes","4 minutes","4 min 30"],a:0,e:"1/6 + 1/3 = 1/2 de baignoire par minute : 2 minutes.",s:"Banque logique"},
{id:"lo-27",t:"log",q:"Combien de carrés au total compte un quadrillage de 2 cases sur 2 ?",o:["4","5","6","8"],a:1,e:"4 petits carrés et 1 grand.",s:"Banque logique"},
{id:"lo-28",t:"log",q:"Si hier était dimanche, quel jour serons-nous après-demain ?",o:["Mardi","Mercredi","Jeudi","Lundi"],a:1,e:"Aujourd'hui lundi, après-demain mercredi.",s:"Banque logique"},
{id:"lo-29",t:"log",q:"Le fils du frère de mon père est mon :",o:["Neveu","Cousin","Oncle","Frère"],a:1,e:"Le frère de mon père est mon oncle ; son fils est mon cousin.",s:"Banque logique"},
{id:"lo-30",t:"log",q:"Trouvez l'intrus : Paris – Lyon – Bruxelles – Marseille",o:["Paris","Lyon","Bruxelles","Marseille"],a:2,e:"Bruxelles n'est pas en France.",s:"Banque logique"},
{id:"lo-31",t:"log",q:"Un article coûte 80 €. Il est soldé à −25 %. Quel est son nouveau prix ?",o:["55 €","60 €","64 €","70 €"],a:1,e:"80 × 0,75 = 60 €.",s:"Banque logique"},
{id:"lo-32",t:"log",q:"Quel nombre suit : 1 – 4 – 9 – 16 – 25 – ?",o:["30","34","36","49"],a:2,e:"Les carrés : 6² = 36.",s:"Banque logique"},
{id:"lo-33",t:"log",q:"Quel nombre suit : 3 – 5 – 9 – 17 – 33 – ?",o:["49","57","65","66"],a:2,e:"Chaque terme = double du précédent − 1 : 33 × 2 − 1 = 65.",s:"Banque logique"},
{id:"lo-34",t:"log",q:"Si tous les chats sont gris et que Félix est un chat, alors :",o:["Félix est gris","Tous les animaux gris sont des chats","Félix n'est peut-être pas gris","Seuls les chats sont gris"],a:0,e:"Déduction directe (syllogisme).",s:"Banque logique"},

// ---------- État ----------
const DEFAULT_SET = {mod:"insp",size:30,newMax:20,pen:0.25,act:true};
function blank(){ return {v:2,u:0,cards:{},exams:[],custom:[],del:[],daily:null,run:null,set:{...DEFAULT_SET}}; }
let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if(raw){ return normalize(JSON.parse(raw)); } } catch(e){}
  return blank();
}
// Cartes stockées sous forme compacte : [échéance, intervalle, facilité×100, répétitions, échecs, dernière révision (s), réponses, justes].
function unpackRec(r){
  if(Array.isArray(r)) return {d:r[0],i:r[1],e:r[2]/100,r:r[3],p:r[4],l:r[5]*1000,k:[r[6],r[7]]};
  const k = r.k||[0,0];
  return {d:r.d||0,i:r.i||0,e:r.e||2.5,r:r.r||0,p:r.p||0,l:r.l||0,k: k.length===6 ? [k[0]+k[2]+k[4], k[1]+k[3]+k[5]] : [k[0]||0,k[1]||0]};
}
function packRec(r){ return [r.d, r.i, Math.round(r.e*100), r.r, r.p, Math.round(r.l/1000), r.k[0], r.k[1]]; }
function normalize(s){
  const o = Object.assign(blank(), s||{});
  o.set = Object.assign({...DEFAULT_SET}, (s&&s.set)||{});
  if(!s || !s.v || s.v<2){ o.set.size = 30; o.set.newMax = Math.max(o.set.newMax||0, 20); o.daily = null; }
  o.v = 2;
  const cards = {}; for(const [id,r] of Object.entries(o.cards||{})) cards[id] = unpackRec(r);
  o.cards = cards; o.exams = o.exams||[]; o.custom = o.custom||[]; o.del = o.del||[];
  return o;
}
function serialize(){
  const cards = {}; for(const [id,r] of Object.entries(S.cards)) cards[id] = packRec(r);
  let out = JSON.stringify({...S, cards});
  if(out.length > 230000){ // garde-fou de taille du document du compte
    S.exams = S.exams.slice(0,20); S.exams.forEach((x,i)=>{ if(i>=2){ delete x.ids; delete x.ans; } });
    out = JSON.stringify({...S, cards});
  }
  return out;
}
let saveTimer=null;
function save(remoteToo=true){
  S.u = Date.now();
  try { localStorage.setItem(KEY, serialize()); } catch(e){}
  if(remoteToo){ clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote, 1500); }
}
// Fusion appareil / compte : carte par carte (révision la plus récente), examens et cartes perso par identifiant.
function merge(a, b){
  const newer = a.u >= b.u ? a : b, other = newer===a ? b : a;
  const out = normalize(JSON.parse(JSON.stringify({...newer, cards:{}})));
  out.cards = {...newer.cards};
  for(const [id, c] of Object.entries(other.cards||{})){ const m=out.cards[id]; if(!m || (c.l||0) > (m.l||0)) out.cards[id]=c; }
  const ex = new Map(); [...(other.exams||[]), ...(newer.exams||[])].forEach(e=>ex.set(e.id,e));
  out.exams = [...ex.values()].sort((x,y)=>y.at-x.at).slice(0,40);
  out.del = [...new Set([...(newer.del||[]), ...(other.del||[])])];
  const cu = new Map(); [...(other.custom||[]), ...(newer.custom||[])].forEach(c=>cu.set(c.id,c));
  out.custom = [...cu.values()].filter(c=>!out.del.includes(c.id));
  out.u = newer.u;
  return out;
}

// ---------- Stockage du compte (capacité db) ----------
const remote = {db:null, uid:null, busy:false, again:false, status:"local"};
async function initRemote(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    remote.db = db; remote.uid = uid;
    const snap = await db.doc("data/users/"+uid+"/state").get();
    if(snap.exists){
      const r = snap.data();
      const body = r && r.json ? JSON.parse(r.json) : null;
      if(body){ S = merge(S, normalize(body)); try{ localStorage.setItem(KEY, serialize()); }catch(e){} session=null; }
    }
    remote.status = "compte";
    await pushRemote();
    render();
  }catch(e){ remote.status = "local"; renderPills(); }
}
async function pushRemote(){
  if(!remote.db) return;
  if(remote.busy){ remote.again = true; return; }
  remote.busy = true;
  try{
    await remote.db.doc("data/users/"+remote.uid+"/state").set({json: serialize(), u: S.u});
    remote.status = "compte";
  }catch(e){ remote.status = (e && e.code==="quota_exceeded") ? "plein" : "local"; }
  remote.busy = false; renderPills();
  if(remote.again){ remote.again=false; pushRemote(); }
}

// ---------- Cartes ----------
function allCards(){ return BANK.concat(S.custom.map(c=>({...c, mine:1}))); }
let CARD_MAP = null;
function cardMap(){ if(!CARD_MAP){ CARD_MAP = new Map(allCards().map(c=>[c.id,c])); } return CARD_MAP; }
function invalidate(){ CARD_MAP=null; }
function themesOn(){ return MODULES[S.set.mod].t; }
function eligible(c){ return !c.d && themesOn().includes(c.t) && (S.set.act || !c.act); }
function rec(id){ return S.cards[id]; }
function newRec(){ return {d:0,i:0,e:2.5,r:0,p:0,l:0,k:[0,0]}; }
// Répétition espacée (SM-2 adapté au calendrier du concours) : 3 j, 7 j, puis intervalle × facilité, plafonné à 40 j.
function review(id, ok, relearn){
  const r = S.cards[id] || newRec();
  r.k[0]++; if(ok) r.k[1]++;
  const today = dayNum();
  r.l = Date.now();
  if(relearn){ r.d = today+1; S.cards[id]=r; return; }
  const q = ok ? 4 : 1;
  r.e = Math.max(1.3, r.e + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  if(!ok){ r.r=0; r.p++; r.i=1; }
  else { r.r++; r.i = r.r===1 ? 3 : r.r===2 ? 7 : Math.round(r.i * r.e); }
  r.i = Math.min(Math.max(r.i,1), 40);
  r.d = today + r.i;
  S.cards[id] = r;
}
function status(id){
  const r = rec(id);
  if(!r || !r.l) return "nouvelle";
  if(r.r>=2 && r.i>=7) return "acquise";
  return "en cours";
}

// ---------- Sessions ----------
let session = null;
function buildDaily(size, onlyTheme, exclude){
  const today = dayNum();
  const seedR = rng(hash("j"+today+(onlyTheme||"")+(exclude?exclude.size:"")));
  const pool = allCards().filter(c => eligible(c) && (!onlyTheme || c.t===onlyTheme) && !(exclude && exclude.has(c.id)));
  const due = pool.filter(c => rec(c.id) && rec(c.id).l && rec(c.id).d <= today)
                  .sort((a,b)=> rec(a.id).d - rec(b.id).d || rec(a.id).e - rec(b.id).e);
  let picked = due.slice(0, size);
  const newMax = onlyTheme ? size : S.set.newMax;
  if(picked.length < size){
    const fresh = pool.filter(c => !rec(c.id) || !rec(c.id).l);
    const bag = fresh.map(c => ({c, w: -Math.log(seedR()) / (WEIGHT[c.t]||1)})).sort((x,y)=>x.w-y.w).map(x=>x.c);
    picked = picked.concat(bag.slice(0, Math.min(newMax, size - picked.length)));
  }
  if(picked.length < size){
    const rest = pool.filter(c => !picked.includes(c) && rec(c.id) && rec(c.id).l).sort((a,b)=> rec(a.id).d - rec(b.id).d);
    picked = picked.concat(rest.slice(0, size - picked.length));
  }
  if(picked.length < size){
    picked = picked.concat(shuffle(pool.filter(c => !picked.includes(c)), seedR).slice(0, size - picked.length));
  }
  return interleave(picked, seedR).map(c=>c.id);
}
// Mélange des thèmes : chaque thème est réparti régulièrement sur toute la session.
function interleave(cards, r){
  const g = {}; cards.forEach(c => (g[c.t] = g[c.t] || []).push(c));
  const keyed = [];
  for(const k of Object.keys(g)){ const list = shuffle(g[k], r); const off = r(); list.forEach((c,j)=>keyed.push({c, key:(j + off)/list.length})); }
  return keyed.sort((x,y)=>x.key-y.key).map(x=>x.c);
}
function startDaily(){
  const today = dayNum();
  if(!S.daily || S.daily.day !== today || !S.daily.ids || !S.daily.ids.length){
    S.daily = {day:today, ids:buildDaily(S.set.size), pos:0, ok:0, n:0};
    save();
  }
  session = {kind:"daily", label:"Session du jour", ids:S.daily.ids.slice(), pos:S.daily.pos, relearn:new Set(S.daily.relearn||[]), ok:S.daily.ok||0, n:S.daily.n||0, seen:{}};
  session.picked = null;
}
function startExtra(ids, label){
  session = {kind:"extra", label, ids, pos:0, relearn:new Set(), ok:0, n:0, seen:{}, picked:null};
  go("jour");
}
function permFor(id, salt){ return shuffle([0,1,2,3], rng(hash(id+"|"+salt))); }

// ----- Aujourd'hui -----
function viewJour(m){
  if(!session) startDaily();
  if(session.pos >= session.ids.length) return viewSessionEnd(m);
  const id = session.ids[session.pos];
  const c = cardMap().get(id);
  if(!c){ session.pos++; return viewJour(m); }
  const perm = permFor(id, session.kind+dayNum());
  const relearn = session.relearn.has(id) && session.seen[id];
  const r = rec(id);
  const total = session.ids.length;
  const answered = session.picked != null;
  const optsHtml = perm.map((oi, k) => {
    let cls = "opt";
    if(answered){ if(oi===c.a) cls+=" right"; else if(k===session.picked) cls+=" wrong"; }
    return `<button class="${cls}" data-pick="${k}" ${answered?"disabled":""}><span class="box">${k+1}</span><span class="t">${esc(c.o[oi])}</span></button>`;
  }).join("");
  const ok = answered && perm[session.picked]===c.a;
  m.innerHTML = `
  <section class="stack">
    <div>
      <div class="row" style="justify-content:space-between"><h2>${esc(session.label)}</h2><span class="kbd">${Math.min(session.pos+1,total)} / ${total}</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${(session.pos/total)*100}%"></i></div>
    </div>
    <article class="sheet">
      <div class="meta">
        <span class="tag">${esc(THEMES[c.t].s)}</span>
        ${!r||!r.l?'<span class="tag plain">Nouvelle</span>':''}
        ${relearn?'<span class="tag bad">À reprendre</span>':''}
        ${c.act?'<span class="tag warn">Actualité datée</span>':''}
        ${c.mine?'<span class="tag ok">Ma carte</span>':''}
      </div>
      <p class="q">${esc(c.q)}</p>
      <div class="opts ${answered?"locked":""}">${optsHtml}</div>
      ${answered?explHtml(c, ok?"ok":"bad", ok?"Bonne réponse":"Mauvaise réponse"):""}
      <div class="foot">
        ${answered?`<button class="btn primary" data-act="next">Question suivante</button>`:`<button class="btn ghost" data-act="skip">Passer</button>`}
      </div>
    </article>
  </section>`;
}
function viewSessionEnd(m){
  const rate = session.n ? Math.round(session.ok*100/session.n) : 0;
  m.innerHTML = `
  <section class="stack">
    <article class="sheet">
      <h2>${session.kind==="daily"?"Session du jour terminée":"Série terminée"}</h2>
      <p class="sub">${session.n} réponses · ${rate} % de réussite</p>
      <div class="row">
        <button class="btn primary" data-act="more">Encore 10 questions</button>
        <button class="btn" data-go="examen">Examen blanc</button>
        <button class="btn" data-go="progres">Progrès</button>
      </div>
    </article>
  </section>`;
}
function pick(k){
  if(!session || session.picked!=null) return;
  const id = session.ids[session.pos];
  const c = cardMap().get(id);
  const perm = permFor(id, session.kind+dayNum());
  session.picked = k;
  const ok = perm[k]===c.a;
  const isRelearn = session.relearn.has(id) && session.seen[id];
  review(id, ok, isRelearn);
  session.seen[id]=1;
  session.n++; if(ok) session.ok++;
  if(!ok && !session.relearn.has(id)){ session.relearn.add(id); session.ids.push(id); }
  persistSession();
  render();
}
function next(){
  if(!session) return;
  session.pos++; session.picked = null; persistSession(); render();
}
function persistSession(){
  if(session.kind==="daily"){ S.daily = {day:dayNum(), ids:session.ids, pos:session.pos, ok:session.ok, n:session.n, relearn:[...session.relearn]}; }
  save();
}

// ----- Examen blanc -----
let tick = null;
let lastResult = null;
function buildExam(kind){
  const E = EXAMS[kind];
  const usable = allCards().filter(c=>!c.d && !c.mine && (S.set.act || !c.act));
  let ids = [];
  for(const [t,n] of E.plan){
    const pool = t==="cg" ? usable.filter(c=>["admin","ue","num","hg"].includes(c.t)) : usable.filter(c=>c.t===t);
    ids = ids.concat(shuffle(pool).slice(0,n).map(c=>c.id));
  }
  return ids;
}
function startExam(kind){
  const E = EXAMS[kind];
  lastResult = null;
  S.run = {id:"x"+Date.now().toString(36), kind, ids:buildExam(kind), ans:{}, start:Date.now(), dur:E.min*60000, pos:0, pen:S.set.pen};
  save(); render();
}
function examLeft(){ return S.run ? S.run.start + S.run.dur - Date.now() : 0; }
function fmtClock(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600), mi=Math.floor((s%3600)/60), se=s%60; return (h?h+" h ":"")+String(mi).padStart(2,"0")+" min "+String(se).padStart(2,"0"); }

function finishExam(timeout){
  const R = S.run; if(!R) return;
  clearInterval(tick);
  let ok=0, ko=0, ab=0; const by={}; const wrong=[];
  for(const id of R.ids){
    const c = cardMap().get(id); if(!c) continue;
    const t = c.t; by[t] = by[t] || [0,0,0,0];
    const a = R.ans[id]; by[t][0]++;
    if(a==null || a===-1){ ab++; by[t][3]++; continue; }
    const perm = permFor(id, R.id);
    if(perm[a]===c.a){ ok++; by[t][1]++; } else { ko++; by[t][2]++; wrong.push(id);
      const r = S.cards[id] || newRec(); r.d = dayNum(); r.r = 0; r.i = 1; r.p++; r.l = Date.now(); S.cards[id] = r; }
  }
  const raw = ok - R.pen*ko;
  const note = Math.max(0, raw) / R.ids.length * 20;
  const res = {id:R.id, kind:R.kind, at:Date.now(), n:R.ids.length, ok, ko, ab, pen:R.pen, raw, note, by, wrong, timeout:!!timeout, ids:R.ids, ans:R.ans};
  S.exams.unshift(res); S.exams = S.exams.slice(0,40);
  S.exams.forEach((x,i)=>{ if(i>=5){ delete x.ids; delete x.ans; } });
  S.run = null; save();
  lastResult = res; tab="examen"; render();
}
