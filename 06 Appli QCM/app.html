<title>QCM · Prépa DGFiP 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* --- Copie de « 07 Charte DA/tokens.css » puis « composants.css » : les mettre à jour ensemble. --- */
/* =====================================================================
   Charte « Copie double » · Prépa DGFiP 2027
   Socle commun aux deux applis : QCM DGFiP 2027 et Atelier QRC compta.
   Concept : la copie d'examen. Papier crème, encre bleue, chiffres en
   machine à écrire, surligneur jaune pour ce qui compte.
   Chaque appli choisit sa couleur d'encre avec <body data-app="qcm|qrc">.
   ===================================================================== */

/* Polices (à charger dans le <head>) :
   https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap */

:root {
  /* Papier et encre */
  --paper: #F5F3EE;
  --surface: #FFFFFF;
  --sunk: #F0EDE6;
  --ink: #16213A;
  --muted: #5A6377;
  --line: #DAD5CA;
  --rule: #E8E4DB;
  --shadow: 0 1px 0 rgba(22, 33, 58, .04), 0 1px 3px rgba(22, 33, 58, .06);
  --shadow-lift: 0 2px 4px rgba(22, 33, 58, .06), 0 8px 24px rgba(22, 33, 58, .08);

  /* Encre de chaque appli (accent d'action) */
  --qcm: #2A44C7;      --qcm-soft: #E7EBFB;
  --qrc: #0E6871;      --qrc-soft: #E0F0F0;
  --accent: var(--qcm); --accent-soft: var(--qcm-soft); --on-accent: #FFFFFF;

  /* Surligneur : signature de la marque, jamais pour un état */
  --hl: #FFE45E;       --hl-ink: #16213A;

  /* États (toujours doublés d'un pictogramme ou d'un mot) */
  --ok: #217A3C;       --ok-soft: #E2F2E5;
  --bad: #B8322A;      --bad-soft: #FAE6E2;
  --warn: #8F5600;     --warn-soft: #FBEFD5;

  /* Typographie */
  --f-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --t-xs: .75rem;   /* 12 : mentions, axes */
  --t-sm: .8125rem; /* 13 : métadonnées, légendes */
  --t-md: .9375rem; /* 15 : interface */
  --t-base: 1rem;   /* 16 : texte courant, énoncés */
  --t-lg: 1.125rem; /* 18 : question, sous-titre */
  --t-xl: 1.375rem; /* 22 : titre de section */
  --t-2xl: 1.75rem; /* 28 : titre de page */
  --t-3xl: 2.5rem;  /* 40 : chiffre clé */

  /* Espacements (base 4) et rayons */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --tap: 44px;
  --content: 960px;
}

[data-app="qrc"] { --accent: var(--qrc); --accent-soft: var(--qrc-soft); }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141F; --surface: #171E2C; --sunk: #121825; --ink: #E8ECF4; --muted: #9BA4B8;
    --line: #2B3447; --rule: #222A3A;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
    --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --on-accent: #0F141F;
    --hl: #5A4E12; --hl-ink: #FFF3B8;
    --ok: #6BCB86; --ok-soft: #143222; --bad: #FF8A7D; --bad-soft: #3B1D1E; --warn: #E8B158; --warn-soft: #36290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141F; --surface: #171E2C; --sunk: #121825; --ink: #E8ECF4; --muted: #9BA4B8;
  --line: #2B3447; --rule: #222A3A;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
  --qcm: #93A5FF; --qcm-soft: #1F2850; --qrc: #62C3CB; --qrc-soft: #12313A; --on-accent: #0F141F;
  --hl: #5A4E12; --hl-ink: #FFF3B8;
  --ok: #6BCB86; --ok-soft: #143222; --bad: #FF8A7D; --bad-soft: #3B1D1E; --warn: #E8B158; --warn-soft: #36290F;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: var(--t-base); line-height: 1.55; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--content); margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* Titres : serif pour la voix « copie », sans-serif pour l'outil */
.h-page { font-family: var(--f-display); font-size: var(--t-2xl); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.h-sec { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 600; line-height: 1.2; }
.h-card { font-size: var(--t-base); font-weight: 600; }
.eyebrow { font-size: var(--t-xs); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 64ch; }
.small { font-size: var(--t-sm); }
.muted { color: var(--muted); }

/* Surligné : un mot ou un chiffre par écran, pas plus */
mark.hl { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .12em; margin: 0 -.06em; }

/* ---------- Barre d'appli ---------- */
.appbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.appbar-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; text-decoration: none; color: inherit; }
.brand-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-t b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-t small { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-r { display: flex; align-items: center; gap: var(--s3); flex: none; }

/* Logo : tuile d'encre 32 px, pictogramme blanc trait 2 px */
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18); }
.logo svg { width: 22px; height: 22px; }
.logo.lg { width: 64px; height: 64px; border-radius: 16px; }
.logo.lg svg { width: 40px; height: 40px; }
.logo.qcm { background: var(--qcm); }
.logo.qrc { background: var(--qrc); }

/* Tampon compte à rebours : signature, en surligneur */
.stamp { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px 4px; background: var(--hl); color: var(--hl-ink); border-radius: 4px; transform: rotate(-1.5deg); font-size: var(--t-xs); white-space: nowrap; }
.stamp b { font-family: var(--f-num); font-size: .95rem; font-weight: 600; letter-spacing: -.02em; }

/* Bascule de profil */
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-pill); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); font-size: var(--t-sm); font-weight: 600; color: var(--muted); cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* Bascule clair / sombre */
.theme-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn svg { width: 18px; height: 18px; }

/* Retour à l'accueil du site (GitHub Pages uniquement) */
.home-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); }
.home-btn:hover { border-color: var(--accent); color: var(--accent); }
.home-btn svg { width: 18px; height: 18px; }

/* Onglets (≥ 720 px) */
.tabs { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; }
.tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px 11px; font-size: var(--t-md); font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a svg { width: 18px; height: 18px; opacity: .8; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs a[aria-current="page"] svg { color: var(--accent); opacity: 1; }
.tabs .count { font-family: var(--f-num); font-size: var(--t-xs); background: var(--accent-soft); color: var(--accent); padding: 0 6px; border-radius: var(--r-pill); }

/* Barre du bas (< 720 px) : à portée de pouce */
.bottomnav { display: none; }
@media (max-width: 719px) {
  .tabs { display: none; }
  .bottomnav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; inset: auto 0 0 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; min-height: 56px; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; position: relative; }
  .bottomnav a svg { width: 22px; height: 22px; }
  .bottomnav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .bottomnav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .appbar-in { min-height: 54px; }
  .brand-t small, .stamp span { display: none; }
  .appbar .seg { display: none; } /* le profil se règle dans « Réglages » sur mobile */
}

/* ---------- Mise en page ---------- */
.page { display: flex; flex-direction: column; gap: var(--s5); padding-block: var(--s5) var(--s7); }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(var(--min, 200px), 1fr)); }
.split { display: grid; gap: var(--s5); grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
@media (max-width: 879px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* Feuille : la carte de base */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.sheet.tight { padding: var(--s4); gap: var(--s3); }
.sheet.flat { box-shadow: none; background: var(--sunk); border-color: transparent; }
@media (max-width: 519px) { .sheet { padding: var(--s4); border-radius: var(--r-md); } }

/* Héros de page : marge rouge discrète de copie double */
.hero { display: flex; flex-direction: column; gap: var(--s2); padding-left: var(--s4); border-left: 3px solid var(--accent); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-md); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: var(--t-sm); border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--f-num); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--muted); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; line-height: 1.5; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.out { background: none; border: 1px solid var(--line); }
.badge.mono { font-family: var(--f-num); font-weight: 500; }

/* ---------- Chiffres clés ---------- */
.stats { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-num); font-size: 1.6rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat b small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.stat span { font-size: var(--t-sm); color: var(--muted); }
.stat .delta { font-family: var(--f-num); font-size: var(--t-xs); font-weight: 600; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }

/* ---------- Progression ---------- */
.meter { height: 6px; border-radius: var(--r-pill); background: var(--rule); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.track { position: relative; height: 12px; border-radius: var(--r-pill); background: var(--rule); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
.track .fill.ok { background: var(--ok); } .track .fill.bad { background: var(--bad); }
.track .jury { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.track .jury::after { content: attr(data-l); position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-family: var(--f-num); font-size: 10px; color: var(--muted); white-space: nowrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 3px; background: var(--rule); border: 1px solid var(--line); }
.pips i.on { background: var(--accent); border-color: var(--accent); }

/* ---------- Retours (correction) ---------- */
.callout { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--accent-soft); }
.callout .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.callout .ic svg { width: 16px; height: 16px; }
.callout.ok { background: var(--ok-soft); } .callout.ok .ic { background: var(--ok); }
.callout.bad { background: var(--bad-soft); } .callout.bad .ic { background: var(--bad); }
.callout.warn { background: var(--warn-soft); } .callout.warn .ic { background: var(--warn); }
.callout h4 { font-size: var(--t-base); font-weight: 600; margin-bottom: 2px; }
.callout.ok h4 { color: var(--ok); } .callout.bad h4 { color: var(--bad); } .callout.warn h4 { color: var(--warn); }

/* ---------- Tableaux ---------- */
.tw { overflow-x: auto; margin-inline: calc(var(--s5) * -1); padding-inline: var(--s5); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
table.t th { text-align: left; font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .r { text-align: right; }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--sunk); }
table.t tr.tot td { font-weight: 600; border-top: 1.5px solid var(--ink); }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: var(--t-sm); font-weight: 600; }
.input { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: var(--t-base); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.n { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.input.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.input.is-bad { border-color: var(--bad); background: var(--bad-soft); }

/* Puces de filtre */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-sm); font-weight: 500; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* Chrono */
.clock { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); }
.clock svg { width: 16px; height: 16px; color: var(--muted); }
.clock.low { color: var(--bad); border-color: var(--bad); }

@media (prefers-reduced-motion: no-preference) {
  .btn, .opt, .chips button, .tabs a { transition: background-color .15s, border-color .15s, color .15s; }
}

/* =====================================================================
   Composants propres à chaque appli, construits sur tokens.css.
   ===================================================================== */

/* ---------- QCM : options de réponse (cases de la feuille optique) ---------- */
.question { font-size: var(--t-lg); font-weight: 600; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: var(--s2); }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; width: 100%; min-height: 54px; padding: 9px 14px 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; cursor: pointer; }
.opt .box { width: 32px; height: 32px; border: 2px solid var(--ink); border-radius: 7px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 600; font-size: .9rem; }
.opt .box svg { width: 18px; height: 18px; stroke-width: 2.6; }
.opt .t { overflow-wrap: anywhere; }
.opt .lab { font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.chosen { border-color: var(--accent); background: var(--accent-soft); }

<script>
"use strict";
// ---------- Référentiels ----------
const THEMES = {
  admin:{l:"Environnement administratif",s:"Administration",jury:52.89},
  ue:{l:"Union européenne",s:"UE",jury:50.19},
  num:{l:"Culture numérique",s:"Numérique",jury:63.39},
  log:{l:"Raisonnement logique",s:"Logique",jury:66.10},
  ang:{l:"Anglais",s:"Anglais",jury:60.74},
  fr:{l:"Français",s:"Français"},
  math:{l:"Mathématiques",s:"Maths"},
  hg:{l:"Histoire-géographie",s:"Hist.-géo"}
};
const MODULES = {
  insp:{l:"Inspecteur",t:["admin","ue","num","log","ang"]},
  ctrl:{l:"Contrôleur",t:["admin","ue","num","hg","fr","math","log"]},
  both:{l:"Les deux",t:["admin","ue","num","log","ang","hg","fr","math"]}
};
// Poids des cartes nouvelles : UE et administration d'abord (les moins réussies en 2026).
const WEIGHT = {ue:3,admin:3,num:1.4,log:1,ang:1,fr:1.3,math:1.3,hg:1.3};
const EXAMS = {
  insp:{l:"Inspecteur",n:45,min:80,plan:[["admin",10],["ue",10],["num",10],["log",10],["ang",5]],date:"2026-12-07",dl:"7 déc. 2026"},
  ctrl:{l:"Contrôleur",n:30,min:60,plan:[["cg",8],["fr",8],["math",8],["log",6]],date:"2027-01-11",dl:"11 janv. 2027"}
};
const KEY = "qcm-dgfip-2027";

// ---------- Utilitaires ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round(a*1000/b)/10 : null;
const fmtPct = v => v==null ? "—" : (Math.round(v)) + " %";
const fmtNum = (v,d=2) => (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("fr-FR");
const fmtDur = ms => { const s = Math.round((ms||0)/1000); return s < 60 ? s+" s" : Math.floor(s/60)+" min "+String(s%60).padStart(2,"0"); };
function dayNum(d=new Date()){ return Math.floor((d.getTime() - d.getTimezoneOffset()*60000)/86400000); }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function shuffle(arr, r=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function daysTo(iso){ const [y,m,d]=iso.split("-").map(Number); return dayNum(new Date(y,m-1,d)) - dayNum(); }
const SITES = {"fr.wikipedia.org":"Wikipédia","www.vie-publique.fr":"Vie publique","www.service-public.fr":"Service-public.fr","www.service-public.gouv.fr":"Service-public.fr","www.conseil-constitutionnel.fr":"Conseil constitutionnel","european-union.europa.eu":"Union européenne","www.europarl.europa.eu":"Parlement européen","www.consilium.europa.eu":"Conseil de l'UE","commission.europa.eu":"Commission européenne","www.ecb.europa.eu":"BCE","curia.europa.eu":"CJUE","www.cnil.fr":"CNIL","cyber.gouv.fr":"ANSSI","www.cybermalveillance.gouv.fr":"Cybermalveillance.gouv.fr","www.economie.gouv.fr":"Ministère de l'Économie","www.budget.gouv.fr":"Budget.gouv.fr","www.impots.gouv.fr":"impots.gouv.fr","www.insee.fr":"Insee","www.ccomptes.fr":"Cour des comptes","www.collectivites-locales.gouv.fr":"Collectivités locales","www.fonction-publique.gouv.fr":"Fonction publique","pix.fr":"Pix","www.data.gouv.fr":"data.gouv.fr","www.touteleurope.eu":"Toute l'Europe","touteleurope.eu":"Toute l'Europe","www.17cyber.gouv.fr":"17Cyber","accessibilite.numerique.gouv.fr":"Accessibilité numérique"};
function linkLabel(u){
  try{
    const x = new URL(u);
    const site = SITES[x.hostname] || x.hostname.replace(/^www\./,"");
    if(x.hostname.endsWith("wikipedia.org")){ const t=decodeURIComponent(x.pathname.split("/wiki/")[1]||"").replace(/_/g," "); return site+" : "+t; }
    return site;
  }catch(e){ return u; }
}
// Pictogrammes de la charte (trait 1,8 px, 24 × 24).
const ICO = {
  today:'<path d="M4 7.5h16M8 3.5v3M16 3.5v3"/><rect x="4" y="5" width="16" height="15.5" rx="2.5"/><path d="m9 14 2 2 4-4.5"/>',
  exam:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M10 3h4M19 6.5l-1.5 1.5"/>',
  chart:'<path d="M4 20h16M7 16.5v-5M12 16.5V6.5M17 16.5v-8"/>',
  bank:'<path d="M4 7.5 12 4l8 3.5-8 3.5z"/><path d="m4 12 8 3.5 8-3.5M4 16.5 12 20l8-3.5"/>',
  more:'<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  cross:'<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
  bolt:'<path d="M13 3 5.5 13.5H12L11 21l7.5-10.5H12z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  link:'<path d="M9.5 14.5 14.5 9.5M10 6.5 11.5 5a4 4 0 0 1 5.5 5.5L15.5 12M14 17.5 12.5 19A4 4 0 0 1 7 13.5L8.5 12"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  flag:'<path d="M5.5 21V4.5M5.5 4.5h11.5l-2.2 4 2.2 4H5.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]}</svg>`;
const plural = (n, w) => n + " " + w + (n>1 ? "s" : "");
function explHtml(c, cls, title){
  const links = (Array.isArray(c.u) ? c.u : c.u ? [c.u] : []).filter(u=>/^https:\/\//.test(u));
  const ic = cls==="ok" ? "check" : cls==="bad" ? "cross" : "info";
  return `<div class="callout ${cls||""}"><span class="ic">${ico(ic)}</span><div class="expl">${title?`<h4>${title}</h4>`:""}<p>${esc(c.e)}</p>${c.x?`<p class="more">${esc(c.x)}</p>`:""}${links.length?`<div class="srcs">${links.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ico("link")}${esc(linkLabel(u))}</a>`).join("")}</div>`:""}<p class="src">${esc(c.s||"")}</p></div></div>`;
}

// ---------- État ----------
const DEFAULT_SET = {mod:"insp",size:30,newMax:20,pen:0.25,act:true};
function blank(){ return {v:2,u:0,cards:{},exams:[],custom:[],del:[],daily:null,run:null,seen:null,set:{...DEFAULT_SET}}; }
let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if(raw){ return normalize(JSON.parse(raw)); } } catch(e){}
  return blank();
}
// Cartes stockées sous forme compacte : [échéance, intervalle, facilité×100, répétitions, échecs, dernière révision (s), réponses, justes].
function unpackRec(r){
  if(Array.isArray(r)) return {d:r[0],i:r[1],e:r[2]/100,r:r[3],p:r[4],l:r[5]*1000,k:[r[6],r[7]]};
  const k = r.k||[0,0];
  return {d:r.d||0,i:r.i||0,e:r.e||2.5,r:r.r||0,p:r.p||0,l:r.l||0,k: k.length===6 ? [k[0]+k[2]+k[4], k[1]+k[3]+k[5]] : [k[0]||0,k[1]||0]};
}
function packRec(r){ return [r.d, r.i, Math.round(r.e*100), r.r, r.p, Math.round(r.l/1000), r.k[0], r.k[1]]; }
function normalize(s){
  const o = Object.assign(blank(), s||{});
  o.set = Object.assign({...DEFAULT_SET}, (s&&s.set)||{});
  if(!s || !s.v || s.v<2){ o.set.size = 30; o.set.newMax = Math.max(o.set.newMax||0, 20); o.daily = null; }
  o.v = 2;
  const cards = {}; for(const [id,r] of Object.entries(o.cards||{})) cards[id] = unpackRec(r);
  o.cards = cards; o.exams = o.exams||[]; o.custom = o.custom||[]; o.del = o.del||[];
  return o;
}
function serialize(){
  const cards = {}; for(const [id,r] of Object.entries(S.cards)) cards[id] = packRec(r);
  let out = JSON.stringify({...S, cards});
  if(out.length > 800000){ // garde-fou de taille du document du compte (Firestore : 1 Mo)
    S.exams = S.exams.slice(0,20); S.exams.forEach((x,i)=>{ if(i>=2){ delete x.ids; delete x.ans; } });
    out = JSON.stringify({...S, cards});
  }
  return out;
}
function save(remoteToo=true){
  S.u = Date.now();
  try { localStorage.setItem(KEY, serialize()); } catch(e){}
  if(remoteToo && window.PrepaSync) PrepaSync.changed("qcm");
}
// Fusion appareil / compte : carte par carte (révision la plus récente), examens et cartes perso par identifiant.
function merge(a, b){
  const newer = a.u >= b.u ? a : b, other = newer===a ? b : a;
  const out = normalize(JSON.parse(JSON.stringify({...newer, cards:{}})));
  out.cards = {...newer.cards};
  for(const [id, c] of Object.entries(other.cards||{})){ const m=out.cards[id]; if(!m || (c.l||0) > (m.l||0)) out.cards[id]=c; }
  const ex = new Map(); [...(other.exams||[]), ...(newer.exams||[])].forEach(e=>ex.set(e.id,e));
  out.exams = [...ex.values()].sort((x,y)=>y.at-x.at).slice(0,40);
  out.del = [...new Set([...(newer.del||[]), ...(other.del||[])])];
  const cu = new Map(); [...(other.custom||[]), ...(newer.custom||[])].forEach(c=>cu.set(c.id,c));
  out.custom = [...cu.values()].filter(c=>!out.del.includes(c.id));
  const sa = newer.seen, sb = other.seen;
  if(sa && sb && sa.day===sb.day) out.seen = {day:sa.day, ids:[...new Set([...sa.ids, ...sb.ids])]};
  out.u = newer.u;
  return out;
}

// ---------- Synchro du compte (commun/sync.js) ----------
// L'examen en cours reste propre à l'appareil : il n'est ni envoyé ni remplacé par la synchro.
function initSync(){
  if(!window.PrepaSync) return;
  PrepaSync.attach("qcm", {
    get: () => { const o = JSON.parse(serialize()); delete o.run; return o; },
    merge: o => {
      const run = S.run;
      S = merge(S, normalize(o)); S.run = run;
      try { localStorage.setItem(KEY, serialize()); } catch(e){}
      invalidate();
      const a = document.activeElement;
      if(a && a.closest && a.closest("input,textarea,select")) renderPills(); else render();
    }
  });
  PrepaSync.onStatus(() => renderPills());
}

// ---------- Cartes ----------
function allCards(){ return BANK.concat(S.custom.map(c=>({...c, mine:1}))); }
let CARD_MAP = null;
function cardMap(){ if(!CARD_MAP){ CARD_MAP = new Map(allCards().map(c=>[c.id,c])); } return CARD_MAP; }
function invalidate(){ CARD_MAP=null; }
function themesOn(){ return MODULES[S.set.mod].t; }
function eligible(c){ return !c.d && themesOn().includes(c.t) && (S.set.act || !c.act); }
function rec(id){ return S.cards[id]; }
function newRec(){ return {d:0,i:0,e:2.5,r:0,p:0,l:0,k:[0,0]}; }
// Répétition espacée (SM-2 adapté au calendrier du concours) : 3 j, 7 j, puis intervalle × facilité, plafonné à 40 j.
function review(id, ok){
  const r = S.cards[id] || newRec();
  r.k[0]++; if(ok) r.k[1]++;
  const today = dayNum();
  r.l = Date.now();
  const q = ok ? 4 : 1;
  r.e = Math.max(1.3, r.e + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  if(!ok){ r.r=0; r.p++; r.i=1; }
  else { r.r++; r.i = r.r===1 ? 3 : r.r===2 ? 7 : Math.round(r.i * r.e); }
  r.i = Math.min(Math.max(r.i,1), 40);
  r.d = today + r.i;
  S.cards[id] = r;
}
function status(id){
  const r = rec(id);
  if(!r || !r.l) return "nouvelle";
  if(r.r>=2 && r.i>=7) return "acquise";
  return "en cours";
}

// ---------- Sessions ----------
let session = null;
// Questions déjà posées aujourd'hui (sessions et examens) : jamais deux fois le même jour.
function seenToday(){ const d = dayNum(); if(!S.seen || S.seen.day!==d) S.seen = {day:d, ids:[]}; return S.seen; }
function wasSeen(id){ return !!S.seen && S.seen.day===dayNum() && S.seen.ids.includes(id); }
function markSeen(ids){ const s = seenToday(); for(const id of ids) if(!s.ids.includes(id)) s.ids.push(id); }
function buildDaily(size, onlyTheme, exclude){
  const today = dayNum();
  const seen = new Set(seenToday().ids);
  const seedR = rng(hash("j"+today+(onlyTheme||"")+seen.size+(exclude?exclude.size:"")));
  const pool = allCards().filter(c => eligible(c) && (!onlyTheme || c.t===onlyTheme) && !seen.has(c.id) && !(exclude && exclude.has(c.id)));
  const due = pool.filter(c => rec(c.id) && rec(c.id).l && rec(c.id).d <= today)
                  .sort((a,b)=> rec(a.id).d - rec(b.id).d || rec(a.id).e - rec(b.id).e);
  let picked = due.slice(0, size);
  const newMax = onlyTheme ? size : S.set.newMax;
  // tirage pondéré des nouvelles questions : UE et administration d'abord
  const bag = pool.filter(c => !rec(c.id) || !rec(c.id).l)
    .map(c => ({c, w: -Math.log(seedR()) / (WEIGHT[c.t]||1)})).sort((x,y)=>x.w-y.w).map(x=>x.c);
  if(picked.length < size){
    picked = picked.concat(bag.slice(0, Math.min(newMax, size - picked.length)));
  }
  if(picked.length < size){
    const rest = pool.filter(c => !picked.includes(c) && rec(c.id) && rec(c.id).l).sort((a,b)=> rec(a.id).d - rec(b.id).d);
    picked = picked.concat(rest.slice(0, size - picked.length));
  }
  if(picked.length < size){
    const set = new Set(picked);
    picked = picked.concat(bag.filter(c => !set.has(c)).slice(0, size - picked.length));
  }
  return interleave(picked, seedR).map(c=>c.id);
}
// Mélange des thèmes : chaque thème est réparti régulièrement sur toute la session.
function interleave(cards, r){
  const g = {}; cards.forEach(c => (g[c.t] = g[c.t] || []).push(c));
  const keyed = [];
  for(const k of Object.keys(g)){ const list = shuffle(g[k], r); const off = r(); list.forEach((c,j)=>keyed.push({c, key:(j + off)/list.length})); }
  return keyed.sort((x,y)=>x.key-y.key).map(x=>x.c);
}
function startDaily(){
  const today = dayNum();
  if(!S.daily || S.daily.day !== today || !S.daily.ids || !S.daily.ids.length){
    S.daily = {day:today, ids:buildDaily(S.set.size), pos:0, ok:0, n:0};
    save();
  }
  session = {kind:"daily", label:"Session du jour", ids:S.daily.ids.slice(), pos:S.daily.pos, ok:S.daily.ok||0, n:S.daily.n||0, picked:null};
}
function startExtra(ids, label){
  if(!ids.length){ toast("Plus de question disponible aujourd'hui."); return; }
  session = {kind:"extra", label, ids, pos:0, ok:0, n:0, picked:null};
  go("jour");
}
function permFor(id, salt){ return shuffle([0,1,2,3], rng(hash(id+"|"+salt))); }

// ---------- Rendu ----------
// Cinq destinations ; « Réglages » donne aussi accès aux cartes perso. [clé, onglet, pictogramme, libellé de la barre du bas]
const TABS = [["jour","Entraînement","today","Entraînement"],["examen","Épreuves","exam","Épreuves"],["progres","Progrès","chart","Progrès"],["banque","Banque","bank","Banque"],["reglages","Réglages","sliders","Réglages"]];
// Pages rattachées à l'onglet Réglages
const IN_PLUS = ["ajout"];
let tab = "jour";
try { const h = location.hash.replace("#","").replace(/^plus$/,"reglages"); if(TABS.some(t=>t[0]===h) || IN_PLUS.includes(h)) tab=h; } catch(e){}
function go(t){ tab=t; render(); window.scrollTo({top:0}); }
function renderTabs(){
  const cur = IN_PLUS.includes(tab) ? "reglages" : tab;
  const due = allCards().filter(c=>eligible(c) && rec(c.id) && rec(c.id).l && rec(c.id).d<=dayNum()).length;
  const link = ([k,l,i,s], bottom) => `<a href="#${k}" data-tab="${k}"${cur===k?' aria-current="page"':""}>${ico(i)}${bottom?`<span>${s}</span>`:l}${!bottom && k==="jour" && due?` <span class="count" title="${plural(due,"question")} à revoir">${due}</span>`:""}</a>`;
  $("#tabs").innerHTML = TABS.map(t => link(t, false)).join("");
  $("#bottomnav").innerHTML = TABS.map(t => link(t, true)).join("");
}
function segHtml(){
  return [["insp","Inspecteur","Inspecteur"],["ctrl","Contrôleur","Contrôleur"]].map(([k,s,l]) => `<button type="button" data-mod="${k}" aria-pressed="${S.set.mod===k}" title="Module ${l.toLowerCase()}">${s}</button>`).join("");
}
function saveStatus(){ return window.PrepaSync ? PrepaSync.label() : "sur cet appareil"; }
function renderPills(){
  const e = EXAMS[S.set.mod==="ctrl"?"ctrl":"insp"];
  const d = daysTo(e.date);
  $("#stamp").innerHTML = `<b>J-${Math.max(d,0)}</b>`;
  $("#stamp").title = `Écrit ${e.l.toLowerCase()} · ${e.dl}`;
  $("#seg").innerHTML = segHtml();
  const st = $("#save-st"); if(st) st.textContent = saveStatus();
}
function render(){
  invalidate(); renderTabs();
  const m = $("#main");
  m.classList.toggle("fit", tab==="jour" || (tab==="examen" && !!S.run));

function pick(k){
  if(!session || session.picked!=null) return;
  const id = session.ids[session.pos];
  const c = cardMap().get(id);

  session.picked = k;

function xAnswer(v){
  const R = S.run; if(!R) return;
  const id = R.ids[R.pos];
  if(R.ans[id]===v){ delete R.ans[id]; save(); render(); return; }
  const full = () => R.ids.every(i=>R.ans[i]!=null), was = full();
  R.ans[id] = v; save(); render();
  if(!was && full()) toast("Toutes les questions ont une réponse : tu peux rendre la copie.");
  const pos = R.pos, rid = R.id;
  if(pos < R.ids.length-1) setTimeout(()=>{ if(S.run && S.run.id===rid && S.run.pos===pos && tab==="examen"){ S.run.pos++; save(); render(); } }, 250);
}
function buildExam(kind){
  const E = EXAMS[kind];
  const usable = allCards().filter(c=>!c.d && !c.mine && (S.set.act || !c.act));
  const seen = new Set(seenToday().ids);
  let ids = [];
  for(const [t,n] of E.plan){
    const pool = t==="cg" ? usable.filter(c=>["admin","ue","num","hg"].includes(c.t)) : usable.filter(c=>c.t===t);
    // questions pas encore vues aujourd'hui d'abord ; les autres seulement si la banque du thème est épuisée
    const fresh = shuffle(pool.filter(c=>!seen.has(c.id))), old = shuffle(pool.filter(c=>seen.has(c.id)));
    ids = ids.concat(fresh.concat(old).slice(0,n).map(c=>c.id));
  }
  return ids;
}
function startExam(kind){
  const E = EXAMS[kind];

function finishExam(timeout){
  const R = S.run; if(!R) return;
  clearInterval(tick);
  xTime();
  let ok=0, ko=0, ab=0; const by={}; const wrong=[];
  for(const id of R.ids){

    const t = c.t; by[t] = by[t] || [0,0,0,0];
    const a = R.ans[id]; by[t][0]++;
    if(a==null || a===-1){ ab++; by[t][3]++; continue; }
    const perm = permFor(id, R.id);
    if(perm[a]===c.a){ ok++; by[t][1]++; } else { ko++; by[t][2]++; wrong.push(id);
      const r = S.cards[id] || newRec(); r.d = dayNum()+1; r.r = 0; r.i = 1; r.p++; r.l = Date.now(); S.cards[id] = r; }
  }
  const raw = ok - R.pen*ko;
  const note = Math.max(0, raw) / R.ids.length * 20;
  const tt = R.ids.reduce((s,id)=>s+((R.t||{})[id]||0), 0);
  const res = {id:R.id, kind:R.kind, at:Date.now(), n:R.ids.length, ok, ko, ab, pen:R.pen, raw, note, by, wrong, timeout:!!timeout,
    dur: Math.min(Date.now(), R.start+R.dur) - R.start, tq: Math.round(tt / R.ids.length), ids:R.ids, ans:R.ans, t:R.t||{}, flag:Object.keys(R.flag||{})};
  S.exams.unshift(res); S.exams = S.exams.slice(0,40);
  S.exams.forEach((x,i)=>{ if(i>=5){ delete x.ids; delete x.ans; delete x.t; delete x.flag; } });
  S.run = null; save();
  lastResult = res; revF = res.ko ? "ko" : "all"; tab="examen"; render();
}

function themeStats(t){
  let n=0, ok=0, seen=0, acq=0, total=0;

    total++;
    const r = rec(c.id); if(!r || !r.l) continue;
    seen++; if(status(c.id)==="acquise") acq++;
    n += r.k[0]; ok += r.k[1];
  }
  let xn=0, xok=0;
  for(const x of S.exams){ const v=x.by && x.by[t]; if(v){ xn+=v[0]; xok+=v[1]; } }
  return {n,ok,seen,acq,total,xn,xok};
}

  const [x0, x1] = S.exams;

// Évolution des notes d'examen blanc : une courbe par module (sélecteur si les deux existent), données en tableau.
let notesK = null;
function notesData(){
  const kinds = Object.keys(EXAMS).filter(k=>S.exams.some(x=>x.kind===k));
  if(!kinds.length) return {kinds, k:null, list:[]};
  let k = notesK && kinds.includes(notesK) ? notesK : (S.set.mod==="ctrl" ? "ctrl" : "insp");
  if(!kinds.includes(k)) k = kinds[0];
  return {kinds, k, list: S.exams.filter(x=>x.kind===k).slice().sort((a,b)=>a.at-b.at)};
}
function notesHtml(){
  const {kinds, k, list} = notesData();
  if(!list.length) return "";
  const day = t => new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  return `<article class="sheet">
    <div class="row between"><h2 class="h-sec">Évolution des notes · ${EXAMS[k].l.toLowerCase()}</h2>
      ${kinds.length>1?`<div class="chips" role="group" aria-label="Module">${kinds.map(q=>`<button data-notesk="${q}" aria-pressed="${q===k}">${EXAMS[q].l}</button>`).join("")}</div>`:""}</div>
    ${list.length>1 ? `<div class="chart" id="notes-chart" role="img" aria-label="Notes des ${list.length} dernières épreuves blanches ${EXAMS[k].l.toLowerCase()}, de ${fmtNum(list[0].note,1)} à ${fmtNum(list[list.length-1].note,1)} sur 20"></div>`
      : `<p class="small muted">Une seule note pour l'instant (${fmtNum(list[0].note,1)} / 20) : la courbe apparaîtra à la deuxième épreuve blanche.</p>`}
    <details><summary class="small">Voir les données</summary><div class="tw"><table class="t">
      <thead><tr><th>Date</th><th class="num">Note / 20</th><th class="num">Justes</th><th class="num">Fausses</th><th class="num">Ann</th><th class="num">Temps / q.</th></tr></thead>
      <tbody>${list.slice().reverse().map(x=>`<tr><td>${day(x.at)}</td><td class="num"><b>${fmtNum(x.note,1)}</b></td><td class="num">${x.ok}</td><td class="num">${x.ko}</td><td class="num">${x.ab}</td><td class="num">${x.tq?fmtDur(x.tq):"—"}</td></tr>`).join("")}</tbody></table></div></details>
  </article>`;
}
function drawNotes(){
  const el = $("#notes-chart"); if(!el) return;
  const {list} = notesData(); const n = list.length; if(n<2) return;
  const W = Math.max(280, el.clientWidth), H = 210, pl = 30, pr = 44, pt = 14, pb = 28;
  const X = i => pl + i*(W-pl-pr)/(n-1), Y = v => pt + (1 - v/20)*(H-pt-pb);
  const day = t => new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  const ticks = n>4 ? [0, Math.round((n-1)/2), n-1] : [...Array(n).keys()];
  const pts = list.map((x,i)=>[X(i), Y(Math.max(0,Math.min(20,x.note)))]);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    ${[0,5,10,15,20].map(v=>`<line x1="${pl}" x2="${W-pr+8}" y1="${Y(v)}" y2="${Y(v)}" class="g${v===10?" mid":""}"/><text x="${pl-8}" y="${Y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join("")}
    ${ticks.map(i=>`<text x="${X(i)}" y="${H-8}" class="ax" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${day(list[i].at)}</text>`).join("")}
    <line class="cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/>
    <polyline points="${pts.map(p=>p.join(",")).join(" ")}" class="ln"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="pt"/>`).join("")}
    <text x="${pts[n-1][0]+8}" y="${pts[n-1][1]+4}" class="last">${fmtNum(list[n-1].note,1)}</text>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="16" class="hit" data-i="${i}" tabindex="0" aria-label="${day(list[i].at)} : ${fmtNum(list[i].note,1)} sur 20"/>`).join("")}
  </svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
  const show = i => { const x = list[i], p = pts[i];
    tip.innerHTML = `<b>${fmtNum(x.note,1)} / 20</b> · ${day(x.at)}<br>${x.ok} justes · ${x.ko} fausses · ${x.ab} ann${x.tq?`<br>${fmtDur(x.tq)} par question`:""}`;
    tip.hidden = false; tip.style.left = Math.min(Math.max(p[0], 80), W-80)+"px"; tip.style.top = p[1]+"px";
    cross.setAttribute("x1",p[0]); cross.setAttribute("x2",p[0]); cross.setAttribute("visibility","visible"); };
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility","hidden"); };
  el.querySelectorAll(".hit").forEach(h => { const i = Number(h.dataset.i);
    h.addEventListener("pointerenter", ()=>show(i)); h.addEventListener("focus", ()=>show(i));
    h.addEventListener("pointerleave", hide); h.addEventListener("blur", hide); h.addEventListener("click", ()=>show(i)); });
}

function addCard(){
  const q = $("#add-q").value.trim();
  const o = [0,1,2,3].map(i=>$("#add-o"+i).value.trim());
  const a = Number((document.querySelector('input[name="add-a"]:checked')||{}).value||0);
  const u = $("#add-u").value.trim();
  const msg = $("#add-msg");
  if(!q){ msg.textContent = "Écris la question."; $("#add-q").focus(); return; }
  if(o.some(x=>!x)){ msg.textContent = "Remplis les quatre propositions."; $("#add-o"+o.findIndex(x=>!x)).focus(); return; }
  if(new Set(o.map(x=>x.toLowerCase())).size<4){ msg.textContent = "Les quatre propositions doivent être différentes."; return; }
  if(u && !/^https:\/\/\S+$/.test(u)){ msg.textContent = "Le lien doit commencer par https://"; $("#add-u").focus(); return; }
  const c = {id:"u-"+Date.now().toString(36), t:$("#add-t").value, q, o, a, e:$("#add-e").value.trim()||"Carte personnelle.", s:$("#add-s").value.trim()||"Ma carte", act:$("#add-act").checked?1:0, at:Date.now()};
  if(u) c.u = [u];
  S.custom.push(c); save(); invalidate();
  toast("Carte ajoutée.");
  render();
}
function delCard(id){
  S.custom = S.custom.filter(c=>c.id!==id); S.del.push(id); delete S.cards[id];
  if(S.daily && S.daily.ids) S.daily.ids = S.daily.ids.filter(x=>x!==id);
  if(session){ session.ids = session.ids.filter((x,k)=>x!==id||k<session.pos); }
  save(); invalidate(); toast("Carte supprimée."); render();
}

// ---------- Événements ----------
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-xrev]");
  if(tr){ const x = S.exams.find(z=>z.id===tr.dataset.xrev); if(x){ lastResult = x; revF = x.ko ? "ko" : "all"; render(); window.scrollTo({top:0}); } return; }
  const b = e.target.closest("button,a[data-tab]"); if(!b) return;
  const d = b.dataset;
  if(d.revf){ revF = d.revf; render(); return; }
  if(d.notesk){ notesK = d.notesk; render(); return; }
  if(d.tab){ e.preventDefault(); go(d.tab); return; }
  if(d.mod){ if(S.set.mod!==d.mod){ S.set.mod=d.mod; S.daily=null; session=null; save(); render(); toast("Module : "+MODULES[d.mod].l+"."); } return; }
  if(d.go){ go(d.go); return; }
  if(d.pick!=null){ pick(Number(d.pick)); return; }
  if(d.toggle!=null){ const body=b.nextElementSibling; if(body) body.hidden=!body.hidden; return; }
  if(d.exam){ startExam(d.exam); return; }
  if(d.pen!=null){ S.set.pen = Number(d.pen); save(); render(); return; }
  if(d.xpick!=null && S.run){ xAnswer(Number(d.xpick)); return; }
  if(d.xnav && S.run){ S.run.pos = Math.min(Math.max(0, S.run.pos + Number(d.xnav)), S.run.ids.length-1); save(); render(); return; }
  if(d.xgo!=null && S.run){ S.run.pos = Number(d.xgo); xsheet = false; save(); render(); return; }
  if(d.bqt){ bq.t = d.bqt; bq.lim=40; render(); return; }
  if(d.themeSession){ const t=d.themeSession; startExtra(buildDaily(30, t), "Révision ciblée · "+THEMES[t].l); return; }
  if(d.delask){ const box=$("#del-"+CSS.escape(d.delask)); if(box) box.innerHTML = `<span class="confirm">Supprimer définitivement ? <button class="btn danger" data-del="${esc(d.delask)}">Oui, supprimer</button><button class="btn" data-act="rerender">Annuler</button></span>`; return; }
  if(d.del){ delCard(d.del); return; }
  switch(d.act){
    case "next": next(); break;
    case "skip": markSeen([session.ids[session.pos]]); next(); break;
    case "more": startExtra(buildDaily(10), "10 questions de plus"); break;
    case "endask": $("#endbox").innerHTML = `<div class="confirm">Rendre la copie maintenant ? <button class="btn danger" data-act="end">Oui, rendre</button><button class="btn" data-act="rerender">Continuer</button></div>`; break;
    case "end": finishExam(false); break;
    case "xsheet": xsheet = !xsheet; render(); break;
    case "xflag": xFlag(); break;
    case "examhome": lastResult=null; render(); break;
    case "bqmore": bq.lim += 40; render(); break;
    case "rerender": render(); break;
    case "newday": S.daily=null; session=null; save(); toast("Session du jour recomposée."); go("jour"); break;
    case "copy": { const t=$("#exp"); try{ navigator.clipboard.writeText(t.value).then(()=>toast("Sauvegarde copiée."),()=>{ t.select(); toast("Texte sélectionné."); }); }catch(err){ t.select(); toast("Texte sélectionné."); } break; }
    case "import": { try{ const v=JSON.parse($("#imp").value); S = merge(S, normalize(v)); save(); invalidate(); session=null; toast("Sauvegarde importée."); render(); }catch(err){ toast("Texte illisible : colle une sauvegarde complète."); } break; }
    case "resetask": $("#resetbox").innerHTML = `<div class="confirm">Toutes tes réponses, examens et cartes perso seront effacés. <button class="btn danger" data-act="reset">Oui, tout effacer</button><button class="btn" data-act="rerender">Annuler</button></div>`; break;
    case "reset": { const set=S.set; S = blank(); S.set=set; session=null; lastResult=null; save(); toast("Progression effacée."); go("jour"); break; }
  }
});

  const t = e.target;
  if(t.id==="bq-flag"){ bq.flag=t.value; render(); return; }
  if(t.id==="set-mod"){ S.set.mod=t.value; S.daily=null; session=null; save(); render(); toast("Module : "+MODULES[t.value].l+"."); }
  if(t.id==="set-size"){ S.set.size=Number(t.value); S.daily=null; session=null; save(); renderPills(); }
  if(t.id==="set-new"){ S.set.newMax=Math.max(0,Math.min(60,Number(t.value)||0)); S.daily=null; session=null; save(); }
  if(t.id==="set-pen"){ S.set.pen=Number(t.value); save(); }
  if(t.id==="set-act"){ S.set.act=t.checked; S.daily=null; session=null; save(); }
});
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("input,textarea,select")) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(tab==="jour" && session && session.pos < session.ids.length){
    if(session.picked==null){ if(["1","2","3","4"].includes(e.key)) pick(Number(e.key)-1); }
    else if(e.key==="Enter"){ e.preventDefault(); next(); }
  } else if(tab==="examen" && S.run){
    if(["1","2","3","4"].includes(e.key)) xAnswer(Number(e.key)-1);
    else if(e.key==="r" || e.key==="R") xFlag();
    else if(e.key==="ArrowRight"){ S.run.pos=Math.min(S.run.pos+1,S.run.ids.length-1); save(); render(); }
    else if(e.key==="ArrowLeft"){ S.run.pos=Math.max(S.run.pos-1,0); save(); render(); }
  }
});
document.addEventListener("keydown", e => {
  const tr = e.target.closest && e.target.closest("tr[data-xrev]");
  if(tr && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); tr.click(); }
});
// Mobile : glisser vers la gauche pour la question suivante, vers la droite pour la précédente (examen) ;
// en session du jour, glisser vers la gauche après avoir répondu passe à la suite.
(function(){
  let x0=null, y0=0, t0=0;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    x0 = (e.touches.length===1 && !(e.target.closest && e.target.closest(".omr,.tw,input,textarea,select,.chips"))) ? t.clientX : null;
    y0 = t.clientY; t0 = Date.now();
  }, {passive:true});
  document.addEventListener("touchend", e => {
    if(x0==null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)*0.6 || Date.now()-t0 > 700) return;
    if(tab==="examen" && S.run){
      const p = Math.min(Math.max(0, S.run.pos + (dx<0?1:-1)), S.run.ids.length-1);
      if(p!==S.run.pos){ S.run.pos = p; xsheet = false; save(); render(); }
    } else if(tab==="jour" && session && session.picked!=null && dx<0) next();
  }, {passive:true});
})();
window.addEventListener("storage", e => { if(e.key===KEY){ S = load(); invalidate(); session=null; render(); } });

render();
initSync();
</script>
